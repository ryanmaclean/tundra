# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Provides:
#   SCA  — vulnerability scanning against RustSec advisory DB
#   License policy — enforce allowed licenses, block copyleft
#   Ban list — block known-bad or unwanted crates
#   Source policy — restrict dependency sources

[graph]
targets = []
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# [advisories] — SCA: scan for known vulnerabilities (RustSec)
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"          # warn only for direct deps
unsound = "all"                     # deny unsound for all deps
ignore = [
    # dotenv is used for local/dev bootstrap in at-daemon.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2021-0141",
    # glib advisory appears through tauri Linux dependency graph in CI.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2024-0429",
    # rand 0.9.2 unsound only when a custom global logger calls rand::rng();
    # we don't install a custom logger and neither do our transitive deps
    # (pulled via tungstenite + proptest + tracing-datadog). Re-evaluate on rand 0.10.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2026-0097",
]

# ---------------------------------------------------------------------------
# [licenses] — enforce allowed licenses, block copyleft/unknown
# ---------------------------------------------------------------------------
[licenses]
# Project policy: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0 only.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # --- Permissive, transitive-only (no direct workspace dep uses these) ---
    # ISC: required by the TLS crypto providers themselves and effectively
    #      tolerated before this entry was documented:
    #      aws-lc-rs / aws-lc-sys (rustls default provider since reqwest 0.13;
    #      "ISC AND (Apache-2.0 OR ISC)"), ring ("Apache-2.0 AND ISC"; direct dep
    #      of at-core and at-bridge), untrusted, rustls-webpki (any rustls stack),
    #      simple_asn1 (jsonwebtoken <- octocrab), inotify/inotify-sys (notify, Linux).
    #      ISC is MIT-equivalent (permissive, no copyleft).
    "ISC",
    # Zlib: foldhash (hashbrown), nanorand (flume), const_format + slotmap (leptos).
    "Zlib",
    # Unicode-3.0: icu_* / zerovec / yoke / litemap (url -> idna), unicode-ident.
    "Unicode-3.0",
]
confidence-threshold = 0.8

# Narrow, per-crate exceptions for licenses outside the policy. Each one is
# pinned to the crate that needs it and documents the dependency path.
# Revisit when the pulling dependency changes.
exceptions = [
    # CC0-1.0 (public-domain dedication). notify is a DIRECT dep of at-core
    # (file watching); no MIT/Apache replacement adopted yet.
    { crate = "notify", allow = ["CC0-1.0"] },
    # CC0-1.0: base16 <- wasm_split_macros <- leptos 0.8 (at-leptos-ui, WASM).
    { crate = "base16", allow = ["CC0-1.0"] },
    # CC0-1.0, only with non-default features (`cargo deny --all-features`):
    # tiny-keccak <- const-random <- ahash `compile-time-rng`.
    # (hexf-parse <- naga 24 went away with ratatui-wgpu 0.6 / wgpu 30.)
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # BSL-1.0: xxhash-rust <- server_fn <- leptos 0.8 (at-leptos-ui, WASM).
    { crate = "xxhash-rust", allow = ["BSL-1.0"] },
    # Apache-2.0 WITH LLVM-exception (strictly more permissive than Apache-2.0):
    # target-lexicon <- cfg-expr <- system-deps <- gtk-rs <- tauri (Linux only).
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # MPL-2.0 (file-level copyleft) -- POLICY EXCEPTION, needs owner sign-off:
    # cssparser/cssparser-macros/dtoa-short/selectors <- kuchikiki <- tauri-utils
    # (tauri build-time HTML/CSP processing; unavoidable while using tauri 2).
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # CDLA-Permissive-2.0: webpki-root-certs <- rustls-platform-verifier 0.6 <-
    # reqwest 0.13 `rustls` feature. rustls-platform-verifier only depends on
    # it under cfg(target_arch = "wasm32") and reqwest only pulls the verifier
    # on non-wasm32-unknown targets, so it is compiled only for wasm32-wasi,
    # which we do not build (cargo-deny's graph has targets = [] = all). Native
    # builds use the OS trust store, as before. Remove if [graph] targets is
    # ever narrowed to the shipped triples. Review 2026-12-31.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # MPL-2.0: option-ext <- dirs-sys 0.5 <- dirs 6. No first-party crate uses
    # `dirs` any more (at-core/at-cli/at-tui resolve paths via at_core::paths,
    # std-only); it is now pulled only by tauri / tauri-build / tray-icon / wry
    # (app/tauri). Remove once tauri drops `dirs` or at-tauri leaves the graph.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]


# Workspace crates have no license yet — mark them private
[licenses.private]
ignore = true
registries = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [{ path = "COPYRIGHT", hash = 0x39f8ad31 }]

# ---------------------------------------------------------------------------
# [bans] — block unwanted or duplicate crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"     # warn on duplicate versions of same crate
wildcards = "allow"            # allow wildcard deps (workspace uses them)
highlight = "lowest-version"
allow = []
deny = [
    # Block crates with known supply-chain concerns
    { crate = "openssl-src" },          # prefer vendored or system openssl
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# [sources] — restrict where dependencies can come from
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
