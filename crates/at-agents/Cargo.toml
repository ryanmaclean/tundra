[package]
name = "at-agents"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
at-core = { path = "../at-core" }
at-session = { path = "../at-session" }
at-bridge = { path = "../at-bridge" }
at-intelligence = { path = "../at-intelligence" }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flume = { workspace = true }
# `rustls` = reqwest/rustls: the same aws-lc-rs + platform-verifier stack as the
# workspace reqwest (post-quantum kx), no ring. Without it rig's own HTTP client
# only had TLS by accident of feature unification.
rig-core = { version = "0.38.1", default-features = false, features = ["derive", "rustls"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
async-trait = { workspace = true }
flume = { workspace = true }
