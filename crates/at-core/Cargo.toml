[package]
name = "at-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
at-time = { path = "../at-time" }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
tokio-rusqlite = "0.9"
tokio = { workspace = true }
toml = "0.9"
notify = { workspace = true }
crossbeam-channel = { workspace = true }
git2 = { workspace = true, optional = true }
libc = "0.2"
lru = "0.18"
ring = "0.17"
rustls = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[features]
default = ["libgit2"]
libgit2 = ["dep:git2"]
# Expose raw-SQL helper methods on CacheDb for use in integration tests in
# other crates.  Never enable in production builds.
test-utils = []

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde", "serde-well-known"] }
toml_legacy = { package = "toml", version = "0.8.23", default-features = false, features = ["parse"] }
