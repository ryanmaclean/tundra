# cargo-audit configuration
#
# Mirrors the [advisories.ignore] list in deny.toml so `cargo audit`
# in CI accepts the same set of documented exceptions.
#
# Keep these two files in sync. If you add or remove an ignore here, update deny.toml
# (and vice versa). The expires/owner notes below match deny.toml.

[advisories]
ignore = [
    # dotenv is used for local/dev bootstrap in at-daemon.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2021-0141",
    # glib advisory appears through tauri Linux dependency graph in CI.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2024-0429",
    # rand 0.9.2 unsound only when a custom global logger calls rand::rng().
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2026-0097",
    # Mirrors deny.toml (2026-10-24): h2 0.3 via reqwest 0.11 (datadog-tracing),
    # lru 0.12 via ratatui 0.29, quick-xml 0.38 via tauri-utils -> plist.
    # expires: 2027-01-24
    # owner: tundra maintainers
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # cookie 0.18.2 via tauri (webview cookie jar). Affected only when an app forks
    # and adds private (encrypted) cookies in several resulting processes; we never
    # fork and do not use private cookies. Fixed in 0.18.3, but the shipped notice
    # bill pins 0.18.2 (selected-manifest.json); bump both together.
    # expires: 2027-01-24
    # owner: tundra maintainers
    "RUSTSEC-2026-0594",
]
