# cargo-audit configuration
#
# Mirrors the [advisories.ignore] list in deny.toml so `cargo audit --deny warnings`
# in CI accepts the same set of documented exceptions.
#
# Keep these two files in sync. If you add or remove an ignore here, update deny.toml
# (and vice versa). The expires/owner notes below match deny.toml.

[advisories]
ignore = [
    # lru 0.12 unsound issue — pinned by ratatui 0.29; upgrade when ratatui bumps
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2026-0002",
    # dotenv is used for local/dev bootstrap in at-daemon.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2021-0141",
    # glib advisory appears through tauri Linux dependency graph in CI.
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2024-0429",
    # rand 0.9.2 unsound only when a custom global logger calls rand::rng().
    # expires: 2026-07-26
    # owner: TBD
    "RUSTSEC-2026-0097",
]
