id: hardcoded-secret
valid:
  - 'fn f() { let token = std::env::var("TOKEN"); }'
  - 'fn f() { let label = "not-a-secret"; }'
  - 'fn f() { let label = "not-a-secret".to_string(); }'
invalid:
  - 'fn f() { let token = "sk-fixture-not-real"; }'
  - 'fn f() { let token = "ghp_fixture-not-real"; }'
  - 'fn f() { let token = "Bearer fixture-not-real"; }'
  - 'fn f() { let token = "sk-fixture-not-real".to_string(); }'
