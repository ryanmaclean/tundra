id: hardcoded-secret
language: Rust
message: Possible hardcoded secret or token; use environment variables instead.
severity: error
rule:
  pattern: let $VAR = $VAL;
constraints:
  VAL:
    any:
      - regex: '^"(sk-|ghp_|Bearer )[^"\n]*"$'
      - has:
          kind: string_literal
          regex: '^"(sk-|ghp_|Bearer )[^"\n]*"$'
          stopBy: end
metadata:
  category: security
  cwe: CWE-798
