name: UI Trunk

on:
  pull_request:
    paths:
      - .github/workflows/ui-trunk.yml
      - Cargo.toml
      - Cargo.lock
      - app/leptos-ui/**
      - scripts/stage_duckdb_runtime.nu
      - scripts/fetch_duckdb_replacement.nu
      - app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json
      - crates/at-api-types/**

permissions:
  contents: read
  actions: read

jobs:
  build-ui:
    name: Build Leptos UI with Trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify one workspace lockfile
        run: test -f Cargo.lock && test ! -e app/leptos-ui/Cargo.lock

      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Install pinned Nushell
        run: cargo install nu --version 0.108.0 --locked

      - name: Authenticate replacement DuckDB artifact and stage exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          printf '%s  %s\n' '34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790' \
            app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json | sha256sum --check --status
          nu scripts/fetch_duckdb_replacement.nu "$RUNNER_TEMP/duckdb-replacement" "$RUNNER_TEMP/duckdb-fetch"
          nu scripts/stage_duckdb_runtime.nu app/leptos-ui/duckdb-runtime "$RUNNER_TEMP" \
            "$RUNNER_TEMP/duckdb-replacement/matching-output"

      - name: Build locked Leptos UI
        working-directory: app/leptos-ui
        run: trunk build --release --locked

      - name: Verify generated UI assets
        working-directory: app/leptos-ui
        run: |
          test -s dist/index.html
          find dist -type f -name '*.wasm' -size +0c | grep -q .
          test "$(find fonts -maxdepth 1 -type f -name '*.woff2' | wc -l)" -eq 6
          while IFS= read -r -d '' font; do
            test -s "dist/$font"
            cmp "$font" "dist/$font"
          done < <(find fonts -maxdepth 1 -type f -name '*.woff2' -print0)
          test "$(find duckdb-runtime -type f | wc -l)" -eq 5
          test "$(find dist/duckdb-runtime -type f | wc -l)" -eq 5
          for asset in duckdb-browser.mjs duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js duckdb-mvp.wasm duckdb-eh.wasm; do
            cmp "duckdb-runtime/$asset" "dist/duckdb-runtime/$asset"
          done
          find dist -maxdepth 2 -type f -print | sort

      - name: Retain generated UI assets
        uses: actions/upload-artifact@v4
        with:
          name: leptos-ui-dist
          path: app/leptos-ui/dist/
          if-no-files-found: error
          retention-days: 14
