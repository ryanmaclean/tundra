name: Strict dependency licenses

on:
  pull_request:
    paths:
      - .github/workflows/strict-licenses.yml
      - scripts/license_inventory.nu
      - scripts/license_approvals.json
      - docs/license-inventory.md
      - docs/file-watcher-feature.md
      - app/tauri/tauri.conf.json
      - app/tauri/third-party-licenses/**
      - crates/at-core/src/file_watcher.rs
      - crates/at-core/src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - deny-strict.toml
      - '**/Cargo.toml'

permissions:
  contents: read

jobs:
  shipped-license-inventory:
    name: Shipped licenses (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
        profile:
          - default
          - tauri-sounds
        exclude:
          - target: wasm32-unknown-unknown
            profile: tauri-sounds
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # Runs only on hosted CI. The inventory does not compile the workspace.
      - name: Install Nushell
        run: cargo install nu --version 0.108.0 --locked

      - name: Resolve locked target graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          printf 'head_sha=%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/license-source-head.txt"
          if [ '${{ matrix.profile }}' = 'tauri-sounds' ]; then
            cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' --features at-tauri/sounds > "$RUNNER_TEMP/cargo-metadata.json"
          else
            cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > "$RUNNER_TEMP/cargo-metadata.json"
          fi

      - name: Inventory shipped and tool-only dependencies
        id: inventory
        shell: bash
        run: |
          set +e
          nu scripts/license_inventory.nu "$RUNNER_TEMP/cargo-metadata.json" '${{ matrix.target }}' '${{ matrix.profile }}' "$RUNNER_TEMP/license-inventory.json"
          result=$?
          echo "status=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require both graph and inventory artifacts
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/license-inventory.json"
          test -s "$RUNNER_TEMP/cargo-metadata.json"

      - name: Retain inventory and exact Cargo resolve graph
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory-${{ matrix.target }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/license-inventory.json
            ${{ runner.temp }}/cargo-metadata.json
            ${{ runner.temp }}/license-source-head.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Enforce shipped product license policy
        if: steps.inventory.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/license-inventory.json"
          exit 1

  broad-license-diagnostic:
    name: Broad all-feature diagnostic
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check all-feature all-target dependency licenses
        run: cargo deny --workspace --config deny-strict.toml --locked check licenses

  exact-notice-custody:
    name: Exact exception license texts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify approval roster, text hashes, and bundle resource
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/tauri/third-party-licenses/manifest.json
          diff -u \
            <(jq -r '.approvals[] | [.id,.name,.version,.approved_choice[0],.lock_checksum] | @tsv' scripts/license_approvals.json | sort) \
            <(jq -r '.entries[] | [.approval_id,.name,.version,.license_id,.crate_sha256] | @tsv' "$manifest" | sort)
          jq -e '.bundle.resources | index("third-party-licenses/") != null' app/tauri/tauri.conf.json
          while IFS=$'\t' read -r digest file; do
            test -s "$file"
            printf '%s  %s\n' "$digest" "$file" | sha256sum --check --status
          done < <(jq -r '.entries[] | [.text_sha256,.file] | @tsv' "$manifest")
      - name: Verify source archives and exact license text bytes
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/tauri/third-party-licenses/manifest.json
          while IFS=$'\t' read -r name version checksum file source; do
            archive="$RUNNER_TEMP/$name-$version.crate"
            curl --fail --silent --show-error --location --max-time 45 \
              "https://static.crates.io/crates/$name/$name-$version.crate" -o "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
            if [[ "$source" == crate:* ]]; then
              tar -xOzf "$archive" "${source#crate:}" | cmp - "$file"
            else
              curl --fail --silent --show-error --location --max-time 45 "$source" | cmp - "$file"
            fi
          done < <(jq -r '.entries[] | [.name,.version,.crate_sha256,.file,.source] | @tsv' "$manifest")
      - name: Retain verified exception license texts
        uses: actions/upload-artifact@v4
        with:
          name: exact-exception-license-texts
          path: app/tauri/third-party-licenses/
          if-no-files-found: error
          retention-days: 14

  linux-deb-notice-resources:
    name: Linux .deb contains exact exception license texts (${{ matrix.profile }})
    needs: [exact-notice-custody, shipped-license-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [default, sounds]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned UI and Tauri build tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build locked UI and Linux .deb
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          (cd app/leptos-ui && trunk build --release --locked)
          test -s app/leptos-ui/dist/index.html
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
              --features at-tauri/sounds > "$RUNNER_TEMP/profile-metadata.json"
            jq -e '. as $g | ($g.packages[] | select(.name == "at-tauri") | .id) as $id | [$g.resolve.nodes[] | select(.id == $id) | .features[]] | index("sounds") != null' \
              "$RUNNER_TEMP/profile-metadata.json"
            (cd app/tauri && cargo tauri build --help | grep -F -- '--features')
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/profile-metadata.json"
            jq -e '. as $g | ($g.packages[] | select(.name == "at-tauri") | .id) as $id | [$g.resolve.nodes[] | select(.id == $id) | .features[]] | index("sounds") == null' \
              "$RUNNER_TEMP/profile-metadata.json"
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          shopt -s nullglob
          fingerprints=(target/release/.fingerprint/at-tauri-*/bin-auto-tundra.json)
          test "${#fingerprints[@]}" -eq 1
          cp "${fingerprints[0]}" "$RUNNER_TEMP/installer-bin-fingerprint.json"
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            jq -e '(.features | fromjson | index("sounds")) != null' "$RUNNER_TEMP/installer-bin-fingerprint.json"
          else
            jq -e '(.features | fromjson | index("sounds")) == null' "$RUNNER_TEMP/installer-bin-fingerprint.json"
          fi
          test -s target/release/auto-tundra
      - name: Verify nine license resources inside built .deb
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          manifest=app/tauri/third-party-licenses/manifest.json
          jq -e '
            (.entries | length) == 9 and
            ([.entries[].file] | unique | length) == 9 and
            all(.entries[];
              (.file | test("^app/tauri/third-party-licenses/[A-Za-z0-9._/-]+$")) and
              (.file | contains("/../") | not) and
              (.text_sha256 | test("^[0-9a-f]{64}$")))
          ' "$manifest"
          jq -r '.entries[] | [.file,.text_sha256] | @tsv' "$manifest" > "$RUNNER_TEMP/expected-license-resources.tsv"
          root="$RUNNER_TEMP/tundra-deb-root"
          mkdir -p "$root"
          dpkg-deb -x "${debs[0]}" "$root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp target/release/auto-tundra "${installed_bins[0]}"
          sha256sum target/release/auto-tundra "${installed_bins[0]}" > "$RUNNER_TEMP/installer-binary.sha256"
          receipt="$RUNNER_TEMP/installer-resource-proof.tsv"
          : > "$receipt"
          while IFS=$'\t' read -r source expected; do
            relative="${source#app/tauri/third-party-licenses/}"
            mapfile -d '' matches < <(find "$root" -type f -path "*/third-party-licenses/$relative" -print0)
            test "${#matches[@]}" -eq 1
            printf '%s  %s\n' "$expected" "${matches[0]}" | sha256sum --check --status
            cmp "$source" "${matches[0]}"
            printf '%s\t%s\t%s\n' "$relative" "$expected" "${matches[0]#"$root"/}" >> "$receipt"
          done < "$RUNNER_TEMP/expected-license-resources.tsv"
          test "$(wc -l < "$receipt")" -eq 9
          sha256sum "${debs[0]}" | tee "$RUNNER_TEMP/installer-deb.sha256"
          sha256sum "$RUNNER_TEMP/profile-metadata.json" > "$RUNNER_TEMP/installer-profile-metadata.sha256"
          if [[ '${{ matrix.profile }}' == sounds ]]; then tauri_features=sounds; else tauri_features=default; fi
          printf 'head_sha=%s\nprofile=%s\ntauri_features=%s\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' "$tauri_features" > "$RUNNER_TEMP/installer-source.txt"
      - name: Retain built installer and byte-comparison receipt
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-exception-license-proof-${{ matrix.profile }}
          path: |
            target/release/bundle/deb/*.deb
            ${{ runner.temp }}/installer-deb.sha256
            ${{ runner.temp }}/installer-resource-proof.tsv
            ${{ runner.temp }}/installer-source.txt
            ${{ runner.temp }}/profile-metadata.json
            ${{ runner.temp }}/installer-profile-metadata.sha256
            ${{ runner.temp }}/installer-bin-fingerprint.json
            ${{ runner.temp }}/installer-binary.sha256
          if-no-files-found: error
          retention-days: 14

  linux-deb-profile-distinction:
    name: Linux default and sounds installers have distinct binaries
    needs: linux-deb-notice-resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-deb-exception-license-proof-*
          path: ${{ runner.temp }}/variant-artifacts
      - name: Compare extracted installer binaries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          default_debs=("$RUNNER_TEMP"/variant-artifacts/linux-deb-exception-license-proof-default/*.deb)
          sounds_debs=("$RUNNER_TEMP"/variant-artifacts/linux-deb-exception-license-proof-sounds/*.deb)
          test "${#default_debs[@]}" -eq 1 && test "${#sounds_debs[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/default-root" "$RUNNER_TEMP/sounds-root"
          dpkg-deb -x "${default_debs[0]}" "$RUNNER_TEMP/default-root"
          dpkg-deb -x "${sounds_debs[0]}" "$RUNNER_TEMP/sounds-root"
          mapfile -d '' default_bins < <(find "$RUNNER_TEMP/default-root" -type f -name auto-tundra -print0)
          mapfile -d '' sounds_bins < <(find "$RUNNER_TEMP/sounds-root" -type f -name auto-tundra -print0)
          test "${#default_bins[@]}" -eq 1 && test "${#sounds_bins[@]}" -eq 1
          if cmp -s "${default_bins[0]}" "${sounds_bins[0]}"; then
            echo 'Default and sounds installer binaries are byte-identical; feature-on package proof is unresolved.' >&2
            exit 1
          fi
          sha256sum "${default_bins[0]}" "${sounds_bins[0]}" > "$RUNNER_TEMP/variant-binary-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-profile-distinction-proof
          path: ${{ runner.temp }}/variant-binary-sha256.txt
          if-no-files-found: error
          retention-days: 14

  optional-watcher:
    name: Optional file watcher on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact feature-on graph
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --features at-core/file-watcher > "$RUNNER_TEMP/watcher-metadata.json"
          jq -e '. as $graph | ($graph.packages[] | select(.name == "at-core") | .id) as $core_id | [$graph.resolve.nodes[] | select(.id == $core_id) | .features[]] | index("file-watcher") != null' "$RUNNER_TEMP/watcher-metadata.json"
          jq -e '[.packages[].name] | index("notify") != null' "$RUNNER_TEMP/watcher-metadata.json"
      - name: Test opt-in watcher module
        run: cargo test -p at-core --locked --features file-watcher --lib file_watcher::tests -- --nocapture
      - name: Retain feature-on graph
        uses: actions/upload-artifact@v4
        with:
          name: optional-file-watcher-linux-graph
          path: ${{ runner.temp }}/watcher-metadata.json
          if-no-files-found: error
          retention-days: 14
