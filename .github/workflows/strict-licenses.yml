name: Strict dependency licenses

on:
  pull_request:
    paths:
      - .github/workflows/strict-licenses.yml
      - scripts/license_inventory.nu
      - scripts/selected_notice_bill.nu
      - scripts/license_approvals.json
      - docs/license-inventory.md
      - docs/file-watcher-feature.md
      - app/tauri/tauri.conf.json
      - app/tauri/third-party-licenses/**
      - app/leptos-ui/index.html
      - app/leptos-ui/style.css
      - app/leptos-ui/fonts/**
      - app/leptos-ui/vendor/**
      - app/leptos-ui/public/**
      - app/leptos-ui/duckdb-bridge.js
      - app/leptos-ui/src/duckdb.rs
      - scripts/stage_duckdb_runtime.nu
      - scripts/fetch_duckdb_replacement.nu
      - scripts/verify_duckdb_selected_bill.nu
      - scripts/build-tool-licenses/**
      - crates/at-core/src/file_watcher.rs
      - crates/at-core/src/lib.rs
      - Cargo.toml
      - Cargo.lock
      - deny-strict.toml
      - '**/Cargo.toml'

permissions:
  contents: read
  actions: read

jobs:
  shipped-license-inventory:
    name: Shipped licenses (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown
        profile:
          - default
          - tauri-sounds
        exclude:
          - target: wasm32-unknown-unknown
            profile: tauri-sounds
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # Runs only on hosted CI. The inventory does not compile the workspace.
      - name: Install Nushell
        run: cargo install nu --version 0.108.0 --locked

      - name: Resolve locked target graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          printf 'head_sha=%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/license-source-head.txt"
          if [ '${{ matrix.profile }}' = 'tauri-sounds' ]; then
            cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' --features at-tauri/sounds > "$RUNNER_TEMP/cargo-metadata.json"
          else
            cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > "$RUNNER_TEMP/cargo-metadata.json"
          fi

      - name: Inventory shipped and tool-only dependencies
        id: inventory
        shell: bash
        run: |
          set +e
          nu scripts/license_inventory.nu "$RUNNER_TEMP/cargo-metadata.json" '${{ matrix.target }}' '${{ matrix.profile }}' "$RUNNER_TEMP/license-inventory.json"
          result=$?
          echo "status=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require both graph and inventory artifacts
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/license-inventory.json"
          test -s "$RUNNER_TEMP/cargo-metadata.json"

      - name: Retain inventory and exact Cargo resolve graph
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory-${{ matrix.target }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/license-inventory.json
            ${{ runner.temp }}/cargo-metadata.json
            ${{ runner.temp }}/license-source-head.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Enforce shipped product license policy
        if: steps.inventory.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/license-inventory.json"
          exit 1

  broad-license-diagnostic:
    name: Broad all-feature diagnostic
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check all-feature all-target dependency licenses
        run: cargo deny --workspace --config deny-strict.toml --locked check licenses

  exact-notice-custody:
    name: Exact exception license texts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify approval roster, text hashes, and bundle resource
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/tauri/third-party-licenses/manifest.json
          diff -u \
            <(jq -r '.approvals[] | [.id,.name,.version,.approved_choice[0],.lock_checksum] | @tsv' scripts/license_approvals.json | sort) \
            <(jq -r '.entries[] | [.approval_id,.name,.version,.license_id,.crate_sha256] | @tsv' "$manifest" | sort)
          jq -e '.bundle.resources | index("third-party-licenses/") != null' app/tauri/tauri.conf.json
          while IFS=$'\t' read -r digest file; do
            test -s "$file"
            printf '%s  %s\n' "$digest" "$file" | sha256sum --check --status
          done < <(jq -r '.entries[] | [.text_sha256,.file] | @tsv' "$manifest")
      - name: Verify source archives and exact license text bytes
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/tauri/third-party-licenses/manifest.json
          while IFS=$'\t' read -r name version checksum file source; do
            archive="$RUNNER_TEMP/$name-$version.crate"
            curl --fail --silent --show-error --location --max-time 45 \
              "https://static.crates.io/crates/$name/$name-$version.crate" -o "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
            if [[ "$source" == crate:* ]]; then
              tar -xOzf "$archive" "${source#crate:}" | cmp - "$file"
            else
              curl --fail --silent --show-error --location --max-time 45 "$source" | cmp - "$file"
            fi
          done < <(jq -r '.entries[] | [.name,.version,.crate_sha256,.file,.source] | @tsv' "$manifest")
      - name: Retain verified exception license texts
        uses: actions/upload-artifact@v4
        with:
          name: exact-exception-license-texts
          path: app/tauri/third-party-licenses/
          if-no-files-found: error
          retention-days: 14

  linux-deb-notice-resources:
    name: Linux .deb contains exact exception license texts (${{ matrix.profile }})
    needs: [exact-notice-custody, shipped-license-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [default, sounds]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget xvfb dbus-x11
      - name: Install ALSA development files for sounds build
        if: matrix.profile == 'sounds'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev
          pkg-config --modversion alsa
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned UI and Tauri build tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
          cargo install nu --version 0.108.0 --locked
      - name: Authenticate replacement DuckDB artifact and stage exact assets
        id: stage_duckdb
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          bill=app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json
          printf '%s  %s\n' '34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790' "$bill" | sha256sum --check --status
          jq -e '.schema == "tundra-duckdb-selected-notice-bill/v2" and .admission == "NO" and (.assets | length) == 5 and (.texts | length) == 36 and (.attributions | length) == 38' "$bill"
          printf '%s  %s\n' 'b40ec5baec7bb34fa5b1c09521fa3cd52d5fad7adafed74932a2010d3612a681' \
            scripts/build-tool-licenses/esbuild-0.19.12-MIT.txt | sha256sum --check --status
          curl --fail --silent --show-error --location --max-time 45 \
            https://raw.githubusercontent.com/evanw/esbuild/v0.19.12/LICENSE.md \
            | cmp - scripts/build-tool-licenses/esbuild-0.19.12-MIT.txt
          nu scripts/fetch_duckdb_replacement.nu "$RUNNER_TEMP/duckdb-replacement" "$RUNNER_TEMP/duckdb-fetch"
          nu scripts/stage_duckdb_runtime.nu app/leptos-ui/duckdb-runtime "$RUNNER_TEMP" \
            "$RUNNER_TEMP/duckdb-replacement/matching-output"
          jq -e '[.outputs | to_entries[] | .value.imports[]? | select(.external == true)] | length == 0' \
            "$RUNNER_TEMP/duckdb-replacement/matching-receipt/browser-metafile.json"
          for variant in mvp eh; do
            jq -e '[.outputs | to_entries[] | .value.imports[]? | select(.external == true) | [.path,.kind]] == [["crypto","require-call"]]' \
              "$RUNNER_TEMP/duckdb-replacement/matching-receipt/worker-$variant-metafile.json"
          done
          printf 'head_sha=%s\nprofile=%s\nadmission=NO\n' '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' > "$RUNNER_TEMP/duckdb-source-head.txt"
      - name: Build locked UI and Linux .deb
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          (cd app/leptos-ui && trunk build --release --locked)
          test -s app/leptos-ui/dist/index.html
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
              --features at-tauri/sounds > "$RUNNER_TEMP/profile-metadata.json"
            jq -e '. as $g | ($g.packages[] | select(.name == "at-tauri") | .id) as $id | [$g.resolve.nodes[] | select(.id == $id) | .features[]] | index("sounds") != null' \
              "$RUNNER_TEMP/profile-metadata.json"
            (cd app/tauri && cargo tauri build --help | grep -F -- '--features')
            inventory_profile=tauri-sounds
          else
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/profile-metadata.json"
            jq -e '. as $g | ($g.packages[] | select(.name == "at-tauri") | .id) as $id | [$g.resolve.nodes[] | select(.id == $id) | .features[]] | index("sounds") == null' \
              "$RUNNER_TEMP/profile-metadata.json"
            inventory_profile=default
          fi
          nu scripts/license_inventory.nu "$RUNNER_TEMP/profile-metadata.json" \
            x86_64-unknown-linux-gnu "$inventory_profile" "$RUNNER_TEMP/license-inventory.json"
          if [[ "$inventory_profile" == default ]]; then
            peer_profile=tauri-sounds
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
              --features at-tauri/sounds > "$RUNNER_TEMP/peer-profile-metadata.json"
          else
            peer_profile=default
            cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
              > "$RUNNER_TEMP/peer-profile-metadata.json"
          fi
          nu scripts/license_inventory.nu "$RUNNER_TEMP/peer-profile-metadata.json" \
            x86_64-unknown-linux-gnu "$peer_profile" "$RUNNER_TEMP/peer-license-inventory.json"
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          nu scripts/selected_notice_bill.nu \
            "$RUNNER_TEMP/license-inventory.json" "$RUNNER_TEMP/peer-license-inventory.json" \
            "$RUNNER_TEMP/profile-metadata.json" "$RUNNER_TEMP/peer-profile-metadata.json" Cargo.lock \
            app/tauri/third-party-licenses/selected-manifest.json \
            app/tauri/third-party-licenses/manifest.json \
            "${CARGO_HOME:-$HOME/.cargo}/registry/cache" \
            app/tauri/third-party-licenses/selected-notice-bill.json
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          shopt -s nullglob
          fingerprints=(target/release/.fingerprint/at-tauri-*/bin-auto-tundra.json)
          test "${#fingerprints[@]}" -eq 1
          cp "${fingerprints[0]}" "$RUNNER_TEMP/installer-bin-fingerprint.json"
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            jq -e '(.features | fromjson | index("sounds")) != null' "$RUNNER_TEMP/installer-bin-fingerprint.json"
          else
            jq -e '(.features | fromjson | index("sounds")) == null' "$RUNNER_TEMP/installer-bin-fingerprint.json"
          fi
          test -s target/release/auto-tundra
      - name: Verify nine license resources inside built .deb
        id: verify_deb_resources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          manifest=app/tauri/third-party-licenses/manifest.json
          jq -e '
            (.entries | length) == 9 and
            ([.entries[].file] | unique | length) == 9 and
            all(.entries[];
              (.file | test("^app/tauri/third-party-licenses/[A-Za-z0-9._/-]+$")) and
              (.file | contains("/../") | not) and
              (.text_sha256 | test("^[0-9a-f]{64}$")))
          ' "$manifest"
          jq -r '.entries[] | [.file,.text_sha256] | @tsv' "$manifest" > "$RUNNER_TEMP/expected-license-resources.tsv"
          root="$RUNNER_TEMP/tundra-deb-root"
          mkdir -p "$root"
          dpkg-deb -x "${debs[0]}" "$root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          # Tauri 2.12.4 changes the unique embedded bundle marker from UNK
          # to DEB when packaging. Font bytes can move its offset, so require
          # exactly one source marker and compare every byte of the expected
          # patched workspace binary against the installed package binary.
          workspace_bin=target/release/auto-tundra
          marker_prefix='__TAURI_BUNDLE_TYPE_VAR_'
          mapfile -t marker_hits < <(LC_ALL=C grep -aobF "${marker_prefix}UNK" "$workspace_bin")
          test "${#marker_hits[@]}" -eq 1
          marker_offset="${marker_hits[0]%%:*}"
          [[ "$marker_offset" =~ ^[0-9]+$ ]]
          expected_bin="$RUNNER_TEMP/expected-bundle-auto-tundra"
          cp "$workspace_bin" "$expected_bin"
          printf 'DEB' | dd of="$expected_bin" bs=1 seek="$((marker_offset + ${#marker_prefix}))" conv=notrunc status=none
          cmp "$expected_bin" "${installed_bins[0]}"
          sha256sum "$workspace_bin" "$expected_bin" "${installed_bins[0]}" > "$RUNNER_TEMP/installer-binary.sha256"
          printf 'profile=%s\nmarker_offset=%s\npatch=UNK-to-DEB\n' \
            '${{ matrix.profile }}' "$marker_offset" > "$RUNNER_TEMP/installer-bundle-patch.txt"
          receipt="$RUNNER_TEMP/installer-resource-proof.tsv"
          : > "$receipt"
          while IFS=$'\t' read -r source expected; do
            relative="${source#app/tauri/third-party-licenses/}"
            mapfile -d '' matches < <(find "$root" -type f -path "*/third-party-licenses/$relative" -print0)
            test "${#matches[@]}" -eq 1
            printf '%s  %s\n' "$expected" "${matches[0]}" | sha256sum --check --status
            cmp "$source" "${matches[0]}"
            printf '%s\t%s\t%s\n' "$relative" "$expected" "${matches[0]#"$root"/}" >> "$receipt"
          done < "$RUNNER_TEMP/expected-license-resources.tsv"
          test "$(wc -l < "$receipt")" -eq 9
          sha256sum "${debs[0]}" | tee "$RUNNER_TEMP/installer-deb.sha256"
          sha256sum "$RUNNER_TEMP/profile-metadata.json" > "$RUNNER_TEMP/installer-profile-metadata.sha256"
          if [[ '${{ matrix.profile }}' == sounds ]]; then tauri_features=sounds; else tauri_features=default; fi
          printf 'head_sha=%s\nprofile=%s\ntauri_features=%s\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' "$tauri_features" > "$RUNNER_TEMP/installer-source.txt"
      - name: Verify complete selected-source bill inside built .deb
        id: verify_selected_bill
        shell: bash
        run: |
          set -euo pipefail
          bill=app/tauri/third-party-licenses/selected-notice-bill.json
          selected_manifest=app/tauri/third-party-licenses/selected-manifest.json
          inventory="$RUNNER_TEMP/license-inventory.json"
          root="$RUNNER_TEMP/tundra-deb-root"
          test -s "$bill"
          jq -e --slurpfile inv "$inventory" '
            .schema_version == 1 and
            .cargo_lock_sha256 == $inv[0].cargo_lock_sha256 and
            .cargo_metadata_sha256 == $inv[0].cargo_metadata_sha256 and
            .target == $inv[0].target and
            .feature_profile == $inv[0].feature_profile and
            .selected_third_party_count == ([ $inv[0].packages[] | select(.role == "product" and .first_party == false) ] | length) and
            (.packages | length) == .selected_third_party_count
          ' "$bill"
          mapfile -d '' installed_bills < <(find "$root" -type f -path '*/third-party-licenses/selected-notice-bill.json' -print0)
          test "${#installed_bills[@]}" -eq 1
          cmp "$bill" "${installed_bills[0]}"
          mapfile -d '' installed_selected_manifests < <(find "$root" -type f -path '*/third-party-licenses/selected-manifest.json' -print0)
          test "${#installed_selected_manifests[@]}" -eq 1
          cmp "$selected_manifest" "${installed_selected_manifests[0]}"
          jq -e '[.entries[].texts[]] | group_by(.file) | all(.[]; ([.[].text_sha256] | unique | length) == 1)' "$selected_manifest"
          receipt="$RUNNER_TEMP/selected-installed-texts.tsv"
          : > "$receipt"
          while IFS=$'\t' read -r source expected; do
            case "$source" in
              app/tauri/third-party-licenses/*) ;;
              *) echo "Unexpected selected legal-text path: $source" >&2; exit 1 ;;
            esac
            relative="${source#app/tauri/third-party-licenses/}"
            mapfile -d '' matches < <(find "$root" -type f -path "*/third-party-licenses/$relative" -print0)
            test "${#matches[@]}" -eq 1
            printf '%s  %s\n' "$expected" "${matches[0]}" | sha256sum --check --status
            cmp "$source" "${matches[0]}"
            printf '%s\t%s\t%s\n' "$relative" "$expected" "${matches[0]#"$root"/}" >> "$receipt"
          done < <(jq -r '.entries[].texts[] | [.file,.text_sha256] | @tsv' "$selected_manifest" | sort -u)
          test "$(wc -l < "$receipt")" -eq "$(jq -r '.entries[].texts[].file' "$selected_manifest" | sort -u | wc -l)"
          diff -u \
            <(jq -r '.entries[].texts[].file | select(startswith("app/tauri/third-party-licenses/selected/")) | sub("^app/tauri/third-party-licenses/"; "")' "$selected_manifest" | sort -u) \
            <(find "$root" -type f -path '*/third-party-licenses/selected/*' -print | sed 's#^.*/third-party-licenses/##' | sort -u)
          sha256sum "$bill" "${installed_bills[0]}" > "$RUNNER_TEMP/selected-bill-sha256.txt"
      - name: Verify Inter source, generated UI, and installed OFL notice
        id: verify_inter_ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git hash-object app/leptos-ui/style.css)" = '71fe560a6ab8fb51a1e462f05b649f7c81e4a80b'
          jq -e '.build.frontendDist == "../leptos-ui/dist" and (.bundle.resources | index("third-party-licenses/") != null)' app/tauri/tauri.conf.json
          declare -A font_hashes=(
            [400]=b6f9db9e45be20f3c1312c97fbee7ec36b7d8280f8caa4d53c9ba0408cc9997a
            [500]=8458f8afa67b5691c1fcbe51607a2dafb53a9839e48131c608a186b65415d96d
            [600]=8e52a861dc26ff4608c50bd7ff89b65d0d6216a2afe7b47ce5d84544811ca400
            [700]=220976705fbec109f43c5cfdceca639e99ace7e51f3eb67292b105d3575eb39b
          )
          dist=app/leptos-ui/dist
          test -s "$dist/index.html"
          dist_hashes="$RUNNER_TEMP/inter-dist-sha256.tsv"
          : > "$dist_hashes"
          while IFS= read -r -d '' file; do
            digest="$(sha256sum "$file")"
            printf '%s\t%s\n' "${digest%% *}" "$file" >> "$dist_hashes"
          done < <(find "$dist" -type f -print0)
          mapfile -d '' css_files < <(find "$dist" -type f -name '*.css' -print0)
          test "${#css_files[@]}" -ge 1
          receipt="$RUNNER_TEMP/inter-dist-source-proof.tsv"
          : > "$receipt"
          for weight in 400 500 600 700; do
            source="app/leptos-ui/fonts/inter-${weight}.woff2"
            expected="${font_hashes[$weight]}"
            printf '%s  %s\n' "$expected" "$source" | sha256sum --check --status
            mapfile -t matches < <(awk -F '\t' -v h="$expected" '$1 == h {print $2}' "$dist_hashes")
            test "${#matches[@]}" -eq 1
            generated="${matches[0]}"
            test "$generated" != "$source"
            test -s "$generated"
            basename="${generated##*/}"
            css_ref=0
            for css in "${css_files[@]}"; do
              if grep -aFq -- "$basename" "$css"; then
                css_ref=1
              fi
            done
            test "$css_ref" -eq 1
            printf '%s\t%s\t%s\t%s\n' "$weight" "$source" "$expected" "${generated#"$dist"/}" >> "$receipt"
          done
          test "$(wc -l < "$receipt")" -eq 4
          source_notice=app/tauri/third-party-licenses/ui/Inter-OFL-1.1.txt
          expected_notice=262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a
          printf '%s  %s\n' "$expected_notice" "$source_notice" | sha256sum --check --status
          root="$RUNNER_TEMP/tundra-deb-root"
          test -d "$root"
          mapfile -d '' installed_notices < <(find "$root" -type f -path '*/third-party-licenses/ui/Inter-OFL-1.1.txt' -print0)
          test "${#installed_notices[@]}" -eq 1
          printf '%s  %s\n' "$expected_notice" "${installed_notices[0]}" | sha256sum --check --status
          cmp "$source_notice" "${installed_notices[0]}"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp "$RUNNER_TEMP/expected-bundle-auto-tundra" "${installed_bins[0]}"
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          printf 'head_sha=%s\nprofile=%s\nsource_notice_sha256=%s\ninstalled_notice=%s\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' "$expected_notice" "${installed_notices[0]#"$root"/}" \
            > "$RUNNER_TEMP/inter-installed-notice.txt"
          sha256sum "${installed_bins[0]}" "${debs[0]}" >> "$RUNNER_TEMP/inter-installed-notice.txt"
      - name: Verify copied UI sources and installed legal notices
        id: verify_other_ui_notices
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          manifest=app/tauri/third-party-licenses/ui/verified-source-manifest.json
          # Constants below bind this review to exact source/legal bytes, not to
          # editable expectations read from the manifest itself. A later source
          # change must receive a new provenance review and updated pins.
          printf '%s  %s\n' 'e928bd1b58413b97c15641771a5c75be9a5f5a6f68aad36ed37f7ceae579e7e9' "$manifest" | sha256sum --check --status
          diff -u \
            <(printf '%s\n' \
              'app/leptos-ui/vendor/xterm/xterm.js' \
              'app/leptos-ui/vendor/xterm/xterm.css' \
              'app/leptos-ui/vendor/xterm/addon-fit.js' \
              'app/leptos-ui/fonts/jetbrains-mono-400.woff2' \
              'app/leptos-ui/fonts/jetbrains-mono-500.woff2' | sort) \
            <(jq -r '.verified_copied_inputs[].path' "$manifest" | sort)
          diff -u \
            <(printf '%s\n' \
              'app/tauri/third-party-licenses/ui/Xterm-Core-MIT.txt' \
              'app/tauri/third-party-licenses/ui/Xterm-Fit-MIT.txt' \
              'app/tauri/third-party-licenses/ui/JetBrains-Mono-OFL-1.1.txt' | sort) \
            <(jq -r '.legal_texts[].path' "$manifest" | sort)
          test "$(jq -r '.unresolved | length' "$manifest")" -eq 0
          printf '%s  %s\n' \
            'b569f629d00f2626a8100df2a1798210535621e42164dfd426a6fe5aac7b0ccd' 'app/tauri/third-party-licenses/ui/Xterm-Core-MIT.txt' \
            'e256f01188af527e4d06d21d06fbf785ae9c50d4b328bf03cbe0ba7f0aa4228f' 'app/tauri/third-party-licenses/ui/Xterm-Fit-MIT.txt' \
            'b2fe5e8987594e9ffd1d2ca52a2f5d73eb8335243893c5d6254b5ad69269591d' 'app/tauri/third-party-licenses/ui/JetBrains-Mono-OFL-1.1.txt' \
            | sha256sum --check --status
          test "$(git hash-object app/leptos-ui/vendor/xterm/xterm.js)" = '7ca75f8e5ec2a0741333130fd63fb9c79d9c2023'
          test "$(git hash-object app/leptos-ui/vendor/xterm/xterm.css)" = 'e97b6439055da076119d8ce42225944623b80e9b'
          test "$(git hash-object app/leptos-ui/vendor/xterm/addon-fit.js)" = '038897193db54dd0f09783d53e602755b93a2eaf'
          test "$(git hash-object app/leptos-ui/fonts/jetbrains-mono-400.woff2)" = '2ca6ac605954ee884442db8ea1d61093000bcc29'
          test "$(git hash-object app/leptos-ui/fonts/jetbrains-mono-500.woff2)" = '2ca6ac605954ee884442db8ea1d61093000bcc29'
          test "$(git hash-object app/leptos-ui/index.html)" = 'e7f71c98b5454a001a38794f51eaa3e895d965b0'
          printf '%s  %s\n' 'd7fbf126caae42e829fbe68687420ec04d26f9ef996133876b242998f46ce914' 'app/leptos-ui/index.html' | sha256sum --check --status
          test "$(git hash-object app/leptos-ui/duckdb-bridge.js)" = '7751fe733eb8b4e5fd6130092932a791bb30f060'
          test ! -e app/leptos-ui/public/js/duckdb.js
          if grep -Fq 'cdn.jsdelivr.net' app/leptos-ui/duckdb-bridge.js; then
            echo 'DuckDB bridge may not load from a CDN' >&2
            exit 1
          fi
          jq -e '
            .schema == "tundra-ui-source-notice/v1" and
            .trunk_entrypoint.path == "app/leptos-ui/index.html" and
            .trunk_entrypoint.git_blob == "e7f71c98b5454a001a38794f51eaa3e895d965b0" and
            .trunk_entrypoint.sha256 == "d7fbf126caae42e829fbe68687420ec04d26f9ef996133876b242998f46ce914" and
            (.verified_copied_inputs | length) == 5 and
            (.legal_texts | length) == 3 and
            ([.verified_copied_inputs[].path] | unique | length) == 5 and
            ([.legal_texts[].path] | unique | length) == 3 and
            all(.verified_copied_inputs[]; (.git_blob | test("^[0-9a-f]{40}$")) and (.sha256 | test("^[0-9a-f]{64}$"))) and
            all(.legal_texts[]; (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$manifest"
          jq -e '.build.frontendDist == "../leptos-ui/dist" and (.bundle.resources | index("third-party-licenses/") != null)' app/tauri/tauri.conf.json
          source_receipt="$RUNNER_TEMP/ui-copied-source-proof.tsv"
          : > "$source_receipt"
          while IFS=$'\t' read -r source expected_blob expected_sha; do
            case "$source" in
              app/leptos-ui/vendor/xterm/*|app/leptos-ui/fonts/jetbrains-mono-*.woff2) ;;
              *) echo "Unexpected copied UI source: $source" >&2; exit 1 ;;
            esac
            test "$(git hash-object "$source")" = "$expected_blob"
            printf '%s  %s\n' "$expected_sha" "$source" | sha256sum --check --status
            printf '%s\t%s\t%s\n' "$source" "$expected_blob" "$expected_sha" >> "$source_receipt"
          done < <(jq -r '.verified_copied_inputs[] | [.path,.git_blob,.sha256] | @tsv' "$manifest")
          test "$(wc -l < "$source_receipt")" -eq 5
          root="$RUNNER_TEMP/tundra-deb-root"
          test -d "$root"
          notice_receipt="$RUNNER_TEMP/ui-installed-notices.tsv"
          : > "$notice_receipt"
          while IFS=$'\t' read -r source expected; do
            case "$source" in
              app/tauri/third-party-licenses/ui/*) ;;
              *) echo "Unexpected UI legal path: $source" >&2; exit 1 ;;
            esac
            printf '%s  %s\n' "$expected" "$source" | sha256sum --check --status
            relative="${source#app/tauri/third-party-licenses/}"
            mapfile -d '' matches < <(find "$root" -type f -path "*/third-party-licenses/$relative" -print0)
            test "${#matches[@]}" -eq 1
            printf '%s  %s\n' "$expected" "${matches[0]}" | sha256sum --check --status
            cmp "$source" "${matches[0]}"
            printf '%s\t%s\t%s\n' "$relative" "$expected" "${matches[0]#"$root"/}" >> "$notice_receipt"
          done < <(jq -r '.legal_texts[] | [.path,.sha256] | @tsv' "$manifest")
          test "$(wc -l < "$notice_receipt")" -eq 3
          mapfile -d '' installed_manifests < <(find "$root" -type f -path '*/third-party-licenses/ui/verified-source-manifest.json' -print0)
          test "${#installed_manifests[@]}" -eq 1
          cmp "$manifest" "${installed_manifests[0]}"
          printf '%s  %s\n' "$(sha256sum "$manifest" | cut -d ' ' -f 1)" "${installed_manifests[0]}" | sha256sum --check --status
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          dist=app/leptos-ui/dist
          test -s "$dist/index.html"
          mapfile -d '' css_files < <(find "$dist" -type f -name '*.css' -print0)
          test "${#css_files[@]}" -ge 1
          generated="$RUNNER_TEMP/ui-jetbrains-generated.tsv"
          : > "$generated"
          while IFS=$'\t' read -r source expected; do
            mapfile -t hits < <(awk -F '\t' -v hash="$expected" '$1 == hash { print $2 }' "$RUNNER_TEMP/inter-dist-sha256.tsv")
            test "${#hits[@]}" -ge 1
            css_ref=0
            for asset in "${hits[@]}"; do
              basename="${asset##*/}"
              for css in "${css_files[@]}"; do
                if grep -aFq -- "$basename" "$css"; then css_ref=1; fi
              done
            done
            test "$css_ref" -eq 1
            printf '%s\t%s\t%s\n' "$source" "$expected" "${hits[0]#"$dist"/}" >> "$generated"
          done < <(jq -r '.verified_copied_inputs[] | select(.path | contains("jetbrains-mono")) | [.path,.sha256] | @tsv' "$manifest")
          test "$(wc -l < "$generated")" -eq 2
          printf 'head_sha=%s\nprofile=%s\ncoverage=source-and-legal-readback-only\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' > "$RUNNER_TEMP/ui-notice-source.txt"
          sha256sum "$manifest" "${installed_manifests[0]}" "${debs[0]}" >> "$RUNNER_TEMP/ui-notice-source.txt"
      - name: Verify DuckDB selected source texts and installed notices
        id: verify_duckdb_notices
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          root="$RUNNER_TEMP/tundra-deb-root"
          test -d "$root"
          nu scripts/verify_duckdb_selected_bill.nu "$RUNNER_TEMP/duckdb-legal-sources" "$root"
          test "$(find "$root" -type f -path '*/third-party-licenses/ui/duckdb-runtime/*' | wc -l)" -eq 36
          for old in DuckDB-Wasm-MIT.txt Apache-Arrow-13-LICENSE.txt Apache-Arrow-13-NOTICE.txt tslib-0BSD.txt tslib-CopyrightNotice.txt FlatBuffers-LICENSE.txt js-sha256-MIT.txt duckdb-runtime-bill.json; do
            test ! -e "app/tauri/third-party-licenses/ui/$old"
            test "$(find "$root" -type f -path "*/third-party-licenses/ui/$old" | wc -l)" -eq 0
          done
          bill=app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json
          printf 'head_sha=%s\nprofile=%s\nattributions=38\ntexts=36\nadmission=NO\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' > "$RUNNER_TEMP/duckdb-installed-notices.txt"
          sha256sum "$bill" >> "$RUNNER_TEMP/duckdb-installed-notices.txt"
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum "${debs[0]}" >> "$RUNNER_TEMP/duckdb-installed-notices.txt"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          sha256sum "${installed_bins[0]}" >> "$RUNNER_TEMP/duckdb-installed-notices.txt"
      - name: Verify generated frontend bytes in packaged executable
        id: verify_embedded_ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          dist=app/leptos-ui/dist
          root="$RUNNER_TEMP/tundra-deb-root"
          test -s "$dist/index.html" && test -d "$root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp "$RUNNER_TEMP/expected-bundle-auto-tundra" "${installed_bins[0]}"
          proof="$RUNNER_TEMP/embedded-asset-proof.json"
          "${installed_bins[0]}" --verify-embedded-assets "$dist" > "$proof"
          jq -e '
            .schema == "tundra-embedded-assets/v1" and
            .asset_count == (.assets | length) and
            .asset_count >= 18 and
            ([.assets[].key] | length) == ([.assets[].key] | unique | length) and
            all(.assets[]; (.dist_sha256 | test("^[0-9a-f]{64}$")) and
              (.embedded_sha256 | test("^[0-9a-f]{64}$")) and .dist_bytes > 0 and .embedded_bytes > 0 and
              (if .key == "index.html" then .transform == "tauri-csp-html"
               else .transform == "identity" and .dist_bytes == .embedded_bytes and .dist_sha256 == .embedded_sha256 end)) and
            ([.assets[].key] | index("index.html") != null and
              index("fonts/inter-400.woff2") != null and
              index("fonts/inter-500.woff2") != null and
              index("fonts/inter-600.woff2") != null and
              index("fonts/inter-700.woff2") != null and
              index("fonts/jetbrains-mono-400.woff2") != null and
              index("fonts/jetbrains-mono-500.woff2") != null and
              any(.[]; test("^xterm-[0-9a-f]+\\.js$")) and
              any(.[]; test("^xterm-[0-9a-f]+\\.css$")) and
              any(.[]; test("^addon-fit-[0-9a-f]+\\.js$")) and
              any(.[]; endswith(".wasm")))
          ' "$proof"
          (cd "$dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/generated-dist-sha256.txt"
          test "$(wc -l < "$RUNNER_TEMP/generated-dist-sha256.txt")" -eq "$(jq -r '.asset_count' "$proof")"
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          printf 'head_sha=%s\nprofile=%s\nasset_count=%s\nverification=packaged-executable-readback\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' \
            "$(jq -r '.asset_count' "$proof")" > "$RUNNER_TEMP/embedded-asset-source.txt"
          sha256sum "${installed_bins[0]}" "${debs[0]}" "$proof" \
            "$RUNNER_TEMP/generated-dist-sha256.txt" >> "$RUNNER_TEMP/embedded-asset-source.txt"
      - name: Verify same-origin DuckDB source, dist, and installed executable
        id: verify_duckdb_runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          source_dir=app/leptos-ui/duckdb-runtime
          dist_dir=app/leptos-ui/dist/duckdb-runtime
          proof="$RUNNER_TEMP/embedded-asset-proof.json"
          root="$RUNNER_TEMP/tundra-deb-root"
          test -d "$source_dir" && test -d "$dist_dir" && test -s "$proof"
          bill=app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json
          mapfile -d '' installed_bills < <(find "$root" -type f -path '*/third-party-licenses/ui/duckdb-runtime-selected-bill.json' -print0)
          test "${#installed_bills[@]}" -eq 1
          cmp "$bill" "${installed_bills[0]}"
          test "$(find "$source_dir" -type f | wc -l)" -eq 5
          test "$(find "$dist_dir" -type f | wc -l)" -eq 5
          : > "$RUNNER_TEMP/duckdb-installed-runtime.tsv"
          for asset in duckdb-browser.mjs duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js duckdb-mvp.wasm duckdb-eh.wasm; do
            cmp "$source_dir/$asset" "$dist_dir/$asset"
            digest="$(sha256sum "$source_dir/$asset" | cut -d ' ' -f 1)"
            jq -e --arg path "duckdb-runtime/$asset" --arg digest "$digest" \
              '[.assets[] | select(.path == $path and .sha256 == $digest)] | length == 1' "$bill"
            key="duckdb-runtime/$asset"
            jq -e --arg key "$key" --arg digest "$digest" '
              [.assets[] | select(.key == $key and .transform == "identity" and
                .dist_sha256 == $digest and .embedded_sha256 == $digest)] | length == 1
            ' "$proof"
            printf '%s\t%s\t%s\n' "$key" "$digest" '${{ matrix.profile }}' \
              >> "$RUNNER_TEMP/duckdb-installed-runtime.tsv"
          done
          test "$(wc -l < "$RUNNER_TEMP/duckdb-installed-runtime.tsv")" -eq 5
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp "$RUNNER_TEMP/expected-bundle-auto-tundra" "${installed_bins[0]}"
          printf 'head_sha=%s\nprofile=%s\nvalidation=installed-executable-asset-readback\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' \
            > "$RUNNER_TEMP/duckdb-runtime-source.txt"
          sha256sum "${installed_bins[0]}" "$proof" \
            >> "$RUNNER_TEMP/duckdb-runtime-source.txt"
      - name: Smoke installed DuckDB in native WebKitGTK
        id: smoke_duckdb
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          root="$RUNNER_TEMP/tundra-deb-root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp "$RUNNER_TEMP/expected-bundle-auto-tundra" "${installed_bins[0]}"
          elf_sha="$(sha256sum "${installed_bins[0]}" | cut -d ' ' -f 1)"
          mkdir -p "$RUNNER_TEMP/smoke-home" "$RUNNER_TEMP/smoke-config" \
            "$RUNNER_TEMP/smoke-data" "$RUNNER_TEMP/smoke-cache"
          set +e
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            env HOME="$RUNNER_TEMP/smoke-home" \
              XDG_CONFIG_HOME="$RUNNER_TEMP/smoke-config" \
              XDG_DATA_HOME="$RUNNER_TEMP/smoke-data" \
              XDG_CACHE_HOME="$RUNNER_TEMP/smoke-cache" \
              TUNDRA_SMOKE_HEAD_SHA='${{ github.event.pull_request.head.sha }}' \
              TUNDRA_SMOKE_PROFILE='${{ matrix.profile }}' \
              TUNDRA_SMOKE_ELF_SHA256="$elf_sha" \
              http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
              HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              NO_PROXY=localhost,127.0.0.1,tauri.localhost \
            timeout 120s "${installed_bins[0]}" --smoke-duckdb \
            > "$RUNNER_TEMP/duckdb-webkit-smoke.stdout" \
            2> "$RUNNER_TEMP/duckdb-webkit-smoke.stderr"
          status=$?
          set -e
          printf 'head_sha=%s\nprofile=%s\ninstalled_elf_sha256=%s\nexit_status=%s\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' "$elf_sha" "$status" \
            > "$RUNNER_TEMP/duckdb-webkit-smoke-source.txt"
          awk 'index($0, "TUNDRA_DUCKDB_SMOKE:") == 1 {
            print substr($0, length("TUNDRA_DUCKDB_SMOKE:") + 1)
          }' "$RUNNER_TEMP/duckdb-webkit-smoke.stdout" \
            > "$RUNNER_TEMP/duckdb-webkit-smoke.json"
          test "$(wc -l < "$RUNNER_TEMP/duckdb-webkit-smoke.json")" -eq 1
          jq -e --arg head '${{ github.event.pull_request.head.sha }}' \
            --arg profile '${{ matrix.profile }}' --arg elf "$elf_sha" '
            .schema == "tundra-duckdb-webkit-smoke/v1" and
            .head_sha == $head and .profile == $profile and
            .installed_elf_sha256 == $elf and .ok == true and
            .result.ok == true and .result.rowCount == 1 and
            .result.answer == 42 and .result.absentIsNull == true and
            .result.aggregateOk == true and .result.exceptionOk == true and
            .result.cspDenied == true and .result.cspViolations == [] and
            .result.localRuntime == true and .result.remoteRequests == 0
          ' "$RUNNER_TEMP/duckdb-webkit-smoke.json"
          test "$status" -eq 0
      - name: Retain native DuckDB smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-webkit-smoke-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/duckdb-installed-notices.txt
            ${{ runner.temp }}/duckdb-webkit-smoke.json
            ${{ runner.temp }}/duckdb-webkit-smoke.stdout
            ${{ runner.temp }}/duckdb-webkit-smoke.stderr
            ${{ runner.temp }}/duckdb-webkit-smoke-source.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture unapproved bundle-byte diagnostic after failed verification
        if: ${{ failure() && (steps.verify_deb_resources.outcome == 'failure' || steps.verify_selected_bill.outcome == 'failure' || steps.verify_inter_ui.outcome == 'failure' || steps.verify_other_ui_notices.outcome == 'failure' || steps.verify_duckdb_notices.outcome == 'failure' || steps.verify_embedded_ui.outcome == 'failure' || steps.verify_duckdb_runtime.outcome == 'failure' || steps.smoke_duckdb.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/unapproved-bundle-byte-${{ matrix.profile }}"
          mkdir -p "$out/extracted"
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          test -s target/release/auto-tundra
          cp "${debs[0]}" "$out/installer.deb"
          cp target/release/auto-tundra "$out/workspace-auto-tundra"
          dpkg-deb -x "$out/installer.deb" "$out/extracted"
          mapfile -d '' bins < <(find "$out/extracted" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          cp "${bins[0]}" "$out/installed-auto-tundra"
          rm -rf "$out/extracted"
          (cd "$out" && sha256sum installer.deb workspace-auto-tundra installed-auto-tundra > SHA256SUMS)
          if cmp "$out/workspace-auto-tundra" "$out/installed-auto-tundra" > "$out/cmp.txt" 2>&1; then
            printf 'cmp_exit=0\n' >> "$out/cmp.txt"
          else
            printf 'cmp_exit=%s\n' "$?" >> "$out/cmp.txt"
          fi
          file "$out/workspace-auto-tundra" "$out/installed-auto-tundra" > "$out/file.txt"
          dpkg-deb -f "$out/installer.deb" > "$out/control-fields.txt"
          for receipt in embedded-asset-proof.json embedded-asset-source.txt generated-dist-sha256.txt; do
            if [[ -f "$RUNNER_TEMP/$receipt" ]]; then cp "$RUNNER_TEMP/$receipt" "$out/$receipt"; fi
          done
          if [[ -d app/leptos-ui/dist ]]; then cp -R app/leptos-ui/dist "$out/generated-dist"; fi
          printf 'head_sha=%s\nprofile=%s\nverification=FAILED_UNAPPROVED\n' \
            '${{ github.event.pull_request.head.sha }}' '${{ matrix.profile }}' > "$out/source.txt"
      - name: Upload unapproved bundle-byte diagnostic
        if: ${{ failure() && (steps.verify_deb_resources.outcome == 'failure' || steps.verify_selected_bill.outcome == 'failure' || steps.verify_inter_ui.outcome == 'failure' || steps.verify_other_ui_notices.outcome == 'failure' || steps.verify_duckdb_notices.outcome == 'failure' || steps.verify_embedded_ui.outcome == 'failure' || steps.verify_duckdb_runtime.outcome == 'failure' || steps.smoke_duckdb.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: UNAPPROVED-bundle-byte-diagnostic-${{ matrix.profile }}
          path: ${{ runner.temp }}/unapproved-bundle-byte-${{ matrix.profile }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain built installer and byte-comparison receipt
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-exception-license-proof-${{ matrix.profile }}
          path: |
            target/release/bundle/deb/*.deb
            ${{ runner.temp }}/installer-deb.sha256
            ${{ runner.temp }}/installer-resource-proof.tsv
            ${{ runner.temp }}/installer-source.txt
            ${{ runner.temp }}/profile-metadata.json
            ${{ runner.temp }}/installer-profile-metadata.sha256
            ${{ runner.temp }}/installer-bin-fingerprint.json
            ${{ runner.temp }}/installer-binary.sha256
            ${{ runner.temp }}/installer-bundle-patch.txt
            ${{ runner.temp }}/license-inventory.json
            ${{ runner.temp }}/peer-license-inventory.json
            ${{ runner.temp }}/selected-installed-texts.tsv
            ${{ runner.temp }}/selected-bill-sha256.txt
            ${{ runner.temp }}/inter-dist-sha256.tsv
            ${{ runner.temp }}/inter-dist-source-proof.tsv
            ${{ runner.temp }}/inter-installed-notice.txt
            ${{ runner.temp }}/ui-copied-source-proof.tsv
            ${{ runner.temp }}/ui-installed-notices.tsv
            ${{ runner.temp }}/ui-jetbrains-generated.tsv
            ${{ runner.temp }}/ui-notice-source.txt
            ${{ runner.temp }}/embedded-asset-proof.json
            ${{ runner.temp }}/embedded-asset-source.txt
            ${{ runner.temp }}/generated-dist-sha256.txt
            ${{ runner.temp }}/duckdb-source-head.txt
            ${{ runner.temp }}/duckdb-generated-assets.sha256
            ${{ runner.temp }}/duckdb-installed-runtime.tsv
            ${{ runner.temp }}/duckdb-runtime-source.txt
            ${{ runner.temp }}/duckdb-installed-notices.txt
            ${{ runner.temp }}/duckdb-webkit-smoke.json
            ${{ runner.temp }}/duckdb-webkit-smoke-source.txt
            app/leptos-ui/dist/**
            app/tauri/third-party-licenses/ui/verified-source-manifest.json
            app/tauri/third-party-licenses/selected-notice-bill.json
          if-no-files-found: error
          retention-days: 14

  linux-deb-profile-distinction:
    name: Linux default and sounds installers have distinct binaries
    needs: linux-deb-notice-resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-deb-exception-license-proof-*
          path: ${{ runner.temp }}/variant-artifacts
      - name: Compare extracted installer binaries
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/variant-artifacts"
          default_dir="$artifact_root/linux-deb-exception-license-proof-default"
          sounds_dir="$artifact_root/linux-deb-exception-license-proof-sounds"
          for profile in default sounds; do
            dir="$artifact_root/linux-deb-exception-license-proof-$profile"
            if ! cmp -s "$dir/_temp/installer-source.txt" \
              <(printf 'head_sha=%s\nprofile=%s\ntauri_features=%s\n' \
                '${{ github.event.pull_request.head.sha }}' "$profile" "$profile"); then
              echo "Missing or mismatched $profile installer source receipt" >&2
              exit 1
            fi
          done
          mapfile -d '' default_debs < <(find "$default_dir" -type f -name '*.deb' -print0)
          mapfile -d '' sounds_debs < <(find "$sounds_dir" -type f -name '*.deb' -print0)
          if (( ${#default_debs[@]} != 1 || ${#sounds_debs[@]} != 1 )); then
            echo 'Expected exactly one .deb in each approved profile artifact' >&2
            exit 1
          fi
          test "${default_debs[0]}" = "$default_dir/tundra/tundra/target/release/bundle/deb/auto-tundra_0.1.0_amd64.deb"
          test "${sounds_debs[0]}" = "$sounds_dir/tundra/tundra/target/release/bundle/deb/auto-tundra_0.1.0_amd64.deb"
          mkdir -p "$RUNNER_TEMP/default-root" "$RUNNER_TEMP/sounds-root"
          dpkg-deb -x "${default_debs[0]}" "$RUNNER_TEMP/default-root"
          dpkg-deb -x "${sounds_debs[0]}" "$RUNNER_TEMP/sounds-root"
          mapfile -d '' default_bins < <(find "$RUNNER_TEMP/default-root" -type f -name auto-tundra -print0)
          mapfile -d '' sounds_bins < <(find "$RUNNER_TEMP/sounds-root" -type f -name auto-tundra -print0)
          test "${#default_bins[@]}" -eq 1 && test "${#sounds_bins[@]}" -eq 1
          if cmp -s "${default_bins[0]}" "${sounds_bins[0]}"; then
            echo 'Default and sounds installer binaries are byte-identical; feature-on package proof is unresolved.' >&2
            exit 1
          fi
          sha256sum "${default_bins[0]}" "${sounds_bins[0]}" > "$RUNNER_TEMP/variant-binary-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-profile-distinction-proof
          path: ${{ runner.temp }}/variant-binary-sha256.txt
          if-no-files-found: error
          retention-days: 14

  optional-watcher:
    name: Optional file watcher on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact feature-on graph
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --features at-core/file-watcher > "$RUNNER_TEMP/watcher-metadata.json"
          jq -e '. as $graph | ($graph.packages[] | select(.name == "at-core") | .id) as $core_id | [$graph.resolve.nodes[] | select(.id == $core_id) | .features[]] | index("file-watcher") != null' "$RUNNER_TEMP/watcher-metadata.json"
          jq -e '[.packages[].name] | index("notify") != null' "$RUNNER_TEMP/watcher-metadata.json"
      - name: Test opt-in watcher module
        run: cargo test -p at-core --locked --features file-watcher --lib file_watcher::tests -- --nocapture
      - name: Retain feature-on graph
        uses: actions/upload-artifact@v4
        with:
          name: optional-file-watcher-linux-graph
          path: ${{ runner.temp }}/watcher-metadata.json
          if-no-files-found: error
          retention-days: 14
