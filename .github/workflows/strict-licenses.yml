name: Strict dependency licenses

on:
  pull_request:
    paths:
      - .github/workflows/strict-licenses.yml
      - Cargo.toml
      - Cargo.lock
      - deny-strict.toml
      - '**/Cargo.toml'

permissions:
  contents: read

jobs:
  strict-licenses:
    name: MIT BSD Apache selected graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check all-feature all-target dependency licenses
        run: cargo deny --workspace --config deny-strict.toml --locked check licenses
