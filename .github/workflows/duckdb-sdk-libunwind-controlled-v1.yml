name: DuckDB controlled libunwind-except object production diagnostic v1

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  controlled-libunwind:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize fail-closed bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pr145-v1-receipt"
          test ! -e "$output"
          mkdir "$output"
          printf '%s\n' '{"schema":"tundra-sdk-libunwind-controlled-object/v1","status":"REFUSED","reason":"NOT_COMPLETED","object_input_closure":"UNPROVEN","sdk_archive_keys_pending_per_condition":9,"generator_input_closure":"UNPROVEN","selected_graph_exhaustive":"NO","glue_legal_admission":"NO","legal_admission":"NO","product_admission":"NO","fleet_admission":"NO"}' > "$output/refusal.json"
      - name: Install checksum-pinned MIT Nushell
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
          tool="$RUNNER_TEMP/pr145-v1-nu"
          mkdir "$tool"
          archive="$tool/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz"
          timeout 180s curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-time 120 --retry 1 \
            --max-filesize 90000000 --output "$archive" \
            https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz
          test "$(stat -c %s "$archive")" = 83545998
          printf '%s  %s\n' 8a9722177ddd421eba927b4baae4ae341a4d1c3434504be7b1b17d998bafdd87 "$archive" | sha256sum --check --status
          tar -xOzf "$archive" nu-0.115.1-x86_64-unknown-linux-musl/nu > "$tool/nu"
          tar -xOzf "$archive" nu-0.115.1-x86_64-unknown-linux-musl/LICENSE > "$tool/LICENSE"
          printf '%s  %s\n' \
            c343a927a2d4a45ebf9300d013b226bcdc2598ecb0178a8a79722ebffe71e56e "$tool/nu" \
            ff5dcaaba6140ec57cafdd4f707cd0d329e727477cf7d5b9ba7a244ec2678b79 "$tool/LICENSE" \
            | sha256sum --check --status
          test "$(stat -c %s "$tool/nu")" = 70750360
          grep -Fxq 'MIT License' "$tool/LICENSE"
          chmod 0700 "$tool/nu"
          test "$("$tool/nu" --version)" = 0.115.1
      - name: Run controlled source object production in pinned image
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/.git/HEAD" && test ! -L "$GITHUB_WORKSPACE/.git/HEAD"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GITHUB_SHA" | cmp -s - "$GITHUB_WORKSPACE/.git/HEAD"
          printf '%s  %s\n' \
            1f9afa1be80e7c7fec8fd90821992dd3f7f5f15799dc2b4033b038fb51378dec .github/receipts/duckdb-sdk-libunwind-controlled-v1.json \
            d82073565a09aae67ba3927d9575b9d9bdc89c2e77bc7a225f6d11b5a176b147 .github/scripts/duckdb-sdk-libunwind-controlled-v1.nu \
            | sha256sum --check --status
          test ! -e "$RUNNER_TEMP/pr145-v1-tool"
          tool="$RUNNER_TEMP/pr145-v1-tool"; mkdir "$tool"
          cp .github/receipts/duckdb-sdk-libunwind-controlled-v1.json "$tool/ledger.json"
          cp .github/scripts/duckdb-sdk-libunwind-controlled-v1.nu "$tool/helper.nu"
          cp "$RUNNER_TEMP/pr145-v1-nu/nu" "$tool/nu"
          chmod -R a+rX "$tool"
          output="$RUNNER_TEMP/pr145-v1-receipt"
          chmod 0777 "$output" && chmod 0666 "$output/refusal.json"
          image='emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29'
          timeout 900s docker pull "$image" >/dev/null
          docker image inspect --format '{{json .RepoDigests}}' "$image" \
            | jq -e --arg expected 'emscripten/emsdk@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29' \
                'type == "array" and index($expected) != null' >/dev/null
          timeout 600s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 4g --cpus 2 \
            --tmpfs /work:rw,nosuid,nodev,size=536870912,mode=1777 \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456,mode=1777 \
            --user 1000:1000 --env HOME=/tmp \
            --mount "type=bind,src=$tool,dst=/tool,readonly" \
            --mount "type=bind,src=$output,dst=/receipt" \
            --entrypoint /tool/nu "$image" /tool/helper.nu /tool/ledger.json /receipt
          test -s "$output/controlled-object.json"
          test ! -e "$output/refusal.json"
      - name: Enforce receipt cap and remove ephemeral tool bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/pr145-v1-tool" "$RUNNER_TEMP/pr145-v1-nu"
          output="$RUNNER_TEMP/pr145-v1-receipt"; test -d "$output"
          bytes="$(du -sb "$output" | cut -f 1)"
          if test "$bytes" -gt 2097152; then
            find "$output" -mindepth 1 -maxdepth 1 -type f -delete
            printf '%s\n' '{"schema":"tundra-sdk-libunwind-controlled-object/v1","status":"REFUSED","reason":"DIAGNOSTIC_CAP","object_input_closure":"UNPROVEN","sdk_archive_keys_pending_per_condition":9,"generator_input_closure":"UNPROVEN","selected_graph_exhaustive":"NO","glue_legal_admission":"NO","legal_admission":"NO","product_admission":"NO","fleet_admission":"NO"}' > "$output/refusal.json"
            exit 1
          fi
      - name: Retain sanitized diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-sdk-libunwind-controlled-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr145-v1-receipt/
          if-no-files-found: error
          retention-days: 7
