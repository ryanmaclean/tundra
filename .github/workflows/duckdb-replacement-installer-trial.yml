name: DuckDB replacement installed WebKit trial

# Technical-only trial retained for comparison. The selected notice bill keeps
# admission NO while generated-glue and SDK source provenance remain unresolved.

on:
  pull_request:
    paths:
      - .github/workflows/duckdb-replacement-installer-trial.yml
      - .github/scripts/duckdb-stage-replacement-trial.nu
      - app/leptos-ui/duckdb-bridge.js
      - app/tauri/src/main.rs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-replacement:
    name: Installed replacement (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [default, sounds]
    env:
      TRIAL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact trial head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate pinned PR117 artifact and inspect closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIAL_HEAD"
          mkdir -p "$RUNNER_TEMP/replacement-input" "$RUNNER_TEMP/replacement-receipt"
          metadata="$RUNNER_TEMP/replacement-receipt/artifact.json"
          zip="$RUNNER_TEMP/replacement-candidate.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ryanmaclean/tundra/actions/artifacts/12607318747' \
            --output "$metadata"
          jq -e '.id == 12607318747 and
            .name == "duckdb-matching-browser-candidate" and
            .digest == "sha256:be8fade74d4dda4b5eae20fc3f906370f6fd9fc82e606810a469b24affa5e7b5" and
            .expired == false and .workflow_run.id == 40217360882 and
            .workflow_run.head_sha == "7182d3f1b51cf643f73d40f15b576006accddd7d"' \
            "$metadata" > /dev/null
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/ryanmaclean/tundra/actions/artifacts/12607318747/zip' \
            --output "$zip"
          printf '%s  %s\n' \
            'be8fade74d4dda4b5eae20fc3f906370f6fd9fc82e606810a469b24affa5e7b5' "$zip" \
            | sha256sum --check --status
          unzip -tq "$zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/replacement-input"
          receipt="$RUNNER_TEMP/replacement-input"
          grep -Fxq 'tundra_trial_head=7182d3f1b51cf643f73d40f15b576006accddd7d' "$receipt/input-receipt/heads.txt"
          grep -Fxq 'source_head=f955138e5218942fb3fb097a8fdcb725222406ff' "$receipt/input-receipt/heads.txt"
          grep -Fxq 'native_tundra_head=a7d43e055ad33f73bb7cd4333b80ebd70ea940ea' "$receipt/input-receipt/heads.txt"
          grep -Fxq 'native_run=40216203853' "$receipt/input-receipt/heads.txt"
          jq -e '.admission == "NO" and .coi_built == false and
            .source_commit == "f955138e5218942fb3fb097a8fdcb725222406ff"' \
            "$receipt/matching-receipt/candidate.json" > /dev/null
          jq -e '[.outputs | to_entries[] | .value.imports[]? |
            select(.external == true)] | length == 0' \
            "$receipt/matching-receipt/browser-metafile.json" > /dev/null
          for variant in mvp eh; do
            jq -e '[.outputs | to_entries[] | .value.imports[]? |
              select(.external == true) | [.path,.kind]] ==
              [["crypto","require-call"]]' \
              "$receipt/matching-receipt/worker-$variant-metafile.json" > /dev/null
          done
          sha256sum "$zip" .github/scripts/duckdb-stage-replacement-trial.nu \
            > "$RUNNER_TEMP/replacement-receipt/input.sha256"
          printf 'trial_head=%s\nprofile=%s\nadmission=NO\n' \
            "$TRIAL_HEAD" '${{ matrix.profile }}' \
            > "$RUNNER_TEMP/replacement-receipt/trial-source.txt"
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget xvfb dbus-x11
      - name: Install ALSA development files for sounds build
        if: matrix.profile == 'sounds'
        run: sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install locked UI and Tauri build tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Install checksum-pinned Nushell binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/nushell/nushell/releases/download/0.108.0/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            'f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df' "$archive" \
            | sha256sum --check --status
          sha256sum "$archive" > "$RUNNER_TEMP/replacement-receipt/nu-archive.sha256"
          mkdir -p "$RUNNER_TEMP/nu-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nu-tool"
          mapfile -t binaries < <(find "$RUNNER_TEMP/nu-tool" -type f -name nu -perm -u+x)
          test "${#binaries[@]}" -eq 1
          printf '%s\n' "${binaries[0]}" > "$RUNNER_TEMP/replacement-receipt/nu-path.txt"
          "${binaries[0]}" --version > "$RUNNER_TEMP/replacement-receipt/nu-version.txt"
          grep -Fxq '0.108.0' "$RUNNER_TEMP/replacement-receipt/nu-version.txt"
      - name: Stage exactly five replacement assets
        shell: bash
        run: |
          set -euo pipefail
          nu_bin="$(cat "$RUNNER_TEMP/replacement-receipt/nu-path.txt")"
          "$nu_bin" .github/scripts/duckdb-stage-replacement-trial.nu \
            "$RUNNER_TEMP/replacement-input/matching-output" \
            app/leptos-ui/duckdb-runtime "$RUNNER_TEMP/replacement-stage"
          jq -e '.admission == "NO" and .artifact_id == 12607318747 and
            (.assets | length) == 5' \
            "$RUNNER_TEMP/replacement-stage/replacement-trial.json" > /dev/null
          jq -r '.assets[] | [.sha256,.name] | join("  ")' \
            "$RUNNER_TEMP/replacement-stage/replacement-trial.json" \
            > "$RUNNER_TEMP/replacement-receipt/five-assets.sha256"
          (cd app/leptos-ui/duckdb-runtime && sha256sum --check --status \
            "$RUNNER_TEMP/replacement-receipt/five-assets.sha256")
          cp "$RUNNER_TEMP/replacement-stage/replacement-trial.json" \
            "$RUNNER_TEMP/replacement-receipt/replacement-trial.json"
      - name: Build locked UI and ephemeral Linux installer
        shell: bash
        run: |
          set -euo pipefail
          (cd app/leptos-ui && trunk build --release --locked)
          test -s app/leptos-ui/dist/index.html
          test "$(find app/leptos-ui/dist/duckdb-runtime -maxdepth 1 -type f | wc -l)" -eq 5
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          test -s target/release/auto-tundra
          shopt -s nullglob
          fingerprints=(target/release/.fingerprint/at-tauri-*/bin-auto-tundra.json)
          test "${#fingerprints[@]}" -eq 1
          cp "${fingerprints[0]}" "$RUNNER_TEMP/replacement-receipt/profile-fingerprint.json"
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            jq -e '(.features | fromjson | index("sounds")) != null' \
              "$RUNNER_TEMP/replacement-receipt/profile-fingerprint.json" > /dev/null
          else
            jq -e '(.features | fromjson | index("sounds")) == null' \
              "$RUNNER_TEMP/replacement-receipt/profile-fingerprint.json" > /dev/null
          fi
      - name: Verify source, dist, extracted installer, and embedded bytes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          root="$RUNNER_TEMP/tundra-deb-root"
          mkdir -p "$root"
          dpkg-deb -x "${debs[0]}" "$root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          workspace_bin=target/release/auto-tundra
          marker_prefix='__TAURI_BUNDLE_TYPE_VAR_'
          mapfile -t marker_hits < <(LC_ALL=C grep -aobF "${marker_prefix}UNK" "$workspace_bin")
          test "${#marker_hits[@]}" -eq 1
          marker_offset="${marker_hits[0]%%:*}"
          [[ "$marker_offset" =~ ^[0-9]+$ ]]
          expected_bin="$RUNNER_TEMP/expected-bundle-auto-tundra"
          cp "$workspace_bin" "$expected_bin"
          printf 'DEB' | dd of="$expected_bin" bs=1 \
            seek="$((marker_offset + ${#marker_prefix}))" conv=notrunc status=none
          cmp "$expected_bin" "${installed_bins[0]}"
          proof="$RUNNER_TEMP/replacement-receipt/embedded-asset-proof.json"
          "${installed_bins[0]}" --verify-embedded-assets app/leptos-ui/dist > "$proof"
          jq -e '.schema == "tundra-embedded-assets/v1" and
            .asset_count == (.assets | length) and .asset_count >= 18 and
            all(.assets[]; .dist_sha256 == .embedded_sha256 or
              (.key == "index.html" and .transform == "tauri-csp-html"))' "$proof" > /dev/null
          : > "$RUNNER_TEMP/replacement-receipt/five-joins.tsv"
          while read -r digest asset; do
            source="app/leptos-ui/duckdb-runtime/$asset"
            dist="app/leptos-ui/dist/duckdb-runtime/$asset"
            printf '%s  %s\n%s  %s\n' "$digest" "$source" "$digest" "$dist" \
              | sha256sum --check --status
            cmp "$source" "$dist"
            jq -e --arg key "duckdb-runtime/$asset" --arg digest "$digest" '
              [.assets[] | select(.key == $key and .transform == "identity" and
                .dist_sha256 == $digest and .embedded_sha256 == $digest)] | length == 1
            ' "$proof" > /dev/null
            printf '%s\t%s\t%s\n' "$asset" "$digest" '${{ matrix.profile }}' \
              >> "$RUNNER_TEMP/replacement-receipt/five-joins.tsv"
          done < "$RUNNER_TEMP/replacement-receipt/five-assets.sha256"
          test "$(wc -l < "$RUNNER_TEMP/replacement-receipt/five-joins.tsv")" -eq 5
          printf 'trial_head=%s\nprofile=%s\nadmission=NO\nselected_duckdb_bill=ADMISSION_NO\n' \
            "$TRIAL_HEAD" '${{ matrix.profile }}' \
            > "$RUNNER_TEMP/replacement-receipt/installer-source.txt"
          sha256sum "$workspace_bin" "$expected_bin" "${installed_bins[0]}" "${debs[0]}" "$proof" \
            >> "$RUNNER_TEMP/replacement-receipt/installer-source.txt"
          mapfile -d '' installed_bills < <(find "$root" -type f -path '*/third-party-licenses/ui/duckdb-runtime-selected-bill.json' -print0)
          test "${#installed_bills[@]}" -eq 1
          cmp app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json "${installed_bills[0]}"
          sha256sum "${installed_bills[0]}" \
            >> "$RUNNER_TEMP/replacement-receipt/installer-source.txt"
      - name: Smoke installed MVP and EH in WebKitGTK
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tundra-deb-root"
          mapfile -d '' installed_bins < <(find "$root" -type f -name auto-tundra -print0)
          test "${#installed_bins[@]}" -eq 1
          cmp "$RUNNER_TEMP/expected-bundle-auto-tundra" "${installed_bins[0]}"
          elf_sha="$(sha256sum "${installed_bins[0]}" | cut -d ' ' -f 1)"
          for variant in mvp eh; do
            home="$RUNNER_TEMP/smoke-$variant"
            mkdir -p "$home/home" "$home/config" "$home/data" "$home/cache"
            set +e
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
              env HOME="$home/home" XDG_CONFIG_HOME="$home/config" \
                XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" \
                TUNDRA_SMOKE_HEAD_SHA="$TRIAL_HEAD" \
                TUNDRA_SMOKE_PROFILE='${{ matrix.profile }}' \
                TUNDRA_SMOKE_VARIANT="$variant" \
                TUNDRA_SMOKE_ELF_SHA256="$elf_sha" \
                http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
                HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
                NO_PROXY=localhost,127.0.0.1,tauri.localhost \
              timeout 120s "${installed_bins[0]}" --smoke-duckdb "$variant" \
              > "$RUNNER_TEMP/replacement-receipt/webkit-$variant.stdout" \
              2> "$RUNNER_TEMP/replacement-receipt/webkit-$variant.stderr"
            status=$?
            set -e
            awk 'index($0, "TUNDRA_DUCKDB_SMOKE:") == 1 {
              print substr($0, length("TUNDRA_DUCKDB_SMOKE:") + 1)
            }' "$RUNNER_TEMP/replacement-receipt/webkit-$variant.stdout" \
              > "$RUNNER_TEMP/replacement-receipt/webkit-$variant.json"
            test "$(wc -l < "$RUNNER_TEMP/replacement-receipt/webkit-$variant.json")" -eq 1
            jq -e --arg head "$TRIAL_HEAD" --arg profile '${{ matrix.profile }}' \
              --arg elf "$elf_sha" --arg variant "$variant" '
              .schema == "tundra-duckdb-webkit-smoke/v1" and
              .head_sha == $head and .profile == $profile and
              .installed_elf_sha256 == $elf and
              .requested_variant == $variant and .result.variant == $variant and
              .ok == true and .result.ok == true and
              .result.rowCount == 1 and .result.answer == 42 and
              .result.absentIsNull == true and .result.aggregateOk == true and
              .result.cspDenied == true and .result.cspViolations == [] and
              .result.localRuntime == true and .result.remoteRequests == 0
            ' "$RUNNER_TEMP/replacement-receipt/webkit-$variant.json" > /dev/null
            test "$status" -eq 0
          done
      - name: Retain receipts only, no installer or executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-replacement-trial-${{ matrix.profile }}
          path: ${{ runner.temp }}/replacement-receipt/
          if-no-files-found: warn
          retention-days: 14
