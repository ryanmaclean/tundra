name: DuckDB PR137 new-runtime four corpus-enabled package cells v1

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  installed-cells:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr153-new-runtime-package-held-20261027' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        condition: [image, clean]
        profile: [default, sounds]
    steps:
      - name: Initialize bounded refusal receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libnoexit-refusal"
          printf 'schema=tundra-libnoexit-new-runtime-package-refusal/v1\nstatus=REFUSED\nreason=SOURCE_OR_PACKAGE_GATE_FAILED\npackage_install_verified=NO\nbehavior_cases=NOT_RUN\nlinker_input=UNPROVEN\ngenerator_input_closure=UNPROVEN\nlegal_admission=NO\nproduct_admission=NO\nfleet_admission=NO\n' \
            > "$RUNNER_TEMP/libnoexit-refusal/refusal.txt"
      - name: Check out exact PR119 package consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad0df7182cd4c9ea4a83bac04e5901de0218d9d0
          persist-credentials: false
      - name: Check out same-head diagnostic gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: gate-source
          persist-credentials: false
      - name: Verify exact source and reviewed helper pins
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/diagnostic/pr153-new-runtime-package-held-20261027
          test "$GITHUB_RUN_ID" != 40442338363
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -f gate-source/.git/HEAD && test ! -L gate-source/.git/HEAD
          printf '%s\n' "$GITHUB_SHA" | cmp -s - gate-source/.git/HEAD
          test -f .git/HEAD && test ! -L .git/HEAD
          printf '%s\n' ad0df7182cd4c9ea4a83bac04e5901de0218d9d0 | cmp -s - .git/HEAD
          for path in \
            gate-source/.github/scripts/duckdb-sdk-libnoexit-installed-preflight-v1.nu \
            gate-source/.github/receipts/duckdb-sdk-libnoexit-installed-preflight-v1.json \
            gate-source/.github/scripts/duckdb-sdk-libnoexit-installed-cells-v1.nu \
            gate-source/.github/receipts/duckdb-sdk-libnoexit-installed-cells-v1.json \
            gate-source/.github/scripts/duckdb-libnoexit-corpus-package-source-v1.nu \
            gate-source/.github/receipts/duckdb-libnoexit-corpus-package-source-v1.json \
            gate-source/.github/scripts/duckdb-libnoexit-new-runtime-package-source-v1.nu \
            gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json \
            gate-source/.github/scripts/duckdb-package-json-selected-bill-v5.nu \
            gate-source/.github/scripts/duckdb-json-selected-notices/yyjson-0.6.0-LICENSE \
            gate-source/.github/scripts/duckdb-eh-corpus/eh-corpus.mjs \
            gate-source/.github/scripts/duckdb-eh-corpus/apply-eh-corpus.nu; do
            test -f "$path" && test ! -L "$path"
          done
          printf '%s  %s\n' \
            9260c1e08c89d481206978c8b65bbf9a649183a4e141a86e9c29a89730939b4c gate-source/.github/scripts/duckdb-sdk-libnoexit-installed-preflight-v1.nu \
            4ed8d49164418402f19528e2ee4e0c61db204f12cc6b1f3f1ba09f019afa005d gate-source/.github/receipts/duckdb-sdk-libnoexit-installed-preflight-v1.json \
            c240925a7fdaab81a4ee4b3e4e2f309001e3efd434fd046e197899a0c5a0ab7f gate-source/.github/scripts/duckdb-sdk-libnoexit-installed-cells-v1.nu \
            ca8cbbd0f65be4e9645ff2d308c24ba0cbe21172bfe20bf005d4a761c1f6e2eb gate-source/.github/receipts/duckdb-sdk-libnoexit-installed-cells-v1.json \
            403ddf59d5e6924ba4754fc1cc92e2c756e4bfdf020a23b9245db47d5e784174 gate-source/.github/scripts/duckdb-libnoexit-corpus-package-source-v1.nu \
            80b4c8e2a6f42f3d8f8bab45d8fb65c7ed1639596b363d80216ee76dad4f71cf gate-source/.github/receipts/duckdb-libnoexit-corpus-package-source-v1.json \
            38b66dde67b64d49f6c17a90cfe28e8175fb6bb9ff3ca918bf19bd0a165ed915 gate-source/.github/scripts/duckdb-libnoexit-new-runtime-package-source-v1.nu \
            4c4c204139621c4ba1dda01ee4eff5590cf44d02051835f1e79bbbc8f84d24a8 gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json \
            b26c3651b599ad15baf58b1e24a91a7fd83ad5832d2ce4b25e3d690b9c00d72c gate-source/.github/scripts/duckdb-package-json-selected-bill-v5.nu \
            45e384d3d52c73cba3a64d6e6c25d47cd738cd8a55c30629e3201046eda62947 gate-source/.github/scripts/duckdb-json-selected-notices/yyjson-0.6.0-LICENSE \
            196ba238054a5b22e2a89d781eb7ed3844a416b71384f98fbc9c032eea551c0a gate-source/.github/scripts/duckdb-eh-corpus/eh-corpus.mjs \
            7895597e2417426c141dcbc7c5e002269fb5f7f3c3381a6612bdfba33af3acf4 gate-source/.github/scripts/duckdb-eh-corpus/apply-eh-corpus.nu \
            | sha256sum --check --status
      - name: Install checksum-pinned MIT Nushell
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
          tool="$RUNNER_TEMP/tundra-nu-0.115.1"
          mkdir -p "$tool"
          archive="$tool/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz"
          timeout 180s curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --max-time 120 --retry 1 \
            --max-filesize 90000000 --output "$archive" \
            https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz
          test "$(stat -c %s "$archive")" = 83545998
          printf '%s  %s\n' 8a9722177ddd421eba927b4baae4ae341a4d1c3434504be7b1b17d998bafdd87 "$archive" \
            | sha256sum --check --status
          tar -xOzf "$archive" nu-0.115.1-x86_64-unknown-linux-musl/nu > "$tool/nu"
          tar -xOzf "$archive" nu-0.115.1-x86_64-unknown-linux-musl/LICENSE > "$tool/LICENSE"
          test "$(stat -c %s "$tool/nu")" = 70750360
          printf '%s  %s\n' \
            c343a927a2d4a45ebf9300d013b226bcdc2598ecb0178a8a79722ebffe71e56e "$tool/nu" \
            ff5dcaaba6140ec57cafdd4f707cd0d329e727477cf7d5b9ba7a244ec2678b79 "$tool/LICENSE" \
            | sha256sum --check --status
          grep -Fxq 'MIT License' "$tool/LICENSE"
          chmod 0700 "$tool/nu"
          test "$("$tool/nu" --version)" = 0.115.1
          echo "$tool" >> "$GITHUB_PATH"
      - name: Authenticate controlled producer bytes independently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nu gate-source/.github/scripts/duckdb-sdk-libnoexit-installed-preflight-v1.nu \
            "$RUNNER_TEMP/libnoexit-preflight"
          jq -e '.status == "PRODUCER_BYTES_AUTHENTICATED_ONLY" and
            .installed_cell_status == "NOT_BUILT" and
            (.future_cells | length) == 4 and
            .legal_admission == "NO" and .product_admission == "NO" and
            .fleet_admission == "NO"' \
            "$RUNNER_TEMP/libnoexit-preflight/authenticated/preflight.json"
      - name: Authenticate PR117, PR136, and condition-matched PR137 API inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/new-runtime-input"
          mkdir -p "$out"
          case '${{ matrix.condition }}-${{ matrix.profile }}' in
            image-default) trial_id=12707397953 ;;
            image-sounds) trial_id=12707094239 ;;
            clean-default) trial_id=12708117533 ;;
            clean-sounds) trial_id=12708990037 ;;
            *) exit 1 ;;
          esac
          for prefix in pr117 pr136 pr137; do
            case "$prefix" in
              pr117) run=40217360882; id=12607318747 ;;
              pr136) run=40434996466; id=12705817192 ;;
              pr137) run=40442338363; id="$trial_id" ;;
            esac
            gh api "repos/ryanmaclean/tundra/actions/runs/$run" > "$out/$prefix-run.json"
            gh api "repos/ryanmaclean/tundra/actions/artifacts/$id" > "$out/$prefix-artifact.json"
          done
          gh api repos/ryanmaclean/tundra/actions/artifacts/12705817192/zip > "$out/pr136.zip"
          test "$(stat -c %s "$out/pr136.zip")" -le 67108864
          gh api "repos/ryanmaclean/tundra/actions/artifacts/$trial_id/zip" > "$out/pr137.zip"
          test "$(stat -c %s "$out/pr137.zip")" -le 8388608
      - name: Stage PR117 original three, PR137 worker, PR136 condition Wasm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nu scripts/fetch_duckdb_replacement.nu \
            "$RUNNER_TEMP/duckdb-replacement" "$RUNNER_TEMP/duckdb-fetch"
          nu scripts/stage_duckdb_runtime.nu app/leptos-ui/duckdb-runtime "$RUNNER_TEMP" \
            "$RUNNER_TEMP/duckdb-replacement/matching-output"
          cp "$RUNNER_TEMP/duckdb-fetch/custody.json" "$RUNNER_TEMP/duckdb-replacement/custody.json"
          nu gate-source/.github/scripts/duckdb-libnoexit-new-runtime-package-source-v1.nu stage \
            gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json \
            '${{ matrix.condition }}' '${{ matrix.profile }}' \
            "$RUNNER_TEMP/new-runtime-input" "$RUNNER_TEMP/duckdb-replacement" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/libnoexit-preflight/authenticated" \
            "$RUNNER_TEMP/new-runtime-input/runtime-stage.json"
      - name: Reproduce exact PR137 v5 selected notice bill before bundling
        shell: bash
        run: |
          set -euo pipefail
          ledger=gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json
          input="$RUNNER_TEMP/new-runtime-input"
          source_bill=app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json
          cp "$source_bill" "$input/pinned-pr119-selected-bill.json"
          printf '%s  %s\n' 34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790 "$input/pinned-pr119-selected-bill.json" | sha256sum --check --status
          condition='${{ matrix.condition }}'
          profile='${{ matrix.profile }}'
          wasm_sha="$(sha256sum app/leptos-ui/duckdb-runtime/duckdb-eh.wasm | cut -d ' ' -f1)"
          worker_sha="$(sha256sum app/leptos-ui/duckdb-runtime/duckdb-browser-eh.worker.js | cut -d ' ' -f1)"
          js_sha="$(sha256sum "$input/condition.js" | cut -d ' ' -f1)"
          nu gate-source/.github/scripts/duckdb-package-json-selected-bill-v5.nu \
            "$input/pinned-pr119-selected-bill.json" app/leptos-ui/duckdb-runtime "$source_bill" \
            "$condition" "$profile" ad0df7182cd4c9ea4a83bac04e5901de0218d9d0 \
            22637d141f67dc92510211d7d281f6591a12a5f5 40434996466 1 12705817192 \
            sha256:b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c \
            b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c \
            "$input/producer-selected-bill.json" "$wasm_sha" "$worker_sha" "$js_sha" \
            gate-source/.github/scripts/duckdb-json-selected-notices/yyjson-0.6.0-LICENSE \
            app/tauri/third-party-licenses/ui/duckdb-runtime
          cmp "$source_bill" "$input/trial-selected-bill.json"
          expected="$(jq -r --arg condition "$condition" --arg profile "$profile" '.cells[] | select(.condition == $condition and .profile == $profile) | .bill_sha256' "$ledger")"
          printf '%s  %s\n' "$expected" "$source_bill" | sha256sum --check --status
      - name: Install disposable package build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          timeout 1800s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 \
            install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            timeout 300s sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends libasound2-dev
          fi
      - name: Install Rust and pinned Tauri build commands
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install UI and Tauri tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Apply exact PR137 32-case source transformation before package build
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/gate-source"
          test -f app/tauri/src/main.rs && test ! -L app/tauri/src/main.rs
          mkdir -p "$RUNNER_TEMP/libnoexit-corpus-source"
          nu gate-source/.github/scripts/duckdb-libnoexit-corpus-package-source-v1.nu patch \
            gate-source/.github/receipts/duckdb-libnoexit-corpus-package-source-v1.json \
            app/tauri/src/main.rs \
            gate-source/.github/scripts/duckdb-eh-corpus/eh-corpus.mjs \
            gate-source/.github/scripts/duckdb-eh-corpus/apply-eh-corpus.nu \
            "$RUNNER_TEMP/libnoexit-corpus-source" \
            "$RUNNER_TEMP/new-runtime-input/source-receipt.json"
          printf '%s  %s\n' \
            57480e689cccfa26e8527dba3f566c275bfbfad7cb2c43c4cb3dd85263284b8e \
            app/tauri/src/main.rs | sha256sum --check --status
      - name: Build four genuinely new condition/profile packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          prior_debs=(target/release/bundle/deb/*.deb)
          test "${#prior_debs[@]}" -eq 0
          (cd app/leptos-ui && trunk build --release --locked)
          for name in duckdb-browser.mjs duckdb-browser-eh.worker.js duckdb-eh.wasm \
                      duckdb-browser-mvp.worker.js duckdb-mvp.wasm; do
            cmp "app/leptos-ui/duckdb-runtime/$name" "app/leptos-ui/dist/duckdb-runtime/$name"
          done
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          printf '%s  %s\n' \
            57480e689cccfa26e8527dba3f566c275bfbfad7cb2c43c4cb3dd85263284b8e \
            app/tauri/src/main.rs | sha256sum --check --status
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          test "$(dpkg-deb -f "${debs[0]}" Package)" = auto-tundra
          test "$(dpkg-deb -f "${debs[0]}" Version)" = 0.1.0
          test "$(dpkg-deb -f "${debs[0]}" Architecture)" = amd64
          test "$(dpkg-deb -f "${debs[0]}" Depends)" = 'libwebkit2gtk-4.1-0, libgtk-3-0'
          mkdir -p "$RUNNER_TEMP/libnoexit-deb-root"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/libnoexit-deb-root"
          "$RUNNER_TEMP/libnoexit-deb-root/usr/bin/auto-tundra" \
            --verify-embedded-assets app/leptos-ui/dist \
            > "$RUNNER_TEMP/new-runtime-input/embedded-assets.json"
          test "$(stat -c %s "$RUNNER_TEMP/new-runtime-input/embedded-assets.json")" -le 131072
          nu gate-source/.github/scripts/duckdb-libnoexit-new-runtime-package-source-v1.nu package \
            gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json \
            '${{ matrix.condition }}' '${{ matrix.profile }}' "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/new-runtime-input" \
            "$RUNNER_TEMP/new-runtime-input/runtime-stage.json" \
            "$RUNNER_TEMP/new-runtime-input/source-receipt.json" \
            "$RUNNER_TEMP/libnoexit-preflight/authenticated/preflight.json" \
            "${debs[0]}" "$RUNNER_TEMP/libnoexit-deb-root" \
            "$RUNNER_TEMP/new-runtime-input/embedded-assets.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/libnoexit-cell"
          bytes="$(du -sb "$RUNNER_TEMP/libnoexit-cell" | cut -f1)"
          test "$bytes" -le 201326592
      - name: Seal exact artifact and prove transient cleanup before positive selection
        if: always()
        shell: bash
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/libnoexit-cell"
          quarantine="$RUNNER_TEMP/libnoexit-cell-quarantine"
          selected="$RUNNER_TEMP/libnoexit-cell-final"
          refusal="$RUNNER_TEMP/libnoexit-refusal/refusal.txt"
          gone() { test ! -e "$1" && test ! -L "$1"; }
          cleanup_ok=NO
          if test "$GITHUB_WORKSPACE" != / && test -d "$GITHUB_WORKSPACE" && \
             test ! -L "$GITHUB_WORKSPACE" && \
             test "$(pwd -P)" = "$(realpath -- "$GITHUB_WORKSPACE")" && \
             rm -rf -- "$RUNNER_TEMP/libnoexit-preflight" \
               "$RUNNER_TEMP/new-runtime-input" "$RUNNER_TEMP/duckdb-replacement" \
               "$RUNNER_TEMP/duckdb-fetch" "$RUNNER_TEMP/libnoexit-corpus-source" \
               "$RUNNER_TEMP/libnoexit-deb-root" "$GITHUB_WORKSPACE/app" \
               "$GITHUB_WORKSPACE/target" >/dev/null 2>&1 && \
             gone "$RUNNER_TEMP/libnoexit-preflight" && \
             gone "$RUNNER_TEMP/new-runtime-input" && \
             gone "$RUNNER_TEMP/duckdb-replacement" && \
             gone "$RUNNER_TEMP/duckdb-fetch" && \
             gone "$RUNNER_TEMP/libnoexit-corpus-source" && \
             gone "$RUNNER_TEMP/libnoexit-deb-root" && \
             gone "$GITHUB_WORKSPACE/app" && \
             gone "$GITHUB_WORKSPACE/target"; then
            cleanup_ok=YES
          fi
          if test "$cleanup_ok" != YES; then
            rm -rf -- "$candidate" "$quarantine" "$selected" || true
            printf 'schema=tundra-libnoexit-new-runtime-package-refusal/v1\nstatus=REFUSED\nreason=EPHEMERAL_CLEANUP_UNPROVEN\npackage_install_verified=NO\nbehavior_cases=NOT_RUN\nlinker_input=UNPROVEN\ngenerator_input_closure=UNPROVEN\nlegal_admission=NO\nproduct_admission=NO\nfleet_admission=NO\n' > "$refusal"
            exit 1
          fi
          if test "$PRIOR_JOB_STATUS" = success; then
            printf '{"schema":"tundra-libnoexit-new-runtime-package-cleanup/v1","status":"BUILD_AND_DOWNLOAD_INPUTS_REMOVED","ephemeral_cleanup":"PROVEN","package_install_verified":"NO","behavior_cases":"NOT_RUN","product_admission":"NO","fleet_admission":"NO"}\n' \
              > "$candidate/cleanup-proof.json"
            if ! nu gate-source/.github/scripts/duckdb-libnoexit-new-runtime-package-source-v1.nu seal \
              gate-source/.github/receipts/duckdb-libnoexit-new-runtime-package-source-v1.json \
              "$candidate" "$quarantine" >/dev/null 2>&1; then
              rm -rf -- "$candidate" "$quarantine" "$selected" || true
              printf 'schema=tundra-libnoexit-new-runtime-package-refusal/v1\nstatus=REFUSED\nreason=ARTIFACT_SCOPE_REFUSED\npackage_install_verified=NO\nbehavior_cases=NOT_RUN\nlinker_input=UNPROVEN\ngenerator_input_closure=UNPROVEN\nlegal_admission=NO\nproduct_admission=NO\nfleet_admission=NO\n' > "$refusal"
              exit 1
            fi
            if ! rm -rf -- "$candidate" "$GITHUB_WORKSPACE/gate-source" >/dev/null 2>&1 || \
               ! gone "$candidate" || ! gone "$GITHUB_WORKSPACE/gate-source"; then
              rm -rf -- "$quarantine" "$selected" || true
              printf 'schema=tundra-libnoexit-new-runtime-package-refusal/v1\nstatus=REFUSED\nreason=EPHEMERAL_CLEANUP_UNPROVEN\npackage_install_verified=NO\nbehavior_cases=NOT_RUN\nlinker_input=UNPROVEN\ngenerator_input_closure=UNPROVEN\nlegal_admission=NO\nproduct_admission=NO\nfleet_admission=NO\n' > "$refusal"
              exit 1
            fi
            test -d "$quarantine" && test ! -L "$quarantine"
            test ! -e "$selected" && test ! -L "$selected"
            mv -- "$quarantine" "$selected"
            test -d "$selected" && test ! -L "$selected"
            rm -f -- "$refusal"
          else
            rm -rf -- "$candidate" "$quarantine" "$selected" "$GITHUB_WORKSPACE/gate-source"
          fi
      - name: Retain bounded new package and diagnostic witness
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-libnoexit-new-runtime-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.condition }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/libnoexit-cell-final/
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded refusal only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-libnoexit-new-runtime-package-refusal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.condition }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/libnoexit-refusal/refusal.txt
          if-no-files-found: error
          retention-days: 14
