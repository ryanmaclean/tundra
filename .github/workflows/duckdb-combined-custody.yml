              require(0 < len(lines) <= 8192, 'PACKAGE_INVENTORY_COUNT')
              declared = set()
              for line in lines:
                  path = Path(line)
                  require(line.startswith('/') and len(line.encode('utf-8')) <= 4096 and
                          '\r' not in line and '\x00' not in line and
                          '..' not in path.parts, 'PACKAGE_INVENTORY_PATH')
                  # A package's final-component symlink is not ownership of its
                  # referent. Ancestor /lib -> /usr/lib aliases remain valid.
                  if path.is_file() and not path.is_symlink():
                      resolved = path.resolve(strict=True)
                      require(resolved.is_file() and not resolved.is_symlink(),
                              'PACKAGE_INVENTORY_REALPATH')
                      declared.add(resolved)
              require(declared, 'PACKAGE_INVENTORY_NO_FILES')
              return declared
          def host_file(path, package, spec, path_class):
              global failure_path_class
              require(path_class in ('LIBLZMA', 'LIBC', 'LOADER'),
                      'HOST_PATH_CLASS')
              failure_path_class = path_class + '_REQUESTED'
              requested = Path(path)
              require(requested.exists() and requested.is_file(), 'HOST_ELF_MISSING')
              failure_path_class = path_class + '_REALPATH'
              resolved = requested.resolve(strict=True)
              require(resolved.is_file() and not resolved.is_symlink(), 'HOST_ELF_REALPATH')
              failure_path_class = path_class + '_INVENTORY'
              declared = declared_regular_files(package)
              require(resolved in declared, 'PACKAGE_INVENTORY_NO_CANONICAL_MATCH')
              failure_path_class = path_class + '_OFFICIAL_BYTES'
              exact(resolved.read_bytes(), spec, 'INSTALLED_ELF_NOT_OFFICIAL_PACKAGE')
              failure_path_class = 'NONE'
              return resolved
          def dynamic(path):
              text = command(['readelf', '-d', str(path)], 'READELF_DYNAMIC')
              sonames = re.findall(r'\(SONAME\)\s+Library soname: \[([^]]+)\]', text)
              needed = set(re.findall(r'\(NEEDED\)\s+Shared library: \[([^]]+)\]', text))
              return sonames, needed
          def versions(path):
              text = command(['readelf', '-V', str(path)], 'READELF_VERSIONS')
              section, current, definitions, requirements = '', None, set(), {}
              for line in text.splitlines():
                  if line.startswith('Version definition section'): section, current = 'definition', None
                  elif line.startswith('Version needs section'): section, current = 'need', None
                  elif line.startswith('Version symbols section'): section, current = 'symbols', None
                  if section == 'need':
                      file_match = re.search(r'File: (\S+)', line)
                      if file_match:
                          current = file_match.group(1)
                          requirements.setdefault(current, set())
                  name_match = re.search(r'Name: (\S+)', line)
                  if name_match and section == 'definition':
                      definitions.add(name_match.group(1))
                  elif name_match and section == 'need':
                      require(current is not None, 'VERSION_REQUIREMENT_WITHOUT_FILE')
                      requirements[current].add(name_match.group(1))
              return definitions, requirements
          scratch = Path(tempfile.mkdtemp(prefix='tundra-eh-runtime-deps-', dir=runner_temp))
          try:
              release = Path('/etc/os-release').read_text()
              require(re.search(r'^ID=ubuntu$', release, re.M) is not None and
                      re.search(r'^VERSION_ID="?22\.04"?$', release, re.M) is not None and
                      platform.machine() == 'x86_64', 'CONTAINER_OS_ARCH')
              require(not target.exists(), 'TARGET_EXISTS')
              selected = {}
              for package, info in packages.items():
                  installed(package, info['version'])
                  data = fetch(info)
                  deb = scratch / info['file']
                  deb.write_bytes(data)
                  for field, expected in (('Package', package), ('Version', info['version']),
                                          ('Architecture', 'amd64')):
                      require(command(['dpkg-deb', '-f', str(deb), field],
                                      'PACKAGE_METADATA') == expected + '\n', 'PACKAGE_METADATA')
                  unpack = scratch / package
                  subprocess.run(['dpkg-deb', '-x', str(deb), str(unpack)],
                                 capture_output=True, timeout=30, check=True)
                  notice_name, notice_size, notice_hash = info['notice']
                  notice = (unpack / notice_name).read_bytes()
                  exact(notice, (notice_size, notice_hash), 'SELECTED_NOTICE_HASH')
                  elf_name, elf_size, elf_hash = info['elf']
                  member = unpack / elf_name
                  require(member.is_file() and not member.is_symlink(), 'PACKAGE_ELF_TYPE')
                  exact(member.read_bytes(), (elf_size, elf_hash), 'PACKAGE_ELF_HASH')
                  host = host_file(info['host'], package, (elf_size, elf_hash),
                                   'LIBLZMA' if package == 'liblzma5' else 'LIBC')
                  require(dynamic(member)[0] == [info['soname']] and
                          dynamic(host) == dynamic(member), 'HOST_PACKAGE_ELF_DYNAMIC')
                  if package == 'liblzma5':
                      link = unpack / 'lib/x86_64-linux-gnu/liblzma.so.5'
                      require(link.is_symlink() and os.readlink(link) == 'liblzma.so.5.2.5',
                              'PACKAGE_SONAME_LINK')
                  selected[package] = (data, notice, member, host)
              libc_info = packages['libc6']
              loader_name, loader_size, loader_hash = libc_info['loader']
              loader_member = scratch / 'libc6' / loader_name
              require(loader_member.is_file() and not loader_member.is_symlink(), 'PACKAGE_LOADER_TYPE')
              exact(loader_member.read_bytes(), (loader_size, loader_hash), 'PACKAGE_LOADER_HASH')
              loader_host = host_file(libc_info['host_loader'], 'libc6',
                                      (loader_size, loader_hash), 'LOADER')
              require(dynamic(loader_host) == dynamic(loader_member), 'HOST_PACKAGE_LOADER_DYNAMIC')
              providers = {
                  'liblzma.so.5': selected['liblzma5'][3],
                  'libc.so.6': selected['libc6'][3],
                  'ld-linux-x86-64.so.2': loader_host,
                  'libunwind-ptrace.so.0': out / 'eh-libunwind-package/libunwind-ptrace.so.0.0.0',
                  'libunwind-x86_64.so.8': out / 'eh-libunwind-package/libunwind-x86_64.so.8.0.1',
                  'libunwind.so.8': out / 'eh-libunwind-package/libunwind.so.8.0.1',
              }
              strace = out / 'eh-generator-tracer-package/strace'
              consumers = {'strace': strace, **providers}
              abi_lines = []
              for label, path in consumers.items():
                  require(path.is_file(), 'ABI_INPUT_MISSING')
                  soname, needed = dynamic(path)
                  definitions, requirements = versions(path)
                  for provider, required in requirements.items():
                      if provider in providers:
                          supplied, _ = versions(providers[provider])
                          require(required <= supplied, 'UNSATISFIED_ELF_SYMBOL_VERSION')
                  abi_lines.append(f'abi_{label}_soname={",".join(soname) or "-"}')
                  abi_lines.append(f'abi_{label}_needed={",".join(sorted(needed)) or "-"}')
                  abi_lines.append(f'abi_{label}_version_definitions={",".join(sorted(definitions)) or "-"}')
                  for provider, required in sorted(requirements.items()):
                      abi_lines.append(f'abi_{label}_requires_{provider}={",".join(sorted(required)) or "-"}')
              target.mkdir()
              try:
                  for package, (data, notice, _, _) in selected.items():
                      info = packages[package]
                      (target / info['file']).write_bytes(data)
                      (target / f'{package}-copyright').write_bytes(notice)
                      exact((target / info['file']).read_bytes(), info['spec'], 'RETAINED_DEB_JOIN')
                      notice_spec = info['notice']
                      exact((target / f'{package}-copyright').read_bytes(),
                            (notice_spec[1], notice_spec[2]), 'RETAINED_NOTICE_JOIN')
              except Exception:
                  shutil.rmtree(target)
                  raise
              fields = [
                  'schema=tundra-eh-runtime-dependencies/v1',
                  'status=PINNED_HOSTED_BYTES_PASSIVE_ABI_ONLY',
                  'liblzma5_version=5.2.5-2ubuntu1',
                  'libc6_version=2.35-0ubuntu3.4',
                  'liblzma_selected_license=PUBLIC_DOMAIN_WITH_PERMISSION_FALLBACK',
                  'libc_selected_license=LGPL_2_1_OR_LATER_FILE_SPECIFIC_NOTICE',
                  'source_archive_custody=NOT_EXTENDED',
                  'loader_resolution=NOT_RUN',
                  'dependency_license_review=SELECTED_BINARY_NOTICES_ONLY',
                  'candidate_executable=NOT_RUN',
                  'python_node_child_canary=NOT_RUN',
                  'eh_image_traced_relink=NOT_RUN',
                  'generator_input_closure=UNPROVEN',
                  'glue_legal_admission=NO',
                  'product_admission=NO',
                  f'host_liblzma_realpath={selected["liblzma5"][3]}',
                  f'host_libc_realpath={selected["libc6"][3]}',
                  f'host_loader_realpath={loader_host}',
              ]
              for package, info in packages.items():
                  fields.append(f'package_{package}={info["spec"][0]}:{info["spec"][1]}')
                  fields.append(f'notice_{package}={info["notice"][1]}:{info["notice"][2]}')
                  fields.append(f'host_elf_{package}={info["elf"][1]}:{info["elf"][2]}')
              fields.append(f'host_loader={loader_size}:{loader_hash}')
              receipt.write_text('\n'.join(fields + abi_lines) + '\n')
          except Refusal as error:
              receipt.write_text('schema=tundra-eh-runtime-dependencies/v1\nstatus=REFUSED\n'
                                 f'reason={error}\npath_class={failure_path_class}\n'
                                 'candidate_executable=NOT_RUN\n'
                                 'loader_resolution=NOT_RUN\nproduct_admission=NO\n')
              raise SystemExit(1)
          except Exception:
              receipt.write_text('schema=tundra-eh-runtime-dependencies/v1\nstatus=REFUSED\n'
                                 f'reason=UNEXPECTED_ERROR\npath_class={failure_path_class}\n'
                                 'candidate_executable=NOT_RUN\n'
                                 'loader_resolution=NOT_RUN\nproduct_admission=NO\n')
              raise SystemExit(1)
          finally:
              shutil.rmtree(scratch)
          PY
          grep -Fqx 'candidate_executable=NOT_RUN' "$out/eh-runtime-dependencies-provenance.txt"
          grep -Fqx 'product_admission=NO' "$out/eh-runtime-dependencies-provenance.txt"
          printf 'host_runtime_dependencies=PINNED_PASSIVE_BYTES_ONLY\njs_generator_input_closure=UNPROVEN\n' \
            >> "$out/admission.txt"
      - name: Classify same-run bytes and immutable custody
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          image_cache="$EMSDK/upstream/emscripten/cache"
          variant='${{ matrix.variant }}'
          case "$variant" in
            mvp) expected=8; names=(libc++.a libc++abi.a libc.a libcompiler_rt.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a) ;;
            eh) expected=9; names=(libc++-except.a libc++abi-except.a libc.a libcompiler_rt-wasm-sjlj.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a libunwind-except.a) ;;
            *) exit 1 ;;
          esac
          test -s "$out/image.js" && test -s "$out/clean.js"
          test -s "$out/image.wasm" && test -s "$out/clean.wasm"
          find "$image_cache" -type f -name '*.a' -print0 | sort -z | xargs -0 -r sha256sum > "$out/image-cache-after.sha256"
          if cmp -s "$out/image-cache-before.sha256" "$out/image-cache-after.sha256"; then
            printf 'image_cache_archive_inventory_stable=YES\n' >> "$out/cache-source.txt"
          else
            printf 'image_cache_archive_inventory_stable=NO\n' >> "$out/cache-source.txt"
          fi
          : > "$out/archive-pair-classification.tsv"
          for name in "${names[@]}"; do
            image_hash="$(sha256sum "$out/image-bytes/$name" | cut -d ' ' -f 1)"
            clean_hash="$(sha256sum "$out/clean-bytes/$name" | cut -d ' ' -f 1)"
            if test "$image_hash" = "$clean_hash"; then verdict=MATCH; else verdict=DIFF_SAME_RUN_BYTES_RETAINED; fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$image_hash" "$clean_hash" "$verdict" >> "$out/archive-pair-classification.tsv"
          done
          if cmp -s "$out/image-js-glue-source.tsv" "$out/clean-js-glue-source.tsv"; then
            printf 'glue_source_hash_bill=MATCH\n' > "$out/glue-pair-classification.txt"
          else
            printf 'glue_source_hash_bill=DIFF_SAME_RUN_BYTES_RETAINED\n' > "$out/glue-pair-classification.txt"
          fi
          if cmp -s "$out/image-js-glue-bill.txt" "$out/clean-js-glue-bill.txt"; then
            printf 'glue_link_selection_bill=MATCH\n' >> "$out/glue-pair-classification.txt"
          else
            printf 'glue_link_selection_bill=DIFF_SAME_RUN_BYTES_RETAINED\n' >> "$out/glue-pair-classification.txt"
          fi
          custody_wasm="custody/duckdb-runtime/duckdb-$variant.wasm"
          custody_hash="$(sha256sum "$custody_wasm" | cut -d ' ' -f 1)"
          : > "$out/classification.tsv"
          for condition in image clean; do
            actual="$(sha256sum "$out/$condition.wasm" | cut -d ' ' -f 1)"
            if test "$actual" = "$custody_hash"; then verdict=MATCH; else verdict=DIFF; fi
            printf '%s\t%s\t%s\t%s\n' "$condition" "duckdb-$variant.wasm" "$actual" "$verdict" >> "$out/classification.tsv"
          done
          for asset in duckdb-browser.mjs duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js; do
            printf 'native-link\t%s\tN/A\tINCOMPARABLE_NATIVE_GLUE_VS_BROWSER_ASSET\n' "$asset" >> "$out/classification.tsv"
          done
          for kind in js wasm; do
            if cmp -s "$out/image.$kind" "$out/clean.$kind"; then verdict=MATCH; else verdict=DIFF; fi
            printf 'image_vs_clean\tduckdb_wasm.%s\tN/A\t%s\n' "$kind" "$verdict" >> "$out/classification.tsv"
          done
          # Preserve the B678 archive hashes as a historical reference only.
          # A new clean build cannot recover B678's omitted physical bytes.
          printf '%s\n' \
            'mvp libc++.a adcc1b705ea6b54edeb8480e9183172356d77fee43b12fde718c33f56f0d803b' \
            'mvp libc++abi.a d6b9298c3c0651591843a38c8bbc0cd7402786f8e8196a60cd6c5686b4e696f4' \
            'mvp libc.a 7e6af4b09ec027ba28034482fc46b6316bab24e466d137ae96b9ab2b5c83d01f' \
            'mvp libcompiler_rt.a 6c6dc176c816faa8e942e9839b4d7df4b94af071489657ac1585f8891c8fcb18' \
            'mvp libdlmalloc.a be1a34621edf0bd32f17b100c3c35a45778c1d967fe189286dbb42d058720a5d' \
            'mvp libnoexit.a dadb42e9b0d69d891a72dc756ade75f3726b8e2eb49d2aed09c59c7a2e7e1a47' \
            'mvp libsockets.a 63a41d8e131188acf229993f5db28bf7313f317c3e233d53a9f1730e31d9b504' \
            'mvp libstubs.a 36a4c790708740796e5d4e09a7cc3050adb177fdb037138170e9d5d3cbe5d229' \
            'eh libc++-except.a 37809212bdd9b8fa860cf117b350d85faafaf1ff805c08cebec97ed2d25db37b' \
            'eh libc++abi-except.a 3265aefb7dd7eb87165c99e6d1dd6ce6b6ee7ffffeb6c498797777dc4c3161e6' \
            'eh libc.a 7e6af4b09ec027ba28034482fc46b6316bab24e466d137ae96b9ab2b5c83d01f' \
            'eh libcompiler_rt-wasm-sjlj.a 4812ec1f0cf5c75362d00884a70109c5960043e9dc19ca16ffacab47f703f0b8' \
            'eh libdlmalloc.a be1a34621edf0bd32f17b100c3c35a45778c1d967fe189286dbb42d058720a5d' \
            'eh libnoexit.a dadb42e9b0d69d891a72dc756ade75f3726b8e2eb49d2aed09c59c7a2e7e1a47' \
            'eh libsockets.a 63a41d8e131188acf229993f5db28bf7313f317c3e233d53a9f1730e31d9b504' \
            'eh libstubs.a 36a4c790708740796e5d4e09a7cc3050adb177fdb037138170e9d5d3cbe5d229' \
            'eh libunwind-except.a ccf519e5c1485e91ab14f6fd69808337cb5228b56597a5c1b5d6a33a00ad7892' \
            > "$out/b678-warm-reference.txt"
          : > "$out/b678-warm-comparison.tsv"
          while IFS=$'\t' read -r name path hash; do
            test -s "$path"
            expected_hash="$(awk -v variant="$variant" -v name="$name" '$1 == variant && $2 == name { print $3 }' "$out/b678-warm-reference.txt")"
            test -n "$expected_hash"
            if test "$hash" = "$expected_hash"; then verdict=MATCH; else verdict=DIFF_SAME_RUN_BYTES_RETAINED; fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$hash" "$expected_hash" "$verdict" >> "$out/b678-warm-comparison.tsv"
          done < "$out/image-prebuild.tsv"
          test "$(wc -l < "$out/b678-warm-comparison.tsv")" -eq "$expected"
          printf 'archive_payload_classification=PAIRED_BYTES_RETAINED_NOT_YET_AUDITED\nexact_custody_output=DIAGNOSTIC_ONLY\nproduct_admission=NO\n' >> "$out/admission.txt"
      - name: Enforce bounded receipt on every outcome
        id: budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          mkdir -p "$out"
          cap=419430400
          printf 'product_admission=NO\nreceipt_budget_bytes=%s\n' "$cap" > "$out/budget.txt"
          bytes="$(du -sb "$out" | cut -f 1)"
          printf 'candidate_bytes=%s\n' "$bytes" >> "$out/budget.txt"
          bytes="$(du -sb "$out" | cut -f 1)"
          if test "$bytes" -le "$cap"; then
            printf 'upload=true\n' >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/combined-over-budget"
            printf 'receipt_upload=NO\nobserved_bytes=%s\ncap_bytes=%s\nproduct_admission=NO\n' \
              "$bytes" "$cap" > "$RUNNER_TEMP/combined-over-budget/budget.txt"
            printf 'over_budget=true\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Retain bounded diagnostic receipt
        id: custody_upload
        if: ${{ always() && steps.budget.outputs.upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-combined-custody-${{ matrix.variant }}
          path: ${{ runner.temp }}/combined-custody/
          if-no-files-found: error
          retention-days: 14
      - name: Retain over-budget refusal
        if: ${{ always() && steps.budget.outputs.over_budget == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-combined-over-budget-${{ matrix.variant }}
          path: ${{ runner.temp }}/combined-over-budget/
          if-no-files-found: error
          retention-days: 14
      - name: Probe pinned EH tracer with bounded Python to Node child
        if: ${{ matrix.variant == 'eh' && steps.custody_upload.outcome == 'success' }}
        shell: bash
        env:
          EH_ARTIFACT_ID: ${{ steps.custody_upload.outputs.artifact-id }}
          EH_ARTIFACT_DIGEST: ${{ steps.custody_upload.outputs.artifact-digest }}
          DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, resource, shutil, signal, subprocess, sys, tempfile
          from pathlib import Path

          container = 'emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29'
          source_head = '0bb7c5237dc1b047de488d67ba30b5ed05c37383'
          custody_head = '1d77df7776dca44731ae8267092e480a78f9f735'
          upstream_head = 'f955138e5218942fb3fb097a8fdcb725222406ff'
          duckdb_head = '401c8061c6ece35949cac58c7770cc755710ca86'
          arrow_head = 'ca1c30f60d6419849dbc2a533bd0bcaff310185f'
          expected = {
              'strace': ('eh-generator-tracer-package/strace', '38a5c75cb29dd85ddd7780d54f5bf595554d7a1b5c42524b23065f5dc4c4b01d'),
              'unwind_ptrace': ('eh-libunwind-package/libunwind-ptrace.so.0.0.0', 'f791a9b0b01faa13a65ee066d2351d2e38a23d6c3752f75eebeaf0fc5c7d56f4'),
              'unwind_x86_64': ('eh-libunwind-package/libunwind-x86_64.so.8.0.1', '1077e265bdd76ed4f2d628ea29150eb98f5c7c8f5a30004a561e6e93a2a6f097'),
              'unwind': ('eh-libunwind-package/libunwind.so.8.0.1', '5d1f6f104f79698e137c9f17c4b0317dfd96816c0eb6a87c50619a41472ca382'),
          }
          host_expected = {
              'liblzma.so.5.2.5': ('/lib/x86_64-linux-gnu/liblzma.so.5', '493cb401ab4aa3bba611ca464d12996afb3b327940d29476f535f999e167439b'),
              'libc.so.6': ('/lib/x86_64-linux-gnu/libc.so.6', '2e15e345ccba1e1e8bf3bc58938d13eb7ccc17044942f0376cd5bc771f429b79'),
              'ld-linux-x86-64.so.2': ('/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2', 'e833bd99168bea158d2f2e5d32462479cacfb624003304a9ea74a1607a144f1f'),
          }
          cap = 2 * 1024 * 1024
          raw_cap = 512 * 1024
          runner_temp = Path(os.environ['RUNNER_TEMP']).resolve()
          out = runner_temp / 'combined-custody'
          diag = runner_temp / 'eh-trace-diagnostic'
          diag.mkdir(mode=0o700, exist_ok=False)
          receipt = {
              'schema': 'tundra-eh-child-trace-canary/v1',
              'status': 'REFUSED',
              'reason': 'NOT_STARTED',
              'reason_subcode': 'NOT_EVALUATED',
              'scope': 'PINNED_TRACER_PYTHON_NODE_SENTINEL_ONLY',
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'diagnostic_head': os.environ.get('DIAGNOSTIC_HEAD', ''),
              'container': container,
              'source_head': source_head,
              'custody_head': custody_head,
              'upstream_head': upstream_head,
              'duckdb_head': duckdb_head,
              'arrow_head': arrow_head,
              'eh_artifact_id': os.environ.get('EH_ARTIFACT_ID', ''),
              'eh_artifact_digest': os.environ.get('EH_ARTIFACT_DIGEST', ''),
              'raw_trace_retained': False,
              'eh_image_traced_relink': 'NOT_RUN',
              'eh_clean_traced_relink': 'NOT_RUN',
              'generator_input_closure': 'UNPROVEN',
              'glue_legal_admission': 'NO',
              'product_admission': 'NO',
              'fleet_admission': 'NO',
          }
          scratch = None
          class Refusal(Exception): pass
          def require(ok, reason):
              if not ok: raise Refusal(reason)
          def sha(path):
              path = Path(path)
              require(path.is_file() and not path.is_symlink(), 'EXPECTED_REGULAR_FILE')
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def git_head(path):
              result = subprocess.run(['git', '-C', str(path), 'rev-parse', 'HEAD'],
                                      capture_output=True, text=True, timeout=5)
              require(result.returncode == 0 and re.fullmatch(r'[0-9a-f]{40}\n', result.stdout),
                      'SOURCE_HEAD_QUERY')
              return result.stdout.strip()
          def runtime(name):
              candidates = []
              for directory in os.environ.get('PATH', '').split(os.pathsep):
                  if not directory or not os.path.isabs(directory): continue
                  candidate = Path(directory) / name
                  if candidate.is_file() and os.access(candidate, os.X_OK):
                      candidates.append(candidate.resolve(strict=True))
              unique = sorted(set(candidates))
              require(len(unique) == 1 and unique[0].is_file(), 'RUNTIME_PATH_AMBIGUOUS_OR_MISSING')
              version = subprocess.run([str(unique[0]), '--version'], capture_output=True,
                                       text=True, timeout=5)
              require(version.returncode == 0, 'RUNTIME_VERSION')
              value = (version.stdout or version.stderr).strip()
              require(bool(re.fullmatch(r'[A-Za-z0-9. +_-]{1,80}', value)), 'RUNTIME_VERSION_FORMAT')
              return unique[0], {'sha256': sha(unique[0]), 'version': value}
          def cap_file_size():
              resource.setrlimit(resource.RLIMIT_FSIZE, (raw_cap, raw_cap))
          def parse_trace(raw, python_path, node_path, sentinel_path, sentinel_len):
              lines = raw.splitlines()
              shape = {
                  'line_count': len(lines), 'pid_prefixed_lines': 0,
                  'unique_pid_count': 0, 'execve_lines': 0,
                  'execve_success_lines': 0, 'execve_nonzero_lines': 0,
                  'execve_unfinished_lines': 0, 'execve_resumed_lines': 0,
                  'expected_python_execve_lines': 0,
                  'expected_node_execve_lines': 0,
                  'expected_python_execve_success': 0,
                  'expected_node_execve_success': 0,
                  'other_execve_success': 0,
              }
              receipt['trace_shape'] = shape
              require(0 < len(lines) <= 20000, 'TRACE_LINE_COUNT')
              roles = {}
              exited = set()
              sentinel_fds = set()
              sentinel_opens = 0
              reads = 0
              pids = set()
              pending_exec = {}
              def successful_exec(role, pid):
                  shape['execve_success_lines'] += 1
                  if role == 'python':
                      shape['expected_python_execve_success'] += 1
                      if 'python' in roles:
                          receipt['reason_subcode'] = 'DUPLICATE_PYTHON_EXECVE'
                          raise Refusal('CHILD_EXEC_NOT_PROVED')
                      roles['python'] = pid
                  elif role == 'node':
                      shape['expected_node_execve_success'] += 1
                      if 'node' in roles:
                          receipt['reason_subcode'] = 'DUPLICATE_NODE_EXECVE'
                          raise Refusal('CHILD_EXEC_NOT_PROVED')
                      roles['node'] = pid
                  else:
                      shape['other_execve_success'] += 1
              for line in lines:
                  match = re.match(r'^\s*(?:\[pid\s+)?(\d+)(?:\])?\s+(.*)$', line)
                  if match is None: receipt['reason_subcode'] = 'PID_PREFIX_SHAPE'
                  require(match is not None, 'TRACE_LINE_FORMAT')
                  pid, body = match.group(1), match.group(2)
                  pids.add(pid)
                  shape['pid_prefixed_lines'] += 1
                  shape['unique_pid_count'] = len(pids)
                  if body.startswith('<... execve resumed>'):
                      shape['execve_resumed_lines'] += 1
                      if pid not in pending_exec:
                          receipt['reason_subcode'] = 'EXECVE_RESUME_PID_MISMATCH'
                          raise Refusal('CHILD_EXEC_NOT_PROVED')
                      role = pending_exec.pop(pid)
                      if not re.fullmatch(r'<\.\.\. execve resumed>\)\s+=\s+0\s*', body):
                          shape['execve_nonzero_lines'] += 1
                          receipt['reason_subcode'] = 'EXECVE_RESUME_NOT_SUCCESS'
                          raise Refusal('CHILD_EXEC_NOT_PROVED')
                      successful_exec(role, pid)
                  if body.startswith('execve('):
                      shape['execve_lines'] += 1
                      unfinished = body.rstrip().endswith('<unfinished ...>')
                      success = body.rstrip().endswith('= 0')
                      python_match = body.startswith('execve("' + str(python_path) + '"')
                      node_match = body.startswith('execve("' + str(node_path) + '"')
                      if python_match: shape['expected_python_execve_lines'] += 1
                      if node_match: shape['expected_node_execve_lines'] += 1
                      role = 'python' if python_match else 'node' if node_match else 'other'
                      if unfinished:
                          shape['execve_unfinished_lines'] += 1
                          if pid in pending_exec:
                              receipt['reason_subcode'] = 'DUPLICATE_UNFINISHED_EXECVE'
                              raise Refusal('CHILD_EXEC_NOT_PROVED')
                          pending_exec[pid] = role
                      elif success:
                          successful_exec(role, pid)
                      else:
                          shape['execve_nonzero_lines'] += 1
                  if body.startswith('exit_group(0)'):
                      exited.add(pid)
                  if pid == roles.get('node') and body.startswith('openat('):
                      opened = re.search(r'"' + re.escape(str(sentinel_path)) +
                                         r'",\s*O_RDONLY[^)]*\)\s+=\s+(\d+)\s*$', body)
                      if opened:
                          sentinel_fds.add(opened.group(1))
                          sentinel_opens += 1
                  if pid == roles.get('node') and body.startswith('close('):
                      closed = re.match(r'^close\((\d+)\)\s+=\s+0\s*$', body)
                      if closed: sentinel_fds.discard(closed.group(1))
                  if pid == roles.get('node') and body.startswith('read('):
                      read = re.match(r'^read\((\d+),.*\)\s+=\s+(\d+)\s*$', body)
                      if read and read.group(1) in sentinel_fds and int(read.group(2)) == sentinel_len:
                          reads += 1
              if pending_exec:
                  receipt['reason_subcode'] = 'EXECVE_RESUME_MISSING'
                  raise Refusal('CHILD_EXEC_NOT_PROVED')
              if set(roles) != {'python', 'node'} or roles['python'] == roles['node']:
                  if shape['execve_success_lines'] == 0:
                      receipt['reason_subcode'] = 'NO_SUCCESSFUL_EXECVE_LINE'
                  elif not roles:
                      receipt['reason_subcode'] = 'NO_EXPECTED_EXECVE_SUCCESS'
                  elif 'python' not in roles:
                      receipt['reason_subcode'] = 'PYTHON_EXECVE_SUCCESS_NOT_PROVED'
                  elif 'node' not in roles:
                      receipt['reason_subcode'] = 'NODE_EXECVE_SUCCESS_NOT_PROVED'
                  else:
                      receipt['reason_subcode'] = 'EXECVE_PID_COLLISION'
                  raise Refusal('CHILD_EXEC_NOT_PROVED')
              require(roles['python'] in exited and roles['node'] in exited, 'CHILD_EXIT_NOT_PROVED')
              require(sentinel_opens == 1 and reads >= 1, 'NODE_SENTINEL_READ_NOT_PROVED')
              receipt['reason_subcode'] = 'CONTROLLED_CHILD_PROVED'
              return {'python_execve': 1, 'node_execve': 1, 'node_sentinel_open': 1,
                      'node_sentinel_full_read': reads, 'normal_exit_roles': 2}
          def safe_run(argv, env, timeout):
              process = subprocess.Popen(argv, env=env, cwd=scratch, start_new_session=True,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                         preexec_fn=cap_file_size)
              try:
                  stdout, stderr = process.communicate(timeout=timeout)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGTERM)
                  try: process.communicate(timeout=3)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.communicate(timeout=3)
                  raise Refusal('TRACER_TIMEOUT')
              require(len(stdout) <= 8192 and len(stderr) <= 8192, 'TRACER_OUTPUT_BOUND')
              return process.returncode, stdout, stderr
          try:
              require(re.fullmatch(r'[0-9]+', receipt['run_id']) and
                      re.fullmatch(r'[0-9]+', receipt['run_attempt']) and
                      re.fullmatch(r'[0-9a-f]{40}', receipt['diagnostic_head']) and
                      re.fullmatch(r'[0-9]+', receipt['eh_artifact_id']) and
                      re.fullmatch(r'[0-9a-f]{64}', receipt['eh_artifact_digest']),
                      'SAME_RUN_ARTIFACT_JOIN')
              receipt['eh_artifact_digest'] = 'sha256:' + receipt['eh_artifact_digest']
              require(git_head(Path(os.environ['GITHUB_WORKSPACE'])) == source_head and
                      git_head(Path('custody')) == custody_head and
                      git_head(Path('duckdb-upstream')) == upstream_head and
                      git_head(Path('duckdb-upstream/submodules/duckdb')) == duckdb_head and
                      git_head(Path('duckdb-upstream/submodules/arrow')) == arrow_head,
                      'SOURCE_HEAD_DRIFT')
              receipt['baseline_sha256'] = {}
              for condition in ('image', 'clean'):
                  for suffix in ('command.txt', 'objects1.rsp', 'linklibs.rsp',
                                 'map', 'js', 'wasm'):
                      name = f'{condition}-{suffix}' if suffix.endswith(('.txt', '.rsp')) else f'{condition}.{suffix}'
                      receipt['baseline_sha256'][name] = sha(out / name)
              grep = (out / 'admission.txt').read_text()
              require('product_admission=NO\n' in grep and
                      'glue_legal_admission=NO\n' in grep and
                      'js_generator_input_closure=UNPROVEN\n' in grep,
                      'ADMISSION_SCOPE_DRIFT')
              pinned = {}
              for label, (relative, digest) in expected.items():
                  path = out / relative
                  require(sha(path) == digest, 'PINNED_TRACER_OR_UNWIND_HASH')
                  pinned[label] = path
              for label, (host, digest) in host_expected.items():
                  path = Path(host).resolve(strict=True)
                  require(sha(path) == digest, 'PINNED_HOST_ELF_HASH')
                  pinned[label] = path
              receipt['pinned_sha256'] = {label: sha(path) for label, path in pinned.items()}
              py, py_info = runtime('python3')
              node, node_info = runtime('node')
              receipt['python'] = py_info
              receipt['node'] = node_info
              proc = Path('/proc/sys/kernel/yama/ptrace_scope')
              receipt['ptrace_scope'] = proc.read_text().strip() if proc.is_file() else 'UNAVAILABLE'
              status = Path('/proc/self/status').read_text()
              receipt['effective_uid'] = os.geteuid()
              receipt['process_policy'] = {
                  key: re.search(r'^' + key + r':\s*(\S+)', status, re.M).group(1)
                  for key in ('CapEff', 'Seccomp', 'NoNewPrivs')
              }
              scratch = Path(tempfile.mkdtemp(prefix='eh-child-canary-', dir=runner_temp))
              os.chmod(scratch, 0o700)
              for label in ('unwind_ptrace', 'unwind_x86_64', 'unwind',
                            'liblzma.so.5.2.5', 'libc.so.6'):
                  shutil.copyfile(pinned[label], scratch / pinned[label].name)
              for link, target in (
                  ('libunwind-ptrace.so.0', 'libunwind-ptrace.so.0.0.0'),
                  ('libunwind-x86_64.so.8', 'libunwind-x86_64.so.8.0.1'),
                  ('libunwind.so.8', 'libunwind.so.8.0.1'),
                  ('liblzma.so.5', 'liblzma.so.5.2.5'),
              ):
                  (scratch / link).symlink_to(target)
              loader = pinned['ld-linux-x86-64.so.2']
              tracer = pinned['strace']
              loader_prefix = [str(loader), '--library-path', str(scratch), str(tracer)]
              minimal_env = {'PATH': '/usr/bin:/bin', 'HOME': str(scratch), 'LC_ALL': 'C'}
              rc, stdout, stderr = safe_run(loader_prefix + ['-V'], minimal_env, 8)
              require(rc == 0 and re.search(rb'strace(?: --)? version 5\.16', stdout),
                      'PINNED_TRACER_LOADER_SMOKE')
              receipt['loader_smoke'] = 'PASS'
              sentinel = scratch / 'sentinel.txt'
              sentinel_bytes = b'tundra-eh-python-node-canary-v1\n'
              sentinel.write_bytes(sentinel_bytes)
              receipt['sentinel_sha256'] = hashlib.sha256(sentinel_bytes).hexdigest()
              node_code = ('const fs=require("node:fs"),crypto=require("node:crypto");'
                           'const f=fs.openSync(process.argv[1],"r"),b=Buffer.alloc(64);'
                           'const n=fs.readSync(f,b,0,b.length,null);fs.closeSync(f);'
                           'if(n!==Number(process.argv[2])||'
                           'crypto.createHash("sha256").update(b.subarray(0,n)).digest("hex")'
                           '!==process.argv[3])process.exit(7)')
              py_code = ('import subprocess,sys;'
                         'subprocess.run([sys.argv[1],"-e",sys.argv[2],sys.argv[3],'
                         'sys.argv[4],sys.argv[5]],check=True,timeout=8,'
                         'env={"PATH":"/usr/bin:/bin","HOME":sys.argv[6],"LC_ALL":"C"})')
              raw_path = scratch / 'trace.raw'
              argv = loader_prefix + ['-f', '-qq', '-s', '96', '-o', str(raw_path),
                                      '-e', 'trace=execve,clone,clone3,fork,vfork,wait4,openat,read,close,exit_group',
                                      str(py), '-I', '-c', py_code, str(node), node_code,
                                      str(sentinel), str(len(sentinel_bytes)),
                                      receipt['sentinel_sha256'], str(scratch)]
              rc, stdout, stderr = safe_run(argv, minimal_env, 20)
              if rc != 0:
                  if b'Operation not permitted' in stderr or b'ptrace' in stderr:
                      raise Refusal('CAPABILITY_REFUSED')
                  raise Refusal('TRACER_OR_TRACEE_EXIT')
              require(not stdout and not stderr, 'UNEXPECTED_TRACE_OUTPUT')
              require(raw_path.is_file() and not raw_path.is_symlink() and
                      0 < raw_path.stat().st_size <= raw_cap, 'RAW_TRACE_BOUND')
              receipt['events'] = parse_trace(raw_path.read_text(errors='replace'),
                                              py, node, sentinel, len(sentinel_bytes))
              receipt['status'] = 'PASS'
              receipt['reason'] = 'CONTROLLED_CHILD_ONLY'
          except Refusal as error:
              receipt['reason'] = str(error)
          except Exception:
              receipt['reason'] = 'UNEXPECTED_ERROR'
          finally:
              if scratch is not None: shutil.rmtree(scratch, ignore_errors=True)
              data = (json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n').encode()
              if len(data) > cap:
                  receipt['status'] = 'REFUSED'
                  data = b'{"schema":"tundra-eh-child-trace-canary/v1","status":"REFUSED","reason":"DIAGNOSTIC_CAP","generator_input_closure":"UNPROVEN","glue_legal_admission":"NO","product_admission":"NO"}\n'
              (diag / 'canary.json').write_bytes(data)
              require(sum(p.stat().st_size for p in diag.iterdir()) <= cap, 'DIAGNOSTIC_CAP')
          if receipt['status'] != 'PASS': raise SystemExit(1)
          PY
      - name: Trace exact EH image and clean relinks after controlled child
        if: ${{ matrix.variant == 'eh' && steps.custody_upload.outcome == 'success' }}
        shell: bash
        env:
          EH_ARTIFACT_ID: ${{ steps.custody_upload.outputs.artifact-id }}
          EH_ARTIFACT_DIGEST: ${{ steps.custody_upload.outputs.artifact-digest }}
          DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shlex, shutil, signal, subprocess, tempfile, time
          from pathlib import Path

          runner = Path(os.environ['RUNNER_TEMP']).resolve()
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          out = runner / 'combined-custody'
          diag = runner / 'eh-trace-diagnostic'
          cap = 2 * 1024 * 1024
          raw_cap = 64 * 1024 * 1024
          expected = {
              'strace': ('eh-generator-tracer-package/strace', '38a5c75cb29dd85ddd7780d54f5bf595554d7a1b5c42524b23065f5dc4c4b01d'),
              'unwind_ptrace': ('eh-libunwind-package/libunwind-ptrace.so.0.0.0', 'f791a9b0b01faa13a65ee066d2351d2e38a23d6c3752f75eebeaf0fc5c7d56f4'),
              'unwind_x86_64': ('eh-libunwind-package/libunwind-x86_64.so.8.0.1', '1077e265bdd76ed4f2d628ea29150eb98f5c7c8f5a30004a561e6e93a2a6f097'),
              'unwind': ('eh-libunwind-package/libunwind.so.8.0.1', '5d1f6f104f79698e137c9f17c4b0317dfd96816c0eb6a87c50619a41472ca382'),
          }
          host_expected = {
              'liblzma.so.5.2.5': ('/lib/x86_64-linux-gnu/liblzma.so.5', '493cb401ab4aa3bba611ca464d12996afb3b327940d29476f535f999e167439b'),
              'libc.so.6': ('/lib/x86_64-linux-gnu/libc.so.6', '2e15e345ccba1e1e8bf3bc58938d13eb7ccc17044942f0376cd5bc771f429b79'),
              'ld-linux-x86-64.so.2': ('/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2', 'e833bd99168bea158d2f2e5d32462479cacfb624003304a9ea74a1607a144f1f'),
          }
          receipt = {
              'schema': 'tundra-eh-traced-relink/v1', 'status': 'REFUSED',
              'reason': 'NOT_STARTED', 'scope': 'EXACT_EH_IMAGE_CLEAN_RELINK_DIAGNOSTIC_ONLY',
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'diagnostic_head': os.environ.get('DIAGNOSTIC_HEAD', ''),
              'eh_artifact_id': os.environ.get('EH_ARTIFACT_ID', ''),
              'eh_artifact_digest': os.environ.get('EH_ARTIFACT_DIGEST', ''),
              'raw_trace_retained': False, 'conditions': {},
              'generator_input_closure': 'UNPROVEN', 'glue_legal_admission': 'NO',
              'product_admission': 'NO', 'fleet_admission': 'NO',
