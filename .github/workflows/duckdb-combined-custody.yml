                  require(sha(path) == digest and canary['pinned_sha256'][label] == digest,
                          'PINNED_TRACER_OR_UNWIND_HASH')
                  pinned[label] = path
              for label, (host, digest) in host_expected.items():
                  path = Path(host).resolve(strict=True)
                  require(sha(path) == digest and canary['pinned_sha256'][label] == digest,
                          'PINNED_HOST_ELF_HASH')
                  pinned[label] = path
              scratch = Path(tempfile.mkdtemp(prefix='eh-traced-relink-', dir=runner))
              os.chmod(scratch, 0o700)
              for label in ('unwind_ptrace', 'unwind_x86_64', 'unwind',
                            'liblzma.so.5.2.5', 'libc.so.6'):
                  shutil.copyfile(pinned[label], scratch / pinned[label].name)
              for link, target in (
                  ('libunwind-ptrace.so.0', 'libunwind-ptrace.so.0.0.0'),
                  ('libunwind-x86_64.so.8', 'libunwind-x86_64.so.8.0.1'),
                  ('libunwind.so.8', 'libunwind.so.8.0.1'),
                  ('liblzma.so.5', 'liblzma.so.5.2.5')):
                  (scratch / link).symlink_to(target)
              loader_prefix = [str(pinned['ld-linux-x86-64.so.2']),
                               '--library-path', str(scratch), str(pinned['strace'])]
              for condition in ('image', 'clean'):
                  cache = (Path(os.environ['EMSDK']) / 'upstream/emscripten/cache'
                           if condition == 'image' else runner / 'empty-sdk-cache-eh')
                  build = workspace / 'duckdb-upstream/build' / f'integrated-eh-{condition}'
                  require(build.is_dir() and cache.is_dir(), 'RELINK_BUILD_OR_CACHE_MISSING')
                  cache_rows = (out / 'cache-source.txt').read_text().splitlines()
                  require(cache_rows.count(f'{condition}_cache={cache}') == 1 and
                          sum(row.startswith(f'{condition}_cache=')
                              for row in cache_rows) == 1, 'EM_CACHE_DRIFT')
                  live = build / 'CMakeFiles/duckdb_wasm.dir'
                  command_file = out / f'{condition}-link.txt'
                  require((live / 'link.txt').read_bytes() == command_file.read_bytes(),
                          'LINK_COMMAND_DRIFT')
                  command = command_file.read_text()
                  map_path = out / f'{condition}.map'
                  tokens = shlex.split(command)
                  require(command.count('\n') == 1 and command.endswith('\n') and
                          len(command) <= 262144 and len(tokens) > 1 and
                          tokens.count(f'-Wl,-Map,{map_path}') == 1,
                          'LINK_COMMAND_SHAPE')
                  baseline = {}
                  for name, artifact, current in (
                      ('command', command_file, live / 'link.txt'),
                      ('objects1_rsp', out / f'{condition}-objects1.rsp', live / 'objects1.rsp'),
                      ('linklibs_rsp', out / f'{condition}-linklibs.rsp', live / 'linklibs.rsp'),
                      ('map', out / f'{condition}.map', out / f'{condition}.map'),
                      ('js', out / f'{condition}.js', build / 'duckdb_wasm.js'),
                      ('wasm', out / f'{condition}.wasm', build / 'duckdb_wasm.wasm')):
                      digest = sha(artifact)
                      require(sha(current) == digest, 'SAME_RUN_BASELINE_DRIFT')
                      canary_name = (f'{condition}-{name}' if name in
                                     ('command', 'objects1_rsp', 'linklibs_rsp') else
                                     f'{condition}.{name}')
                      canary_name = canary_name.replace('-command', '-command.txt').replace(
                          '-objects1_rsp', '-objects1.rsp').replace('-linklibs_rsp', '-linklibs.rsp')
                      require(canary['baseline_sha256'][canary_name] == digest,
                              'SAME_RUN_BASELINE_DRIFT')
                      baseline[name] = digest
                  ordinary_map = scratch / f'{condition}-ordinary.map'
                  shutil.copyfile(map_path, ordinary_map)
                  raw = scratch / f'{condition}.raw'
                  tracee_env = os.environ.copy()
                  tracee_env['EM_CACHE'] = str(cache)
                  for key in ('LD_LIBRARY_PATH', 'LD_PRELOAD', 'LD_AUDIT'):
                      tracee_env.pop(key, None)
                  argv = loader_prefix + ['-f', '-qq', '-s', '96', '-o', str(raw),
                      '-e', 'trace=execve,open,openat,openat2,read,close,clone,clone3,fork,vfork,wait4,exit_group',
                      'bash', '-euo', 'pipefail', '-c', command.rstrip('\n')]
                  try:
                      # Remove the mutable local map after saving its uploaded
                      # preimage, so a missing/wrong live map output cannot
                      # pass on stale bytes from the original link.
                      map_path.unlink()
                      traced_run(argv, build, tracee_env, raw)
                      replay = {'map': sha(map_path),
                                'js': sha(build / 'duckdb_wasm.js'),
                                'wasm': sha(build / 'duckdb_wasm.wasm')}
                      require(all(replay[name] == baseline[name] for name in replay),
                              'DIFF_SAME_RUN_REPLAY')
                      receipt['conditions'][condition] = {
                          'status': 'PASS', 'build_cwd_class': 'EXACT_INTEGRATED_EH_BUILD',
                          'em_cache_class': condition, 'baseline_sha256': baseline,
                          'replay_sha256': replay,
                          'trace': classify(raw, build, cache),
                          'raw_trace_bytes': raw.stat().st_size,
                          'tracee_and_tracer_exit': 0,
                      }
                  finally:
                      # The EH upload already contains the baseline map. Restore
                      # mutable local outputs before the second condition/refusal.
                      shutil.copyfile(ordinary_map, map_path)
                      for name in ('js', 'wasm'):
                          shutil.copyfile(out / f'{condition}.{name}',
                                          build / f'duckdb_wasm.{name}')
                      raw.unlink(missing_ok=True)
              receipt['status'] = 'PASS'
              receipt['reason'] = 'BOUNDED_IMAGE_CLEAN_REPLAY_BYTE_EQUAL'
          except Refusal as error:
              receipt['reason'] = str(error)
          except Exception:
              receipt['reason'] = 'UNEXPECTED_ERROR'
          finally:
              if scratch is not None: shutil.rmtree(scratch, ignore_errors=True)
              data = (json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n').encode()
              if len(data) + sum(p.stat().st_size for p in diag.iterdir()) > cap:
                  receipt['status'] = 'REFUSED'
                  data = b'{"schema":"tundra-eh-traced-relink/v1","status":"REFUSED","reason":"DIAGNOSTIC_CAP","generator_input_closure":"UNPROVEN","glue_legal_admission":"NO","product_admission":"NO"}\n'
              (diag / 'relink.json').write_bytes(data)
              require(sum(p.stat().st_size for p in diag.iterdir()) <= cap,
                      'DIAGNOSTIC_CAP')
          if receipt['status'] != 'PASS': raise SystemExit(1)
          PY
      - name: Retain bounded EH child-trace diagnostic
        if: ${{ always() && matrix.variant == 'eh' && steps.custody_upload.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-traced-relink-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eh-trace-diagnostic/
          if-no-files-found: error
          retention-days: 7
