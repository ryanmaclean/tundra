            test "$(grep -Fxc arrow-compute-util-instance-2.o "$out/$condition-arrow-renamed-members.txt")" -eq 1
            test "$(grep -Fxc util.cc.o "$out/$condition-arrow-renamed-members.txt" || true)" -eq 0
            while IFS=$'\t' read -r ledger_row member count payload_offset header_offset payload_sha bytes new_name source_object; do
              test "$(sed -n "$ledger_row"p "$out/$condition-arrow-renamed-members.txt")" = "$new_name"
              clone_count="$count"
