          fields = {
              'schema': 'tundra-generator-tracer-candidate/v1',
              'container_image': 'emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29',
              'tracer_candidate': 'strace',
