                                         ('source_head', 'custody_head', 'upstream_head',
                                          'duckdb_head', 'arrow_head')}
              receipt['python'] = canary['python']
              receipt['node'] = canary['node']
              receipt['ptrace_scope'] = canary['ptrace_scope']
              receipt['process_policy'] = canary['process_policy']
              receipt['controlled_child'] = 'PASS_SAME_RUN'
              pinned = {}
              for label, (relative, digest) in expected.items():
