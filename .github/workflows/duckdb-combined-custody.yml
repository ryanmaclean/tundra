                      fields['discovery'] = 'PACKAGE_OWNER_UNVERIFIED'
                  else:
                      match = re.fullmatch(r'([A-Za-z0-9.+:~_-]+)\t(amd64)\t(install ok installed)\n',
                                           package.stdout)
                      if match is None:
                          fields['discovery'] = 'PACKAGE_METADATA_UNVERIFIED'
                      else:
