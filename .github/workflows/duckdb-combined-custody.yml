      - name: Retain EH JS glue trace, includes and SDK generator superset
        if: ${{ matrix.variant == 'eh' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          python3 - "$out" "$EMSDK/upstream/emscripten" "$GITHUB_WORKSPACE/duckdb-upstream" <<'PY'
          from collections import defaultdict, deque
          import gzip, hashlib, io, re, sys, tarfile
          from pathlib import Path
          out, sdk, upstream = map(lambda x: Path(x).resolve(), sys.argv[1:])
          src, tools = sdk / 'src', sdk / 'tools'
          stub = upstream / 'lib/js-stubs.js'
          notices = {
              'emscripten': sdk / 'LICENSE',
              'duckdb-wasm': upstream / 'LICENSE',
          }
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def sha(data): return hashlib.sha256(data).hexdigest()
          def regular(path, limit=16777216, empty_ok=False):
              require(path.is_file() and not path.is_symlink(), f'not regular: {path}')
              size = path.stat().st_size
              require((size > 0 or empty_ok) and size <= limit,
                      f'empty or oversized input: {path}: {size}')
              return path.read_bytes()
          notice_bytes = {kind: regular(path) for kind, path in notices.items()}
          require(sha(notice_bytes['emscripten']) ==
                  '620a78084fc7ca97c0b5dea9abf891f3ffcadfdbf305276f099c9c4e12fc1d86',
                  'pinned Emscripten notice drift')
          require(sha(notice_bytes['duckdb-wasm']) ==
                  '3ad73e53243c374756dfc2eb5e780abd462ce99e89c84f9e46ada745db934107',
                  'pinned DuckDB-Wasm notice drift')
          require(src.is_dir() and tools.is_dir(), 'SDK generator roots missing')
          expected = {src / 'arrayUtils.js', src / 'IDBStore.js'}
          include_pattern = re.compile(r'^\s*#include\s+["<]([^">]+)[">]\s*$', re.M)
          for condition in ('image', 'clean'):
              lines = (out / f'{condition}-js-glue-bill.txt').read_text().splitlines()
              require(len(lines) == 68, f'{condition} trace event count drift')
              roles = defaultdict(set)
              for line in lines:
                  if line.startswith('processing system library: '):
                      name = line.removeprefix('processing system library: ')
                      require(name and not name.startswith('/') and '..' not in
                              Path(name).parts, f'unsafe SDK trace path: {name}')
                      candidate = src / name
                      require(not candidate.is_symlink(), f'SDK trace symlink: {candidate}')
                      path = candidate.resolve()
                      require(path.is_relative_to(src), f'SDK trace escaped src: {path}')
                  elif line.startswith('processing user library: '):
                      path = Path(line.removeprefix('processing user library: ')).resolve()
                      require(path == stub, f'unexpected user library: {path}')
                  else:
                      raise SystemExit(f'unaccounted glue trace line: {line}')
                  regular(path)
                  roles[path].add('TRACE')
              require(len(roles) == 34 and stub in roles, 'unique traced library count drift')
              queue = deque(roles)
              visited = set()
              edges = []
              while queue:
                  path = queue.popleft()
                  if path in visited: continue
                  visited.add(path)
                  body = regular(path).decode('utf-8')
                  raw_directives = re.findall(r'^\s*#include\b.*$', body, re.M)
                  includes = include_pattern.findall(body)
                  require(len(raw_directives) == len(includes),
                          f'unparsed include directive: {path}')
                  for name in includes:
                      require(name and not name.startswith('/') and '..' not in
                              Path(name).parts, f'unsafe include: {path}: {name}')
                      candidate = path.parent / name
                      require(not candidate.is_symlink(), f'include symlink: {candidate}')
                      child = candidate.resolve()
                      require(child.is_relative_to(src), f'include escaped SDK src: {child}')
                      regular(child)
                      roles[child].add('TRANSITIVE_INCLUDE')
                      edges.append((path, child))
                      queue.append(child)
              require(expected <= roles.keys() and all('TRANSITIVE_INCLUDE' in
                      roles[path] for path in expected), 'known transitive includes absent')
              # This is a bounded conservative SDK-source superset, not a
              # claim that emcc disclosed every generator read at runtime.
              for root in (src, tools):
                  for path in sorted(root.rglob('*')):
                      require(not path.is_symlink(), f'SDK superset symlink: {path}')
                      if path.is_file():
                          roles[path].add('SDK_GENERATOR_SUPERSET')
              for path in (sdk / 'emcc.py', sdk / 'em++.py', *notices.values(), stub):
                  regular(path)
                  roles[path].add('NOTICE_TEXT' if path in notices.values() else
                                  'USER_STUB' if path == stub else 'SDK_GENERATOR_SUPERSET')
              require(len(roles) <= 10000, 'SDK superset file count exceeded')
              rows = []
              total = 0
              archive = out / f'{condition}-js-generator-superset.tar.gz'
              with archive.open('wb') as sink, gzip.GzipFile(
                      fileobj=sink, mode='wb', filename='', mtime=0) as compressed, \
                      tarfile.open(fileobj=compressed, mode='w') as tar:
                  for path in sorted(roles):
                      empty_ok = roles[path] == {'SDK_GENERATOR_SUPERSET'}
                      data = regular(path, empty_ok=empty_ok)
                      total += len(data)
                      require(total <= 134217728, 'SDK generator superset exceeds 128 MiB')
                      if path.is_relative_to(sdk):
                          kind = 'emscripten'
                          rel = 'emscripten/' + str(path.relative_to(sdk))
                      else:
                          require(path in (stub, notices['duckdb-wasm']),
                                  f'unaccounted superset path: {path}')
                          kind = 'duckdb-wasm'
                          rel = ('duckdb-wasm/lib/js-stubs.js' if path == stub else
                                 'duckdb-wasm/LICENSE')
                      head = data[:2048].decode('utf-8', errors='replace')
                      spdx = re.search(r'SPDX-License-Identifier:\s*([^\s*]+)', head)
                      info = tarfile.TarInfo(rel)
                      info.size = len(data)
                      info.mode = 0o644
                      info.mtime = 0
                      tar.addfile(info, io.BytesIO(data))
                      rows.append((rel, ','.join(sorted(roles[path])), str(len(data)),
                          sha(data), kind + '/LICENSE', sha(notice_bytes[kind]),
                          spdx.group(1) if spdx else 'NO_EARLY_SPDX_HEADER',
                          'TOP_LEVEL_NOTICE_CANDIDATE_UNREVIEWED'))
              manifest = out / f'{condition}-js-generator-superset.tsv'
              manifest.write_text('path\troles\tbytes\tsha256\tnotice_path\tnotice_sha256\tspdx\tnotice_join_status\n' +
                                  ''.join('\t'.join(row) + '\n' for row in rows))
              (out / f'{condition}-js-transitive-includes.tsv').write_text(
                  'parent\tchild\n' + ''.join(
                      f'{parent}\t{child}\n' for parent, child in sorted(set(edges))))
              with tarfile.open(archive, 'r:gz') as check:
                  members = check.getmembers()
                  require(len(members) == len(rows) and
                          [member.name for member in members] ==
                          [row[0] for row in rows], 'superset archive manifest mismatch')
                  for member, row in zip(members, rows):
                      require(sha(check.extractfile(member).read()) == row[3],
                              f'superset tar byte mismatch: {member.name}')
              (out / f'{condition}-js-generator-scope.txt').write_text(
                  'scope=TRACE_PLUS_TRANSITIVE_INCLUDES_PLUS_SDK_SRC_TOOLS_SUPERSET\n'
                  f'trace_events={len(lines)}\nunique_traced_libraries=34\n'
                  f'transitive_include_edges={len(set(edges))}\n'
                  f'retained_files={len(rows)}\nretained_source_bytes={total}\n'
                  f'superset_archive_sha256={sha(archive.read_bytes())}\n'
                  'generator_input_closure=UNPROVEN\n'
                  'source_to_notice_join=TOP_LEVEL_CANDIDATE_UNREVIEWED\n'
                  'glue_legal_admission=NO\nproduct_admission=NO\n')
          PY
          test -s "$out/image-js-generator-scope.txt"
          test -s "$out/clean-js-generator-scope.txt"
          printf 'js_generator_superset=RETAINED_DIAGNOSTIC\njs_generator_input_closure=UNPROVEN\n' \
            >> "$out/admission.txt"
      - name: Inventory EH tracer provenance before any generator replay
