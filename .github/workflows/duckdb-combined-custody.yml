                              fields['discovery'] = 'NOTICE_UNSAFE_OR_LICENSE_UNVERIFIED'
                          else:
                              fields.update({
                                  'discovery': 'PIN_REVIEW_REQUIRED',
                                  'package_version': match.group(1),
                                  'package_arch': match.group(2),
                                  'binary_bytes': str(binary.stat().st_size),
                                  'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                                  'notice_bytes': str(len(body)),
                                  'notice_sha256': hashlib.sha256(body).hexdigest(),
                              })
                              (out / 'eh-generator-tracer-candidate-copyright').write_bytes(body)
          receipt.write_text(''.join(f'{key}={value}\n' for key, value in fields.items()))
          PY
          test -s "$out/eh-generator-tracer-candidate.txt"
          grep -Fqx 'generator_input_closure=UNPROVEN' "$out/eh-generator-tracer-candidate.txt"
          grep -Fqx 'eh_image_traced_relink=NOT_RUN_UNPINNED' "$out/eh-generator-tracer-candidate.txt"
