name: DuckDB combined same-run custody diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/duckdb-combined-custody.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-output:
    name: Paired archive, glue and output custody (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29
    env:
      DUCKDB_EXCEL: "0"
      DUCKDB_JSON: "1"
      CCACHE_DISABLE: "1"
      SOURCE_HEAD: 0bb7c5237dc1b047de488d67ba30b5ed05c37383
      CUSTODY_HEAD: 1d77df7776dca44731ae8267092e480a78f9f735
    strategy:
      fail-fast: false
      matrix:
        variant: [mvp, eh]
    steps:
      - name: Check out exact PR116 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0bb7c5237dc1b047de488d67ba30b5ed05c37383
          persist-credentials: false
      - name: Check out immutable PR119 custody bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d77df7776dca44731ae8267092e480a78f9f735
          path: custody
          persist-credentials: false
      - name: Check out versioned observed glue notice ledger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: legal-ledger
          sparse-checkout: .github/receipts/duckdb-eh-js-glue-observed-v2.tsv
          persist-credentials: false
      - name: Check out pinned DuckDB Wasm and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: duckdb/duckdb-wasm
          ref: f955138e5218942fb3fb097a8fdcb725222406ff
          path: duckdb-upstream
          submodules: recursive
          persist-credentials: false
      - name: Build both cache conditions and retain same-run inputs and outputs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/custody"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/duckdb-upstream"
          while IFS= read -r -d '' directory; do
            git config --global --add safe.directory "$directory"
          done < <(find "$GITHUB_WORKSPACE/duckdb-upstream" -type f -name .git -printf '%h\0')
          out="$RUNNER_TEMP/combined-custody"
          mkdir -p "$out" "$out/image-bytes" "$out/clean-bytes" "$out/member-lists"
          cat > "$out/yyjson-0.6.0-LICENSE" <<'LICENSE'
          MIT License

          Copyright (c) 2020 YaoYuan <ibireme@gmail.com>

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          LICENSE
          test "$(sha256sum "$out/yyjson-0.6.0-LICENSE" | cut -d ' ' -f 1)" = \
            45e384d3d52c73cba3a64d6e6c25d47cd738cd8a55c30629e3201046eda62947
          printf 'product_admission=NO\nsource_build_admission=NO\nglue_legal_admission=NO\njson_installed_capability=UNVERIFIED\nconversion_fetch_error_behavior=UNVERIFIED\njson_selected_archive_bytes=PENDING\narrow_original_member_instance=AMBIGUOUS\narchive_payload_classification=UNREAD\nexact_custody_output=UNRESOLVED\n' > "$out/admission.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C custody rev-parse HEAD)" = "$CUSTODY_HEAD"
          test "$(git -C duckdb-upstream rev-parse HEAD)" = f955138e5218942fb3fb097a8fdcb725222406ff
          test "$(git -C duckdb-upstream/submodules/duckdb rev-parse HEAD)" = 401c8061c6ece35949cac58c7770cc755710ca86
          test "$(git -C duckdb-upstream/submodules/arrow rev-parse HEAD)" = ca1c30f60d6419849dbc2a533bd0bcaff310185f
          test -z "$(git -C duckdb-upstream status --porcelain)"
          # Pinned source-only diagnostic: DuckDB can set a stream error during
          # Fetch(), after RunQuery's initial HasError check. Refuse a successful
          # schema-only Arrow file when materialization encountered that error.
          webdb=duckdb-upstream/lib/src/webdb.cc
          test "$(sha256sum "$webdb" | cut -d ' ' -f 1)" = \
            764b0bd6f433281bd38520fb5537e41a503435d5b456d54909526f1f15f791b7
          sha256sum "$webdb" > "$out/webdb-source-before.sha256"
          cat > "$out/webdb-fetch-error.patch" <<'PATCH'
          --- a/lib/src/webdb.cc
          +++ b/lib/src/webdb.cc
          @@ -128,6 +128,9 @@
                   // Write the record batch
                   ARROW_RETURN_NOT_OK(writer->WriteRecordBatch(*batch));
               }
          +    if (result->HasError()) {
          +        return arrow::Status{arrow::StatusCode::ExecutionError, std::move(result->GetError())};
          +    }
               ARROW_RETURN_NOT_OK(writer->Close());
               return out->Finish();
           }
          PATCH
          test "$(sha256sum "$out/webdb-fetch-error.patch" | cut -d ' ' -f 1)" = \
            9fc2d55cc1eb02f274743f9990a5601cc35ce5688afec6edf01e7a3d40fc795c
          git -C duckdb-upstream apply --check "$out/webdb-fetch-error.patch"
          git -C duckdb-upstream apply "$out/webdb-fetch-error.patch"
          test "$(git -C duckdb-upstream diff --name-only)" = lib/src/webdb.cc
          test "$(sha256sum "$webdb" | cut -d ' ' -f 1)" = \
            e935d57b7ccb3d45ed5509d092b7040b6a5bc12968e17792fd69da2a7586bfe0
          sha256sum "$webdb" "$out/webdb-fetch-error.patch" > "$out/webdb-source-and-patch.sha256"
          git -C duckdb-upstream diff --binary -- lib/src/webdb.cc > "$out/webdb-applied.patch"
          test -s "$out/webdb-applied.patch"
          {
            printf 'diagnostic_head=%s\nsource_head=%s\ncustody_head=%s\nupstream_head=%s\nvariant=%s\n' \
              '${{ github.event.pull_request.head.sha || github.sha }}' "$SOURCE_HEAD" "$CUSTODY_HEAD" \
              f955138e5218942fb3fb097a8fdcb725222406ff '${{ matrix.variant }}'
            printf 'container=emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29\n'
            emcc --version
            "$EMSDK/upstream/bin/llvm-ar" --version
          } > "$out/environment.txt"
          git -C duckdb-upstream submodule status --recursive > "$out/submodules.txt"
          test -z "$(grep '^[+-U]' "$out/submodules.txt" || true)"
          emcc --version | grep -Fq '3.1.48'
          python3 --version > "$out/python-version.txt"
          sha256sum custody/custody/manifest.json > "$out/custody-manifest.sha256"
          test "$(cut -d ' ' -f 1 "$out/custody-manifest.sha256")" = 5ec157dc96c54326970029900129b044365c2e330a46fa5d9f3ea66741fb2d14
          python3 - <<'PY'
          import json
          with open('custody/custody/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          if manifest['admission'] != 'NO' or len(manifest['assets']) != 5:
              raise SystemExit('custody manifest admission/assets mismatch')
          PY
          : > "$out/five-custody-assets.tsv"
          for asset in duckdb-browser.mjs duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js duckdb-mvp.wasm duckdb-eh.wasm; do
            expected="$(python3 - "$asset" <<'PY'
          import json, sys
          with open('custody/custody/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['assets']['duckdb-runtime/' + sys.argv[1]]['sha256'])
          PY
          )"
            actual="$(sha256sum "custody/duckdb-runtime/$asset" | cut -d ' ' -f 1)"
            test "$expected" = "$actual"
            printf '%s\t%s\t%s\n' "$asset" "$actual" CUSTODY_BYTE_MATCH >> "$out/five-custody-assets.tsv"
          done
          image_cache="$EMSDK/upstream/emscripten/cache"
          test -d "$image_cache"
          clean_cache="$RUNNER_TEMP/empty-sdk-cache-${{ matrix.variant }}"
          test ! -e "$clean_cache"
          mkdir "$clean_cache"
          test -z "$(find "$clean_cache" -mindepth 1 -print -quit)"
          printf 'image_cache=%s\nclean_cache=%s\nclean_cache_empty_before_configure=YES\n' "$image_cache" "$clean_cache" > "$out/cache-source.txt"
          # Retain the installed SDK recipe and library sources that produce
          # clean-cache system archives, alongside the command and build logs.
          test -s "$EMSDK/upstream/emscripten/embuilder.py"
          tar -C "$EMSDK/upstream/emscripten" -czf "$out/sdk-archive-recipe-source.tar.gz" \
            embuilder.py system/lib
          sha256sum "$out/sdk-archive-recipe-source.tar.gz" > "$out/sdk-archive-recipe-source.sha256"
          find duckdb-upstream -type f \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -print0 | LC_ALL=C sort -z | tar --null -czf "$out/upstream-legal-texts.tar.gz" -T -
          test -s "$out/upstream-legal-texts.tar.gz"
          sha256sum "$out/upstream-legal-texts.tar.gz" > "$out/upstream-legal-texts.sha256"
          find "$image_cache" -type f -name '*.a' -print0 | sort -z | xargs -0 -r sha256sum > "$out/image-cache-before.sha256"
          # These known selected candidates must exist before either build.
          # The map below confirms which of them the linker actually used.
          variant='${{ matrix.variant }}'
          case "$variant" in
            mvp) expected=8; names=(libc++.a libc++abi.a libc.a libcompiler_rt.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a) ;;
            eh) expected=9; names=(libc++-except.a libc++abi-except.a libc.a libcompiler_rt-wasm-sjlj.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a libunwind-except.a) ;;
            *) exit 1 ;;
          esac
          : > "$out/image-prebuild.tsv"
          for name in "${names[@]}"; do
            mapfile -t paths < <(find "$image_cache/sysroot" -type f -name "$name" | LC_ALL=C sort)
            test "${#paths[@]}" -eq 1
            archive="${paths[0]}"
            cp -- "$archive" "$out/image-bytes/$name"
            cmp -s "$archive" "$out/image-bytes/$name"
            printf '%s\t%s\t%s\n' "$name" "$archive" "$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$out/image-prebuild.tsv"
          done
          printf 'image_cache_preexisting_archive_count=%s\n' "$(wc -l < "$out/image-cache-before.sha256")" >> "$out/cache-source.txt"
          git -C duckdb-upstream/submodules/duckdb apply --check ../../duckdb.patch
          git -C duckdb-upstream/submodules/duckdb apply ../../duckdb.patch
          git -C duckdb-upstream/submodules/duckdb diff --binary > "$out/duckdb-applied.patch"
          test -s "$out/duckdb-applied.patch"
          # Direct CMake never runs the upstream Makefile's extension-cache setup.
          # A zero-byte sentinel selects the linked, non-loadable JSON extension.
          extension_cache=duckdb-upstream/.ccache/extension
          test ! -e "$extension_cache/excel"
          test ! -e "$extension_cache/json"
          mkdir -p "$extension_cache"
          : > "$extension_cache/json"
          test -f "$extension_cache/json" && test ! -s "$extension_cache/json"
          test ! -e "$extension_cache/excel"
          test "$(find "$extension_cache" -mindepth 1 -print)" = "$extension_cache/json"
          test "$DUCKDB_JSON" = 1 && test "$DUCKDB_EXCEL" = 0
          test -z "${DUCKDB_WASM_LOADABLE_EXTENSIONS+x}"
          printf 'json_sentinel=regular_zero_byte\nexcel_sentinel=absent\nloadable_extensions_env=unset\n' > "$out/json-configuration-intent.txt"
          sha256sum duckdb-upstream/lib/CMakeLists.txt duckdb-upstream/lib/src/webdb.cc \
            "$extension_cache/json" > "$out/json-configuration-source.sha256"
      - name: Produce paired warm and empty-cache native bytes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          image_cache="$EMSDK/upstream/emscripten/cache"
          clean_cache="$RUNNER_TEMP/empty-sdk-cache-${{ matrix.variant }}"
          variant='${{ matrix.variant }}'
          case "$variant" in
            mvp) expected=8; names=(libc++.a libc++abi.a libc.a libcompiler_rt.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a) ;;
            eh) expected=9; names=(libc++-except.a libc++abi-except.a libc.a libcompiler_rt-wasm-sjlj.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a libunwind-except.a) ;;
            *) exit 1 ;;
          esac
          test -s "$out/image-prebuild.tsv" && test -s "$out/duckdb-applied.patch"
          test -s "$out/webdb-applied.patch"
          extension_cache=duckdb-upstream/.ccache/extension
          for condition in image clean; do
            case "$condition" in
              image) cache="$image_cache" ;;
              clean) cache="$clean_cache" ;;
            esac
            build="$GITHUB_WORKSPACE/duckdb-upstream/build/integrated-$variant-$condition"
            map="$out/$condition.map"
            flags=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
              -DDUCKDB_WASM_LOADABLE_EXTENSIONS=OFF
              -DDUCKDB_WASM_LOADABLE_EXTENSIONS_UNSIGNED=OFF
              -DDUCKDB_WASM_VERSION=v1.28.0
              "-DDUCKDB_LOCATION=$GITHUB_WORKSPACE/duckdb-upstream/submodules/duckdb"
              "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-Map,$map")
            if test "$variant" = eh; then
              flags+=(-DWITH_WASM_EXCEPTIONS=1 -DDUCKDB_CUSTOM_PLATFORM=wasm_eh)
            else
              flags+=(-DDUCKDB_CUSTOM_PLATFORM=wasm_mvp)
            fi
            if test "$condition" = clean; then
              test -z "$(find "$cache" -mindepth 1 -print -quit)"
            fi
            test -f "$extension_cache/json" && test ! -s "$extension_cache/json"
            test ! -e "$extension_cache/excel"
            test "$(find "$extension_cache" -mindepth 1 -print)" = "$extension_cache/json"
            test -z "${DUCKDB_WASM_LOADABLE_EXTENSIONS+x}"
            test "$(sha256sum duckdb-upstream/lib/src/webdb.cc | cut -d ' ' -f 1)" = \
              e935d57b7ccb3d45ed5509d092b7040b6a5bc12968e17792fd69da2a7586bfe0
            printf 'condition=%s\njson_sentinel=regular_zero_byte\nexcel_sentinel=absent\nloadable_extensions_env=unset\n' \
              "$condition" > "$out/$condition-json-configuration.txt"
            sha256sum "$extension_cache/json" >> "$out/$condition-json-configuration.txt"
            printf 'EM_CACHE=%s emcmake cmake -S duckdb-upstream/lib -B %s %s\n' \
              "$cache" "$build" "${flags[*]}" > "$out/$condition-command.txt"
            printf 'EM_CACHE=%s EMCC_DEBUG=1 EM_FORCE_RESPONSE_FILES=0 emmake make -C %s -j4 duckdb_wasm\n' \
              "$cache" "$build" >> "$out/$condition-command.txt"
            EM_CACHE="$cache" emcmake cmake -S duckdb-upstream/lib -B "$build" "${flags[@]}" > "$out/$condition-configure.log" 2>&1
            EM_CACHE="$cache" EMCC_DEBUG=1 EM_FORCE_RESPONSE_FILES=0 \
              emmake make -C "$build" -j4 duckdb_wasm > "$out/$condition-build.log" 2>&1
            test -s "$build/duckdb_wasm.js" && test -s "$build/duckdb_wasm.wasm" && test -s "$map"
            cp "$build/duckdb_wasm.js" "$out/$condition.js"
            cp "$build/duckdb_wasm.wasm" "$out/$condition.wasm"
            cp "$build/compile_commands.json" "$out/$condition-compile_commands.json"
            cp "$build/CMakeCache.txt" "$out/$condition-CMakeCache.txt"
            grep -Fxq 'DUCKDB_WASM_LOADABLE_EXTENSIONS:BOOL=OFF' "$out/$condition-CMakeCache.txt"
            grep -Fxq 'DUCKDB_WASM_LOADABLE_EXTENSIONS_UNSIGNED:BOOL=OFF' "$out/$condition-CMakeCache.txt"
            python3 - "$out/$condition-compile_commands.json" "$out/$condition-json-configuration.txt" <<'PY'
          import json, shlex, sys
          from pathlib import Path
          commands = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          matches = [row for row in commands if row['file'].endswith('/src/webdb.cc')]
          if len(matches) != 1:
              raise SystemExit(f'expected one WebDB compile command; got {len(matches)}')
          row = matches[0]
          args = row.get('arguments') or shlex.split(row['command'])
          if '-DDUCKDB_JSON_EXTENSION' not in args:
              raise SystemExit('WebDB compile lacks DUCKDB_JSON_EXTENSION')
          if '-DDISABLE_EXTENSION_LOAD=1' not in args or '-DWASM_LOADABLE_EXTENSIONS=1' in args:
              raise SystemExit('WebDB compile is not confirmed non-loadable')
          with Path(sys.argv[2]).open('a', encoding='utf-8') as receipt:
              receipt.write('webdb_compile_json_define=YES\n')
              receipt.write('webdb_compile_nonloadable=YES\n')
              receipt.write('webdb_compile_command=' + shlex.join(args) + '\n')
          PY
            arrow_build="$build/third_party/arrow/src/arrow_ep-build"
            arrow_commands="$arrow_build/src/arrow/CMakeFiles/arrow_objlib.dir"
            test -s "$arrow_commands/build.make" && test -s "$arrow_commands/flags.make"
            cp "$arrow_commands/build.make" "$out/$condition-arrow-build.make"
            cp "$arrow_commands/flags.make" "$out/$condition-arrow-flags.make"
            if test -s "$arrow_build/compile_commands.json"; then
              cp "$arrow_build/compile_commands.json" "$out/$condition-arrow-compile_commands.json"
              arrow_db="$out/$condition-arrow-compile_commands.json"
              printf 'arrow_compile_commands=external_project_database\n' > "$out/$condition-arrow-command-source.txt"
            else
              arrow_db=''
              python3 - "$out/$condition-arrow-build.make" <<'PY'
          from pathlib import Path
          import re, sys
          recipe = Path(sys.argv[1]).read_text(encoding='utf-8')
          for source in ('array', 'compute'):
              rule = (r'(?m)^[^\n]*/' + re.escape(source) +
                      r'/util\.cc\.o:[ \t]+[^\n]*/' + re.escape(source) +
                      r'/util\.cc(?:[ \t]|$)')
              if len(re.findall(rule, recipe)) != 1:
                  raise SystemExit(f'missing or ambiguous Arrow {source}/util.cc source prerequisite')
          PY
              printf 'arrow_compile_commands=verified_make_fragments_only\n' > "$out/$condition-arrow-command-source.txt"
            fi
            for source in array compute; do
              if test -z "$arrow_db"; then
                continue
              fi
              python3 - "$arrow_db" "/$source/util.cc" > "$out/$condition-arrow-$source-command.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              matches = [row for row in json.load(f) if row['file'].endswith(sys.argv[2])]
          if len(matches) != 1:
              raise SystemExit(f'expected one util compile command, got {len(matches)}')
          print(json.dumps(matches[0], sort_keys=True))
          PY
            done
            cp "$build/CMakeFiles/duckdb_wasm.dir/link.txt" "$out/$condition-link.txt"
            cp "$build/CMakeFiles/duckdb_wasm.dir/objects1.rsp" "$out/$condition-objects1.rsp"
            cp "$build/CMakeFiles/duckdb_wasm.dir/linklibs.rsp" "$out/$condition-linklibs.rsp"
            python3 - "$out/$condition-linklibs.rsp" "$map" "$build" \
              "$out/$condition-json-configuration.txt" "$out/$condition-json-link-selection.tsv" \
              "$out/$condition-json-archive-members.txt" <<'PY'
          import hashlib, os, re, shlex, subprocess, sys
          from pathlib import Path
          response, link_map, build, receipt, selection, members = map(Path, sys.argv[1:])
          tokens = shlex.split(response.read_text(encoding='utf-8'))
          map_text = link_map.read_text(encoding='utf-8')
          ar = Path(os.environ['EMSDK']) / 'upstream/bin/llvm-ar'
          expected_paths = ('libduckdb_web_json.a',
                            'third_party/duckdb/install/lib/libjson_extension.a')
          for expected_path in expected_paths:
              archive_name = Path(expected_path).name
              paths = [Path(token) for token in tokens if Path(token).name == archive_name]
              if len(paths) != 1:
                  raise SystemExit(f'expected one {archive_name} in link response; got {len(paths)}')
              if str(paths[0]) != expected_path:
                  raise SystemExit(f'wrong selected JSON archive path: {paths[0]}')
              path = paths[0] if paths[0].is_absolute() else build / paths[0]
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f'JSON archive missing or empty: {path}')
              selected = re.findall(re.escape(expected_path) + r'\(([^)]+)\)', map_text)
              if not selected:
                  raise SystemExit(f'no selected {archive_name} member in final link map')
              inventory = subprocess.check_output([str(ar), 't', str(path)], text=True).splitlines()
              if not inventory or not set(selected).issubset(set(inventory)):
                  raise SystemExit(f'JSON selected members missing from actual archive: {path}')
              hash_state = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hash_state.update(chunk)
              digest = hash_state.hexdigest()
              with selection.open('a', encoding='utf-8') as out:
                  out.write(f'{archive_name}\t{path.resolve()}\t{digest}\t{len(selected)}\n')
              with members.open('a', encoding='utf-8') as out:
                  for member in sorted(set(selected)):
                      out.write(f'{archive_name}\t{member}\n')
          with receipt.open('a', encoding='utf-8') as out:
              out.write('json_web_and_duckdb_archives_in_response_and_map=YES\n')
              out.write('json_installed_capability=UNVERIFIED\n')
          PY
            test -s "$out/$condition-json-link-selection.tsv"
            test -s "$out/$condition-json-archive-members.txt"
            sha256sum "$out/$condition.js" "$out/$condition.wasm" "$out/$condition-link.txt" \
              "$out/$condition-objects1.rsp" "$out/$condition-linklibs.rsp" \
              "$out/$condition-CMakeCache.txt" "$map" > "$out/$condition-output.sha256"
            # These are link-selected archives, not an inventory of every cache entry.
            grep -oE "$cache/sysroot/[^[:space:]():]+\.a" "$map" | LC_ALL=C sort -u > "$out/$condition-sdk-selected.txt"
            test "$(wc -l < "$out/$condition-sdk-selected.txt")" -eq "$expected"
            : > "$out/$condition-sdk-archives.tsv"
            while IFS= read -r archive; do
              test -s "$archive"
              name="${archive##*/}"
              test "$(printf '%s\n' "${names[@]}" | grep -Fxc "$name")" -eq 1
              test ! -e "$out/member-lists/$condition-$name.txt"
              if test "$condition" = image; then
                cmp -s "$archive" "$out/image-bytes/$name"
                grep -Fqx "$name"$'\t'"$archive"$'\t'"$(sha256sum "$archive" | cut -d ' ' -f 1)" "$out/image-prebuild.tsv"
              else
                cp -- "$archive" "$out/clean-bytes/$name"
              fi
              cmp -s "$archive" "$out/$condition-bytes/$name"
              "$EMSDK/upstream/bin/llvm-ar" t "$out/$condition-bytes/$name" > "$out/member-lists/$condition-$name.txt"
              printf '%s\t%s\t%s\n' "$name" "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
                "$(sha256sum "$out/member-lists/$condition-$name.txt" | cut -d ' ' -f 1)" \
                >> "$out/$condition-sdk-archives.tsv"
            done < "$out/$condition-sdk-selected.txt"
            test "$(find "$out/$condition-bytes" -maxdepth 1 -type f -name '*.a' | wc -l)" -eq "$expected"
            grep -F "$cache/sysroot/" "$map" > "$out/$condition-sdk-map-selection.txt"
            test -s "$out/$condition-sdk-map-selection.txt"
            if test "$condition" = image; then
              warm=0
              cold=0
              : > "$out/image-selected-prebuild-cache.tsv"
              while IFS= read -r archive; do
                selected_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
                if grep -Fqx "$selected_sha  $archive" "$out/image-cache-before.sha256"; then
                  status=PREEXISTING_PATH_AND_BYTES
                  warm=$((warm + 1))
                else
                  status=COLD_OR_CHANGED_DURING_BUILD
                  cold=$((cold + 1))
                fi
                printf '%s\t%s\t%s\n' "$archive" "$selected_sha" "$status" \
                  >> "$out/image-selected-prebuild-cache.tsv"
              done < "$out/image-sdk-selected.txt"
              if test "$cold" -eq 0; then
                printf 'image_selected_cache_classification=WARM_EXACT\n' >> "$out/cache-source.txt"
              else
                printf 'image_selected_cache_classification=COLD_OR_MUTATED\n' >> "$out/cache-source.txt"
              fi
              printf 'image_selected_preexisting=%s\nimage_selected_cold_or_mutated=%s\n' \
                "$warm" "$cold" >> "$out/cache-source.txt"
            fi
            mapfile -t arrows < <(grep -oE "[^[:space:]\"']*libarrow\.a" "$out/$condition-linklibs.rsp" | LC_ALL=C sort -u)
            test "${#arrows[@]}" -eq 1
            arrow="${arrows[0]}"
            if [[ "$arrow" != /* ]]; then arrow="$build/$arrow"; fi
            arrow="$(realpath "$arrow")"
            test -s "$arrow"
            printf 'archive=%s\nsha256=%s\n' "$arrow" "$(sha256sum "$arrow" | cut -d ' ' -f 1)" > "$out/$condition-arrow.txt"
            "$EMSDK/upstream/bin/llvm-ar" t "$arrow" > "$out/$condition-arrow-members.txt"
            test "$(grep -Fxc util.cc.o "$out/$condition-arrow-members.txt")" -eq 2
            grep -F 'libarrow.a(' "$map" > "$out/$condition-arrow-map-selection.txt"
            test -s "$out/$condition-arrow-map-selection.txt"
            # These are candidate source objects only. The original archive
            # has duplicate util.cc.o names; map rows cannot bind either one.
            for source in array compute; do
              object="$build/third_party/arrow/src/arrow_ep-build/src/arrow/CMakeFiles/arrow_objlib.dir/$source/util.cc.o"
              test -s "$object"
              printf '%s\t%s\n' "$source/util.cc.o" "$(sha256sum "$object" | cut -d ' ' -f 1)" >> "$out/$condition-arrow-source-objects.tsv"
              "$EMSDK/upstream/bin/llvm-readobj" --sections "$object" > "$out/$condition-arrow-$source-sections.txt"
            done
            # Replay the exact native link with only VERBOSE tracing added.
            original="$(cat "$out/$condition-link.txt")"
            test "$(wc -l < "$out/$condition-link.txt")" -eq 1
            [[ "$original" == *' --js-library='* ]]
            traced="${original/ --js-library=/ -sVERBOSE=1 --js-library=}"
            test "$traced" != "$original"
            (cd "$build" && EM_CACHE="$cache" bash -euo pipefail -c "$traced") > "$out/$condition-glue-link.log" 2>&1
            if cmp -s "$build/duckdb_wasm.js" "$out/$condition.js" && \
               cmp -s "$build/duckdb_wasm.wasm" "$out/$condition.wasm"; then
              printf 'verbose_relink_byte_match=YES\n' > "$out/$condition-replay.txt"
            else
              printf 'verbose_relink_byte_match=NO\n' > "$out/$condition-replay.txt"
            fi
            grep -E '^processing (system|user) library: ' "$out/$condition-glue-link.log" > "$out/$condition-js-glue-bill.txt"
            test -s "$out/$condition-js-glue-bill.txt"
            grep -Fq "processing user library: $GITHUB_WORKSPACE/duckdb-upstream/lib/js-stubs.js" "$out/$condition-js-glue-bill.txt"
            : > "$out/$condition-js-glue-source.tsv"
            : > "$out/$condition-js-glue-archive-paths.txt"
            installed_js_root="$(realpath -e "$EMSDK/upstream/emscripten/src")"
            upstream_root="$(realpath -e "$GITHUB_WORKSPACE/duckdb-upstream")"
            while IFS= read -r entry; do
              case "$entry" in
                'processing system library: '*)
                  relative="${entry#processing system library: }"
                  [[ "$relative" != /* && "$relative" != *..* ]]
                  source="$EMSDK/upstream/emscripten/src/$relative"
                  resolved="$(realpath -e "$source")"
                  [[ "$resolved" == "$installed_js_root/"* ]]
                  ;;
                'processing user library: '*)
                  source="${entry#processing user library: }"
                  test "$source" = "$GITHUB_WORKSPACE/duckdb-upstream/lib/js-stubs.js"
                  resolved="$(realpath -e "$source")"
                  [[ "$resolved" == "$upstream_root/"* ]]
                  ;;
                *) exit 1 ;;
              esac
              test -f "$resolved"
              test -s "$source"
              printf '%s\t%s\n' "$source" "$(sha256sum "$source" | cut -d ' ' -f 1)" >> "$out/$condition-js-glue-source.tsv"
              printf '%s\n' "${source#/}" >> "$out/$condition-js-glue-archive-paths.txt"
            done < "$out/$condition-js-glue-bill.txt"
            tar -C / --dereference -czf "$out/$condition-js-glue-source-bytes.tar.gz" \
              -T "$out/$condition-js-glue-archive-paths.txt"
            test -s "$out/$condition-js-glue-source-bytes.tar.gz"
            # Retain legal texts shipped with the SDK's system-library sources.
            find "$EMSDK/upstream/emscripten/system/lib" -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
              -printf '%P\0' | LC_ALL=C sort -z \
              | tar -C "$EMSDK/upstream/emscripten/system/lib" --null -czf "$out/sdk-system-legal-texts.tar.gz" -T -
            test -s "$out/sdk-system-legal-texts.tar.gz"
            sha256sum "$out/sdk-system-legal-texts.tar.gz" > "$out/sdk-system-legal-texts.sha256"
            mkdir "$out/$condition-legal-texts"
            cp "$EMSDK/upstream/emscripten/LICENSE" \
              "$out/$condition-legal-texts/emscripten-LICENSE"
            cp duckdb-upstream/LICENSE \
              "$out/$condition-legal-texts/duckdb-wasm-LICENSE"
            (cd "$out/$condition-legal-texts" && sha256sum ./*) \
              > "$out/$condition-legal-texts.sha256"
            sha256sum "$out/$condition-js-glue-source-bytes.tar.gz" \
              > "$out/$condition-js-glue-source-bytes.sha256"
          done
      - name: Retain selected JSON archive and compiled-source custody
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          variant='${{ matrix.variant }}'
          case "$variant" in mvp|eh) ;; *) exit 1 ;; esac
          for condition in image clean; do
            build="$GITHUB_WORKSPACE/duckdb-upstream/build/integrated-$variant-$condition"
            test -s "$out/$condition-json-link-selection.tsv"
            test -s "$out/$condition-json-archive-members.txt"
            python3 - "$build" "$out" "$condition" "$EMSDK/upstream/bin/llvm-ar" \
              "$GITHUB_WORKSPACE/duckdb-upstream/submodules/duckdb" <<'PY'
          import hashlib, os, re, shlex, shutil, subprocess, sys
          from pathlib import Path
          build, out, ar, source_root = [Path(sys.argv[i]).resolve() for i in (1, 2, 4, 5)]
          condition = sys.argv[3]
          if condition not in ('image', 'clean'): raise SystemExit('invalid JSON custody condition')
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def sha(path):
              state = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      state.update(chunk)
              return state.hexdigest()
          def regular(path, limit):
              require(path.is_file() and not path.is_symlink(), f'not regular: {path}')
              size = path.stat().st_size
              require(0 < size <= limit, f'unbounded or empty: {path}: {size}')
              return size
          rows = [line.split('\t') for line in
                  (out / f'{condition}-json-link-selection.tsv').read_text().splitlines()]
          require(len(rows) == 2 and all(len(row) == 4 for row in rows), 'JSON selection bill malformed')
          by_name = {row[0]: row for row in rows}
          require(len(by_name) == 2 and set(by_name) ==
                  {'libduckdb_web_json.a', 'libjson_extension.a'}, 'JSON archive set changed')
          selected_rows = [line.split('\t') for line in
                           (out / f'{condition}-json-archive-members.txt').read_text().splitlines()]
          require(len(selected_rows) == 25 and all(len(row) == 2 for row in selected_rows),
                  'selected JSON member bill changed')
          require(len({tuple(row) for row in selected_rows}) == 25, 'duplicate selected JSON member')
          physical = out / f'{condition}-json-bytes'
          physical.mkdir(exist_ok=False)
          physical_bill = []
          member_bill = []
          archive_paths = {
              'libduckdb_web_json.a': build / 'libduckdb_web_json.a',
              'libjson_extension.a': build / 'third_party/duckdb/install/lib/libjson_extension.a',
          }
          for name in sorted(archive_paths):
              source = archive_paths[name]
              require(Path(by_name[name][1]).resolve() == source.resolve(),
                      f'archive path drift: {name}')
              size = regular(source, 134217728)
              destination = physical / name
              shutil.copyfile(source, destination)
              require(regular(destination, 134217728) == size and sha(destination) ==
                      sha(source) == by_name[name][2], f'archive physical/hash mismatch: {name}')
              inventory = subprocess.check_output([str(ar), 't', str(destination)], text=True).splitlines()
              require(inventory and len(inventory) == len(set(inventory)),
                      f'ambiguous archive inventory: {name}')
              inventory_file = out / f'{condition}-{name}.inventory.txt'
              inventory_file.write_text(''.join(f'{member}\n' for member in inventory))
              members = [member for archive, member in selected_rows if archive == name]
              require(members and set(members) <= set(inventory), f'selected member absent: {name}')
              require(int(by_name[name][3]) >= len(members), f'map/member count drift: {name}')
              physical_bill.append((name, f'{condition}-json-bytes/{name}', sha(destination),
                                    str(size), sha(inventory_file), str(len(inventory)),
                                    str(len(members))))
              for member in sorted(members):
                  object_bytes = subprocess.check_output([str(ar), 'p', str(destination), member])
                  require(0 < len(object_bytes) <= 33554432, f'bad selected object size: {member}')
                  member_bill.append((name, member, hashlib.sha256(object_bytes).hexdigest(),
                                      str(len(object_bytes))))
          require(len(member_bill) == 25 and len([row for row in member_bill if
                  row[0] == 'libjson_extension.a']) == 24, 'JSON selected object count drift')
          require(('libjson_extension.a', 'yyjson.cpp.o') in
                  {(row[0], row[1]) for row in member_bill}, 'selected yyjson object absent')
          (out / f'{condition}-json-physical.tsv').write_text(''.join('\t'.join(row) + '\n'
              for row in physical_bill))
          (out / f'{condition}-json-member-bytes.tsv').write_text(''.join('\t'.join(row) + '\n'
              for row in sorted(member_bill)))
          duckdb_build = build / 'third_party/duckdb/src/duckdb_ep-build'
          require(duckdb_build.is_dir(), 'DuckDB external-project build directory absent')
          evidence = out / f'{condition}-json-external'
          evidence.mkdir(exist_ok=False)
          sources_retained = out / f'{condition}-json-source'
          sources_retained.mkdir(exist_ok=False)
          source_bill = []
          for archive, member, object_sha, object_size in sorted(member_bill):
              if archive != 'libjson_extension.a': continue
              json_build = duckdb_build / 'extension/json'
              selected_target = (json_build / 'yyjson/CMakeFiles/yyjson.dir' if
                                 member == 'yyjson.cpp.o' else
                                 json_build / 'CMakeFiles/json_extension.dir')
              candidates = [p for p in json_build.rglob(member)
                            if p.is_file() and not p.is_symlink()]
              objects = [p for p in candidates if p.is_relative_to(selected_target) and
                         regular(p, 33554432) == int(object_size) and sha(p) == object_sha]
              require(len(objects) == 1,
                      f'selected target/archive object mismatch: {member}: {len(objects)}')
              obj = objects[0]
              depfile = obj.with_name(member + '.d')
              regular(depfile, 2097152)
              deps = depfile.read_text().replace('\\\n', ' ')
              require(':' in deps, f'depfile target absent: {member}')
              target, prerequisites = deps.split(':', 1)
              require(target.strip().endswith(member), f'depfile object target drift: {member}')
              tokens = shlex.split(prerequisites)
              sources = [Path(token).resolve() for token in tokens if token.endswith('.cpp') and
                         Path(token).name == member.removesuffix('.o') and
                         Path(token).resolve().is_relative_to(source_root / 'extension/json')]
              require(len(sources) == 1, f'unbound JSON source: {member}')
              source = sources[0]
              regular(source, 8388608)
              source_relative = source.relative_to(source_root)
              retained_source = sources_retained / source_relative
              retained_source.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, retained_source)
              require(sha(retained_source) == sha(source), f'JSON source copy mismatch: {member}')
              targets = [p for p in obj.parents if p.name.endswith('.dir') and
                         p.parent.name == 'CMakeFiles']
              require(len(targets) == 1, f'object target ambiguous: {member}')
              recipe = (targets[0] / 'build.make').read_text()
              rule = (r'(?m)^' + re.escape(str(obj.relative_to(duckdb_build))) +
                      r':[ \t]+' + re.escape(str(source)) + r'(?:[ \t]|$)')
              require(len(re.findall(rule, recipe)) == 1,
                      f'CMake object/source rule missing or ambiguous: {member}')
              fragments = [depfile, targets[0] / 'build.make', targets[0] / 'flags.make',
                           targets[0] / 'includes_CXX.rsp']
              copied = []
              for path in fragments:
                  regular(path, 8388608)
                  relative = path.relative_to(duckdb_build)
                  retained = evidence / relative
                  retained.parent.mkdir(parents=True, exist_ok=True)
                  if not retained.exists(): shutil.copyfile(path, retained)
                  require(sha(retained) == sha(path), f'external fragment changed: {path}')
                  copied.append((str(relative), sha(retained)))
              if member == 'yyjson.cpp.o':
                  require(sha(source) == '2a007a54182c6ea244ef65846a24652aa47a951a45808f1accd22752cfbb2590',
                          'pinned yyjson source changed')
                  header = source_root / 'extension/json/yyjson/include/yyjson.hpp'
                  require(regular(header, 8388608) and sha(header) ==
                          '69500ac662c5f22bdeb76fba7e881135eac07fafccd9ce9ffec5b47503f38ed1',
                          'pinned yyjson header changed')
                  require(str(header.resolve()) in tokens, 'yyjson header absent from object depfile')
                  retained_header = sources_retained / header.relative_to(source_root)
                  retained_header.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(header, retained_header)
                  require(sha(retained_header) == sha(header), 'yyjson header copy mismatch')
              source_bill.append((member, object_sha, str(obj.relative_to(duckdb_build)),
                  str(source_relative), sha(retained_source),
                  *(item for pair in copied for item in pair)))
          require(len(source_bill) == 24, 'DuckDB JSON source/object coverage incomplete')
          (out / f'{condition}-json-object-source.tsv').write_text(''.join(
              '\t'.join(row) + '\n' for row in source_bill))
          (out / f'{condition}-json-yyjson-header.tsv').write_text(
              '\t'.join((str(header.relative_to(source_root)), sha(retained_header),
                         str(retained_header.relative_to(out)))) + '\n')
          with (out / f'{condition}-json-configuration.txt').open('a') as receipt:
              receipt.write('json_selected_archive_bytes=RETAINED_BOUNDED\n')
              receipt.write('duckdb_json_external_object_source=24_EXACT_ARCHIVE_OBJECT_DEPFILE_JOINS\n')
          PY
          done
          python3 - "$out/admission.txt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          data = path.read_text()
          old = 'json_selected_archive_bytes=PENDING\n'
          assert data.count(old) == 1
          for condition in ('image', 'clean'):
              root = path.parent
              assert (root / f'{condition}-json-physical.tsv').is_file()
              assert (root / f'{condition}-json-member-bytes.tsv').is_file()
              assert (root / f'{condition}-json-object-source.tsv').is_file()
          path.write_text(data.replace(old, 'json_selected_archive_bytes=RETAINED_BOUNDED\n'))
          PY
      - name: Retain EH Arrow archive and duplicate-instance relink
        if: ${{ matrix.variant == 'eh' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          ar="$EMSDK/upstream/bin/llvm-ar"
          "$EMSDK/upstream/bin/wasm-ld" --help > "$out/arrow-wasm-ld-help.txt"
          grep -Fq -- '--why-extract' "$out/arrow-wasm-ld-help.txt"
          test -s "$out/cache-source.txt"
          restore_arrow_link() {
            cp "$saved_rsp" "$linklibs"
            cp "$saved_map" "$map"
            cp "$out/$condition.js" "$build/duckdb_wasm.js"
            cp "$out/$condition.wasm" "$build/duckdb_wasm.wasm"
          }
          for condition in image clean; do
            case "$condition" in
              image) cache="$EMSDK/upstream/emscripten/cache" ;;
              clean) cache="$RUNNER_TEMP/empty-sdk-cache-eh" ;;
            esac
            test -d "$cache"
            grep -Fqx "${condition}_cache=$cache" "$out/cache-source.txt"
            printf 'condition=%s\nEM_CACHE=%s\nsource=cache-source.txt\n' \
              "$condition" "$cache" > "$out/$condition-arrow-relink-cache.txt"
            build="$GITHUB_WORKSPACE/duckdb-upstream/build/integrated-eh-$condition"
            map="$out/$condition.map"
            linklibs="$build/CMakeFiles/duckdb_wasm.dir/linklibs.rsp"
            saved_rsp="$out/$condition-arrow-ordinary-linklibs.rsp"
            saved_map="$out/$condition-arrow-ordinary.map"
            test -s "$out/$condition.js" && test -s "$out/$condition.wasm"
            test -s "$map" && test -s "$linklibs"
            cmp "$linklibs" "$out/$condition-linklibs.rsp"
            cp "$linklibs" "$saved_rsp"
            cp "$map" "$saved_map"
            trap restore_arrow_link EXIT
            token=third_party/arrow/install/lib/libarrow.a
            test "$(tr ' ' '\n' < "$linklibs" | grep -Fxc "$token")" -eq 1
            archive="$build/$token"
            original="$out/$condition-arrow-original.a"
            test -s "$archive"
            cp "$archive" "$original"
            cmp "$archive" "$original"
            test "$(sha256sum "$original" | cut -d ' ' -f 1)" = \
              "$(sed -n 's/^sha256=//p' "$out/$condition-arrow.txt")"
            test "$(stat -c %s "$original")" -le 83886080
            members="$out/$condition-arrow-original-members.txt"
            offsets="$out/$condition-arrow-original-offsets.txt"
            "$ar" t "$original" > "$members"
            "$ar" tO "$original" > "$offsets"
            test "$(wc -l < "$members")" -eq "$(wc -l < "$offsets")"
            test "$(grep -Fxc util.cc.o "$members")" -eq 2
            verified="$out/$condition-arrow-verified-offsets.tsv"
            python3 - "$original" "$members" "$offsets" "$verified" <<'PY'
          from pathlib import Path
          import re, sys
          archive, members, offsets, verified = map(Path, sys.argv[1:])
          data = archive.read_bytes()
          assert data.startswith(b'!<arch>\n')
          selected = []
          string_table = None
          cursor = 8
          while cursor < len(data):
              header = data[cursor:cursor + 60]
              assert len(header) == 60 and header[58:60] == bytes((96, 10))
              raw_name = header[:16].decode('ascii').strip()
              size = int(header[48:58].strip())
              payload = cursor + 60
              end = payload + size
              assert 0 < size and end <= len(data)
              if raw_name == '//':
                  string_table = data[payload:end]
              elif raw_name not in ('/', '/SYM64/'):
                  if raw_name.startswith('/') and raw_name[1:].isdigit():
                      assert string_table is not None
                      start = int(raw_name[1:])
                      stop = string_table.find(b'/\n', start)
                      assert 0 <= start < stop
                      name = string_table[start:stop].decode('utf-8')
                  else:
                      assert raw_name.endswith('/')
                      name = raw_name[:-1]
                  selected.append((name, payload, cursor))
              cursor = end + (size & 1)
          assert cursor == len(data)
          member_rows = members.read_text().splitlines()
          offset_rows = offsets.read_text().splitlines()
          assert len(selected) == len(member_rows) == len(offset_rows) > 0
          output = []
          last_payload = -1
          for row, ((name, payload, header), member, offset_row) in enumerate(
                  zip(selected, member_rows, offset_rows), 1):
              match = re.fullmatch(r'(\S+)\s+0x([0-9A-Fa-f]+)', offset_row)
              assert match is not None
              assert name == member == match.group(1)
              assert payload == int(match.group(2), 16)
              assert 8 <= header < payload and payload > last_payload
              assert data[header + 58:header + 60] == bytes((96, 10))
              last_payload = payload
              output.append(f'{row}\t{name}\t0x{payload:x}\t0x{header:x}\n')
          verified.write_text(''.join(output))
          PY
            original_link="$(cat "$out/$condition-link.txt")"
            test "$(wc -l < "$out/$condition-link.txt")" -eq 1
            (cd "$build" && EM_CACHE="$cache" bash -euo pipefail -c \
              "$original_link -Wl,--why-extract=$out/$condition-arrow-original-why-extract.tsv") \
              > "$out/$condition-arrow-original-relink.log" 2>&1
            # Preserve the replay map before a failed comparison or the EXIT trap
            # restores the ordinary map in the build directory.
            trace_map="$out/$condition-arrow-original-trace.map"
            test -s "$map"
            cp "$map" "$trace_map"
            cmp "$map" "$trace_map"
            python3 - "$saved_map" "$trace_map" \
              "$out/$condition-arrow-original-map-diff.txt" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          ordinary, replay, receipt = map(Path, sys.argv[1:])
          def digest(path):
              value = sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(65536), b''):
                      value.update(chunk)
              return value.hexdigest()

          first = None
          with ordinary.open('rb') as left, replay.open('rb') as right:
              offset = 0
              while True:
                  a, b = left.read(65536), right.read(65536)
                  if a != b:
                      index = next((i for i in range(min(len(a), len(b)))
                                    if a[i] != b[i]), min(len(a), len(b)))
                      first = (offset + index, a[index:index + 16].hex(),
                               b[index:index + 16].hex())
                      break
                  if not a:
                      break
                  offset += len(a)
          lines = [f'ordinary_bytes={ordinary.stat().st_size}',
                   f'ordinary_sha256={digest(ordinary)}',
                   f'replay_bytes={replay.stat().st_size}',
                   f'replay_sha256={digest(replay)}',
                   f'byte_equal={"YES" if first is None else "NO"}']
          if first is not None:
              lines += [f'first_diff_offset_zero_based={first[0]}',
                        f'ordinary_first_16_hex={first[1]}',
                        f'replay_first_16_hex={first[2]}']
          receipt.write_text('\n'.join(lines) + '\n')
          PY
            test -s "$out/$condition-arrow-original-why-extract.tsv"
            cmp "$build/duckdb_wasm.js" "$out/$condition.js"
            cmp "$build/duckdb_wasm.wasm" "$out/$condition.wasm"
            cmp "$trace_map" "$saved_map"
            clone="$out/$condition-arrow-renamed.a"
            staging="$RUNNER_TEMP/arrow-$condition-members"
            mkdir "$staging" "$out/$condition-arrow-source"
            : > "$out/$condition-arrow-source/joins.tsv"
            ledger="$out/$condition-arrow-instance-ledger.tsv"
            printf 'row\tmember\toccurrence\tpayload_offset\theader_offset\tpayload_sha256\tbytes\trenamed_member\tsource_object\n' > "$ledger"
            row=0
            # The selected member list is read-only; the loop writes a separate clone.
            # shellcheck disable=SC2094
            while IFS= read -r member; do
              row=$((row + 1))
              test -n "$member" && [[ "$member" != */* && "$member" != *[[:space:]]* ]]
              count="$(head -n "$row" "$members" | grep -Fxc "$member")"
              slot="$staging/$row"
              mkdir "$slot"
              (cd "$slot" && "$ar" xN "$count" "$original" "$member")
              test -s "$slot/$member"
              IFS=$'\t' read -r offset_row offset_name payload_offset header_offset \
                <<< "$(sed -n "$row"p "$verified")"
              test "$offset_row" = "$row" && test "$offset_name" = "$member"
              new_name="$member"
              source_object=-
              if test "$member" = util.cc.o; then
                case "$count" in
                  1) family=array; new_name=arrow-array-util-instance-1.o ;;
                  2) family=compute; new_name=arrow-compute-util-instance-2.o ;;
                  *) exit 1 ;;
                esac
                source_object="$build/third_party/arrow/src/arrow_ep-build/src/arrow/CMakeFiles/arrow_objlib.dir/$family/util.cc.o"
                source_file="$GITHUB_WORKSPACE/duckdb-upstream/submodules/arrow/cpp/src/arrow/$family/util.cc"
                test -s "$source_object" && test -s "$source_object.d" && test -s "$source_file"
                cmp "$slot/$member" "$source_object"
                if ! grep -Fq "$source_file" "$source_object.d"; then
                  grep -Fq "src/arrow/$family/util.cc" "$source_object.d"
                fi
                target="src/arrow/CMakeFiles/arrow_objlib.dir/$family/util.cc.o:"
                test "$(awk -v target="$target" -v source="$source_file" \
                  'index($0, target) == 1 && index($0, source) > 0 { n++ } END { print n+0 }' \
                  "$out/$condition-arrow-build.make")" -eq 1
                printf '%s\t%s\t%s\t%s\n' "$family" \
                  "$(sha256sum "$source_object" | cut -d ' ' -f 1)" \
                  "$(sha256sum "$source_object.d" | cut -d ' ' -f 1)" \
                  "$(sha256sum "$source_file" | cut -d ' ' -f 1)" \
                  >> "$out/$condition-arrow-source/joins.tsv"
                cp "$source_object" "$out/$condition-arrow-source/$family-util.o"
                cp "$source_object.d" "$out/$condition-arrow-source/$family-util.o.d"
                cp "$source_file" "$out/$condition-arrow-source/$family-util.cc"
                cmp "$source_object" "$out/$condition-arrow-source/$family-util.o"
                cmp "$source_object.d" "$out/$condition-arrow-source/$family-util.o.d"
                cmp "$source_file" "$out/$condition-arrow-source/$family-util.cc"
                mv "$slot/$member" "$slot/$new_name"
              fi
              payload="$slot/$new_name"
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$row" "$member" "$count" "$payload_offset" "$header_offset" \
                "$(sha256sum "$payload" | cut -d ' ' -f 1)" "$(stat -c %s "$payload")" \
                "$new_name" "$source_object" >> "$ledger"
              "$ar" qc "$clone" "$payload"
            done < "$members"
            "$ar" s "$clone"
            test "$(wc -l < "$ledger")" -eq "$((row + 1))"
            test "$(wc -l < "$out/$condition-arrow-source/joins.tsv")" -eq 2
            test "$(stat -c %s "$clone")" -le 83886080
            "$ar" t "$clone" > "$out/$condition-arrow-renamed-members.txt"
            test "$(wc -l < "$out/$condition-arrow-renamed-members.txt")" -eq "$row"
            test "$(grep -Fxc arrow-array-util-instance-1.o "$out/$condition-arrow-renamed-members.txt")" -eq 1
            test "$(grep -Fxc arrow-compute-util-instance-2.o "$out/$condition-arrow-renamed-members.txt")" -eq 1
            test "$(grep -Fxc util.cc.o "$out/$condition-arrow-renamed-members.txt" || true)" -eq 0
            while IFS=$'\t' read -r ledger_row member count payload_offset header_offset payload_sha bytes new_name source_object; do
              test "$(sed -n "$ledger_row"p "$out/$condition-arrow-renamed-members.txt")" = "$new_name"
              clone_count="$count"
              if test "$member" = util.cc.o; then clone_count=1; fi
              check="$staging/check-$ledger_row"
              mkdir "$check"
              (cd "$check" && "$ar" xN "$clone_count" "$clone" "$new_name")
              test "$(stat -c %s "$check/$new_name")" = "$bytes"
              test "$(sha256sum "$check/$new_name" | cut -d ' ' -f 1)" = "$payload_sha"
            done < <(tail -n +2 "$ledger")
            python3 - "$linklibs" "$token" "$clone" <<'PY'
          from pathlib import Path
          import sys
          path, token, replacement = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          data = path.read_text()
          assert data.split().count(token) == 1
          data = data.replace(token, replacement)
          assert data.split().count(replacement) == 1
          path.write_text(data)
          PY
            (cd "$build" && EM_CACHE="$cache" bash -euo pipefail -c \
              "$original_link -Wl,--why-extract=$out/$condition-arrow-renamed-why-extract.tsv") \
              > "$out/$condition-arrow-renamed-relink.log" 2>&1
            test -s "$out/$condition-arrow-renamed-why-extract.tsv"
            cp "$map" "$out/$condition-arrow-renamed.map"
            cmp "$build/duckdb_wasm.js" "$out/$condition.js"
            cmp "$build/duckdb_wasm.wasm" "$out/$condition.wasm"
            array=arrow-array-util-instance-1.o
            compute=arrow-compute-util-instance-2.o
            test "$(awk -F '\t' -v name="$array" 'NR > 1 && index($2, "(" name ")") > 0 { n++ } END { print n+0 }' \
              "$out/$condition-arrow-renamed-why-extract.tsv")" -eq 1
            test "$(awk -F '\t' -v name="$compute" 'NR > 1 && index($2, "(" name ")") > 0 { n++ } END { print n+0 }' \
              "$out/$condition-arrow-renamed-why-extract.tsv")" -eq 0
            grep -Fq "$clone($array)" "$out/$condition-arrow-renamed.map"
            if grep -Fq "$clone($compute)" "$out/$condition-arrow-renamed.map"; then exit 1; fi
            printf 'original_trace_js_wasm_map_byte_match=YES\nrenamed_relink_js_wasm_byte_match=YES\narray_instance_1=EXTRACTED_RETAINED\ncompute_instance_2=NOT_EXTRACTED\nproduct_admission=NO\n' \
              > "$out/$condition-arrow-instance-gate.txt"
            sha256sum "$original" "$clone" "$ledger" \
              "$out/$condition-arrow-original-why-extract.tsv" \
              "$out/$condition-arrow-renamed-why-extract.tsv" \
              "$out/$condition-arrow-renamed.map" \
              > "$out/$condition-arrow-instance.sha256"
            restore_arrow_link
            trap - EXIT
          done
          python3 - "$out/admission.txt" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1]).parent
          for condition in ('image', 'clean'):
              gate = (root / f'{condition}-arrow-instance-gate.txt').read_text()
              assert gate.count('renamed_relink_js_wasm_byte_match=YES\n') == 1
              assert gate.count('compute_instance_2=NOT_EXTRACTED\n') == 1
              assert (root / f'{condition}-arrow-original.a').is_file()
          path = root / 'admission.txt'
          data = path.read_text()
          old = 'arrow_original_member_instance=AMBIGUOUS\n'
          assert data.count(old) == 1
          path.write_text(data.replace(old,
              'arrow_original_member_instance=ARRAY_1_SELECTED_COMPUTE_2_UNSELECTED_EH_DIAGNOSTIC\n'))
          PY
      - name: Retain EH JS glue trace, includes and SDK generator superset
        if: ${{ matrix.variant == 'eh' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          python3 - "$out" "$EMSDK/upstream/emscripten" "$GITHUB_WORKSPACE/duckdb-upstream" <<'PY'
          from collections import defaultdict, deque
          import csv, gzip, hashlib, io, re, sys, tarfile
          from pathlib import Path
          out, sdk, upstream = map(lambda x: Path(x).resolve(), sys.argv[1:])
          src, tools = sdk / 'src', sdk / 'tools'
          stub = upstream / 'lib/js-stubs.js'
          notices = {
              'emscripten': sdk / 'LICENSE',
              'duckdb-wasm': upstream / 'LICENSE',
          }
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def sha(data): return hashlib.sha256(data).hexdigest()
          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def regular(path, limit=16777216, empty_ok=False):
              require(path.is_file() and not path.is_symlink(), f'not regular: {path}')
              size = path.stat().st_size
              require((size > 0 or empty_ok) and size <= limit,
                      f'empty or oversized input: {path}: {size}')
              return path.read_bytes()
          notice_bytes = {kind: regular(path) for kind, path in notices.items()}
          require(sha(notice_bytes['emscripten']) ==
                  '620a78084fc7ca97c0b5dea9abf891f3ffcadfdbf305276f099c9c4e12fc1d86',
                  'pinned Emscripten notice drift')
          require(sha(notice_bytes['duckdb-wasm']) ==
                  '3ad73e53243c374756dfc2eb5e780abd462ce99e89c84f9e46ada745db934107',
                  'pinned DuckDB-Wasm notice drift')
          ledger_path = Path('legal-ledger/.github/receipts/duckdb-eh-js-glue-observed-v2.tsv')
          ledger_bytes = regular(ledger_path)
          require(sha(ledger_bytes) ==
                  '58f8a95afeb3d41499dd89bb37a00f8b1dbab99a78da39a5fc7e9cb56b9604ca',
                  'observed glue ledger drift')
          ledger_text = ledger_bytes.decode('utf-8')
          require('\r' not in ledger_text and '\x00' not in ledger_text,
                  'unsafe ledger bytes')
          ledger_rows = list(csv.DictReader(io.StringIO(ledger_text), delimiter='\t'))
          columns = ('path', 'observed_role', 'sha256', 'origin', 'header_evidence',
                     'selected_license', 'notice_path', 'notice_sha256',
                     'association_status', 'official_commit', 'official_source_blob',
                     'official_notice_blob', 'provenance_status')
          require(len(ledger_rows) == 36 and
                  tuple(ledger_rows[0]) == columns and
                  all(None not in row and None not in row.values() for row in ledger_rows),
                  'observed glue ledger schema/count mismatch')
          ledger = {row['path']: row for row in ledger_rows}
          require(len(ledger) == 36, 'duplicate observed glue ledger path')
          emsdk_origin = ('emscripten/emsdk:3.1.48@sha256:'
                          'c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29')
          duckdb_origin = 'duckdb/duckdb-wasm@f955138e5218942fb3fb097a8fdcb725222406ff'
          repo_scope = {
              'emscripten/src/library_math.js': (
                  'NO_FILE_HEADER_PINNED_REPO_HISTORY', 'REPO_SCOPE_MIT_REVIEWED',
                  'e967e20b4727956a30592165a3c1cde5c67fa0a8',
                  'c971124f4db689c2b09d1fa0dd1d662731485cee',
                  '70cabe388d27da221bd769c50b427a35354f4f1d',
                  'TRACKED_SOURCE'),
              'emscripten/src/library_sigs.js': (
                  'GENERATED_NO_FILE_HEADER_PINNED_REPO',
                  'REPO_SCOPE_MIT_GENERATOR_PROVENANCE_PENDING',
                  'e967e20b4727956a30592165a3c1cde5c67fa0a8',
                  '8e708f4510494d07b002bb606c9046a686417906',
                  '70cabe388d27da221bd769c50b427a35354f4f1d',
                  'GENERATOR_INPUT_REPLAY_UNPROVEN'),
              'duckdb-wasm/lib/js-stubs.js': (
                  'NO_FILE_HEADER_PINNED_REPO_HISTORY', 'REPO_SCOPE_MIT_REVIEWED',
                  'f955138e5218942fb3fb097a8fdcb725222406ff',
                  'e11e070fedc1d962fea4cacd0b2f00d2d3857ed8',
                  'a79d955f7d91b5679f49f78aad20f7834b50c8bb',
                  'TRACKED_SOURCE'),
          }
          require(src.is_dir() and tools.is_dir(), 'SDK generator roots missing')
          expected = {src / 'arrayUtils.js', src / 'IDBStore.js'}
          include_pattern = re.compile(r'^\s*#include\s+["<]([^">]+)[">]\s*$', re.M)
          for condition in ('image', 'clean'):
              lines = (out / f'{condition}-js-glue-bill.txt').read_text().splitlines()
              require(len(lines) == 68, f'{condition} trace event count drift')
              roles = defaultdict(set)
              for line in lines:
                  if line.startswith('processing system library: '):
                      name = line.removeprefix('processing system library: ')
                      require(name and not name.startswith('/') and '..' not in
                              Path(name).parts, f'unsafe SDK trace path: {name}')
                      candidate = src / name
                      require(not candidate.is_symlink(), f'SDK trace symlink: {candidate}')
                      path = candidate.resolve()
                      require(path.is_relative_to(src), f'SDK trace escaped src: {path}')
                  elif line.startswith('processing user library: '):
                      path = Path(line.removeprefix('processing user library: ')).resolve()
                      require(path == stub, f'unexpected user library: {path}')
                  else:
                      raise SystemExit(f'unaccounted glue trace line: {line}')
                  regular(path)
                  roles[path].add('TRACE')
              require(len(roles) == 34 and stub in roles, 'unique traced library count drift')
              queue = deque(roles)
              visited = set()
              edges = []
              while queue:
                  path = queue.popleft()
                  if path in visited: continue
                  visited.add(path)
                  body = regular(path).decode('utf-8')
                  raw_directives = re.findall(r'^\s*#include\b.*$', body, re.M)
                  includes = include_pattern.findall(body)
                  require(len(raw_directives) == len(includes),
                          f'unparsed include directive: {path}')
                  for name in includes:
                      require(name and not name.startswith('/') and '..' not in
                              Path(name).parts, f'unsafe include: {path}: {name}')
                      candidate = path.parent / name
                      require(not candidate.is_symlink(), f'include symlink: {candidate}')
                      child = candidate.resolve()
                      require(child.is_relative_to(src), f'include escaped SDK src: {child}')
                      regular(child)
                      roles[child].add('TRANSITIVE_INCLUDE')
                      edges.append((path, child))
                      queue.append(child)
              require(expected <= roles.keys() and all('TRANSITIVE_INCLUDE' in
                      roles[path] for path in expected), 'known transitive includes absent')
              observed = {}
              for path, flags in roles.items():
                  if not ({'TRACE', 'TRANSITIVE_INCLUDE'} & flags): continue
                  if path.is_relative_to(sdk):
                      rel = 'emscripten/' + str(path.relative_to(sdk))
                      origin = emsdk_origin
                      notice_kind = 'emscripten'
                  else:
                      require(path == stub, f'unexpected observed user source: {path}')
                      rel = 'duckdb-wasm/lib/js-stubs.js'
                      origin = duckdb_origin
                      notice_kind = 'duckdb-wasm'
                  observed[rel] = path
                  require(rel in ledger, f'ledger missing observed source: {rel}')
                  row = ledger[rel]
                  data = regular(path)
                  head = data[:2048].decode('utf-8', errors='replace')
                  spdx = re.search(r'SPDX-License-Identifier:\s*([^\s*]+)', head)
                  selected_role = 'TRACE' if 'TRACE' in flags else 'TRANSITIVE_INCLUDE'
                  require(row['observed_role'] == selected_role and
                          row['sha256'] == sha(data) and row['origin'] == origin,
                          f'ledger role/source/origin drift: {rel}')
                  if rel in repo_scope:
                      evidence, status, commit, source_blob, notice_blob, provenance = repo_scope[rel]
                      require(spdx is None and row['header_evidence'] == evidence and
                              row['selected_license'] == 'MIT' and
                              row['notice_path'] == notice_kind + '/LICENSE' and
                              row['notice_sha256'] == sha(notice_bytes[notice_kind]) and
                              row['association_status'] == status and
                              row['official_commit'] == commit and
                              row['official_source_blob'] == source_blob == git_blob(data) and
                              row['official_notice_blob'] == notice_blob ==
                              git_blob(notice_bytes[notice_kind]) and
                              row['provenance_status'] == provenance,
                              f'pinned repository-scope evidence mismatch: {rel}')
                  else:
                      require(spdx is not None and spdx.group(1) == 'MIT' and
                              row['header_evidence'] == 'EARLY_SPDX_MIT' and
                              row['selected_license'] == 'MIT' and
                              row['notice_path'] == notice_kind + '/LICENSE' and
                              row['notice_sha256'] == sha(notice_bytes[notice_kind]) and
                              row['association_status'] == 'HEADER_NOTICE_REVIEWED' and
                              all(row[key] == 'NOT_APPLICABLE' for key in columns[-4:]),
                              f'header/notice association mismatch: {rel}')
              require(len(observed) == 36 and set(observed) == set(ledger),
                      'observed glue paths do not exactly match versioned ledger')
              # This is a bounded conservative SDK-source superset, not a
              # claim that emcc disclosed every generator read at runtime.
              for root in (src, tools):
                  for path in sorted(root.rglob('*')):
                      require(not path.is_symlink(), f'SDK superset symlink: {path}')
                      if path.is_file():
                          roles[path].add('SDK_GENERATOR_SUPERSET')
              for path in (sdk / 'emcc.py', sdk / 'em++.py', *notices.values(), stub):
                  regular(path)
                  roles[path].add('NOTICE_TEXT' if path in notices.values() else
                                  'USER_STUB' if path == stub else 'SDK_GENERATOR_SUPERSET')
              require(len(roles) <= 10000, 'SDK superset file count exceeded')
              rows = []
              total = 0
              archive = out / f'{condition}-js-generator-superset.tar.gz'
              with archive.open('wb') as sink, gzip.GzipFile(
                      fileobj=sink, mode='wb', filename='', mtime=0) as compressed, \
                      tarfile.open(fileobj=compressed, mode='w') as tar:
                  for path in sorted(roles):
                      empty_ok = roles[path] == {'SDK_GENERATOR_SUPERSET'}
                      data = regular(path, empty_ok=empty_ok)
                      total += len(data)
                      require(total <= 134217728, 'SDK generator superset exceeds 128 MiB')
                      if path.is_relative_to(sdk):
                          kind = 'emscripten'
                          rel = 'emscripten/' + str(path.relative_to(sdk))
                      else:
                          require(path in (stub, notices['duckdb-wasm']),
                                  f'unaccounted superset path: {path}')
                          kind = 'duckdb-wasm'
                          rel = ('duckdb-wasm/lib/js-stubs.js' if path == stub else
                                 'duckdb-wasm/LICENSE')
                      head = data[:2048].decode('utf-8', errors='replace')
                      spdx = re.search(r'SPDX-License-Identifier:\s*([^\s*]+)', head)
                      info = tarfile.TarInfo(rel)
                      info.size = len(data)
                      info.mode = 0o644
                      info.mtime = 0
                      tar.addfile(info, io.BytesIO(data))
                      association = (ledger[rel]['association_status'] if rel in observed else
                                     'TOP_LEVEL_NOTICE_CANDIDATE_UNREVIEWED')
                      rows.append((rel, ','.join(sorted(roles[path])), str(len(data)),
                          sha(data), kind + '/LICENSE', sha(notice_bytes[kind]),
                          spdx.group(1) if spdx else 'NO_EARLY_SPDX_HEADER',
                          association))
              manifest = out / f'{condition}-js-generator-superset.tsv'
              manifest.write_text('path\troles\tbytes\tsha256\tnotice_path\tnotice_sha256\tspdx\tnotice_join_status\n' +
                                  ''.join('\t'.join(row) + '\n' for row in rows))
              (out / f'{condition}-js-transitive-includes.tsv').write_text(
                  'parent\tchild\n' + ''.join(
                      f'{parent}\t{child}\n' for parent, child in sorted(set(edges))))
              with tarfile.open(archive, 'r:gz') as check:
                  members = check.getmembers()
                  require(len(members) == len(rows) and
                          [member.name for member in members] ==
                          [row[0] for row in rows], 'superset archive manifest mismatch')
                  for member, row in zip(members, rows):
                      require(sha(check.extractfile(member).read()) == row[3],
                              f'superset tar byte mismatch: {member.name}')
              (out / f'{condition}-js-generator-scope.txt').write_text(
                  'scope=TRACE_PLUS_TRANSITIVE_INCLUDES_PLUS_SDK_SRC_TOOLS_SUPERSET\n'
                  f'trace_events={len(lines)}\nunique_traced_libraries=34\n'
                  f'transitive_include_edges={len(set(edges))}\n'
                  f'retained_files={len(rows)}\nretained_source_bytes={total}\n'
                  f'superset_archive_sha256={sha(archive.read_bytes())}\n'
                  'generator_input_closure=UNPROVEN\n'
                  'source_to_notice_join=TOP_LEVEL_CANDIDATE_UNREVIEWED\n'
                  'glue_legal_admission=NO\nproduct_admission=NO\n')
              (out / f'{condition}-js-glue-legal-review.txt').write_text(
                  'ledger_version=duckdb-eh-js-glue-observed-v2\n'
                  f'ledger_sha256={sha(ledger_bytes)}\n'
                  'observed_paths=36\nheader_notice_reviewed=33\n'
                  'repo_scope_mit_reviewed=2\n'
                  'repo_scope_mit_generator_provenance_pending=1\n'
                  'superset_only_promoted=0\n'
                  'generator_input_closure=UNPROVEN\n'
                  'glue_legal_admission=NO\nproduct_admission=NO\n')
          PY
          test -s "$out/image-js-generator-scope.txt"
          test -s "$out/clean-js-generator-scope.txt"
          printf 'js_generator_superset=RETAINED_DIAGNOSTIC\njs_generator_input_closure=UNPROVEN\n' \
            >> "$out/admission.txt"
      - name: Classify same-run bytes and immutable custody
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          image_cache="$EMSDK/upstream/emscripten/cache"
          variant='${{ matrix.variant }}'
          case "$variant" in
            mvp) expected=8; names=(libc++.a libc++abi.a libc.a libcompiler_rt.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a) ;;
            eh) expected=9; names=(libc++-except.a libc++abi-except.a libc.a libcompiler_rt-wasm-sjlj.a libdlmalloc.a libnoexit.a libsockets.a libstubs.a libunwind-except.a) ;;
            *) exit 1 ;;
          esac
          test -s "$out/image.js" && test -s "$out/clean.js"
          test -s "$out/image.wasm" && test -s "$out/clean.wasm"
          find "$image_cache" -type f -name '*.a' -print0 | sort -z | xargs -0 -r sha256sum > "$out/image-cache-after.sha256"
          if cmp -s "$out/image-cache-before.sha256" "$out/image-cache-after.sha256"; then
            printf 'image_cache_archive_inventory_stable=YES\n' >> "$out/cache-source.txt"
          else
            printf 'image_cache_archive_inventory_stable=NO\n' >> "$out/cache-source.txt"
          fi
          : > "$out/archive-pair-classification.tsv"
          for name in "${names[@]}"; do
            image_hash="$(sha256sum "$out/image-bytes/$name" | cut -d ' ' -f 1)"
            clean_hash="$(sha256sum "$out/clean-bytes/$name" | cut -d ' ' -f 1)"
            if test "$image_hash" = "$clean_hash"; then verdict=MATCH; else verdict=DIFF_SAME_RUN_BYTES_RETAINED; fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$image_hash" "$clean_hash" "$verdict" >> "$out/archive-pair-classification.tsv"
          done
          if cmp -s "$out/image-js-glue-source.tsv" "$out/clean-js-glue-source.tsv"; then
            printf 'glue_source_hash_bill=MATCH\n' > "$out/glue-pair-classification.txt"
          else
            printf 'glue_source_hash_bill=DIFF_SAME_RUN_BYTES_RETAINED\n' > "$out/glue-pair-classification.txt"
          fi
          if cmp -s "$out/image-js-glue-bill.txt" "$out/clean-js-glue-bill.txt"; then
            printf 'glue_link_selection_bill=MATCH\n' >> "$out/glue-pair-classification.txt"
          else
            printf 'glue_link_selection_bill=DIFF_SAME_RUN_BYTES_RETAINED\n' >> "$out/glue-pair-classification.txt"
          fi
          custody_wasm="custody/duckdb-runtime/duckdb-$variant.wasm"
          custody_hash="$(sha256sum "$custody_wasm" | cut -d ' ' -f 1)"
          : > "$out/classification.tsv"
          for condition in image clean; do
            actual="$(sha256sum "$out/$condition.wasm" | cut -d ' ' -f 1)"
            if test "$actual" = "$custody_hash"; then verdict=MATCH; else verdict=DIFF; fi
            printf '%s\t%s\t%s\t%s\n' "$condition" "duckdb-$variant.wasm" "$actual" "$verdict" >> "$out/classification.tsv"
          done
          for asset in duckdb-browser.mjs duckdb-browser-mvp.worker.js duckdb-browser-eh.worker.js; do
            printf 'native-link\t%s\tN/A\tINCOMPARABLE_NATIVE_GLUE_VS_BROWSER_ASSET\n' "$asset" >> "$out/classification.tsv"
          done
          for kind in js wasm; do
            if cmp -s "$out/image.$kind" "$out/clean.$kind"; then verdict=MATCH; else verdict=DIFF; fi
            printf 'image_vs_clean\tduckdb_wasm.%s\tN/A\t%s\n' "$kind" "$verdict" >> "$out/classification.tsv"
          done
          # Preserve the B678 archive hashes as a historical reference only.
          # A new clean build cannot recover B678's omitted physical bytes.
          printf '%s\n' \
            'mvp libc++.a adcc1b705ea6b54edeb8480e9183172356d77fee43b12fde718c33f56f0d803b' \
            'mvp libc++abi.a d6b9298c3c0651591843a38c8bbc0cd7402786f8e8196a60cd6c5686b4e696f4' \
            'mvp libc.a 7e6af4b09ec027ba28034482fc46b6316bab24e466d137ae96b9ab2b5c83d01f' \
            'mvp libcompiler_rt.a 6c6dc176c816faa8e942e9839b4d7df4b94af071489657ac1585f8891c8fcb18' \
            'mvp libdlmalloc.a be1a34621edf0bd32f17b100c3c35a45778c1d967fe189286dbb42d058720a5d' \
            'mvp libnoexit.a dadb42e9b0d69d891a72dc756ade75f3726b8e2eb49d2aed09c59c7a2e7e1a47' \
            'mvp libsockets.a 63a41d8e131188acf229993f5db28bf7313f317c3e233d53a9f1730e31d9b504' \
            'mvp libstubs.a 36a4c790708740796e5d4e09a7cc3050adb177fdb037138170e9d5d3cbe5d229' \
            'eh libc++-except.a 37809212bdd9b8fa860cf117b350d85faafaf1ff805c08cebec97ed2d25db37b' \
            'eh libc++abi-except.a 3265aefb7dd7eb87165c99e6d1dd6ce6b6ee7ffffeb6c498797777dc4c3161e6' \
            'eh libc.a 7e6af4b09ec027ba28034482fc46b6316bab24e466d137ae96b9ab2b5c83d01f' \
            'eh libcompiler_rt-wasm-sjlj.a 4812ec1f0cf5c75362d00884a70109c5960043e9dc19ca16ffacab47f703f0b8' \
            'eh libdlmalloc.a be1a34621edf0bd32f17b100c3c35a45778c1d967fe189286dbb42d058720a5d' \
            'eh libnoexit.a dadb42e9b0d69d891a72dc756ade75f3726b8e2eb49d2aed09c59c7a2e7e1a47' \
            'eh libsockets.a 63a41d8e131188acf229993f5db28bf7313f317c3e233d53a9f1730e31d9b504' \
            'eh libstubs.a 36a4c790708740796e5d4e09a7cc3050adb177fdb037138170e9d5d3cbe5d229' \
            'eh libunwind-except.a ccf519e5c1485e91ab14f6fd69808337cb5228b56597a5c1b5d6a33a00ad7892' \
            > "$out/b678-warm-reference.txt"
          : > "$out/b678-warm-comparison.tsv"
          while IFS=$'\t' read -r name path hash; do
            test -s "$path"
            expected_hash="$(awk -v variant="$variant" -v name="$name" '$1 == variant && $2 == name { print $3 }' "$out/b678-warm-reference.txt")"
            test -n "$expected_hash"
            if test "$hash" = "$expected_hash"; then verdict=MATCH; else verdict=DIFF_SAME_RUN_BYTES_RETAINED; fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$hash" "$expected_hash" "$verdict" >> "$out/b678-warm-comparison.tsv"
          done < "$out/image-prebuild.tsv"
          test "$(wc -l < "$out/b678-warm-comparison.tsv")" -eq "$expected"
          printf 'archive_payload_classification=PAIRED_BYTES_RETAINED_NOT_YET_AUDITED\nexact_custody_output=DIAGNOSTIC_ONLY\nproduct_admission=NO\n' >> "$out/admission.txt"
      - name: Enforce bounded receipt on every outcome
        id: budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combined-custody"
          mkdir -p "$out"
          cap=419430400
          printf 'product_admission=NO\nreceipt_budget_bytes=%s\n' "$cap" > "$out/budget.txt"
          bytes="$(du -sb "$out" | cut -f 1)"
          printf 'candidate_bytes=%s\n' "$bytes" >> "$out/budget.txt"
          bytes="$(du -sb "$out" | cut -f 1)"
          if test "$bytes" -le "$cap"; then
            printf 'upload=true\n' >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/combined-over-budget"
            printf 'receipt_upload=NO\nobserved_bytes=%s\ncap_bytes=%s\nproduct_admission=NO\n' \
              "$bytes" "$cap" > "$RUNNER_TEMP/combined-over-budget/budget.txt"
            printf 'over_budget=true\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Retain bounded diagnostic receipt
        if: ${{ always() && steps.budget.outputs.upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-combined-custody-${{ matrix.variant }}
          path: ${{ runner.temp }}/combined-custody/
          if-no-files-found: error
          retention-days: 14
      - name: Retain over-budget refusal
        if: ${{ always() && steps.budget.outputs.over_budget == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-combined-over-budget-${{ matrix.variant }}
          path: ${{ runner.temp }}/combined-over-budget/
          if-no-files-found: error
          retention-days: 14
