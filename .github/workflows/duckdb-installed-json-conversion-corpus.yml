          assert len(embedded_by_key) == len(embedded['assets'])
          bill_assets = {item['path']: item['sha256'] for item in package_bill['assets']}
          assert len(bill_assets) == 5
          expected_assets = {'duckdb-browser.mjs', 'duckdb-browser-mvp.worker.js',
                             'duckdb-browser-eh.worker.js', 'duckdb-mvp.wasm',
                             'duckdb-eh.wasm'}
          assert set(p.name for p in source_assets.iterdir()) == expected_assets
          assert set(p.name for p in dist_assets.iterdir()) == expected_assets
          assert set(bill_assets) == {f'duckdb-runtime/{name}' for name in expected_assets}
          expected_wasm = {
              'image': 'ac2022967687136ec63c8917d77842f3c01f69291d2d024626e42a34d17953b8',
              'clean': 'd267671286a6f0718a6fe1d712cd209bda84ef53f5984d0303defeb55c9f5d99',
