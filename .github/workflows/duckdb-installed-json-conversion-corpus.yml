                          ('surface', 'component', 'source_url', 'file'))
              assert key not in seen_attributions
              seen_attributions.add(key)
              assert attribution['license_or_role'].strip()
              assert text_digests[attribution['file']] == attribution['source_sha256']
          assert len(seen_attributions) == 39
          for old in ('DuckDB-Wasm-MIT.txt', 'Apache-Arrow-13-LICENSE.txt',
                      'Apache-Arrow-13-NOTICE.txt', 'tslib-0BSD.txt',
                      'tslib-CopyrightNotice.txt', 'FlatBuffers-LICENSE.txt',
                      'js-sha256-MIT.txt', 'duckdb-runtime-bill.json'):
              assert not (source_ui / old).exists()
