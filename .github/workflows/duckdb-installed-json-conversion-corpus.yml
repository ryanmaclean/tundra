      - name: Retain same-build installed DuckDB notice and asset custody
        shell: bash
        env:
          EH_CONDITION: ${{ matrix.condition }}
          EH_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PYNOTICE'
          import hashlib, json, os, shutil
          from pathlib import Path, PurePosixPath

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, f'duplicate JSON key: {key}'
                  result[key] = value
              return result

          temp = Path(os.environ['RUNNER_TEMP'])
          receipt = temp / 'eh-semantic'
          root = temp / 'deb-root'
          source_ui = Path('app/tauri/third-party-licenses/ui')
          source_assets = Path('app/leptos-ui/duckdb-runtime')
          dist_assets = Path('app/leptos-ui/dist/duckdb-runtime')
          debs = list(Path('target/release/bundle/deb').glob('*.deb'))
          bin_candidates = list(root.rglob('auto-tundra'))
          bins = [path for path in bin_candidates
                  if path.is_file() and not path.is_symlink()]
          assert len(debs) == 1, f'expected one built installer; found {len(debs)}'
          assert len(bins) == 1, (
              f'expected one regular non-symlink installed auto-tundra binary; '
              f'found {len(bins)} among {len(bin_candidates)} named paths')
          deb, binary = debs[0], bins[0]
          assert binary.is_file() and not binary.is_symlink()
          recorded = [line.split(maxsplit=1) for line in
                      (receipt / 'installer.sha256').read_text().splitlines()]
          assert len(recorded) == 2
          assert recorded == [[sha(deb), str(deb)], [sha(binary), str(binary)]]

          bill_source = receipt / 'pinned-pr119-selected-bill.json'
          package_source = source_ui / 'duckdb-runtime-selected-bill.json'
          bill_matches = list(root.rglob('duckdb-runtime-selected-bill.json'))
          assert len(bill_matches) == 1
          bill_installed = bill_matches[0]
          assert bill_installed.is_file() and not bill_installed.is_symlink()
          resource_suffix = ('third-party-licenses', 'ui',
                             'duckdb-runtime-selected-bill.json')
          assert bill_installed.relative_to(root).parts[-len(resource_suffix):] == resource_suffix
          assert bill_installed.read_bytes() == package_source.read_bytes()
          prebundle = (receipt / 'prebundle-selected-bill.sha256').read_text().splitlines()
          assert len(prebundle) == 1
          assert prebundle[0].split(maxsplit=1) == [sha(bill_installed), str(package_source)]
          bill_hash = sha(bill_source)
          assert bill_hash == '34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790'
          bill = json.loads(bill_source.read_bytes(), object_pairs_hook=unique_object)
          assert bill['schema'] == 'tundra-duckdb-selected-notice-bill/v2'
          assert bill['admission'] == 'NO' and bill['profiles'] == ['default', 'sounds']
          assert len(bill['assets']) == 5 and len(bill['attributions']) == 38
          assert len(bill['texts']) == 36
          assert len(bill['unresolved']) >= 2
          package_bill = json.loads(bill_installed.read_bytes(), object_pairs_hook=unique_object)
          producer_bill_bytes = (receipt / 'producer-selected-bill.json').read_bytes()
          assert hashlib.sha256(producer_bill_bytes).hexdigest() == os.environ['PRODUCER_BILL_SHA256']
          producer_bill = json.loads(producer_bill_bytes, object_pairs_hook=unique_object)
          selected_outputs = [row for row in producer_bill['condition_outputs']
                              if row['condition'] == os.environ['EH_CONDITION']]
          assert len(selected_outputs) == 1
          assert package_bill['schema'] == 'tundra-duckdb-installed-json-package-selected-bill/v5'
          assert package_bill['admission'] == package_bill['notice_graph_complete'] == 'NO'
          assert package_bill['selected_dependency_inventory_admission'] == 'NO'
          assert package_bill['source_build_admission'] == package_bill['glue_legal_admission'] == 'NO'
          assert package_bill['selected_graph_exhaustive'] == package_bill['legal_admission'] == 'NO'
          assert package_bill['generator_input_closure'] == 'UNPROVEN'
          assert package_bill['full_EH_semantics'] == package_bill['product_fleet_admission'] == 'NO'
          assert package_bill['json_selected_archive_bytes'] == 'RETAINED_BOUNDED'
          assert package_bill['producer_head'] == os.environ['PRODUCER_HEAD']
          assert package_bill['producer_run'] == int(os.environ['PRODUCER_RUN'])
          assert package_bill['producer_attempt'] == int(os.environ['PRODUCER_ATTEMPT'])
          assert package_bill['producer_artifact_id'] == int(os.environ['PRODUCER_ARTIFACT_ID'])
          assert package_bill['producer_artifact_digest'] == 'sha256:' + os.environ['PRODUCER_ZIP_SHA256']
          assert package_bill['producer_zip_sha256'] == os.environ['PRODUCER_ZIP_SHA256']
          assert package_bill['producer_bill_sha256'] == os.environ['PRODUCER_BILL_SHA256']
          assert package_bill['condition_output'] == selected_outputs[0]
          assert package_bill['condition'] == os.environ['EH_CONDITION']
          assert package_bill['profile'] == os.environ['EH_PROFILE']
          assert package_bill['consumer_head'] == os.environ['CONSUMER_HEAD']
          assert package_bill['pinned_pr119_input_bill_sha256'] == bill_hash
          assert package_bill['attributions'][:38] == bill['attributions']
          assert package_bill['texts'][:36] == bill['texts']
          assert len(package_bill['attributions']) == 39 and len(package_bill['texts']) == 37
          assert package_bill['historical_notice_rows'] == {
              'attributions':39,'texts':37,'graph_closure':'NO'}
          joins = package_bill['selected_notice_joins']
          assert len(joins) == len({item['key'] for item in joins}) == 71
          assert len(package_bill['selected_unresolved_keys']) == 35
          assert sorted(package_bill['selected_unresolved_keys']) == sorted(
              item['key'] for item in joins if item['installed_notice_status'] != 'NOTICE_BYTES_MATCH')
          yy = package_bill['attributions'][-1]
          assert yy['component'] == 'yyjson' and yy['license_or_role'] == 'MIT'
          assert yy['source_sha256'] == '45e384d3d52c73cba3a64d6e6c25d47cd738cd8a55c30629e3201046eda62947'
          assert package_bill['texts'][-1] == {'file': yy['file'], 'sha256': yy['source_sha256']}
          text_prefix = 'third-party-licenses/ui/duckdb-runtime/'
          text_names = []
          text_digests = {}
          raw = receipt / 'installed-notice-bytes'
          raw.mkdir()
          for entry in package_bill['texts']:
              path = entry['file']
              relative = PurePosixPath(path)
              assert path.startswith(text_prefix) and len(relative.parts) == 4
              assert relative.name not in ('', '.', '..') and '\\' not in path
              assert path not in text_digests
              src = Path('app/tauri') / path
              installed = bill_installed.parent / 'duckdb-runtime' / relative.name
              assert src.is_file() and not src.is_symlink()
              assert installed.is_file() and not installed.is_symlink()
              assert src.read_bytes() == installed.read_bytes()
              assert sha(src) == entry['sha256']
              shutil.copyfile(installed, raw / relative.name)
              text_names.append(relative.name)
              text_digests[path] = entry['sha256']
          assert len(set(text_names)) == 37
          for item in joins:
              if item['installed_notice_status'] == 'SOURCE_OR_NOTICE_UNRESOLVED':
                  assert item['installed_notice_path'] == 'UNRESOLVED'
                  assert item['source_notice_sha256'] == 'UNRESOLVED'
              else:
                  path = item['installed_notice_path']
                  assert path in text_digests
                  assert text_digests[path] == item['source_notice_sha256'] == item['installed_notice_sha256']
                  assert sha(raw / PurePosixPath(path).name) == item['installed_notice_sha256']
                  if item['installed_notice_status'] == 'NOTICE_BYTES_MATCH_GENERATOR_PROVENANCE_PENDING':
                      assert item['producer_status'] == 'REPO_SCOPE_MIT_GENERATOR_PROVENANCE_PENDING'
              if item['attribution_install_status'] == 'HEADER_BYTES_RETAINED_NOT_INSTALLED':
                  assert item['family'] == 'json' and item['attribution_sha256'] == '69500ac662c5f22bdeb76fba7e881135eac07fafccd9ce9ffec5b47503f38ed1'
          expected = set(text_names)
          for directory in (source_ui / 'duckdb-runtime',
                            bill_installed.parent / 'duckdb-runtime', raw):
              assert directory.is_dir() and not directory.is_symlink()
              assert {p.name for p in directory.iterdir()} == expected
              assert all(p.is_file() and not p.is_symlink() for p in directory.iterdir())
          seen_attributions = set()
          for attribution in package_bill['attributions']:
