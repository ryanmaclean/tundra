          assets = {}
          for name in sorted(expected_assets):
              key = f'duckdb-runtime/{name}'
              src, dist = source_assets / name, dist_assets / name
              assert src.is_file() and dist.is_file()
              assert not src.is_symlink() and not dist.is_symlink()
              assert src.read_bytes() == dist.read_bytes()
              digest = sha(src)
              assert digest == bill_assets[key]
              if name == 'duckdb-eh.wasm':
                  assert digest == expected_wasm
              elif name != 'duckdb-browser-eh.worker.js':
                  assert digest == {item['path']: item['sha256'] for item in bill['assets']}[key]
              entry = embedded_by_key[key]
              assert entry['transform'] == 'identity'
              assert entry['dist_sha256'] == entry['embedded_sha256'] == digest
              assert entry['dist_bytes'] == entry['embedded_bytes'] == src.stat().st_size
              assets[key] = digest
          (receipt / 'installed-five-assets.tsv').write_text(''.join(
              f'{digest}\t{key}\n' for key, digest in sorted(assets.items())))
          producer = temp / 'eh-input/input'
          condition = os.environ['EH_CONDITION']
          selected = []
          for line in (producer / f'{condition}-sdk-archives.tsv').read_text().splitlines():
              name, archive_hash, member_list_hash = line.split('\t')
