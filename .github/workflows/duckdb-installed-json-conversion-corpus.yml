      - name: Run forced EH in installed WebKitGTK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bins < <(find "$RUNNER_TEMP/deb-root" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          elf_sha="$(sha256sum "${bins[0]}" | cut -d ' ' -f1)"
          home="$RUNNER_TEMP/eh-smoke-home"
          mkdir -p "$home/home" "$home/config" "$home/data" "$home/cache"
          set +e
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            env HOME="$home/home" XDG_CONFIG_HOME="$home/config" \
              XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" \
              TUNDRA_SMOKE_HEAD_SHA="$CONSUMER_HEAD" \
              TUNDRA_SMOKE_PROFILE='${{ matrix.profile }}' \
              TUNDRA_SMOKE_VARIANT=eh TUNDRA_SMOKE_ELF_SHA256="$elf_sha" \
              http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
              HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              NO_PROXY=localhost,127.0.0.1,tauri.localhost \
            timeout 150s "${bins[0]}" --smoke-duckdb eh \
            > "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            2> "$RUNNER_TEMP/eh-semantic/webkit.stderr"
          status=$?
          set -e
          printf 'exit_status=%s\ninstalled_elf_sha256=%s\n' "$status" "$elf_sha" \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
          awk 'index($0, "TUNDRA_DUCKDB_SMOKE:") == 1 {
            print substr($0, length("TUNDRA_DUCKDB_SMOKE:") + 1)
          }' "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            > "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$(wc -l < "$RUNNER_TEMP/eh-semantic/webkit.json")" -eq 1
          jq -e --arg head "$CONSUMER_HEAD" --arg elf "$elf_sha" \
            --arg profile '${{ matrix.profile }}' '
            .schema == "tundra-duckdb-webkit-smoke/v1" and
            .head_sha == $head and .profile == $profile and
            .installed_elf_sha256 == $elf and .requested_variant == "eh" and
            .result.variant == "eh" and .ok == true and .result.ok == true and
            .result.exceptionOk == true and .result.cspDenied == true and
            .result.cspViolations == [] and .result.localRuntime == true and
            .result.remoteRequests == 0 and
            (.result.semanticObserved | fromjson | .sameConnection and .recovery and
              .targetedPathsOk and
              (.cases | length == 9)) and
            (.result.corpusObserved | fromjson |
              .schema == "tundra-installed-eh-corpus/v1" and
              .directConnection == "SEPARATE_SAME_INSTALLED_PAIR" and
              (.cases | length == 32) and
              (.cases | map(.id) | sort) == (["bridge-create", "bridge-json-insert",
                "bridge-empty-insert", "bridge-persist-null-utf8", "bridge-macro-create",
                "bridge-macro-query", "bridge-parser-error", "bridge-parser-recovery",
                "bridge-catalog-error", "bridge-catalog-recovery", "bridge-binder-error",
                "bridge-conversion-error", "bridge-after-errors", "bridge-arrow-json-types",
                "bridge-large-bigint-string", "installed-local-pair-urls",
                "installed-local-pair-bytes", "direct-arrow-schema", "direct-csv-register",
                "direct-csv-scan", "direct-csv-insert", "direct-json-register",
                "direct-json-scan", "direct-json-insert", "direct-parquet-copy",
                "direct-parquet-buffer", "direct-parquet-reregister", "direct-parquet-scan",
                "direct-file-error", "direct-after-error", "direct-arrow-invalid-ipc",
                "direct-after-arrow-error"] | sort) and
              all(.cases[]; (.passed | type) == "boolean" and
                (.skipped // false) == false and (.unsupported // false) == false) and
              (.passed | type) == "boolean" and
              .passed == all(.cases[]; .passed == true) and
              .skipped == [] and
              (.unsupported | sort) == ["arrow-positive-ipc", "multibatch-stream", "upstream-full-suite"])' "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$status" -eq 0
          printf 'installed_native_js_pair=SAME_RUN_WORKER_REBUILT_AND_INSTALLED\n' \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
      - name: Retain installed corpus environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYENV'
          import hashlib, json, os, pathlib, subprocess
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / 'eh-semantic'
          webkit = json.loads((receipt / 'webkit.json').read_text())
          custody = json.loads((receipt / 'installed-legal-custody.json').read_text())
          profile = '${{ matrix.profile }}'
          assert webkit['profile'] == custody['profile'] == profile
          assert webkit['head_sha'] == custody['consumer_head'] == 'ad0df7182cd4c9ea4a83bac04e5901de0218d9d0'
          version = subprocess.check_output(['dpkg-query', '-W', '-f=${Version}', 'libwebkit2gtk-4.1-0'], text=True).strip()
          harness = hashlib.sha256(pathlib.Path('app/tauri/src/main.rs').read_bytes()).hexdigest()
          out = {'schema':'tundra-installed-eh-corpus-environment/v1', 'admission':'NO',
                 'profile':profile, 'condition':'${{ matrix.condition }}',
                 'consumer_head':webkit['head_sha'], 'producer_head':custody['producer_head'],
                 'installed_elf_sha256':webkit['installed_elf_sha256'],
                 'harness_sha256':harness, 'webkitgtk_version':version,
                 'runner_os':'ubuntu-24.04', 'offline':True, 'csp_enforced':True}
          (receipt / 'corpus-environment.json').write_text(json.dumps(out, sort_keys=True)+'\n')
          PYENV
      - name: Enforce bounded diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/eh-semantic"
          mkdir -p "$out"
          cap=16777216
          candidate="$(du -sb "$out" | cut -f1)"
          if test "$candidate" -gt "$((cap - 1024))"; then
            mkdir -p "$RUNNER_TEMP/eh-refusal"
            printf 'schema=tundra-eh-pair-receipt-refusal/v1\nproduct_admission=NO\nreceipt_upload=NO\nobserved_bytes=%s\ncap_bytes=%s\n' \
              "$candidate" "$cap" > "$RUNNER_TEMP/eh-refusal/refusal.txt"
            mv "$out" "$RUNNER_TEMP/eh-quarantine"
            exit 1
          fi
          printf 'schema=tundra-eh-pair-receipt-budget/v1\nproduct_admission=NO\nreceipt_upload=YES\ncandidate_bytes=%s\ncap_bytes=%s\n' \
            "$candidate" "$cap" > "$out/receipt-budget.txt"
      - name: Retain diagnostic receipts, not package bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-pair-${{ matrix.condition }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/eh-semantic/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bounded receipt refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-pair-refusal-${{ matrix.condition }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/eh-refusal/
          if-no-files-found: ignore
          retention-days: 14

  compare-selected-eh-webkit-semantics:
    name: Compare six installed EH observations and selected legal custody
    if: ${{ always() && github.ref != 'refs/heads/diagnostic/pr139-selected-notice-25-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr139-selected-notice-25-20261027' && github.ref != 'refs/heads/diagnostic/pr140-sdk-three-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr140-sdk-three-20261027' && github.ref != 'refs/heads/diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.ref != 'refs/heads/diagnostic/pr142-library-sigs-lineage-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr142-library-sigs-lineage-held-20261027' }}
    needs: [selected-eh-webkit-semantic-trial, old-selected-eh-webkit-baseline]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require both installed matrices succeeded
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.selected-eh-webkit-semantic-trial.result }}' = success
          test '${{ needs.old-selected-eh-webkit-baseline.result }}' = success
      - name: Check out pinned comparison helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: gate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Nushell
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/nushell/nushell/releases/download/0.108.0/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            'f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df' "$archive" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/nu-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nu-tool"
          mapfile -t binaries < <(find "$RUNNER_TEMP/nu-tool" -type f -name nu -perm -u+x)
          test "${#binaries[@]}" -eq 1
          dirname "${binaries[0]}" >> "$GITHUB_PATH"
      - name: Authenticate exact six current-run artifact ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C gate-source rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git -C gate-source merge-base --is-ancestor 5aac42f054e25ca0cee69ca341aa67dbdbcbc649 HEAD
          helper=gate-source/.github/scripts/duckdb-eh-corpus
          printf '%s  %s\n' \
            '95206f742c58dda13fb9640bc0c90dfd7b43a96206fea2773015f2ac630386c6' "$helper/authenticate-eh-artifacts.nu" \
            '5e91791b76511824a168797e1a08e458b73491c621ca2d5be064bcbc0b004218' "$helper/compare-json-conversion-v4.nu" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/eh-compare"
          case "$GITHUB_EVENT_NAME" in
            pull_request|workflow_dispatch) ;;
            *) echo 'unsupported six-cell event' >&2; exit 1 ;;
          esac
          # PR GITHUB_SHA is a synthetic merge ref; the run/artifact API head is
          # the checked-out source head. On dispatch this also equals GITHUB_SHA.
          source_head="$(git -C gate-source rev-parse HEAD)"
          test "$source_head" = '${{ github.event.pull_request.head.sha || github.sha }}'
          nu "$helper/authenticate-eh-artifacts.nu" \
            "$RUNNER_TEMP/eh-compare" ryanmaclean/tundra "$GITHUB_RUN_ID" \
            "$source_head"
      - name: Read exact-run trial receipts and compare observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, f'duplicate JSON key: {key}'
                  result[key] = value
              return result
          root = Path(os.environ['RUNNER_TEMP']) / 'eh-compare'
          observed = {}
          installation = {}
          for condition in ('image', 'clean'):
              for profile in ('default', 'sounds'):
                  directory = root / f'duckdb-eh-pair-{condition}-{profile}'
                  source = (directory / 'source.txt').read_text()
                  assert 'schema=tundra-selected-eh-installed-semantic/v2\n' in source
                  assert 'admission=NO\n' in source
                  assert 'producer_head=22637d141f67dc92510211d7d281f6591a12a5f5\n' in source
                  assert 'producer_run=40434996466\n' in source
                  assert 'producer_attempt=1\n' in source
                  assert 'producer_bill_sha256=93c4637dcd0cf4527814267b38a242cc626ad64f92df0a9a52928d1edc036c0f\n' in source
                  assert 'artifact_id=12705817192\n' in source
                  assert 'artifact_zip_sha256=b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c\n' in source
                  assert f'profile={profile}\n' in source
                  assert f'condition={condition}\n' in source
                  expected_wasm = {
                      'image': 'ac2022967687136ec63c8917d77842f3c01f69291d2d024626e42a34d17953b8',
                      'clean': 'd267671286a6f0718a6fe1d712cd209bda84ef53f5984d0303defeb55c9f5d99',
                  }[condition]
                  assert f'wasm_sha256={expected_wasm}\n' in source
                  assert 'generated_js_sha256=fd610ecd2c58944726dc473ef8babc400581ae07df2a805b67f29a14b38695d3\n' in source
                  assert 'installed_native_js_pair=AWAITING_SAME_RUN_BUILD\n' in source
                  assert 'installed_native_js_pair=SAME_RUN_WORKER_REBUILT_AND_INSTALLED\n' in source
                  assert 'full_EH_semantics=NO\n' in source
                  pair = json.loads((directory / 'pair.json').read_text())
                  assert pair['schema'] == 'tundra-eh-same-run-worker-pair/v1'
                  assert pair['condition'] == condition
                  assert pair['upstream_head'] == 'f955138e5218942fb3fb097a8fdcb725222406ff'
                  assert pair['native_js_sha256'] == 'fd610ecd2c58944726dc473ef8babc400581ae07df2a805b67f29a14b38695d3'
                  assert pair['rewritten_js_sha256'] == '2a45ebf0fbb2113f6bdf6fcd7c61c7d1f14d8edca6fe871831b295132fefa397'
                  assert pair['worker_sha256'] == 'feec83f39202c08eb93e89df8c181bac32d4fb9ffb83a18bc277953e4d2945c4'
                  assert f"worker_source_dist_embedded_sha256={pair['worker_sha256']}\n" in source
                  budget = dict(line.split('=', 1) for line in
                                (directory / 'receipt-budget.txt').read_text().splitlines())
                  assert budget['product_admission'] == 'NO'
                  assert budget['receipt_upload'] == 'YES'
                  assert int(budget['candidate_bytes']) <= int(budget['cap_bytes']) - 1024
                  custody = json.loads((directory / 'installed-legal-custody.json').read_text(),
                                       object_pairs_hook=unique_object)
                  assert custody['schema'] == 'tundra-eh-installed-notice-custody/v2'
                  assert custody['admission'] == custody['full_EH_semantics'] == 'NO'
                  assert custody['source_build_admission'] == custody['glue_legal_admission'] == 'NO'
                  assert custody['legal_admission'] == custody['selected_graph_exhaustive'] == 'NO'
                  assert custody['generator_input_closure'] == 'UNPROVEN'
                  assert custody['arrow_original_member_instance'] == 'ARRAY_1_SELECTED_COMPUTE_2_UNSELECTED_EH_DIAGNOSTIC'
                  assert custody['condition'] == condition and custody['profile'] == profile
                  assert custody['consumer_head'] == 'ad0df7182cd4c9ea4a83bac04e5901de0218d9d0'
                  assert custody['producer_head'] == '22637d141f67dc92510211d7d281f6591a12a5f5'
                  assert custody['producer_run'] == 40434996466
                  assert custody['producer_attempt'] == 1
                  assert custody['producer_artifact_id'] == 12705817192
                  assert custody['producer_artifact_digest'] == 'sha256:b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c'
                  assert custody['producer_zip_sha256'] == 'b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c'
                  assert custody['producer_bill_sha256'] == '93c4637dcd0cf4527814267b38a242cc626ad64f92df0a9a52928d1edc036c0f'
                  hashes = [line.split(maxsplit=1)[0] for line in
                            (directory / 'installer.sha256').read_text().splitlines()]
                  assert len(hashes) == 2
                  assert hashes == [custody['installer_sha256'], custody['installed_elf_sha256']]
                  bill_bytes = (directory / 'installed-selected-bill.json').read_bytes()
                  assert hashlib.sha256(bill_bytes).hexdigest() == custody['installed_bill_sha256']
                  prebundle = (directory / 'prebundle-selected-bill.sha256').read_text().splitlines()
                  assert len(prebundle) == 1 and prebundle[0].split(maxsplit=1)[0] == custody['installed_bill_sha256']
                  bill_script = Path('gate-source/.github/scripts/duckdb-package-json-selected-bill-v5.nu')
                  script_receipt = (directory / 'package-bill-script.sha256').read_text().splitlines()
                  assert len(script_receipt) == 1
                  assert script_receipt[0].split(maxsplit=1) == [hashlib.sha256(bill_script.read_bytes()).hexdigest(), str(bill_script)]
                  assert custody['pinned_pr119_bill_sha256'] == '34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790'
                  bill = json.loads(bill_bytes, object_pairs_hook=unique_object)
                  assert bill['schema'] == 'tundra-duckdb-installed-json-package-selected-bill/v5'
                  assert bill['admission'] == bill['notice_graph_complete'] == 'NO'
                  assert bill['producer_artifact_id'] == 12705817192
                  assert bill['producer_attempt'] == custody['producer_attempt']
                  assert bill['producer_artifact_digest'] == custody['producer_artifact_digest']
                  assert bill['producer_bill_sha256'] == custody['producer_bill_sha256']
                  assert bill['producer_zip_sha256'] == 'b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c'
                  producer_bytes = (directory / 'producer-selected-bill.json').read_bytes()
                  assert hashlib.sha256(producer_bytes).hexdigest() == custody['producer_bill_sha256']
                  producer_bill = json.loads(producer_bytes, object_pairs_hook=unique_object)
                  assert producer_bill['schema'] == 'selected-native-glue-bill/v1'
                  assert producer_bill['run_id'] == str(custody['producer_run'])
                  assert producer_bill['run_attempt'] == str(custody['producer_attempt'])
                  assert producer_bill['artifact_id'] == producer_bill['artifact_digest'] == 'PENDING_UPLOAD_API_JOIN'
                  assert len(producer_bill['rows']) == len({row['key'] for row in producer_bill['rows']}) == 142
                  condition_outputs = [row for row in producer_bill['condition_outputs'] if row['condition'] == condition]
                  assert len(condition_outputs) == 1
                  assert bill['condition_output'] == custody['condition_output'] == condition_outputs[0]
                  assert bill['condition'] == condition and bill['profile'] == profile
                  assert bill['consumer_head'] == custody['consumer_head']
                  assert bill['producer_head'] == custody['producer_head']
                  assert bill['producer_run'] == custody['producer_run']
                  assert bill['native_js_sha256'] == pair['native_js_sha256']
                  assert bill['native_wasm_sha256'] == expected_wasm
                  assert bill['rebuilt_worker_sha256'] == pair['worker_sha256']
                  assert bill['pinned_pr119_input_bill_sha256'] == custody['pinned_pr119_bill_sha256']
                  pinned_bytes = (directory / 'pinned-pr119-selected-bill.json').read_bytes()
                  assert hashlib.sha256(pinned_bytes).hexdigest() == custody['pinned_pr119_bill_sha256']
                  pinned = json.loads(pinned_bytes, object_pairs_hook=unique_object)
                  assert pinned['schema'] == 'tundra-duckdb-selected-notice-bill/v2'
                  assert len(pinned['attributions']) == 38 and len(pinned['texts']) == 36
                  assert bill['attributions'][:38] == pinned['attributions']
                  assert bill['texts'][:36] == pinned['texts']
                  assert len(bill['attributions']) == custody['installed_attributions'] == 39
                  assert len(bill['texts']) == len(custody['installed_texts']) == 37
                  yy = bill['attributions'][-1]
                  assert yy['component'] == 'yyjson' and yy['license_or_role'] == 'MIT'
                  assert yy['source_sha256'] == '45e384d3d52c73cba3a64d6e6c25d47cd738cd8a55c30629e3201046eda62947'
                  assert bill['texts'][-1] == {'file': yy['file'], 'sha256': yy['source_sha256']}
                  assert bill['json_selected_archive_bytes'] == 'RETAINED_BOUNDED'
                  assert bill['selected_graph_exhaustive'] == bill['legal_admission'] == 'NO'
                  assert bill['generator_input_closure'] == 'UNPROVEN'
                  joins = bill['selected_notice_joins']
                  assert len(joins) == len({item['key'] for item in joins}) == 71
                  assert sorted(bill['selected_unresolved_keys']) == sorted(
                      item['key'] for item in joins if item['installed_notice_status'] != 'NOTICE_BYTES_MATCH')
                  assert len(bill['selected_unresolved_keys']) == 35
                  assert custody['selected_unresolved_keys'] == bill['selected_unresolved_keys']
                  assert hashlib.sha256(json.dumps(joins, sort_keys=True,
                      separators=(',', ':')).encode()).hexdigest() == custody['selected_notice_joins_sha256']
                  assert {item['file']: item['sha256'] for item in bill['texts']} == custody['installed_texts']
                  raw = directory / 'installed-notice-bytes'
                  assert {p.name for p in raw.iterdir()} == {
                      Path(path).name for path in custody['installed_texts']}
                  assert all(p.is_file() and not p.is_symlink() for p in raw.iterdir())
                  for path, digest in custody['installed_texts'].items():
                      assert hashlib.sha256((raw / Path(path).name).read_bytes()).hexdigest() == digest
                  for item in joins:
                      if item['installed_notice_status'] == 'SOURCE_OR_NOTICE_UNRESOLVED':
                          assert item['installed_notice_path'] == 'UNRESOLVED'
                      else:
                          path = item['installed_notice_path']
                          assert custody['installed_texts'][path] == item['installed_notice_sha256']
                          assert hashlib.sha256((raw / Path(path).name).read_bytes()).hexdigest() == item['source_notice_sha256']
                  assert (directory / 'installed-notices.tsv').read_text() == ''.join(
                      f'{digest}\t{path}\n' for path, digest in
                      sorted(custody['installed_texts'].items()))
                  assets = custody['installed_assets']
                  assert set(assets) == {
                      'duckdb-runtime/duckdb-browser.mjs',
                      'duckdb-runtime/duckdb-browser-mvp.worker.js',
                      'duckdb-runtime/duckdb-browser-eh.worker.js',
                      'duckdb-runtime/duckdb-mvp.wasm',
                      'duckdb-runtime/duckdb-eh.wasm',
                  }
                  old_assets = {item['path']: item['sha256'] for item in bill['assets']}
                  assert len(old_assets) == 5
                  assert assets == old_assets
                  assert assets['duckdb-runtime/duckdb-eh.wasm'] == expected_wasm
                  assert assets['duckdb-runtime/duckdb-browser-eh.worker.js'] == pair['worker_sha256']
                  embedded = json.loads((directory / 'embedded-assets.json').read_text(),
                                        object_pairs_hook=unique_object)
                  assert all(len([item for item in embedded['assets'] if item['key'] == key and
                                  item['transform'] == 'identity' and
                                  item['dist_sha256'] == digest and
                                  item['embedded_sha256'] == digest]) == 1
                             for key, digest in assets.items())
                  assert (directory / 'installed-five-assets.tsv').read_text() == ''.join(
                      f'{digest}\t{key}\n' for key, digest in sorted(assets.items()))
                  exact_bytes = (directory / 'exact-package-selected-bill.json').read_bytes()
                  assert hashlib.sha256(exact_bytes).hexdigest() == custody['exact_package_selected_bill_sha256']
                  exact = json.loads(exact_bytes, object_pairs_hook=unique_object)
                  assert exact['schema'] == 'tundra-duckdb-exact-eh-package-selected-bill/v2'
                  assert exact['admission'] == exact['full_EH_semantics'] == 'NO'
                  assert exact['selected_dependency_inventory_admission'] == 'NO'
                  assert exact['product_fleet_admission'] == 'NO'
                  assert exact['source_texts_upstream_reverified_this_run'] == 'NO'
                  assert exact['condition'] == condition and exact['profile'] == profile
                  assert exact['consumer_head'] == custody['consumer_head']
                  assert exact['producer_head'] == custody['producer_head']
                  assert exact['producer_run'] == custody['producer_run']
                  for key in ('producer_attempt','producer_artifact_id','producer_artifact_digest',
                              'producer_zip_sha256','producer_bill_sha256','condition_output'):
                      assert exact[key] == custody[key]
                  assert exact['installer_sha256'] == custody['installer_sha256']
                  assert exact['installed_elf_sha256'] == custody['installed_elf_sha256']
                  assert exact['installed_pr119_bill_sha256'] == custody['pinned_pr119_bill_sha256']
                  assert exact['installed_json_v5_bill_sha256'] == custody['installed_bill_sha256']
                  assert exact['attributions'] == bill['attributions'] and exact['texts'] == bill['texts']
                  assert exact['selected_notice_joins'] == joins
                  assert exact['selected_unresolved_keys'] == bill['selected_unresolved_keys']
                  assert exact['selected_graph_exhaustive'] == exact['legal_admission'] == 'NO'
                  assert exact['generator_input_closure'] == 'UNPROVEN'
                  assert len(exact['assets']) == 5
                  assert {item['path']: item['sha256'] for item in exact['assets']} == assets
                  native = exact['native_evidence']
                  assert native['producer_artifact_id'] == 12705817192
                  assert native['producer_artifact_zip_sha256'] == 'b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c'
                  assert native['producer_bill_sha256'] == custody['producer_bill_sha256']
                  assert native['condition_output'] == custody['condition_output']
                  assert native['physical_archive_scope'] == 'two_selected_json_and_one_arrow_and_nine_sdk_archives_per_condition'
                  assert native['other_selected_project_archive_physical_hashes'] == 'NOT_PROVED_EXHAUSTIVE'
                  assert native['arrow_archive_bytes_retained'] == 'YES_BOUNDED'
                  assert native['json_selected_archive_bytes'] == 'RETAINED_BOUNDED'
                  assert native['json_selected_member_count'] == 25
                  for key in ('json_selected_members_bill_sha256',
                              'json_selected_link_selection_sha256'):
                      assert len(native[key]) == 64 and all(c in '0123456789abcdef' for c in native[key])
                  assert native['source_build_admission'] == native['glue_legal_admission'] == 'NO'
                  assert native['arrow_original_member_instance'] == 'ARRAY_1_SELECTED_COMPUTE_2_UNSELECTED_EH_DIAGNOSTIC'
                  assert native['selected_graph_exhaustive'] == 'NO' and native['generator_input_closure'] == 'UNPROVEN'
                  assert len(native['json_physical_archives']) == 2
                  assert len(native['selected_sdk_archives']) == 9
                  assert set(native['arrow_duplicate_util_member_candidate_hashes_producer_attested']) == {
                      'array/util.cc.o', 'compute/util.cc.o'}
                  assert len(native['source_evidence_archive_sha256']) == 4
                  for name, expected in (
                      (f'native-{condition}.js', pair['native_js_sha256']),
                      ('rewritten-binding.js', pair['rewritten_js_sha256']),
                      ('rebuilt-worker.js', pair['worker_sha256']),
                  ):
                      assert hashlib.sha256((directory / name).read_bytes()).hexdigest() == expected
                  receipt = json.loads((directory / 'webkit.json').read_text())
                  result = receipt['result']
                  assert receipt['ok'] and result['ok']
                  assert receipt['requested_variant'] == result['variant'] == 'eh'
                  assert result['cspDenied'] and not result['cspViolations']
                  assert result['localRuntime'] and result['remoteRequests'] == 0
                  semantic = json.loads(result['semanticObserved'])
                  assert semantic['sameConnection'] and semantic['recovery']
                  assert semantic['targetedPathsOk'] and len(semantic['cases']) == 9
                  worker_sha = (directory / 'pinned-worker.sha256').read_text().split()[0]
                  assert worker_sha == pair['worker_sha256']
                  elf_sha = next(line.split('=', 1)[1] for line in source.splitlines()
                                 if line.startswith('installed_elf_sha256='))
                  assert elf_sha == receipt['installed_elf_sha256']
                  installation[(condition, profile)] = {
                      'worker_sha256': worker_sha,
                      'installed_elf_sha256': elf_sha,
                      'installer_sha256': (directory / 'installer.sha256').read_text(),
                      'overlaid_assets_sha256': (directory / 'overlaid-assets.sha256').read_text(),
                  }
                  observed[(condition, profile)] = {
                      'semantic': semantic,
                      'parser_catalog': result['rejectionProbes'],
                      'aggregate': result['aggregateObserved'],
                      'answer': result['answer'],
                      'absent_is_null': result['absentIsNull'],
                  }
          baseline = observed[('image', 'default')]
          differences = [f'{condition}-{profile}' for (condition, profile), value
                         in observed.items() if value != baseline]
          worker_digests = {cell['worker_sha256'] for cell in installation.values()}
          output = root / 'comparison.json'
          output.write_text(json.dumps({
              'schema': 'tundra-eh-exact-pair-installed-compare/v2',
              'admission': 'NO',
              'producer_run': 40434996466,
              'producer_attempt': 1,
              'producer_head': '22637d141f67dc92510211d7d281f6591a12a5f5',
              'producer_artifact_id': 12705817192,
              'producer_artifact_digest': 'sha256:b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c',
              'producer_bill_sha256': '93c4637dcd0cf4527814267b38a242cc626ad64f92df0a9a52928d1edc036c0f',
              'compared': [f'{c}-{p}' for c, p in observed],
              'observed': {f'{c}-{p}': value for (c, p), value in observed.items()},
              'installation': {f'{c}-{p}': value for (c, p), value in installation.items()},
              'differences_from_image_default': differences,
              'equal': not differences and len(worker_digests) == 1,
              'installed_native_js_pair': 'SAME_RUN_WORKER_REBUILT_AND_INSTALLED',
              'full_EH_semantics': 'NO',
              'product_fleet_admission': 'NO',
          }, sort_keys=True, indent=2) + '\n')
          assert not differences, f'EH semantic mismatch: {differences}'
          assert len(worker_digests) == 1, 'Pinned installed EH worker changed across cells'
          PY
      - name: Compare authenticated 32-case installed corpus
        shell: bash
        run: |
          set -euo pipefail
          nu gate-source/.github/scripts/duckdb-eh-corpus/compare-json-conversion-v4.nu \
            "$RUNNER_TEMP/eh-compare"
          jq -e '.schema == "tundra-installed-json-conversion-corpus-compare/v4" and
            .admission == "NO" and .case_count == 32 and .accepted == true and
            (.case_comparisons | length == 32) and
            .case_failures == [] and .case_differences == [] and
            ([.case_comparisons[] | select(.classification == "old_unsupported_to_new_pass")] | length) == 1 and
            ([.case_comparisons[] | select(.classification == "old_wrong_empty_to_new_pass")] | length) == 1 and
            (.snapshots | length == 4) and (.baselines | length == 2)' \
            "$RUNNER_TEMP/eh-compare/corpus-comparison.json"
      - name: Enforce bounded authenticated comparison receipt
        id: comparison_budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/eh-compare"
          mkdir -p "$root"
          cap=16777216
          candidate=0
          for name in comparison.json corpus-comparison.json artifact-auth.json; do
            if ! test -f "$root/$name"; then
              mkdir -p "$RUNNER_TEMP/eh-compare-refusal"
              printf 'schema=tundra-eh-comparison-refusal/v1\nproduct_admission=NO\nreceipt_upload=NO\nreason=missing_required_receipt\n' \
                > "$RUNNER_TEMP/eh-compare-refusal/refusal.txt"
              exit 1
            fi
            bytes="$(stat -c %s "$root/$name")"
            candidate="$((candidate + bytes))"
          done
          if test "$candidate" -gt "$((cap - 1024))"; then
            mkdir -p "$RUNNER_TEMP/eh-compare-refusal"
            printf 'schema=tundra-eh-comparison-refusal/v1\nproduct_admission=NO\nreceipt_upload=NO\nobserved_bytes=%s\ncap_bytes=%s\n' \
              "$candidate" "$cap" > "$RUNNER_TEMP/eh-compare-refusal/refusal.txt"
            for name in comparison.json corpus-comparison.json artifact-auth.json; do
              if test -f "$root/$name"; then
                mv "$root/$name" "$RUNNER_TEMP/eh-compare-refusal/$name.quarantined"
              fi
            done
            exit 1
          fi
          printf 'schema=tundra-eh-comparison-budget/v1\nproduct_admission=NO\nreceipt_upload=YES\ncandidate_bytes=%s\ncap_bytes=%s\n' \
            "$candidate" "$cap" > "$root/comparison-budget.txt"
      - name: Retain comparison receipt
        if: ${{ always() && steps.comparison_budget.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-pair-comparison
          path: |
            ${{ runner.temp }}/eh-compare/comparison.json
            ${{ runner.temp }}/eh-compare/corpus-comparison.json
            ${{ runner.temp }}/eh-compare/artifact-auth.json
            ${{ runner.temp }}/eh-compare/comparison-budget.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bounded comparison refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-pair-comparison-refusal
          path: ${{ runner.temp }}/eh-compare-refusal/refusal.txt
          if-no-files-found: ignore
          retention-days: 14

  old-selected-eh-webkit-baseline:
    if: ${{ github.ref != 'refs/heads/diagnostic/pr139-selected-notice-25-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr139-selected-notice-25-20261027' && github.ref != 'refs/heads/diagnostic/pr140-sdk-three-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr140-sdk-three-20261027' && github.ref != 'refs/heads/diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.ref != 'refs/heads/diagnostic/pr142-library-sigs-lineage-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr142-library-sigs-lineage-held-20261027' }}
    name: PR119 installed old EH corpus (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [default, sounds]
    env:
      CONSUMER_HEAD: ad0df7182cd4c9ea4a83bac04e5901de0218d9d0
      OLD_UI_RUN: "40275385842"
      OLD_UI_ARTIFACT: "12630875549"
      OLD_UI_ZIP_SHA256: d0f2845347a404c37265b008626bbce4d3b3e97033f3b98383389400b4fe3685
    steps:
      - name: Check out exact PR119 consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad0df7182cd4c9ea4a83bac04e5901de0218d9d0
          persist-credentials: false
      - name: Check out exact corpus helper source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: gate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate and stage old selected PR119 UI runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_HEAD"
          test "$(git -C gate-source rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git -C gate-source merge-base --is-ancestor 5aac42f054e25ca0cee69ca341aa67dbdbcbc649 HEAD
          mkdir -p "$RUNNER_TEMP/eh-semantic" "$RUNNER_TEMP/old-ui"
          base=https://api.github.com/repos/ryanmaclean/tundra
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/runs/$OLD_UI_RUN" -o "$RUNNER_TEMP/old-ui/run.json"
          jq -e --arg head "$CONSUMER_HEAD" --argjson id "$OLD_UI_RUN" \
            '.id == $id and .head_sha == $head and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/old-ui/run.json"
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/artifacts/$OLD_UI_ARTIFACT" -o "$RUNNER_TEMP/old-ui/artifact.json"
          jq -e --arg head "$CONSUMER_HEAD" --argjson run "$OLD_UI_RUN" \
            --argjson id "$OLD_UI_ARTIFACT" --arg digest "sha256:$OLD_UI_ZIP_SHA256" \
            '.id == $id and .name == "leptos-ui-dist" and .digest == $digest and
             .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $head' \
            "$RUNNER_TEMP/old-ui/artifact.json"
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/artifacts/$OLD_UI_ARTIFACT/zip" -o "$RUNNER_TEMP/old-ui/ui-dist.zip"
          printf '%s  %s\n' "$OLD_UI_ZIP_SHA256" "$RUNNER_TEMP/old-ui/ui-dist.zip" | sha256sum --check --status
          test "$(stat -c %s "$RUNNER_TEMP/old-ui/ui-dist.zip")" = \
            "$(jq -r .size_in_bytes "$RUNNER_TEMP/old-ui/artifact.json")"
          python3 - <<'PYOLD'
          import hashlib, json, os, pathlib, shutil, stat, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'old-ui/ui-dist.zip'
          source = pathlib.Path('app/leptos-ui/duckdb-runtime')
          expected = {
            'duckdb-browser.mjs':'8ccf3fe3c6bd87d5c3e397f01d40cc11ea6373b016a9cf5e954d39ee22c3aa49',
            'duckdb-browser-eh.worker.js':'feec83f39202c08eb93e89df8c181bac32d4fb9ffb83a18bc277953e4d2945c4',
            'duckdb-eh.wasm':'d71b7e4575c98b87e09ac799c574d770aa5ee4df5e6c6cf36b6e277d92b8d2c2',
            'duckdb-browser-mvp.worker.js':'d7920b73954d99ffa59175db35fe24e7936f8a003144386686b53c853c46eaef',
            'duckdb-mvp.wasm':'7cf852dcc3c399f34330072a422679f2a5b7fc58c5839d3de0035fc68d9b7791',
          }
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              assert 0 < len(infos) <= 128 and sum(i.file_size for i in infos) <= 64*1024*1024
              names = [i.filename for i in infos]
              assert len(names) == len(set(names))
              for i in infos:
                  p = pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '\\' not in i.filename
                  assert all(part not in ('', '.', '..') for part in i.filename.rstrip('/').split('/'))
                  assert ((i.external_attr >> 16) & 0o170000) in (0, stat.S_IFREG, stat.S_IFDIR)
              actual = {i.filename for i in infos if i.filename.startswith('duckdb-runtime/')}
              assert actual == {'duckdb-runtime/'+name for name in expected}
              source.mkdir(parents=True, exist_ok=True)
              for name,digest in expected.items():
                  data = z.read('duckdb-runtime/'+name)
                  assert hashlib.sha256(data).hexdigest() == digest
                  (source/name).write_bytes(data)
          bill = pathlib.Path('app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json')
          assert hashlib.sha256(bill.read_bytes()).hexdigest() == '34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790'
          (temp/'eh-semantic/old-source.json').write_text(json.dumps({
            'schema':'tundra-old-eh-source/v1','admission':'NO',
            'source_checkout_head':'ad0df7182cd4c9ea4a83bac04e5901de0218d9d0',
            'old_ui_run':40275385842,'old_ui_artifact_id':12630875549,
            'old_ui_zip_sha256':'d0f2845347a404c37265b008626bbce4d3b3e97033f3b98383389400b4fe3685',
            'selected_assets':expected}, sort_keys=True)+'\n')
          PYOLD
          printf 'schema=tundra-old-installed-eh-baseline/v1\nadmission=NO\nfull_EH_semantics=NO\nproduct_fleet_admission=NO\nconsumer_head=%s\nprofile=%s\n' \
            "$CONSUMER_HEAD" '${{ matrix.profile }}' > "$RUNNER_TEMP/eh-semantic/source.txt"
      - name: Install Linux WebKitGTK and Tauri build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt_bounded() {
            local label="$1" limit="$2" attempt rc effective_limit
            shift 2
            for attempt in 1 2; do
              effective_limit="$limit"
              if [[ "$label" == base-install && "$attempt" -eq 2 ]]; then
                effective_limit=1800
              fi
              if timeout --signal=TERM --kill-after=20s "${effective_limit}s" \
                sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \
                -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                printf 'prereq=%s attempt=%s limit_seconds=%s result=PASS\n' \
                  "$label" "$attempt" "$effective_limit" \
                  >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
                return 0
              else
                rc=$?
              fi
              printf 'prereq=%s attempt=%s limit_seconds=%s exit=%s\n' \
                "$label" "$attempt" "$effective_limit" "$rc" \
                >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
              if [[ "$attempt" -eq 2 || ( "$rc" -ne 100 && "$rc" -ne 124 ) ]]; then
                return "$rc"
              fi
              sleep 10
            done
          }
          apt_bounded update 300 update
          apt-cache policy libwebkit2gtk-4.1-0 > "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt"
          webkit_candidate="$(awk '$1 == "Candidate:" { print $2 }' \
            "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt")"
          test -n "$webkit_candidate" && test "$webkit_candidate" != '(none)'
          test "$(grep -c '^[[:space:]]*Candidate:' \
            "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt")" -eq 1
          apt-cache madison libwebkit2gtk-4.1-0 > "$RUNNER_TEMP/eh-semantic/apt-webkit-madison.txt"
          apt-cache policy > "$RUNNER_TEMP/eh-semantic/apt-source-policy.txt"
          python3 - "$webkit_candidate" "$RUNNER_TEMP/eh-semantic" <<'PYAPT'
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import urlparse
          import json, re, sys
          version, root = sys.argv[1], Path(sys.argv[2])
          policy = (root / 'apt-source-policy.txt').read_text().splitlines()
          hosts = {'azure.archive.ubuntu.com', 'archive.ubuntu.com',
                   'security.ubuntu.com'}
          def official_url(value):
              parsed = urlparse(value)
              return (parsed.scheme in ('http', 'https') and
                      parsed.hostname in hosts and parsed.port is None and
                      parsed.username is None and parsed.password is None and
                      parsed.path.rstrip('/') == '/ubuntu' and
                      not parsed.query and not parsed.fragment)
          mirror_token = 'mirror+file:/etc/apt/apt-mirrors.txt'
          mirror_sha = None
          def official_source(value):
              global mirror_sha
              if official_url(value):
                  return True
              if value != mirror_token:
                  return False
              path = Path('/etc/apt/apt-mirrors.txt')
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              assert 0 < len(data) <= 4096
              mirror_sha = sha256(data).hexdigest()
              (root / 'apt-mirrors.sha256').write_text(mirror_sha + '\n')
              classes = {'cr': [], 'tab': [], 'non_ascii': [],
                         'other_control': [], 'lf': []}
              for offset, byte in enumerate(data):
                  if byte == 13: classes['cr'].append(offset)
                  elif byte == 9: classes['tab'].append(offset)
                  elif byte == 10: classes['lf'].append(offset)
                  elif byte >= 128: classes['non_ascii'].append(offset)
                  elif byte < 32 or byte == 127:
                      classes['other_control'].append(offset)
              lines = data.split(b'\n')
              shapes = []
              for raw_line in lines[:32]:
                  shape = {'bytes': len(raw_line),
                           'ends_cr': raw_line.endswith(b'\r'),
                           'has_non_ascii': any(byte >= 128 for byte in raw_line)}
                  if not shape['has_non_ascii']:
                      line = raw_line.decode('ascii').strip(' \t\r')
                      try:
                          parsed = urlparse(line)
                          host = parsed.hostname
                      except ValueError:
                          parsed, host = None, None
                      shape.update({
                          'scheme': (parsed.scheme if parsed and
                                     parsed.scheme in ('http', 'https') else 'OTHER'),
                          'host_class': ('APPROVED' if host in hosts else
                                         'OTHER' if host else 'NONE'),
                          'path_class': ('UBUNTU_ROOT' if parsed and
                                         parsed.path.rstrip('/') == '/ubuntu'
                                         else 'OTHER'),
                          'has_userinfo': b'@' in raw_line,
                          'has_query': b'?' in raw_line,
                          'has_fragment': b'#' in raw_line})
                  shapes.append(shape)
              (root / 'apt-mirrors-shape.json').write_text(json.dumps({
                  'schema': 'tundra-apt-mirror-shape/v1', 'bytes': len(data),
                  'sha256': mirror_sha,
                  'byte_classes': {name: {'count': len(offsets),
                                          'positions_zero_based': offsets}
                                   for name, offsets in classes.items()},
                  'line_lengths': [len(line) for line in lines],
                  'lines_reported': len(shapes), 'line_shapes': shapes,
              }, sort_keys=True) + '\n')
              try:
                  mirror_text = data.decode('utf-8')
              except UnicodeDecodeError:
                  safety = 'INVALID_UTF8'
              else:
                  if any(char in '@?#' for char in mirror_text):
                      safety = 'SENSITIVE_DELIMITER'
                  elif any(char not in ('\n', '\t') and
                           not 32 <= ord(char) <= 126 for char in mirror_text):
                      safety = 'CONTROL_OR_NONASCII'
                  else:
                      safety = 'SAFE_ASCII_MIRROR_TEXT'
              (root / 'apt-mirrors-safety.txt').write_text(
                  f'bytes={len(data)}\nsha256={mirror_sha}\nraw_retained=NO'
                  f'\nreason={safety}\n')
              assert safety == 'SAFE_ASCII_MIRROR_TEXT', \
                  'unsafe mirror list; raw bytes withheld'
              entries = []
              for line in mirror_text.splitlines():
                  assert line, 'empty mirror line'
                  if '\t' in line:
                      assert line.count('\t') == 1, 'multiple mirror metadata tabs'
                      url, metadata = line.split('\t')
                      assert re.fullmatch(r'priority:[0-9]', metadata), \
                          'unapproved mirror metadata'
                      entries.append((url, True))
                  else:
                      entries.append((line, False))
                  assert official_url(entries[-1][0]), 'unapproved mirror URL'
              assert 1 <= len(entries) <= 8, 'mirror entry count drift'
              assert len({with_metadata for _, with_metadata in entries}) == 1, \
                  'mixed mirror metadata forms'
              (root / 'apt-mirrors.txt').write_bytes(data)
              assert (root / 'apt-mirrors.txt').read_bytes() == data
              (root / 'apt-mirrors-safety.txt').write_text(
                  f'bytes={len(data)}\nsha256={mirror_sha}\nraw_retained=YES'
                  '\nreason=APPROVED_CANONICAL_MIRROR_LIST\n')
              return True
          selected = []
          for row in (root / 'apt-webkit-madison.txt').read_text().splitlines():
              fields = [part.strip() for part in row.split('|')]
              if fields[:2] != ['libwebkit2gtk-4.1-0', version]:
                  continue
              assert len(fields) == 3, 'malformed candidate source row'
              source = fields[2]
              parts = source.split()
              assert (len(parts) == 4 and parts[-1] == 'Packages' and
                      parts[1] in ('noble/main', 'noble-updates/main',
                                   'noble-security/main') and
                      parts[2] == 'amd64' and official_source(parts[0])), \
                  'unapproved candidate WebKit source'
              matched = False
              for index, line in enumerate(policy[:-1]):
                  if not re.fullmatch(r'\s*\d+\s+' + re.escape(source), line):
                      continue
                  release = policy[index + 1].strip()
                  if (release.startswith('release ') and
                      re.search(r'(?:^|,)o=Ubuntu(?:,|$)', release[8:]) and
                      re.search(r'(?:^|,)l=Ubuntu(?:,|$)', release[8:])):
                      selected.append((source, release))
                      matched = True
              assert matched, 'candidate WebKit source lacks Ubuntu Release join'
          assert selected, 'candidate WebKit version lacks authenticated Ubuntu archive origin'
          (root / 'apt-webkit-origin.txt').write_text(
              'candidate_version=' + version + '\n' +
              ('mirror_sha256=' + mirror_sha + '\n' if mirror_sha else '') +
              ''.join('source=' + source + '\n' + 'release=' + release + '\n'
                      for source, release in sorted(set(selected))))
          PYAPT
          printf 'webkit_candidate_version=%s\n' "$webkit_candidate" \
            >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
          apt_bounded base-install 900 install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget xvfb dbus-x11
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            apt_bounded sounds-install 300 install -y --no-install-recommends libasound2-dev
          fi
          installed_webkit="$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)"
          installed_status="$(dpkg-query -W -f='${db:Status-Abbrev}' libwebkit2gtk-4.1-0)"
          test "$installed_webkit" = "$webkit_candidate"
          test "$installed_status" = 'ii '
          printf 'webkit_installed_version=%s\n' "$installed_webkit" \
            >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
          dpkg-query -W -f='${Package}\t${Version}\t${db:Status-Abbrev}\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv"
          test -s "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv"
          test "$(awk -F '\t' -v version="$installed_webkit" \
            '$1 == "libwebkit2gtk-4.1-0" && $2 == version && $3 == "ii " \
              { n++ } END { print n+0 }' \
            "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv")" -eq 1
          sha256sum "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv" \
            > "$RUNNER_TEMP/eh-semantic/apt-installed-packages.sha256"
      - name: Install pinned build tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned UI and Tauri tools
        shell: bash
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
          cargo install nu --version 0.108.0 --locked
      - name: Extend the existing forced-EH smoke with targeted SQL paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/tauri/src/main.rs')
          source = path.read_text()
          old = '    recovery_ok: bool,\n    smoke_error: Option<String>,'
          new = '    recovery_ok: bool,\n    semantic_observed: Option<String>,\n    smoke_error: Option<String>,'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '            "recoveryOk": result.recovery_ok,\n'
          new = old + '            "semanticObserved": result.semantic_observed.as_deref().unwrap_or("").chars().take(4096).collect::<String>(),\n'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '      result.ok = result.ok && result.exceptionOk;\n'
          new = '''      // Test-only extension: every query uses the bridge's one retained connection.
          const semantic = { cases: [], sameConnection: false,
            recovery: false, targetedPathsOk: false };
          const inspect = async (name, sql) => {
            const value = JSON.parse(await bridge.query_duckdb(sql));
            const error = value && !Array.isArray(value) &&
              typeof value.error === 'string' ? value.error : '';
            semantic.cases.push({ name, shape: Array.isArray(value) ? 'rows' :
              (error ? 'error' : typeof value),
              errorClass: (error.match(/(?:Parser|Catalog|Binder|Conversion|Invalid Input|Internal) Error/) || [])[0] || '',
              rows: Array.isArray(value) ? value : [],
              marker: error ? error.split(/\\r?\\n/, 1)[0].slice(0, 120) : '' });
          };
          await inspect('create-macro',
            'CREATE MACRO eh_probe(x) AS TABLE SELECT x AS v');
          await inspect('table-macro-ok', 'SELECT * FROM eh_probe(7)');
          await inspect('table-macro-arity-error', 'SELECT * FROM eh_probe()');
          await inspect('pragma-ok', 'PRAGMA version');
          await inspect('pragma-error', 'PRAGMA eh_missing_pragma_6f86d081');
          await inspect('aggregate-ok', 'SELECT sum(i) AS total FROM csp_probe');
          await inspect('aggregate-error', "SELECT sum('eh_bad_number') FROM csp_probe");
          await inspect('same-connection', 'SELECT * FROM eh_probe(11)');
          await inspect('post-error-recovery', 'SELECT 42 AS alive');
          semantic.sameConnection = JSON.stringify(semantic.cases.find(c =>
            c.name === 'same-connection')?.rows) === JSON.stringify([{v:11}]);
          semantic.recovery = JSON.stringify(semantic.cases.find(c =>
            c.name === 'post-error-recovery')?.rows) === JSON.stringify([{alive:42}]);
          const byName = name => semantic.cases.find(c => c.name === name);
          semantic.targetedPathsOk =
            byName('create-macro')?.shape === 'rows' &&
            JSON.stringify(byName('table-macro-ok')?.rows) === JSON.stringify([{v:7}]) &&
            byName('table-macro-arity-error')?.shape === 'error' &&
            !!byName('table-macro-arity-error')?.errorClass &&
            byName('pragma-ok')?.shape === 'rows' &&
            byName('pragma-error')?.shape === 'error' &&
            !!byName('pragma-error')?.errorClass &&
            byName('aggregate-ok')?.shape === 'rows' &&
            [3, '3', '"3"'].includes(byName('aggregate-ok')?.rows?.[0]?.total) &&
            byName('aggregate-error')?.shape === 'error' &&
            !!byName('aggregate-error')?.errorClass;
          result.semanticObserved = JSON.stringify(semantic);
          result.ok = result.ok && result.exceptionOk &&
            semantic.sameConnection && semantic.recovery && semantic.targetedPathsOk;
          '''
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          sha256sum app/tauri/src/main.rs > "$RUNNER_TEMP/eh-semantic/test-harness.sha256"
      - name: Add pinned 32-case corpus to disposable installed smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gate-source rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git -C gate-source merge-base --is-ancestor 5aac42f054e25ca0cee69ca341aa67dbdbcbc649 HEAD
          helper=gate-source/.github/scripts/duckdb-eh-corpus
          printf '%s  %s\n' \
            '196ba238054a5b22e2a89d781eb7ed3844a416b71384f98fbc9c032eea551c0a' "$helper/eh-corpus.mjs" \
            '7895597e2417426c141dcbc7c5e002269fb5f7f3c3381a6612bdfba33af3acf4' "$helper/apply-eh-corpus.nu" \
            | sha256sum --check --status
          nu "$helper/apply-eh-corpus.nu" app/tauri/src/main.rs "$helper/eh-corpus.mjs"
          # Corpus failures are diagnostics; preserve the independent installed
          # smoke verdict so only a complete, safe receipt reaches comparison.
          python3 - <<'PYCORPUS'
          from pathlib import Path
          path = Path('app/tauri/src/main.rs')
          source = path.read_text()
          old = 'result.ok = result.ok && corpus.passed;'
          new = 'result.corpusPassed = corpus.passed;'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PYCORPUS
          sha256sum app/tauri/src/main.rs > "$RUNNER_TEMP/eh-semantic/corpus-harness.sha256"
          node --check "$helper/eh-corpus.mjs"
      - name: Build and verify installed PR119 old selected package
        shell: bash
        run: |
          set -euo pipefail
          (cd app/leptos-ui && trunk build --release --locked)
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          shopt -s nullglob
          fingerprints=(target/release/.fingerprint/at-tauri-*/bin-auto-tundra.json)
          test "${#fingerprints[@]}" -eq 1
          cp "${fingerprints[0]}" "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            jq -e '(.features | fromjson | index("sounds")) != null' "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          else
            jq -e '(.features | fromjson | index("sounds")) == null' "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          fi
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb-root"
          mapfile -d '' bins < <(find "$RUNNER_TEMP/deb-root" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          "${bins[0]}" --verify-embedded-assets app/leptos-ui/dist \
            > "$RUNNER_TEMP/eh-semantic/embedded-assets.json"
          python3 - <<'PYBASE'
          import hashlib, json, os, pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); receipt=temp/'eh-semantic'
          source=json.loads((receipt/'old-source.json').read_text())
          expected=source['selected_assets']
          root=temp/'deb-root'; debs=list(pathlib.Path('target/release/bundle/deb').glob('*.deb'))
          bin_candidates=list(root.rglob('auto-tundra'))
          bins=[path for path in bin_candidates if path.is_file() and not path.is_symlink()]
          assert len(debs)==1, f'expected one old-baseline installer, found {len(debs)}'
          assert len(bins)==1, (
              f'expected one regular non-symlink old-baseline binary; '
              f'found {len(bins)} among {len(bin_candidates)} named paths')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          proof=json.loads((receipt/'embedded-assets.json').read_text())
          rows={r['key']:r for r in proof['assets']}
          for name,digest in expected.items():
              key='duckdb-runtime/'+name
              assert sha(pathlib.Path('app/leptos-ui/duckdb-runtime')/name)==digest
              assert sha(pathlib.Path('app/leptos-ui/dist/duckdb-runtime')/name)==digest
              assert rows[key]['dist_sha256']==rows[key]['embedded_sha256']==digest
          bill_source=pathlib.Path('app/tauri/third-party-licenses/ui/duckdb-runtime-selected-bill.json')
          bills=list(root.rglob('duckdb-runtime-selected-bill.json'))
          assert len(bills)==1 and bills[0].read_bytes()==bill_source.read_bytes()
          bill_sha=sha(bills[0]);assert bill_sha=='34381cba60c8922a159f578753b55531460792372f2d72b22769da205fe97790'
          bill=json.loads(bills[0].read_text())
          assert bill['schema']=='tundra-duckdb-selected-notice-bill/v2' and bill['admission']=='NO'
          assert len(bill['assets'])==5 and len(bill['attributions'])==38 and len(bill['texts'])==36
          provenance={'schema':'tundra-old-installed-eh-baseline/v1','admission':'NO',
              'consumer_head':'ad0df7182cd4c9ea4a83bac04e5901de0218d9d0',
              'source_checkout_head':source['source_checkout_head'],
              'profile':'${{ matrix.profile }}','installed_pr119_bill_sha256':bill_sha,
              'installed_assets':{'duckdb-runtime/'+k:v for k,v in expected.items()},
              'installer_sha256':sha(debs[0]),'installed_elf_sha256':sha(bins[0]),
              'harness_sha256':sha(pathlib.Path('app/tauri/src/main.rs')),
              'old_ui_run':source['old_ui_run'],'old_ui_artifact_id':source['old_ui_artifact_id'],
              'old_ui_zip_sha256':source['old_ui_zip_sha256'],
              'offline':True,'csp_enforced':True}
          (receipt/'old-baseline-provenance.json').write_text(json.dumps(provenance,sort_keys=True)+'\n')
          (receipt/'installed-selected-bill.json').write_bytes(bills[0].read_bytes())
          PYBASE
      - name: Run forced EH in installed WebKitGTK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bins < <(find "$RUNNER_TEMP/deb-root" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          elf_sha="$(sha256sum "${bins[0]}" | cut -d ' ' -f1)"
          home="$RUNNER_TEMP/eh-smoke-home"
          mkdir -p "$home/home" "$home/config" "$home/data" "$home/cache"
          set +e
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            env HOME="$home/home" XDG_CONFIG_HOME="$home/config" \
              XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" \
              TUNDRA_SMOKE_HEAD_SHA="$CONSUMER_HEAD" \
              TUNDRA_SMOKE_PROFILE='${{ matrix.profile }}' \
              TUNDRA_SMOKE_VARIANT=eh TUNDRA_SMOKE_ELF_SHA256="$elf_sha" \
              http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
              HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              NO_PROXY=localhost,127.0.0.1,tauri.localhost \
            timeout 150s "${bins[0]}" --smoke-duckdb eh \
            > "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            2> "$RUNNER_TEMP/eh-semantic/webkit.stderr"
          status=$?
          set -e
          printf 'exit_status=%s\ninstalled_elf_sha256=%s\n' "$status" "$elf_sha" \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
          awk 'index($0, "TUNDRA_DUCKDB_SMOKE:") == 1 {
            print substr($0, length("TUNDRA_DUCKDB_SMOKE:") + 1)
          }' "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            > "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$(wc -l < "$RUNNER_TEMP/eh-semantic/webkit.json")" -eq 1
          jq -e --arg head "$CONSUMER_HEAD" --arg elf "$elf_sha" \
            --arg profile '${{ matrix.profile }}' '
            .schema == "tundra-duckdb-webkit-smoke/v1" and
            .head_sha == $head and .profile == $profile and
            .installed_elf_sha256 == $elf and .requested_variant == "eh" and
            .result.variant == "eh" and .ok == true and .result.ok == true and
            .result.exceptionOk == true and .result.cspDenied == true and
            .result.cspViolations == [] and .result.localRuntime == true and
            .result.remoteRequests == 0 and
            (.result.semanticObserved | fromjson | .sameConnection and .recovery and
              .targetedPathsOk and
              (.cases | length == 9)) and
            (.result.corpusObserved | fromjson |
              .schema == "tundra-installed-eh-corpus/v1" and
              .directConnection == "SEPARATE_SAME_INSTALLED_PAIR" and
              (.cases | length == 32) and
              (.cases | map(.id) | sort) == (["bridge-create", "bridge-json-insert",
                "bridge-empty-insert", "bridge-persist-null-utf8", "bridge-macro-create",
                "bridge-macro-query", "bridge-parser-error", "bridge-parser-recovery",
                "bridge-catalog-error", "bridge-catalog-recovery", "bridge-binder-error",
                "bridge-conversion-error", "bridge-after-errors", "bridge-arrow-json-types",
                "bridge-large-bigint-string", "installed-local-pair-urls",
                "installed-local-pair-bytes", "direct-arrow-schema", "direct-csv-register",
                "direct-csv-scan", "direct-csv-insert", "direct-json-register",
                "direct-json-scan", "direct-json-insert", "direct-parquet-copy",
                "direct-parquet-buffer", "direct-parquet-reregister", "direct-parquet-scan",
                "direct-file-error", "direct-after-error", "direct-arrow-invalid-ipc",
                "direct-after-arrow-error"] | sort) and
              all(.cases[]; (.passed | type) == "boolean" and
                (.skipped // false) == false and (.unsupported // false) == false) and
              (.passed | type) == "boolean" and
              .passed == all(.cases[]; .passed == true) and
              .skipped == [] and
              (.unsupported | sort) == ["arrow-positive-ipc", "multibatch-stream", "upstream-full-suite"])' "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$status" -eq 0
          printf 'installed_native_js_pair=PINNED_PR119_UI_PAIR_INSTALLED\n' \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
      - name: Retain old installed corpus environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYOLDENV'
          import json, os, pathlib, subprocess
          receipt=pathlib.Path(os.environ['RUNNER_TEMP'])/'eh-semantic'
          webkit=json.loads((receipt/'webkit.json').read_text())
          provenance=json.loads((receipt/'old-baseline-provenance.json').read_text())
          version=subprocess.check_output(['dpkg-query','-W','-f=${Version}','libwebkit2gtk-4.1-0'],text=True).strip()
          assert webkit['head_sha']==provenance['consumer_head']
          assert webkit['profile']==provenance['profile']
          assert webkit['installed_elf_sha256']==provenance['installed_elf_sha256']
          provenance['webkitgtk_version']=version
          (receipt/'old-baseline-provenance.json').write_text(json.dumps(provenance,sort_keys=True)+'\n')
          environment={'schema':'tundra-installed-eh-corpus-environment/v1','admission':'NO',
             'profile':provenance['profile'],'consumer_head':provenance['consumer_head'],
             'installed_elf_sha256':provenance['installed_elf_sha256'],
             'harness_sha256':provenance['harness_sha256'],'webkitgtk_version':version,
             'runner_os':'ubuntu-24.04','offline':True,'csp_enforced':True}
          (receipt/'corpus-environment.json').write_text(json.dumps(environment,sort_keys=True)+'\n')
          PYOLDENV
      - name: Enforce bounded diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/eh-semantic"
          mkdir -p "$out"
          cap=16777216
          candidate="$(du -sb "$out" | cut -f1)"
          if test "$candidate" -gt "$((cap - 1024))"; then
            mkdir -p "$RUNNER_TEMP/eh-refusal"
            printf 'schema=tundra-eh-old-receipt-refusal/v1\nproduct_admission=NO\nreceipt_upload=NO\nobserved_bytes=%s\ncap_bytes=%s\n' \
              "$candidate" "$cap" > "$RUNNER_TEMP/eh-refusal/refusal.txt"
            mv "$out" "$RUNNER_TEMP/eh-quarantine"
            exit 1
          fi
          printf 'schema=tundra-eh-old-receipt-budget/v1\nproduct_admission=NO\nreceipt_upload=YES\ncandidate_bytes=%s\ncap_bytes=%s\n' \
            "$candidate" "$cap" > "$out/receipt-budget.txt"
      - name: Retain old installed diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-old-${{ matrix.profile }}
          path: ${{ runner.temp }}/eh-semantic/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain bounded old receipt refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-old-refusal-${{ matrix.profile }}
          path: ${{ runner.temp }}/eh-refusal/
          if-no-files-found: ignore
          retention-days: 14
