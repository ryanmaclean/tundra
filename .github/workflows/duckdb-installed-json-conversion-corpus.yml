name: DuckDB six-cell installed JSON and Conversion corpus candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/duckdb-installed-json-conversion-corpus.yml
      - .github/scripts/duckdb-eh-corpus/apply-eh-corpus.nu
      - .github/scripts/duckdb-eh-corpus/authenticate-eh-artifacts.nu
      - .github/scripts/duckdb-eh-corpus/compare-json-conversion-v4.nu
      - .github/scripts/duckdb-eh-corpus/eh-corpus.mjs
      - .github/scripts/duckdb-json-selected-notices/yyjson-0.6.0-LICENSE
      - .github/scripts/duckdb-package-json-selected-bill-v5.nu

permissions:
  contents: read
  actions: read

jobs:
  library-sigs-lineage-registered-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr142-library-sigs-lineage-held-20261027' }}
    uses: ./.github/workflows/duckdb-library-sigs-lineage.yml
    permissions:
      contents: read
      actions: read

  sdk-dlmalloc-sockets-registered-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' }}
    uses: ./.github/workflows/duckdb-sdk-dlmalloc-sockets.yml
    permissions:
      contents: read
      actions: read

  sdk-three-registered-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr140-sdk-three-20261027' }}
    uses: ./.github/workflows/duckdb-sdk-three-notice.yml
    permissions:
      contents: read
      actions: read

  selected-notice-25-registered-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr139-selected-notice-25-20261027' }}
    uses: ./.github/workflows/duckdb-selected-notice-25.yml
    permissions:
      contents: read
      actions: read

  selected-eh-webkit-semantic-trial:
    if: ${{ github.ref != 'refs/heads/diagnostic/pr139-selected-notice-25-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr139-selected-notice-25-20261027' && github.ref != 'refs/heads/diagnostic/pr140-sdk-three-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr140-sdk-three-20261027' && github.ref != 'refs/heads/diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr141-sdk-dlmalloc-sockets-held-20261027' && github.ref != 'refs/heads/diagnostic/pr142-library-sigs-lineage-held-20261027' && github.event.pull_request.head.ref != 'diagnostic/pr142-library-sigs-lineage-held-20261027' }}
    name: Installed EH semantics (${{ matrix.condition }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        condition: [image, clean]
        profile: [default, sounds]
    env:
      # Exact PR119 consumer source, including its forced-EH smoke path.
      CONSUMER_HEAD: ad0df7182cd4c9ea4a83bac04e5901de0218d9d0
      PRODUCER_HEAD: 22637d141f67dc92510211d7d281f6591a12a5f5
      PRODUCER_RUN: "40434996466"
      PRODUCER_ATTEMPT: "1"
      PRODUCER_ARTIFACT_ID: "12705817192"
      PRODUCER_ZIP_SHA256: b25664ca46d4f4970aa7742e3e4927a2c55b53f9466bd5644854263e0b33ab6c
      PRODUCER_BILL_SHA256: 93c4637dcd0cf4527814267b38a242cc626ad64f92df0a9a52928d1edc036c0f
    steps:
      - name: Check out exact installed-consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad0df7182cd4c9ea4a83bac04e5901de0218d9d0
          persist-credentials: false
      - name: Check out exact diagnostic helper source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: gate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact selected-bill producer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 22637d141f67dc92510211d7d281f6591a12a5f5
          path: producer-source
          persist-credentials: false
      - name: Check out exact upstream worker source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: duckdb/duckdb-wasm
          ref: f955138e5218942fb3fb097a8fdcb725222406ff
          path: duckdb-upstream
          persist-credentials: false
      - name: Bind exact producer run, API, safe ZIP and both output pairs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_HEAD"
          test "$(git -C producer-source rev-parse HEAD)" = "$PRODUCER_HEAD"
          test "$(git -C producer-source hash-object .github/scripts/duckdb-selected-native-glue-bill-v1.nu)" = eaadc9293b9f9b9f850f39035cf0785a429d80b7
          printf '%s  %s\n' \
            dfb03cd2c17f6cb4aa8d2c68568d5c7829a1362b15a7c8aaa564db4b1385911c \
            producer-source/.github/scripts/duckdb-selected-native-glue-bill-v1.nu \
            58f8a95afeb3d41499dd89bb37a00f8b1dbab99a78da39a5fc7e9cb56b9604ca \
            producer-source/.github/receipts/duckdb-eh-js-glue-observed-v2.tsv \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/eh-semantic" "$RUNNER_TEMP/eh-input/input"
          base=https://api.github.com/repos/ryanmaclean/tundra
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/runs/$PRODUCER_RUN" -o "$RUNNER_TEMP/eh-semantic/producer-run.json"
          jq -e --arg head "$PRODUCER_HEAD" --argjson run "$PRODUCER_RUN" \
            --argjson attempt "$PRODUCER_ATTEMPT" \
            '.id == $run and .run_attempt == $attempt and .event == "workflow_dispatch" and
             .head_sha == $head and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/eh-semantic/producer-run.json"
          artifact="$PRODUCER_ARTIFACT_ID"
          zip_digest="$PRODUCER_ZIP_SHA256"
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/artifacts/$artifact" -o "$RUNNER_TEMP/eh-semantic/artifact.json"
          jq -e --argjson id "$artifact" --argjson run "$PRODUCER_RUN" \
            --arg head "$PRODUCER_HEAD" --arg digest "sha256:$zip_digest" \
            '.id == $id and .name == "duckdb-combined-custody-eh" and .digest == $digest and
             .expired == false and .workflow_run.id == $run and
             .workflow_run.head_sha == $head' "$RUNNER_TEMP/eh-semantic/artifact.json"
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" \
            "$base/actions/artifacts/$artifact/zip" -o "$RUNNER_TEMP/eh-input/artifact.zip"
          test "$(stat -c %s "$RUNNER_TEMP/eh-input/artifact.zip")" = \
            "$(jq -r .size_in_bytes "$RUNNER_TEMP/eh-semantic/artifact.json")"
          printf '%s  %s\n' "$zip_digest" "$RUNNER_TEMP/eh-input/artifact.zip" | sha256sum -c -
          python3 - <<'PYZIP'
          import hashlib, json, os, pathlib, shutil, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'eh-input'
          with zipfile.ZipFile(root / 'artifact.zip') as z:
              members = z.infolist()
              names = [i.filename for i in members]
              assert len(names) == len(set(names)) == 333
              assert sum(i.file_size for i in members) <= 419430400
              for i in members:
                  p = pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '\\' not in i.filename
                  assert all(part not in ('', '.', '..') for part in i.filename.rstrip('/').split('/'))
                  assert (i.external_attr >> 16) & 0o170000 in (0, 0o100000, 0o040000)
              assert z.testzip() is None
              required = {'image.js','image.wasm','clean.js','clean.wasm',
                          'image-output.sha256','clean-output.sha256','environment.txt',
                          'admission.txt','budget.txt','cache-source.txt',
                          'image-command.txt','clean-command.txt',
                          'image-sdk-selected.txt','clean-sdk-selected.txt',
                          'image-sdk-archives.tsv','clean-sdk-archives.tsv',
                          'image.map','clean.map','five-custody-assets.tsv',
                          'image-json-configuration.txt','clean-json-configuration.txt',
                          'image-json-link-selection.tsv','clean-json-link-selection.tsv',
                          'image-json-archive-members.txt','clean-json-archive-members.txt',
                          'image-linklibs.rsp','clean-linklibs.rsp',
                          'duckdb-applied.patch','webdb-fetch-error.patch',
                          'webdb-applied.patch',
                          'selected-native-glue-bill-v1.json',
                          'image-json-physical.tsv','clean-json-physical.tsv',
                          'image-json-member-bytes.tsv','clean-json-member-bytes.tsv',
                          'image-json-object-source.tsv','clean-json-object-source.tsv',
                          'image-arrow-instance-ledger.tsv','clean-arrow-instance-ledger.tsv',
                          'image-arrow-original.a','clean-arrow-original.a',
                          'image-js-generator-superset.tsv','clean-js-generator-superset.tsv',
                          'image-js-glue-legal-review.txt','clean-js-glue-legal-review.txt',
                          'image-legal-texts/emscripten-LICENSE',
                          'clean-legal-texts/emscripten-LICENSE',
                          'image-legal-texts/duckdb-wasm-LICENSE',
                          'clean-legal-texts/duckdb-wasm-LICENSE',
                          'yyjson-0.6.0-LICENSE'}
              assert required <= set(names)
              z.extractall(root / 'input')
          inp = root / 'input'
          env = (inp / 'environment.txt').read_text()
          for line in ('diagnostic_head=22637d141f67dc92510211d7d281f6591a12a5f5',
                       'source_head=0bb7c5237dc1b047de488d67ba30b5ed05c37383',
                       'custody_head=1d77df7776dca44731ae8267092e480a78f9f735',
                       'upstream_head=f955138e5218942fb3fb097a8fdcb725222406ff',
                       'variant=eh'):
              assert line in env.splitlines(), line
          adm = (inp / 'admission.txt').read_text()
          for line in ('product_admission=NO','source_build_admission=NO',
                       'glue_legal_admission=NO','json_installed_capability=UNVERIFIED',
                       'conversion_fetch_error_behavior=UNVERIFIED',
                       'json_selected_archive_bytes=RETAINED_BOUNDED'):
              assert line in adm.splitlines(), line
          budget = dict(line.split('=',1) for line in (inp / 'budget.txt').read_text().splitlines())
          assert budget['receipt_budget_bytes'] == '419430400'
          assert 0 < int(budget['candidate_bytes']) <= 419430400
          cache = (inp / 'cache-source.txt').read_text()
          assert 'clean_cache_empty_before_configure=YES' in cache
          assert 'image_selected_cache_classification=WARM_EXACT' in cache
          for cond, expected in [('image','ac2022967687136ec63c8917d77842f3c01f69291d2d024626e42a34d17953b8'),
                                 ('clean','d267671286a6f0718a6fe1d712cd209bda84ef53f5984d0303defeb55c9f5d99')]:
              lines = (inp / f'{cond}-output.sha256').read_text().splitlines()
              outputs = {pathlib.PurePosixPath(line.split('  ',1)[1]).name: line.split('  ',1)[0]
                         for line in lines}
              assert len(lines) == len(outputs) == 7
              assert set(outputs) == {f'{cond}{suffix}' for suffix in
                  ('.js','.wasm','-link.txt','-objects1.rsp','-linklibs.rsp',
                   '-CMakeCache.txt','.map')}
              assert outputs[f'{cond}.wasm'] == expected
              assert outputs[f'{cond}.js'] == 'fd610ecd2c58944726dc473ef8babc400581ae07df2a805b67f29a14b38695d3'
              for name in outputs:
                  assert hashlib.sha256((inp / name).read_bytes()).hexdigest() == outputs[name]
              assert 'EM_CACHE=' in (inp / f'{cond}-command.txt').read_text()
              selected = (inp / f'{cond}-sdk-selected.txt').read_text().splitlines()
              archives = (inp / f'{cond}-sdk-archives.tsv').read_text().splitlines()
              assert len(selected) == len(archives) == 9
              assert len({line.split('\t',1)[0] for line in archives}) == 9
              for line in archives:
                  name, digest, members = line.split('\t')
                  archive = inp / f'{cond}-bytes' / name
                  listing = inp / 'member-lists' / f'{cond}-{name}.txt'
                  assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
                  assert hashlib.sha256(listing.read_bytes()).hexdigest() == members
              assert (inp / f'{cond}.map').stat().st_size > 0
              configuration = (inp / f'{cond}-json-configuration.txt').read_text()
              for marker in ('json_sentinel=regular_zero_byte', 'excel_sentinel=absent',
                             'webdb_compile_json_define=YES', 'webdb_compile_nonloadable=YES',
                             'json_web_and_duckdb_archives_in_response_and_map=YES',
                             'json_selected_archive_bytes=RETAINED_BOUNDED'):
                  assert marker in configuration.splitlines(), (cond, marker)
              response = (inp / f'{cond}-linklibs.rsp').read_text().split()
              assert response.count('libduckdb_web_json.a') == 1
              assert response.count('third_party/duckdb/install/lib/libjson_extension.a') == 1
              selected_json = (inp / f'{cond}-json-link-selection.tsv').read_text().splitlines()
              assert len(selected_json) == 2
              assert {line.split('\t',1)[0] for line in selected_json} == {
                  'libduckdb_web_json.a','libjson_extension.a'}
              json_members = (inp / f'{cond}-json-archive-members.txt').read_text().splitlines()
              assert len(json_members) == 25 and len(set(json_members)) == 25
              assert 'libjson_extension.a\tyyjson.cpp.o' in json_members
              assert 'libjson_extension.a\tjson_scan.cpp.o' in json_members
          for name, digest in {
              'duckdb-applied.patch': 'e0311787a5902d557a7477aed2fefa5ecbc8fd0e15e382bf4dbad461a34e8a9c',
              'webdb-fetch-error.patch': '9fc2d55cc1eb02f274743f9990a5601cc35ce5688afec6edf01e7a3d40fc795c',
              'webdb-applied.patch': '93fd6e45b63e9249faa2e5816e22baf0e394b0ba13b70e0ee7a8dbce8206c023',
          }.items():
              assert hashlib.sha256((inp / name).read_bytes()).hexdigest() == digest
          assert len((inp / 'five-custody-assets.tsv').read_text().splitlines()) == 5
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, f'duplicate JSON key: {key}'
                  result[key] = value
              return result
          bill_path = inp / 'selected-native-glue-bill-v1.json'
          bill_bytes = bill_path.read_bytes()
          assert hashlib.sha256(bill_bytes).hexdigest() == os.environ['PRODUCER_BILL_SHA256']
          bill = json.loads(bill_bytes, object_pairs_hook=unique_object)
          assert bill['schema'] == 'selected-native-glue-bill/v1'
          assert bill['producer_diagnostic_head'] == os.environ['PRODUCER_HEAD']
          assert bill['pinned_source_head'] == '0bb7c5237dc1b047de488d67ba30b5ed05c37383'
          assert bill['pinned_custody_head'] == '1d77df7776dca44731ae8267092e480a78f9f735'
          assert bill['pinned_upstream_head'] == 'f955138e5218942fb3fb097a8fdcb725222406ff'
          assert bill['run_id'] == os.environ['PRODUCER_RUN']
          assert bill['run_attempt'] == os.environ['PRODUCER_ATTEMPT']
          assert bill['artifact_name'] == 'duckdb-combined-custody-eh'
          assert bill['artifact_id'] == bill['artifact_digest'] == 'PENDING_UPLOAD_API_JOIN'
          for key, value in {'selected_graph_exhaustive':'NO',
                             'generator_input_closure':'UNPROVEN',
                             'glue_legal_admission':'NO','legal_admission':'NO',
                             'product_admission':'NO','fleet_admission':'NO'}.items():
              assert bill[key] == value
          outputs = {row['condition']: row for row in bill['condition_outputs']}
          assert len(outputs) == len(bill['condition_outputs']) == 2
          assert set(outputs) == {'image','clean'}
          rows = bill['rows']
          assert len(rows) == len({row['key'] for row in rows}) == 142
          expected_family = {'json':25,'arrow':1,'sdk':9,'glue':36}
          for condition in ('image','clean'):
              part = [row for row in rows if row['condition'] == condition]
              assert len(part) == 71
              for family, count in expected_family.items():
                  assert sum(row['family'] == family for row in part) == count
              assert outputs[condition]['js_sha256'] == hashlib.sha256((inp / f'{condition}.js').read_bytes()).hexdigest()
              assert outputs[condition]['wasm_sha256'] == hashlib.sha256((inp / f'{condition}.wasm').read_bytes()).hexdigest()
              assert outputs[condition]['map_sha256'] == hashlib.sha256((inp / f'{condition}.map').read_bytes()).hexdigest()
          ledger = pathlib.Path('producer-source/.github/receipts/duckdb-eh-js-glue-observed-v2.tsv')
          for row in rows:
              assert row['key'].startswith(row['condition'] + '/' + row['family'] + '/')
              assert row['status'] != 'TOP_LEVEL_NOTICE_CANDIDATE_UNREVIEWED'
              for path_key, hash_key in (('witness_path','witness_sha256'),
                                          ('source_join_witness_path','source_join_witness_sha256')):
                  rel = row[path_key]
                  path = ledger if rel == '.github/receipts/duckdb-eh-js-glue-observed-v2.tsv' else inp / rel
                  assert not pathlib.PurePosixPath(rel).is_absolute() and '..' not in pathlib.PurePosixPath(rel).parts
                  assert path.is_file() and not path.is_symlink()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == row[hash_key]
              if row['notice_sha256'] != 'UNRESOLVED':
                  rel = row['notice_path']
                  if rel == 'yyjson-0.6.0-LICENSE':
                      path = inp / rel
                  elif rel in ('emscripten/LICENSE','duckdb-wasm/LICENSE'):
                      path = inp / f"{row['condition']}-legal-texts" / rel.replace('/', '-')
                  else:
                      raise AssertionError('unexpected selected notice path')
                  assert path.is_file() and not path.is_symlink()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == row['notice_sha256']
          shutil.copyfile(bill_path, root.parent / 'eh-semantic' / 'producer-selected-bill.json')
          PYZIP
          condition='${{ matrix.condition }}'
          wasm_digest="$(sha256sum "$RUNNER_TEMP/eh-input/input/$condition.wasm" | cut -d ' ' -f1)"
          js_digest="$(sha256sum "$RUNNER_TEMP/eh-input/input/$condition.js" | cut -d ' ' -f1)"
          {
            printf 'schema=tundra-selected-eh-installed-semantic/v2\n'
            printf 'admission=NO\nfull_EH_semantics=NO\ngenerated_JS_pair_admission=NO\n'
            printf 'legal_source_build_admission=NO\nproduct_fleet_admission=NO\ninstalled_native_js_pair=AWAITING_SAME_RUN_BUILD\n'
            printf 'consumer_head=%s\nproducer_head=%s\nproducer_run=%s\nproducer_attempt=%s\nproducer_bill_sha256=%s\n' \
              "$CONSUMER_HEAD" "$PRODUCER_HEAD" "$PRODUCER_RUN" "$PRODUCER_ATTEMPT" "$PRODUCER_BILL_SHA256"
            printf 'artifact_id=%s\nartifact_zip_sha256=%s\n' "$artifact" "$zip_digest"
            printf 'condition=%s\nprofile=%s\nwasm_sha256=%s\ngenerated_js_sha256=%s\n' \
              "$condition" '${{ matrix.profile }}' "$wasm_digest" "$js_digest"
          } > "$RUNNER_TEMP/eh-semantic/source.txt"
          cp "$RUNNER_TEMP/eh-input/input/"{image,clean}-output.sha256 "$RUNNER_TEMP/eh-semantic/"
          cp "$RUNNER_TEMP/eh-input/input/"{environment,admission,budget,cache-source}.txt "$RUNNER_TEMP/eh-semantic/"
      - name: Install Linux WebKitGTK and Tauri build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt_bounded() {
            local label="$1" limit="$2" attempt rc effective_limit
            shift 2
            for attempt in 1 2; do
              effective_limit="$limit"
              if [[ "$label" == base-install && "$attempt" -eq 2 ]]; then
                effective_limit=1800
              fi
              if timeout --signal=TERM --kill-after=20s "${effective_limit}s" \
                sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \
                -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                printf 'prereq=%s attempt=%s limit_seconds=%s result=PASS\n' \
                  "$label" "$attempt" "$effective_limit" \
                  >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
                return 0
              else
                rc=$?
              fi
              printf 'prereq=%s attempt=%s limit_seconds=%s exit=%s\n' \
                "$label" "$attempt" "$effective_limit" "$rc" \
                >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
              if [[ "$attempt" -eq 2 || ( "$rc" -ne 100 && "$rc" -ne 124 ) ]]; then
                return "$rc"
              fi
              sleep 10
            done
          }
          apt_bounded update 300 update
          apt-cache policy libwebkit2gtk-4.1-0 > "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt"
          webkit_candidate="$(awk '$1 == "Candidate:" { print $2 }' \
            "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt")"
          test -n "$webkit_candidate" && test "$webkit_candidate" != '(none)'
          test "$(grep -c '^[[:space:]]*Candidate:' \
            "$RUNNER_TEMP/eh-semantic/apt-webkit-policy.txt")" -eq 1
          apt-cache madison libwebkit2gtk-4.1-0 > "$RUNNER_TEMP/eh-semantic/apt-webkit-madison.txt"
          apt-cache policy > "$RUNNER_TEMP/eh-semantic/apt-source-policy.txt"
          python3 - "$webkit_candidate" "$RUNNER_TEMP/eh-semantic" <<'PYAPT'
          from hashlib import sha256
          from pathlib import Path
          from urllib.parse import urlparse
          import json, re, sys
          version, root = sys.argv[1], Path(sys.argv[2])
          policy = (root / 'apt-source-policy.txt').read_text().splitlines()
          hosts = {'azure.archive.ubuntu.com', 'archive.ubuntu.com',
                   'security.ubuntu.com'}
          def official_url(value):
              parsed = urlparse(value)
              return (parsed.scheme in ('http', 'https') and
                      parsed.hostname in hosts and parsed.port is None and
                      parsed.username is None and parsed.password is None and
                      parsed.path.rstrip('/') == '/ubuntu' and
                      not parsed.query and not parsed.fragment)
          mirror_token = 'mirror+file:/etc/apt/apt-mirrors.txt'
          mirror_sha = None
          def official_source(value):
              global mirror_sha
              if official_url(value):
                  return True
              if value != mirror_token:
                  return False
              path = Path('/etc/apt/apt-mirrors.txt')
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              assert 0 < len(data) <= 4096
              mirror_sha = sha256(data).hexdigest()
              (root / 'apt-mirrors.sha256').write_text(mirror_sha + '\n')
              classes = {'cr': [], 'tab': [], 'non_ascii': [],
                         'other_control': [], 'lf': []}
              for offset, byte in enumerate(data):
                  if byte == 13: classes['cr'].append(offset)
                  elif byte == 9: classes['tab'].append(offset)
                  elif byte == 10: classes['lf'].append(offset)
                  elif byte >= 128: classes['non_ascii'].append(offset)
                  elif byte < 32 or byte == 127:
                      classes['other_control'].append(offset)
              lines = data.split(b'\n')
              shapes = []
              for raw_line in lines[:32]:
                  shape = {'bytes': len(raw_line),
                           'ends_cr': raw_line.endswith(b'\r'),
                           'has_non_ascii': any(byte >= 128 for byte in raw_line)}
                  if not shape['has_non_ascii']:
                      line = raw_line.decode('ascii').strip(' \t\r')
                      try:
                          parsed = urlparse(line)
                          host = parsed.hostname
                      except ValueError:
                          parsed, host = None, None
                      shape.update({
                          'scheme': (parsed.scheme if parsed and
                                     parsed.scheme in ('http', 'https') else 'OTHER'),
                          'host_class': ('APPROVED' if host in hosts else
                                         'OTHER' if host else 'NONE'),
                          'path_class': ('UBUNTU_ROOT' if parsed and
                                         parsed.path.rstrip('/') == '/ubuntu'
                                         else 'OTHER'),
                          'has_userinfo': b'@' in raw_line,
                          'has_query': b'?' in raw_line,
                          'has_fragment': b'#' in raw_line})
                  shapes.append(shape)
              (root / 'apt-mirrors-shape.json').write_text(json.dumps({
                  'schema': 'tundra-apt-mirror-shape/v1', 'bytes': len(data),
                  'sha256': mirror_sha,
                  'byte_classes': {name: {'count': len(offsets),
                                          'positions_zero_based': offsets}
                                   for name, offsets in classes.items()},
                  'line_lengths': [len(line) for line in lines],
                  'lines_reported': len(shapes), 'line_shapes': shapes,
              }, sort_keys=True) + '\n')
              try:
                  mirror_text = data.decode('utf-8')
              except UnicodeDecodeError:
                  safety = 'INVALID_UTF8'
              else:
                  if any(char in '@?#' for char in mirror_text):
                      safety = 'SENSITIVE_DELIMITER'
                  elif any(char not in ('\n', '\t') and
                           not 32 <= ord(char) <= 126 for char in mirror_text):
                      safety = 'CONTROL_OR_NONASCII'
                  else:
                      safety = 'SAFE_ASCII_MIRROR_TEXT'
              (root / 'apt-mirrors-safety.txt').write_text(
                  f'bytes={len(data)}\nsha256={mirror_sha}\nraw_retained=NO'
                  f'\nreason={safety}\n')
              assert safety == 'SAFE_ASCII_MIRROR_TEXT', \
                  'unsafe mirror list; raw bytes withheld'
              entries = []
              for line in mirror_text.splitlines():
                  assert line, 'empty mirror line'
                  if '\t' in line:
                      assert line.count('\t') == 1, 'multiple mirror metadata tabs'
                      url, metadata = line.split('\t')
                      assert re.fullmatch(r'priority:[0-9]', metadata), \
                          'unapproved mirror metadata'
                      entries.append((url, True))
                  else:
                      entries.append((line, False))
                  assert official_url(entries[-1][0]), 'unapproved mirror URL'
              assert 1 <= len(entries) <= 8, 'mirror entry count drift'
              assert len({with_metadata for _, with_metadata in entries}) == 1, \
                  'mixed mirror metadata forms'
              (root / 'apt-mirrors.txt').write_bytes(data)
              assert (root / 'apt-mirrors.txt').read_bytes() == data
              (root / 'apt-mirrors-safety.txt').write_text(
                  f'bytes={len(data)}\nsha256={mirror_sha}\nraw_retained=YES'
                  '\nreason=APPROVED_CANONICAL_MIRROR_LIST\n')
              return True
          selected = []
          for row in (root / 'apt-webkit-madison.txt').read_text().splitlines():
              fields = [part.strip() for part in row.split('|')]
              if fields[:2] != ['libwebkit2gtk-4.1-0', version]:
                  continue
              assert len(fields) == 3, 'malformed candidate source row'
              source = fields[2]
              parts = source.split()
              assert (len(parts) == 4 and parts[-1] == 'Packages' and
                      parts[1] in ('noble/main', 'noble-updates/main',
                                   'noble-security/main') and
                      parts[2] == 'amd64' and official_source(parts[0])), \
                  'unapproved candidate WebKit source'
              matched = False
              for index, line in enumerate(policy[:-1]):
                  if not re.fullmatch(r'\s*\d+\s+' + re.escape(source), line):
                      continue
                  release = policy[index + 1].strip()
                  if (release.startswith('release ') and
                      re.search(r'(?:^|,)o=Ubuntu(?:,|$)', release[8:]) and
                      re.search(r'(?:^|,)l=Ubuntu(?:,|$)', release[8:])):
                      selected.append((source, release))
                      matched = True
              assert matched, 'candidate WebKit source lacks Ubuntu Release join'
          assert selected, 'candidate WebKit version lacks authenticated Ubuntu archive origin'
          (root / 'apt-webkit-origin.txt').write_text(
              'candidate_version=' + version + '\n' +
              ('mirror_sha256=' + mirror_sha + '\n' if mirror_sha else '') +
              ''.join('source=' + source + '\n' + 'release=' + release + '\n'
                      for source, release in sorted(set(selected))))
          PYAPT
          printf 'webkit_candidate_version=%s\n' "$webkit_candidate" \
            >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
          apt_bounded base-install 900 install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget xvfb dbus-x11
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            apt_bounded sounds-install 300 install -y --no-install-recommends libasound2-dev
          fi
          installed_webkit="$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)"
          installed_status="$(dpkg-query -W -f='${db:Status-Abbrev}' libwebkit2gtk-4.1-0)"
          test "$installed_webkit" = "$webkit_candidate"
          test "$installed_status" = 'ii '
          printf 'webkit_installed_version=%s\n' "$installed_webkit" \
            >> "$RUNNER_TEMP/eh-semantic/prereq.txt"
          dpkg-query -W -f='${Package}\t${Version}\t${db:Status-Abbrev}\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv"
          test -s "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv"
          test "$(awk -F '\t' -v version="$installed_webkit" \
            '$1 == "libwebkit2gtk-4.1-0" && $2 == version && $3 == "ii " \
              { n++ } END { print n+0 }' \
            "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv")" -eq 1
          sha256sum "$RUNNER_TEMP/eh-semantic/apt-installed-packages.tsv" \
            > "$RUNNER_TEMP/eh-semantic/apt-installed-packages.sha256"
