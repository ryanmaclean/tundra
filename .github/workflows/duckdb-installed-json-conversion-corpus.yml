              'producer_bill_sha256': os.environ['PRODUCER_BILL_SHA256'],
              'condition_output': selected_outputs[0],
              'selected_link_map_sha256': map_hash,
              'selected_sdk_archives': selected,
              'arrow_archive_sha256_producer_attested': arrow_hash,
              'arrow_archive_bytes_retained': 'YES_BOUNDED',
              'json_selected_archive_bytes': 'RETAINED_BOUNDED',
              'json_selected_members_bill_sha256': sha(producer / f'{condition}-json-archive-members.txt'),
              'json_selected_link_selection_sha256': sha(producer / f'{condition}-json-link-selection.tsv'),
