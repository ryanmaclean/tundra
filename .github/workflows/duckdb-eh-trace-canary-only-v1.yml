name: DuckDB EH trace canary only v1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  canary-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29
    steps:
      - name: Initialize fixed canary-only refusal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /work/image
          mkdir -p /work/image/receipt /work/image/tool /work/image/trace-private
          chmod 0700 /work/image/trace-private
          printf '%s\n' '{"schema":"tundra-eh-seeded-link-trace/v1","status":"REFUSED","reason":"CANARY_ONLY_NOT_COMPLETED","actual_eh_linker_child":"UNPROVEN","linker_archive_read":"UNPROVEN","same_run_traced_outputs":"UNPROVEN","legal_admission":"NO","product_admission":"NO","fleet_admission":"NO"}' > /work/image/receipt/refusal.json
      - name: Check out exact held gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: gate
          persist-credentials: false
      - name: Run pinned live tracer canary without EH build
        id: canary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/diagnostic/eh-seeded-link-repin-20261106
          timeout 180s curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 120 --retry 1 --max-filesize 90000000 --output /work/image/tool/nu.tar.gz https://github.com/nushell/nushell/releases/download/0.115.1/nu-0.115.1-x86_64-unknown-linux-musl.tar.gz
          test "$(stat -c %s /work/image/tool/nu.tar.gz)" = 83545998
          printf '%s  %s\n' 8a9722177ddd421eba927b4baae4ae341a4d1c3434504be7b1b17d998bafdd87 /work/image/tool/nu.tar.gz | sha256sum --check --status
          tar -xOzf /work/image/tool/nu.tar.gz nu-0.115.1-x86_64-unknown-linux-musl/nu > /work/image/tool/nu
          tar -xOzf /work/image/tool/nu.tar.gz nu-0.115.1-x86_64-unknown-linux-musl/LICENSE > /work/image/tool/LICENSE
          printf '%s  %s\n' c343a927a2d4a45ebf9300d013b226bcdc2598ecb0178a8a79722ebffe71e56e /work/image/tool/nu ff5dcaaba6140ec57cafdd4f707cd0d329e727477cf7d5b9ba7a244ec2678b79 /work/image/tool/LICENSE | sha256sum --check --status
          chmod 0700 /work/image/tool/nu
          test "$(/work/image/tool/nu --version)" = 0.115.1
          /work/image/tool/nu gate/.github/scripts/duckdb-eh-seeded-link-trace-v1-test.nu
          timeout 90s curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 600000 --output /work/image/tool/strace.deb https://archive.ubuntu.com/ubuntu/pool/main/s/strace/strace_5.16-0ubuntu3_amd64.deb
          test "$(stat -c %s /work/image/tool/strace.deb)" = 566994
          printf '%s  %s\n' 847a3535be015325f127f121d2ea5ac042b32bd20a5861a94cb7782b09857b1f /work/image/tool/strace.deb | sha256sum --check --status
          test "$(dpkg-deb -f /work/image/tool/strace.deb Package)" = strace
          test "$(dpkg-deb -f /work/image/tool/strace.deb Version)" = 5.16-0ubuntu3
          test "$(dpkg-deb -f /work/image/tool/strace.deb Architecture)" = amd64
          dpkg-deb -x /work/image/tool/strace.deb /work/image/tool/strace
          tracer=/work/image/tool/strace/usr/bin/strace
          printf '%s  %s\n' 38a5c75cb29dd85ddd7780d54f5bf595554d7a1b5c42524b23065f5dc4c4b01d "$tracer" | sha256sum --check --status
          timeout 90s curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 60000 --output /work/image/tool/libunwind.deb https://archive.ubuntu.com/ubuntu/pool/main/libu/libunwind/libunwind8_1.3.2-2build2.1_amd64.deb
          test "$(stat -c %s /work/image/tool/libunwind.deb)" = 54518
          printf '%s  %s\n' 781e3eb86986ab93e8b4866fc571fdec780c3d9a8b56b490e9c2f10fb90978ce /work/image/tool/libunwind.deb | sha256sum --check --status
          test "$(dpkg-deb -f /work/image/tool/libunwind.deb Package)" = libunwind8
          test "$(dpkg-deb -f /work/image/tool/libunwind.deb Version)" = 1.3.2-2build2.1
          test "$(dpkg-deb -f /work/image/tool/libunwind.deb Architecture)" = amd64
          dpkg-deb -x /work/image/tool/libunwind.deb /work/image/tool/libunwind
          libdir=/work/image/tool/libunwind/usr/lib/x86_64-linux-gnu
          printf '%s  %s\n' \
            f791a9b0b01faa13a65ee066d2351d2e38a23d6c3752f75eebeaf0fc5c7d56f4 "$libdir/libunwind-ptrace.so.0.0.0" \
            1077e265bdd76ed4f2d628ea29150eb98f5c7c8f5a30004a561e6e93a2a6f097 "$libdir/libunwind-x86_64.so.8.0.1" \
            5d1f6f104f79698e137c9f17c4b0317dfd96816c0eb6a87c50619a41472ca382 "$libdir/libunwind.so.8.0.1" \
            | sha256sum --check --status
          test "$(readlink "$libdir/libunwind-ptrace.so.0")" = libunwind-ptrace.so.0.0.0
          test "$(readlink "$libdir/libunwind-x86_64.so.8")" = libunwind-x86_64.so.8.0.1
          test "$(readlink "$libdir/libunwind.so.8")" = libunwind.so.8.0.1
          test "$(dpkg-query -W -f='${Version}' libc6)" = 2.35-0ubuntu3.4
          test "$(dpkg-query -W -f='${Version}' liblzma5)" = 5.2.5-2ubuntu1
          printf '%s  %s\n' \
            e833bd99168bea158d2f2e5d32462479cacfb624003304a9ea74a1607a144f1f /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 \
            2e15e345ccba1e1e8bf3bc58938d13eb7ccc17044942f0376cd5bc771f429b79 /lib/x86_64-linux-gnu/libc.so.6 \
            493cb401ab4aa3bba611ca464d12996afb3b327940d29476f535f999e167439b /lib/x86_64-linux-gnu/liblzma.so.5 \
            | sha256sum --check --status
          loader=/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
          test "$(timeout 10s "$loader" --library-path "$libdir" "$tracer" --version | head -1)" = 'strace -- version 5.16'
          # Bounded parser controls; all captured bytes are fixed dummy inputs.
          /work/image/tool/nu -c 'use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu execve_ellipsis_self_test; execve_ellipsis_self_test gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          mkdir -m 0700 /work/image/trace-private/execve-fixture
          printf -v execve_dummy '%0300d' 0
          timeout 15s "$loader" --library-path "$libdir" "$tracer" -s 256 -e trace=execve \
            -o /work/image/trace-private/execve-fixture/trace.123 /bin/true "$execve_dummy" \
            > /work/image/trace-private/execve-canary.log 2>&1
          python3 - <<'PYEXEC'
          from pathlib import Path
          p = Path('/work/image/trace-private/execve-fixture/trace.123')
          if p.is_symlink() or not p.is_file() or p.stat().st_size > 8192:
              raise SystemExit('execve fixture refused')
          rows = p.read_bytes().splitlines()
          if not rows or not rows[0].startswith(b'execve("/bin/true",') or b'...' not in rows[0] or rows[-1] != b'+++ exited with 0 +++':
              raise SystemExit('execve fixture refused')
          archive = b'/work/image/cache/sysroot/lib/wasm32-emscripten/libnoexit.a'
          first = rows[0].replace(b'/bin/true', b'/emsdk/upstream/bin/wasm-ld', 1)
          p.write_bytes(first + b'\nopenat(AT_FDCWD, "' + archive + b'", O_RDONLY) = 3<' + archive + b'>\nread(3<' + archive + b'>, "") = 1\n' + rows[-1] + b'\n')
          PYEXEC
          /work/image/tool/nu -c 'use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu witness; witness gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json /work/image/trace-private/execve-fixture 6e5c12aab29b80db118acd16c08953257683ed11c415970f8320ed777997eec7 /work/image/trace-private/execve-fixture-receipt.json'
          python3 - <<'PYEXECRESULT'
          import json
          from pathlib import Path
          p = Path('/work/image/trace-private/execve-fixture-receipt.json')
          data = json.loads(p.read_text())
          if data.get('status') != 'FIXTURE_DIRECT_READ_SHAPE' or data.get('actual_eh_linker_child') != 'UNPROVEN' or data.get('linker_archive_read') != 'UNPROVEN':
              raise SystemExit('execve fixture receipt refused')
          PYEXECRESULT
          # Exercise the exact fixed-enum scanner from the pinned full workflow.
          # The trace is generated entirely from a fixed dummy anonymous map.
          timeout 15s "$loader" --library-path "$libdir" "$tracer" -s 256 -e trace=mmap \
            -o /work/image/trace-private/mmap-dummy.trace python3 -c 'import mmap,ctypes; a=mmap.mmap(-1,4096,flags=mmap.MAP_PRIVATE|mmap.MAP_ANONYMOUS); b=mmap.mmap(-1,4096,flags=mmap.MAP_SHARED|mmap.MAP_ANONYMOUS); c=mmap.mmap(-1,4096,flags=mmap.MAP_PRIVATE|mmap.MAP_ANONYMOUS|0x4000); l=ctypes.CDLL(None); l.mmap.restype=ctypes.c_void_p; l.mmap.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_int,ctypes.c_int,ctypes.c_int,ctypes.c_long]; l.munmap.argtypes=[ctypes.c_void_p,ctypes.c_size_t]; p=l.mmap(None,4096,3,0x22,-1,0); assert p != ctypes.c_void_p(-1).value; q=l.mmap(p,4096,3,0x32,-1,0); assert q == p; assert l.munmap(q,4096)==0' \
            > /work/image/trace-private/mmap-dummy.log 2>&1
          python3 - <<'PYMMAPCANARY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import textwrap
          source = Path('gate/.github/workflows/duckdb-eh-seeded-image-link-trace-v1.yml').read_text()
          start_marker = "          if classification == 'MMAP_SHAPE_AMBIGUOUS':\n"
          end_marker = "          encoded = json.dumps(data, separators=(',', ':'), sort_keys=True) + '\\n'\n"
          if source.count(start_marker) != 1:
              raise SystemExit('mmap diagnostic source refused')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = textwrap.dedent(source[start:end])
          dummy = Path('/work/image/trace-private/mmap-dummy.trace')
          if dummy.is_symlink() or not dummy.is_file() or not 0 < dummy.stat().st_size <= 65536:
              raise SystemExit('mmap dummy refused')
          records = dummy.read_bytes().splitlines(keepends=True)
          private = [line for line in records if line.startswith(b'mmap(NULL, ') and b'MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)' in line and re.search(rb'\) = 0x[0-9a-f]+\n$', line)]
          shared = [line for line in records if line.startswith(b'mmap(NULL, ') and b'MAP_SHARED|MAP_ANONYMOUS, -1, 0)' in line and re.search(rb'\) = 0x[0-9a-f]+\n$', line)]
          noreserve = [line for line in records if line.startswith(b'mmap(NULL, ') and b'MAP_NORESERVE' in line and b', -1, 0)' in line and re.search(rb'\) = 0x[0-9a-f]+\n$', line)]
          fixed = [line for line in records if line.startswith(b'mmap(0x') and b'MAP_FIXED|MAP_ANONYMOUS, -1, 0)' in line and re.search(rb'\) = 0x[0-9a-f]+\n$', line)]
          if not private or not shared or not noreserve or not fixed:
              raise SystemExit('mmap dummy refused')
          fixture = Path('/work/image/trace-private/mmap-fixture')
          fixture.mkdir(mode=0o700)
          (fixture / 'trace.123').write_bytes(b'execve("/emsdk/upstream/bin/wasm-ld", [], 0x1) = 0\n' + private[0] + shared[0] + fixed[0] + noreserve[0])
          block = block.replace("Path('/work/image/trace-raw')", "Path('/work/image/trace-private/mmap-fixture')")
          classification = 'MMAP_SHAPE_AMBIGUOUS'
          data = {'parser_diagnostic': {'failure_class': classification}}
          exec(compile(block, '<fixed-mmap-diagnostic>', 'exec'))
          if data['parser_diagnostic'].get('mmap_class') != 'NEGATIVE_FD_SUCCESS':
              raise SystemExit('mmap fixture refused')
          archive = b'/work/image/cache/sysroot/lib/wasm32-emscripten/libnoexit.a'
          begin = b'execve("/emsdk/upstream/bin/wasm-ld", [], 0x1) = 0\nopenat(AT_FDCWD, "' + archive + b'", O_RDONLY) = 3<' + archive + b'>\n' + private[0] + shared[0] + fixed[0]
          end = b'+++ exited with 0 +++\n'
          for name, tail in (('anon-no-read', b''), ('anon-with-read', b'read(3<' + archive + b'>, "") = 1\n')):
              directory = Path('/work/image/trace-private') / name
              directory.mkdir(mode=0o700)
              (directory / 'trace.123').write_bytes(begin + tail + end)
          PYMMAPCANARY
          /work/image/tool/nu -c 'use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu anonymous_mmap_self_test; anonymous_mmap_self_test gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          /work/image/tool/nu -c "$(cat <<'NUANON'
          use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu [witness parser_failure_class]
          let ledger = 'gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          let digest = '6e5c12aab29b80db118acd16c08953257683ed11c415970f8320ed777997eec7'
          let result = (try { witness $ledger /work/image/trace-private/anon-no-read $digest /work/image/trace-private/anon-no-read.json; 'ACCEPTED' } catch {|e| parser_failure_class $e.msg })
          if $result != 'REFUSED_DIRECT_READ_NOT_PROVED' { error make {msg: 'anonymous no-read control refused'} }
          witness $ledger /work/image/trace-private/anon-with-read $digest /work/image/trace-private/anon-with-read.json
          NUANON
          )"
          # Exercise only fixed dummy paths and keep all trace bytes private.
          printf '%s\n' dummy > /work/image/trace-private/open-fixture-file
          printf '%s\n' dummy > /work/image/trace-private/open-trunc-file
          timeout 15s "$loader" --library-path "$libdir" "$tracer" -yy -s 256 -e trace=open,openat \
            -o /work/image/trace-private/open-dummy.trace python3 -c 'import os; p="/work/image/trace-private/"; f=os.open(p+"open-fixture-file",os.O_RDONLY); os.close(f); t=os.open(p+"open-trunc-file",os.O_RDONLY|os.O_TRUNC); os.close(t); exec("try:\n os.open(p+\"open-absent-file\",os.O_RDONLY)\nexcept FileNotFoundError:\n pass\ntry:\n os.open(p+\"open-fixture-file\",os.O_RDONLY|os.O_DIRECTORY)\nexcept NotADirectoryError:\n pass")' \
            > /work/image/trace-private/open-dummy.log 2>&1
          python3 - <<'PYOPENCANARY'
          import os
          from pathlib import Path
          import re
          import stat
          import textwrap
          source = Path('gate/.github/workflows/duckdb-eh-seeded-image-link-trace-v1.yml').read_text()
          start_marker = "          if classification == 'OPEN_SHAPE_AMBIGUOUS':\n"
          end_marker = "          encoded = json.dumps(data, separators=(',', ':'), sort_keys=True) + '\\n'\n"
          if source.count(start_marker) != 1:
              raise SystemExit('open diagnostic source refused')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = textwrap.dedent(source[start:end])
          dummy = Path('/work/image/trace-private/open-dummy.trace')
          if dummy.is_symlink() or not dummy.is_file() or not 0 < dummy.stat().st_size <= 1048576:
              raise SystemExit('open dummy refused')
          records = dummy.read_bytes().splitlines(keepends=True)
          good = [line for line in records if b'/work/image/trace-private/open-fixture-file' in line and b'O_DIRECTORY' not in line]
          trunc = [line for line in records if b'/work/image/trace-private/open-trunc-file' in line and b'O_TRUNC' in line]
          missing = [line for line in records if b'/work/image/trace-private/open-absent-file' in line]
          failed = [line for line in records if b'/work/image/trace-private/open-fixture-file' in line and b'O_DIRECTORY' in line]
          if len(good) != 1 or len(trunc) != 1 or len(missing) != 1 or len(failed) != 1:
              raise SystemExit('open dummy refused')
          fixture = Path('/work/image/trace-private/open-fixture')
          fixture.mkdir(mode=0o700)
          (fixture / 'trace.123').write_bytes(b'execve("/emsdk/upstream/bin/wasm-ld", [], 0x1) = 0\n' + good[0] + missing[0] + failed[0])
          block = block.replace("Path('/work/image/trace-raw')", "Path('/work/image/trace-private/open-fixture')")
          classification = 'OPEN_SHAPE_AMBIGUOUS'
          direct_open_detail = 'UNAVAILABLE'
          data = {'parser_diagnostic': {'failure_class': classification}}
          exec(compile(block, '<fixed-open-diagnostic>', 'exec'))
          if data['parser_diagnostic'].get('open_class') != 'OPENAT_FAILED_RETURN':
              raise SystemExit('open fixture refused')
          archive = b'/work/image/cache/sysroot/lib/wasm32-emscripten/libnoexit.a'
          begin = b'execve("/emsdk/upstream/bin/wasm-ld", [], 0x1) = 0\nopenat(AT_FDCWD, "' + archive + b'", O_RDONLY) = 3<' + archive + b'>\n' + missing[0]
          end = b'+++ exited with 0 +++\n'
          for name, tail in (('missing-no-read', b''), ('missing-with-read', b'read(3<' + archive + b'>, "") = 1\n')):
              directory = Path('/work/image/trace-private') / name
              directory.mkdir(mode=0o700)
              (directory / 'trace.123').write_bytes(begin + tail + end)
          for name, record, dummy in (('flags-good', good[0], b'/work/image/trace-private/open-fixture-file'), ('flags-trunc', trunc[0], b'/work/image/trace-private/open-trunc-file')):
              if not re.match(rb'^openat\(AT_FDCWD</[^>]+>, "', record):
                  raise SystemExit('cwd annotation fixture refused')
              fd = re.search(rb'\) = ([0-9]+)<', record)
              if fd is None or record.count(dummy) != 2:
                  raise SystemExit('open fd fixture refused')
              synthetic = record.replace(dummy, archive)
              prefix = b'execve("/emsdk/upstream/bin/wasm-ld", [], 0x1) = 0\n' + synthetic
              for suffix, tail in (('no-read', b''), ('with-read', b'read(' + fd.group(1) + b'<' + archive + b'>, "") = 1\n')):
                  directory = Path('/work/image/trace-private') / (name + '-' + suffix)
                  directory.mkdir(mode=0o700)
                  (directory / 'trace.123').write_bytes(prefix + tail + end)
          PYOPENCANARY
          /work/image/tool/nu -c 'use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu [openat_cwd_self_test archive_flags_self_test]; openat_cwd_self_test gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json; archive_flags_self_test gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          /work/image/tool/nu -c 'use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu failed_open_self_test; failed_open_self_test gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          /work/image/tool/nu -c "$(cat <<'NUFAILEDOPEN'
          use gate/.github/scripts/duckdb-eh-linker-fd-witness-v1.nu [witness parser_failure_class]
          let ledger = 'gate/.github/receipts/duckdb-eh-linker-fd-witness-v1.json'
          let digest = '6e5c12aab29b80db118acd16c08953257683ed11c415970f8320ed777997eec7'
          let result = (try { witness $ledger /work/image/trace-private/missing-no-read $digest /work/image/trace-private/missing-no-read.json; 'ACCEPTED' } catch {|e| parser_failure_class $e.msg })
          if $result != 'REFUSED_DIRECT_READ_NOT_PROVED' { error make {msg: 'missing-open no-read control refused'} }
          witness $ledger /work/image/trace-private/missing-with-read $digest /work/image/trace-private/missing-with-read.json
          let good = (try { witness $ledger /work/image/trace-private/flags-good-no-read $digest /work/image/trace-private/flags-good-no-read.json; 'ACCEPTED' } catch {|e| parser_failure_class $e.msg })
          if $good != 'REFUSED_DIRECT_READ_NOT_PROVED' { error make {msg: 'readonly no-read control refused'} }
          let bad = (try { witness $ledger /work/image/trace-private/flags-trunc-with-read $digest /work/image/trace-private/flags-trunc.json; 'ACCEPTED' } catch {|e| parser_failure_class $e.msg })
          if $bad != 'ARCHIVE_OPEN_NOT_READONLY_EXACT' { error make {msg: 'mutation flag control refused'} }
          witness $ledger /work/image/trace-private/flags-good-with-read $digest /work/image/trace-private/flags-good-with-read.json
          NUFAILEDOPEN
          )"
          # Fixed dummy calls, intentionally aligned to exercise suffix enums.
          printf '%s\n' dummy > /work/image/trace-private/suffix-present
          timeout 15s "$loader" --library-path "$libdir" "$tracer" -yy -s 256 -a 115 -e trace=open,openat \
            -o /work/image/trace-private/suffix-dummy.trace python3 -c 'import os; os.chdir("/work/image/trace-private"); f=os.open("suffix-present",os.O_RDONLY); os.close(f); exec("try:\n os.open(\"suffix-absent\",os.O_RDONLY)\nexcept FileNotFoundError:\n pass")' \
            > /work/image/trace-private/suffix-dummy.log 2>&1
          python3 - <<'PYSUFFIXCANARY'
          from pathlib import Path
          import re
          import stat
          import textwrap
          source = Path('gate/.github/workflows/duckdb-eh-seeded-image-link-trace-v1.yml').read_text()
          start_marker = "          if classification == 'OPEN_SHAPE_AMBIGUOUS':\n"
          end_marker = "          encoded = json.dumps(data, separators=(',', ':'), sort_keys=True) + '\\n'\n"
          if source.count(start_marker) != 1:
              raise SystemExit('open suffix source refused')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = textwrap.dedent(source[start:end])
          dummy = Path('/work/image/trace-private/suffix-dummy.trace')
          if dummy.is_symlink() or not dummy.is_file() or not 0 < dummy.stat().st_size <= 1048576:
              raise SystemExit('open suffix dummy refused')
          records = dummy.read_bytes().splitlines(keepends=True)
          for name, needle, expected in (
              ('suffix-success', b'"suffix-present"', 'OPENAT_ANNOTATED_SUCCESS_OTHER_GRAMMAR'),
              ('suffix-failed', b'"suffix-absent"', 'OPENAT_FAILED_RETURN_OTHER_GRAMMAR')):
              matches = [line for line in records if needle in line]
              if len(matches) != 1:
                  raise SystemExit('open suffix dummy refused')
              fixture = Path('/work/image/trace-private') / name
