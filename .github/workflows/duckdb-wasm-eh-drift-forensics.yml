name: DuckDB Wasm EH archive member forensic trial

on:
  pull_request:
    paths:
      - .github/workflows/duckdb-wasm-eh-drift-forensics.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pinned-eh-rebuild:
    name: Pinned EH rebuild (${{ matrix.repeat }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29
    env:
      DUCKDB_EXCEL: "0"
      DUCKDB_JSON: "0"
      CCACHE_DISABLE: "1"
    strategy:
      fail-fast: false
      # Green jobs prove receipt generation; compare the two artifacts before claiming reproducibility.
      matrix:
        repeat: [a, b]
    steps:
      - name: Check out exact Tundra head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned DuckDB Wasm source and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: duckdb/duckdb-wasm
          ref: f955138e5218942fb3fb097a8fdcb725222406ff
          path: duckdb-upstream
          submodules: recursive
          persist-credentials: false

      - name: Trust these checked-out paths inside the ephemeral container
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/duckdb-upstream"
          while IFS= read -r -d '' directory; do
            git config --global --add safe.directory "$directory"
          done < <(find "$GITHUB_WORKSPACE/duckdb-upstream" -type f -name .git -printf '%h\0')

      - name: Record and require pinned source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-receipt"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git -C duckdb-upstream rev-parse HEAD)" = 'f955138e5218942fb3fb097a8fdcb725222406ff'
          test "$(git -C duckdb-upstream/submodules/duckdb rev-parse HEAD)" = '401c8061c6ece35949cac58c7770cc755710ca86'
          test "$(git -C duckdb-upstream/submodules/arrow rev-parse HEAD)" = 'ca1c30f60d6419849dbc2a533bd0bcaff310185f'
          test "$(git -C duckdb-upstream/submodules/rapidjson rev-parse HEAD)" = '973dc9c06dcd3d035ebd039cfb9ea457721ec213'
          test -z "$(git -C duckdb-upstream status --porcelain)"
          git -C duckdb-upstream submodule status --recursive > "$RUNNER_TEMP/native-receipt/submodules.txt"
          test -z "$(grep '^[+-U]' "$RUNNER_TEMP/native-receipt/submodules.txt" || true)"
          sha256sum duckdb-upstream/duckdb.patch > "$RUNNER_TEMP/native-receipt/patch.sha256"
          emcc --version | grep -Fq '3.1.48'
          em++ --version | grep -Fq '3.1.48'
          test -n "${EMSDK:-}"
          wasm_ld="$EMSDK/upstream/bin/wasm-ld"
          test -x "$wasm_ld"
          config="${EM_CONFIG:-${EMSDK}/.emscripten}"
          test -s "$config"
          {
            printf 'tundra_head=%s\nupstream_head=%s\nvariant=eh\nrepeat=%s\n' \
              "$(git rev-parse HEAD)" "$(git -C duckdb-upstream rev-parse HEAD)" '${{ matrix.repeat }}'
            printf 'container=emscripten/emsdk:3.1.48@sha256:c952f592577a428698cb990c9656f395ae34424740f9c40bed4c3ee6d4850d29\n'
            printf 'DUCKDB_EXCEL=%s\nDUCKDB_JSON=%s\nCCACHE_DISABLE=%s\n' \
              "$DUCKDB_EXCEL" "$DUCKDB_JSON" "$CCACHE_DISABLE"
            uname -a
            command -v emcc em++ emcmake cmake make
            emcc --version
            em++ --version
            printf 'wasm_ld=%s\n' "$wasm_ld"
            "$wasm_ld" --version
            cmake --version
            printf 'EMSDK=%s\nEM_CONFIG=%s\n' "$EMSDK" "$config"
            sha256sum "$config"
          } > "$RUNNER_TEMP/native-receipt/toolchain.txt"
          test ! -e duckdb-upstream/.ccache/extension/json
          test ! -e duckdb-upstream/.ccache/extension/excel
          git -C duckdb-upstream/submodules/duckdb apply --check ../../duckdb.patch
          git -C duckdb-upstream/submodules/duckdb apply ../../duckdb.patch
          git -C duckdb-upstream/submodules/duckdb diff --binary \
            > "$RUNNER_TEMP/native-receipt/duckdb-applied.patch"
          test -s "$RUNNER_TEMP/native-receipt/duckdb-applied.patch"

      - name: Build EH once and retain native member receipts
        shell: bash
        run: |
          set -euo pipefail
          variant=eh
          build="$GITHUB_WORKSPACE/duckdb-upstream/build/relperf/$variant"
          map="$RUNNER_TEMP/native-receipt/duckdb-$variant.map"
          mkdir -p "$build"
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DDUCKDB_WASM_VERSION=v1.28.0
            "-DDUCKDB_LOCATION=$GITHUB_WORKSPACE/duckdb-upstream/submodules/duckdb"
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-Map,$map"
          )
          flags+=(-DWITH_WASM_EXCEPTIONS=1 -DDUCKDB_CUSTOM_PLATFORM=wasm_eh)
          emcmake cmake -S duckdb-upstream/lib -B "$build" "${flags[@]}"
          emmake make -C "$build" -j4 duckdb_wasm
          test -s "$build/duckdb_wasm.wasm"
          test -s "$build/duckdb_wasm.js"
          test -s "$map"
          test -s "$build/compile_commands.json"
          test -s "$build/CMakeCache.txt"
          test -s "$build/CMakeFiles/duckdb_wasm.dir/link.txt"
          grep -Fq '@CMakeFiles/duckdb_wasm.dir/objects1.rsp' "$build/CMakeFiles/duckdb_wasm.dir/link.txt"
          grep -Fq '@CMakeFiles/duckdb_wasm.dir/linklibs.rsp' "$build/CMakeFiles/duckdb_wasm.dir/link.txt"
          objects_rsp="$build/CMakeFiles/duckdb_wasm.dir/objects1.rsp"
          linklibs_rsp="$build/CMakeFiles/duckdb_wasm.dir/linklibs.rsp"
          test -s "$objects_rsp"
          test -s "$linklibs_rsp"
          grep -Eq '(^|/).*\.o([):[:space:]]|$)' "$map"
          cp "$build/compile_commands.json" "$RUNNER_TEMP/native-receipt/compile_commands.json"
          cp "$build/CMakeCache.txt" "$RUNNER_TEMP/native-receipt/CMakeCache.txt"
          cp "$build/CMakeFiles/duckdb_wasm.dir/link.txt" "$RUNNER_TEMP/native-receipt/link.txt"
          cp "$objects_rsp" "$RUNNER_TEMP/native-receipt/objects1.rsp"
          cp "$linklibs_rsp" "$RUNNER_TEMP/native-receipt/linklibs.rsp"
          cp "$build/duckdb_wasm.wasm" "$RUNNER_TEMP/native-receipt/duckdb-$variant.wasm"
          cp "$build/duckdb_wasm.js" "$RUNNER_TEMP/native-receipt/duckdb-$variant.js"
          find "$build" -type f -name '*.a' -print0 | sort -z | xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/native-receipt/static-archives.sha256"
          find "$build" -type f -name '*.d' -printf '%P\0' | sort -z \
            | tar -C "$build" --null -czf "$RUNNER_TEMP/native-receipt/depfiles.tar.gz" -T -
          test -s "$RUNNER_TEMP/native-receipt/static-archives.sha256"
          test -s "$RUNNER_TEMP/native-receipt/depfiles.tar.gz"
          # Hash every member so a whole-archive change can be separated from
          # a change to one of the members actually selected by the link map.
          duckdb_archive="$build/third_party/duckdb/install/lib/libduckdb_static.a"
          duckdb_alias="$build/third_party/duckdb/install/lib/libduckdb.a"
          test -s "$duckdb_archive"
          test -s "$duckdb_alias"
          command -v emar
          emar --version > "$RUNNER_TEMP/native-receipt/emar-version.txt"
          stat -c '%n size=%s inode=%i links=%h' "$duckdb_archive" "$duckdb_alias" \
            > "$RUNNER_TEMP/native-receipt/duckdb-archive-stat.txt"
          readlink -f "$duckdb_archive" "$duckdb_alias" \
            > "$RUNNER_TEMP/native-receipt/duckdb-archive-paths.txt"
          sha256sum "$duckdb_archive" "$duckdb_alias" \
            > "$RUNNER_TEMP/native-receipt/duckdb-archive.sha256"
          emar t "$duckdb_archive" > "$RUNNER_TEMP/native-receipt/duckdb-members.txt"
          test -s "$RUNNER_TEMP/native-receipt/duckdb-members.txt"
          LC_ALL=C sort "$RUNNER_TEMP/native-receipt/duckdb-members.txt" \
            > "$RUNNER_TEMP/native-receipt/duckdb-members.sorted.txt"
          uniq -d "$RUNNER_TEMP/native-receipt/duckdb-members.sorted.txt" \
            > "$RUNNER_TEMP/native-receipt/duckdb-members.duplicates.txt"
          if test -s "$RUNNER_TEMP/native-receipt/duckdb-members.duplicates.txt"; then
            echo 'Duplicate DuckDB archive member names need index-aware extraction' >&2
            exit 1
          fi
          if grep -Eq '[[:space:]]' "$RUNNER_TEMP/native-receipt/duckdb-members.txt"; then
            echo 'Unexpected whitespace in DuckDB archive member name' >&2
            exit 1
          fi
          member_extract="$RUNNER_TEMP/duckdb-member-extract"
          mkdir -p "$member_extract"
          (cd "$member_extract" && emar x "$duckdb_archive")
          (cd "$member_extract" && find . -type f -printf '%P\n' | LC_ALL=C sort) \
            > "$RUNNER_TEMP/native-receipt/duckdb-members.extracted.txt"
          diff -u "$RUNNER_TEMP/native-receipt/duckdb-members.sorted.txt" \
            "$RUNNER_TEMP/native-receipt/duckdb-members.extracted.txt"
          (cd "$member_extract" && find . -type f -printf '%P\0' | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum) \
            > "$RUNNER_TEMP/native-receipt/duckdb-members.sha256"
          cut -c 67- "$RUNNER_TEMP/native-receipt/duckdb-members.sha256" \
            | diff -u "$RUNNER_TEMP/native-receipt/duckdb-members.sorted.txt" -
          grep -oE 'libduckdb_static\.a\([^)]+' "$map" | sed 's/.*(//' \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.txt"
          test -s "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.txt"
          awk 'NR==FNR { wanted[$0]=1; next } { name=substr($0,67); if (name in wanted) { print; seen[name]=1 } } END { for (name in wanted) if (!(name in seen)) exit 1 }' \
            "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.txt" \
            "$RUNNER_TEMP/native-receipt/duckdb-members.sha256" \
            > "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.sha256"
          test "$(wc -l < "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.txt")" \
            -eq "$(wc -l < "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.sha256")"
          # Keep only the two differing unity objects and their exact nested
          # CMake inputs; the full 42 MB DuckDB archive stays on the runner.
          nested="$build/third_party/duckdb/src/duckdb_ep-build"
          readobj="$EMSDK/upstream/bin/llvm-readobj"
          objdump="$EMSDK/upstream/bin/llvm-objdump"
          test -x "$readobj"
          test -x "$objdump"
          "$readobj" --version > "$RUNNER_TEMP/native-receipt/llvm-readobj-version.txt"
          "$objdump" --version > "$RUNNER_TEMP/native-receipt/llvm-objdump-version.txt"
          retain_changed_object() {
            local label="$1" member="$2" target_rel="$3" unity_rel="$4"
            local target="$nested/$target_rel"
            local out="$RUNNER_TEMP/native-receipt/changed-objects/$label"
            grep -Fxq "$member" "$RUNNER_TEMP/native-receipt/duckdb-map-selected-members.txt"
            test -s "$member_extract/$member"
            test -s "$target/$member"
            cmp -s "$member_extract/$member" "$target/$member"
            test -s "$target/$member.d"
            test -s "$target/flags.make"
            test -s "$target/build.make"
            test -s "$nested/$unity_rel"
            mkdir -p "$out"
            cp "$member_extract/$member" "$out/$member"
            cp "$target/$member.d" "$out/$member.d"
            cp "$target/flags.make" "$out/flags.make"
            cp "$target/build.make" "$out/build.make"
            cp "$nested/$unity_rel" "$out/${unity_rel##*/}"
            "$readobj" --sections "$out/$member" > "$out/llvm-readobj-sections.txt"
            "$objdump" -h "$out/$member" > "$out/llvm-objdump-headers.txt"
            "$objdump" -d "$out/$member" > "$out/llvm-objdump-disassembly.txt"
            test -s "$out/llvm-readobj-sections.txt"
            test -s "$out/llvm-objdump-headers.txt"
            test -s "$out/llvm-objdump-disassembly.txt"
            sha256sum "$out/$member" "$out/$member.d" "$out/flags.make" \
              "$out/build.make" "$out/${unity_rel##*/}" \
              > "$out/inputs.sha256"
          }
          retain_changed_object aggregate ub_duckdb_operator_aggregate.cpp.o \
            src/execution/operator/aggregate/CMakeFiles/duckdb_operator_aggregate.dir \
            src/execution/operator/aggregate/ub_duckdb_operator_aggregate.cpp
          retain_changed_object system ub_duckdb_table_func_system.cpp.o \
            src/function/table/system/CMakeFiles/duckdb_table_func_system.dir \
            src/function/table/system/ub_duckdb_table_func_system.cpp
          # Hash the SDK archives actually selected by wasm-ld, not every cached SDK archive.
          grep -oE '/emsdk/upstream/emscripten/cache/sysroot/[^[:space:]():]+\.a' "$map" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/native-receipt/selected-sdk-archives.txt"
          test -s "$RUNNER_TEMP/native-receipt/selected-sdk-archives.txt"
          while IFS= read -r archive; do
            test -f "$archive"
            sha256sum "$archive"
          done < "$RUNNER_TEMP/native-receipt/selected-sdk-archives.txt" \
            > "$RUNNER_TEMP/native-receipt/selected-sdk-archives.sha256"
          test -s "$RUNNER_TEMP/native-receipt/selected-sdk-archives.sha256"
          sha256sum "$RUNNER_TEMP/native-receipt/objects1.rsp" \
            "$RUNNER_TEMP/native-receipt/linklibs.rsp" \
            > "$RUNNER_TEMP/native-receipt/link-response-files.sha256"
          sha256sum "$RUNNER_TEMP/native-receipt/duckdb-$variant.wasm" "$map" \
            > "$RUNNER_TEMP/native-receipt/output.sha256"
          test ! -e duckdb-upstream/.ccache/extension/json
          test ! -e duckdb-upstream/.ccache/extension/excel

      - name: Replay the changing unity objects serially on this runner
        shell: bash
        run: |
          set -euo pipefail
          nested="$GITHUB_WORKSPACE/duckdb-upstream/build/relperf/eh/third_party/duckdb/src/duckdb_ep-build"
          replay_object() {
            local label="$1" rel="$2" target="$3" member="$4" unity="$5"
            local object="$nested/$rel/CMakeFiles/$target.dir/$member"
            local preprocessed="$nested/$rel/CMakeFiles/$target.dir/$unity.i"
            local recipe="$rel/CMakeFiles/$target.dir/build.make"
            local preprocess_target="$rel/CMakeFiles/$target.dir/$unity.i"
            local object_target="$rel/CMakeFiles/$target.dir/$member"
            local out="$RUNNER_TEMP/native-receipt/$label-object-replay"
            local pass
            mkdir -p "$out"
            test -s "$object"
            cmp -s "$object" "$RUNNER_TEMP/native-receipt/changed-objects/$label/$member"
            cp "$object" "$out/initial.o"
            sha256sum "$nested/$rel/$unity" \
              "$nested/$rel/CMakeFiles/$target.dir/flags.make" \
              "$nested/$rel/CMakeFiles/$target.dir/includes_CXX.rsp" \
              "$nested/$recipe" > "$out/recipe-inputs.sha256"
            for pass in first second; do
              emmake make -C "$nested" -f "$recipe" "$preprocess_target"
              test -s "$preprocessed"
              sha256sum "$preprocessed" > "$out/$pass.preprocessed.sha256"
              stat -c '%s' "$preprocessed" > "$out/$pass.preprocessed.size"
              rm "$preprocessed"
              rm "$object"
              emmake make -C "$nested" -j1 -f "$recipe" "$object_target"
              test -s "$object"
              cp "$object" "$out/$pass.o"
              sha256sum "$object" > "$out/$pass.object.sha256"
              cmp -s "$nested/$rel/$unity" \
                "$RUNNER_TEMP/native-receipt/changed-objects/$label/$unity"
            done
            sha256sum "$nested/$rel/$unity" \
              "$nested/$rel/CMakeFiles/$target.dir/flags.make" \
              "$nested/$rel/CMakeFiles/$target.dir/includes_CXX.rsp" \
              "$nested/$recipe" > "$out/recipe-inputs-after.sha256"
            cmp -s "$out/recipe-inputs.sha256" "$out/recipe-inputs-after.sha256"
            for pass in first second; do
              if cmp -s "$out/initial.o" "$out/$pass.o"; then
                printf '%s=identical-to-initial\n' "$pass"
              else
                printf '%s=differs-from-initial\n' "$pass"
              fi
            done > "$out/observed-equality.txt"
            if cmp -s "$out/first.o" "$out/second.o"; then
              printf 'first_vs_second=identical\n' >> "$out/observed-equality.txt"
            else
              printf 'first_vs_second=differs\n' >> "$out/observed-equality.txt"
            fi
          }
          replay_object system src/function/table/system duckdb_table_func_system \
            ub_duckdb_table_func_system.cpp.o ub_duckdb_table_func_system.cpp
          replay_object aggregate src/execution/operator/aggregate duckdb_operator_aggregate \
            ub_duckdb_operator_aggregate.cpp.o ub_duckdb_operator_aggregate.cpp

      - name: Compile retained EH preprocessed inputs at one output path
        shell: bash
        run: |
          set -euo pipefail
          nested="$GITHUB_WORKSPACE/duckdb-upstream/build/relperf/eh/third_party/duckdb/src/duckdb_ep-build"
          compiler="$EMSDK/upstream/emscripten/em++"
          clang="$EMSDK/upstream/bin/clang++"
          readobj="$EMSDK/upstream/bin/llvm-readobj"
          objdump="$EMSDK/upstream/bin/llvm-objdump"
          for tool in "$compiler" "$clang" "$readobj" "$objdump"; do
            test -x "$tool"
          done
          replay_saved_input() {
            local label="$1" rel="$2" target="$3" member="$4" unity="$5"
            local dir="$nested/$rel" object="$nested/$rel/CMakeFiles/$target.dir/$member"
            local recipe="$rel/CMakeFiles/$target.dir/build.make"
            local object_target="$rel/CMakeFiles/$target.dir/$member"
            local preprocess_target="$rel/CMakeFiles/$target.dir/$unity.i"
            local generated_i="$nested/$preprocess_target"
            local out="$RUNNER_TEMP/native-receipt/$label-saved-input-trial"
            local command_line prefix args_text pass argument
            local -a lines original_argv replay_argv
            mkdir -p "$out"
            test -s "$object"
            cmp -s "$object" "$RUNNER_TEMP/native-receipt/$label-object-replay/second.o"
            cp "$object" "$out/before.o"
            emmake make -C "$nested" -f "$recipe" "$preprocess_target"
            test -s "$generated_i"
            cp "$generated_i" "$out/input.i"
            sha256sum "$out/input.i" > "$out/input.sha256"
            cp "$dir/CMakeFiles/$target.dir/includes_CXX.rsp" "$out/includes_CXX.rsp"
            sha256sum "$dir/CMakeFiles/$target.dir/flags.make" \
              "$out/includes_CXX.rsp" "$nested/$recipe" \
              "$dir/$unity" > "$out/generated-inputs.sha256"
            # CMake's expanded recipe is the source of the original argument vector.
            # Dry-run only after removing the object, and require exactly one compile line.
            rm "$object"
            mapfile -t lines < <(emmake make -C "$nested" -f "$recipe" -n "$object_target" \
              | grep -F " -c $dir/$unity")
            test "${#lines[@]}" -eq 1
            command_line="${lines[0]}"
            prefix="cd $dir && $compiler"
            test "${command_line#"$prefix"}" != "$command_line"
            args_text="${command_line#"$prefix"}"
            printf '%s\n' "$command_line" > "$out/generated-compile-command.txt"
            # This eval expands only the pinned CMake-generated argument text into
            # an argv array; it does not execute the compiler command.
            cd "$dir"
            eval "set -- \"$compiler\" $args_text"
            original_argv=("$@")
            test "${original_argv[${#original_argv[@]}-1]}" = "$dir/$unity"
            test "${original_argv[0]}" = "$compiler"
            printf '%s\0' "${original_argv[@]}" > "$out/original-argv.nul"
            printf '%q ' "${original_argv[@]}" > "$out/original-argv.shell.txt"
            printf '\n' >> "$out/original-argv.shell.txt"
            replay_argv=("${original_argv[@]:0:${#original_argv[@]}-1}" -x c++-cpp-output "$out/input.i")
            printf '%s\0' "${replay_argv[@]}" > "$out/replay-argv.nul"
            printf '%q ' "${replay_argv[@]}" > "$out/replay-argv.shell.txt"
            printf '\n' >> "$out/replay-argv.shell.txt"
            pwd -P > "$out/compiler-cwd.txt"
            env -0 | sha256sum > "$out/full-environment.sha256"
            env | cut -d= -f1 | LC_ALL=C sort > "$out/environment-names.txt"
            for argument in EMSDK EM_CONFIG PATH CCACHE_DISABLE DUCKDB_EXCEL DUCKDB_JSON \
              CMAKE_PREFIX_PATH CC CXX LD TMPDIR; do
              if test "${!argument+x}"; then
                printf '%s=%q\n' "$argument" "${!argument}"
              fi
            done > "$out/compiler-environment.txt"
            sha256sum "$compiler" "$clang" "$readobj" "$objdump" \
              > "$out/compiler-tools.sha256"
            "$compiler" --version > "$out/compiler-version.txt"
            "$clang" --version > "$out/clang-version.txt"
            for pass in 1 2 3; do
              env -0 | sha256sum > "$out/pass-$pass.environment.sha256"
              cmp -s "$out/full-environment.sha256" "$out/pass-$pass.environment.sha256"
              "${replay_argv[@]}"
              test -s "$object"
              cp "$object" "$out/pass-$pass.o"
              sha256sum "$object" > "$out/pass-$pass.object.sha256"
              "$readobj" --sections "$object" > "$out/pass-$pass.sections.txt"
              "$objdump" -d "$object" > "$out/pass-$pass.disassembly.txt"
              test -s "$out/pass-$pass.sections.txt"
              test -s "$out/pass-$pass.disassembly.txt"
              sha256sum "$out/input.i" > "$out/pass-$pass.input.sha256"
              cmp -s "$out/input.sha256" "$out/pass-$pass.input.sha256"
            done
            for pass in 2 3; do
              if cmp -s "$out/pass-1.o" "$out/pass-$pass.o"; then
                printf 'pass_1_vs_%s=identical\n' "$pass"
              else
                printf 'pass_1_vs_%s=differs\n' "$pass"
              fi
            done > "$out/observed-equality.txt"
            printf 'admission=NO\ntrial=preprocessed-compiler-replay-only\n' \
              > "$out/admission.txt"
          }
          replay_saved_input system src/function/table/system duckdb_table_func_system \
            ub_duckdb_table_func_system.cpp.o ub_duckdb_table_func_system.cpp
          replay_saved_input aggregate src/execution/operator/aggregate duckdb_operator_aggregate \
            ub_duckdb_operator_aggregate.cpp.o ub_duckdb_operator_aggregate.cpp

      - name: Retain EH forensic trial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-forensic-${{ matrix.repeat }}
          path: ${{ runner.temp }}/native-receipt/
          if-no-files-found: warn
          retention-days: 14

  eh-webkit-semantic-trial:
    name: Installed EH semantics (${{ matrix.repeat }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repeat: [a, b]
        profile: [default, sounds]
    env:
      # Exact PR119 consumer source, including its forced-EH smoke path.
      CONSUMER_HEAD: 1ccac98a3cfe7a7b1e28b900761d81b94fa5f64f
      PRODUCER_HEAD: 08aa1f75eb15fecdc7e43aaa1c695ce2a32a59ec
      PRODUCER_RUN: "40257227449"
    steps:
      - name: Check out exact installed-consumer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1ccac98a3cfe7a7b1e28b900761d81b94fa5f64f
          persist-credentials: false
      - name: Bind historic EH artifact to API, ZIP and output bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_HEAD"
          mkdir -p "$RUNNER_TEMP/eh-semantic" "$RUNNER_TEMP/eh-input"
          case '${{ matrix.repeat }}' in
            a) artifact=12623139348
               zip_digest=4d0f43d826d763e460aeb5eaf4e6be3de0e0157d4830b6fe54224ae4c6a2e7f9
               wasm_digest=d87a513f76157d7c48894b9b2919057b9ed3fa953614e735bcc2c4635a5e2506 ;;
            b) artifact=12623850020
               zip_digest=2e4eb432737803dc4c98d10ecbfccf81f54180adc69a40415b8a6c3834ca7386
               wasm_digest=e10021a35fb3be231b8f679679b4910d4f42b47614e28f8ce71e20f8654cbfce ;;
            *) exit 1 ;;
          esac
          base="https://api.github.com/repos/ryanmaclean/tundra/actions/artifacts/$artifact"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" "$base" \
            -o "$RUNNER_TEMP/eh-semantic/artifact.json"
          jq -e --argjson id "$artifact" --argjson run "$PRODUCER_RUN" \
            --arg head "$PRODUCER_HEAD" --arg digest "sha256:$zip_digest" \
            --arg name "duckdb-eh-forensic-${{ matrix.repeat }}" \
            '.id == $id and .name == $name and .digest == $digest and
             .expired == false and .workflow_run.id == $run and
             .workflow_run.head_sha == $head' "$RUNNER_TEMP/eh-semantic/artifact.json"
          curl --fail --silent --show-error --location --retry 3 "${headers[@]}" "$base/zip" \
            -o "$RUNNER_TEMP/eh-input/artifact.zip"
          printf '%s  %s\n' "$zip_digest" "$RUNNER_TEMP/eh-input/artifact.zip" \
            | sha256sum --check --status
          unzip -tq "$RUNNER_TEMP/eh-input/artifact.zip"
          mkdir "$RUNNER_TEMP/eh-input/input"
          unzip -q "$RUNNER_TEMP/eh-input/artifact.zip" -d "$RUNNER_TEMP/eh-input/input"
          input="$RUNNER_TEMP/eh-input/input"
          printf '%s  %s\n' "$wasm_digest" "$input/duckdb-eh.wasm" \
            'fd610ecd2c58944726dc473ef8babc400581ae07df2a805b67f29a14b38695d3' \
            "$input/duckdb-eh.js" | sha256sum --check --status
          grep -Fxq "tundra_head=$PRODUCER_HEAD" "$input/toolchain.txt"
          grep -Fxq 'upstream_head=f955138e5218942fb3fb097a8fdcb725222406ff' "$input/toolchain.txt"
          grep -Fxq 'variant=eh' "$input/toolchain.txt"
          grep -Fxq 'repeat=${{ matrix.repeat }}' "$input/toolchain.txt"
          grep -Fq "$wasm_digest" "$input/output.sha256"
          {
            printf 'schema=tundra-eh-webkit-semantic-trial/v1\n'
            printf 'admission=NO\nconsumer_head=%s\nproducer_head=%s\nproducer_run=%s\n' \
              "$CONSUMER_HEAD" "$PRODUCER_HEAD" "$PRODUCER_RUN"
            printf 'artifact_id=%s\nartifact_zip_sha256=%s\nwasm_sha256=%s\n' \
              "$artifact" "$zip_digest" "$wasm_digest"
            printf 'generated_js_sha256=%s\nprofile=%s\nrepeat=%s\n' \
              fd610ecd2c58944726dc473ef8babc400581ae07df2a805b67f29a14b38695d3 \
              '${{ matrix.profile }}' '${{ matrix.repeat }}'
          } > "$RUNNER_TEMP/eh-semantic/source.txt"
      - name: Install Linux WebKitGTK and Tauri build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf pkg-config wget xvfb dbus-x11
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            sudo apt-get install -y --no-install-recommends libasound2-dev
          fi
      - name: Install pinned build tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned UI and Tauri tools
        shell: bash
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version 2.12.4 --locked
          cargo install nu --version 0.108.0 --locked
      - name: Stage original browser runtime and replace only EH Wasm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nu scripts/fetch_duckdb_replacement.nu \
            "$RUNNER_TEMP/duckdb-replacement" "$RUNNER_TEMP/duckdb-fetch"
          nu scripts/stage_duckdb_runtime.nu app/leptos-ui/duckdb-runtime "$RUNNER_TEMP" \
            "$RUNNER_TEMP/duckdb-replacement/matching-output"
          cmp "$RUNNER_TEMP/duckdb-replacement/matching-output/duckdb-browser-eh.worker.js" \
            app/leptos-ui/duckdb-runtime/duckdb-browser-eh.worker.js
          cp "$RUNNER_TEMP/eh-input/input/duckdb-eh.wasm" \
            app/leptos-ui/duckdb-runtime/duckdb-eh.wasm
          sha256sum app/leptos-ui/duckdb-runtime/* \
            > "$RUNNER_TEMP/eh-semantic/overlaid-assets.sha256"
          echo 'Diagnostic replacement of EH Wasm only; original selected bill is inapplicable.' \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
      - name: Extend the existing forced-EH smoke with targeted SQL paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/tauri/src/main.rs')
          source = path.read_text()
          old = '    recovery_ok: bool,\n    smoke_error: Option<String>,'
          new = '    recovery_ok: bool,\n    semantic_observed: Option<String>,\n    smoke_error: Option<String>,'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '            "recoveryOk": result.recovery_ok,\n'
          new = old + '            "semanticObserved": result.semantic_observed.as_deref().unwrap_or("").chars().take(4096).collect::<String>(),\n'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '      result.ok = result.ok && result.exceptionOk;\n'
          new = '''      // Test-only extension: every query uses the bridge's one retained connection.
          const semantic = { cases: [], sameConnection: false,
            recovery: false, targetedPathsOk: false };
          const inspect = async (name, sql) => {
            const value = JSON.parse(await bridge.query_duckdb(sql));
            const error = value && !Array.isArray(value) &&
              typeof value.error === 'string' ? value.error : '';
            semantic.cases.push({ name, shape: Array.isArray(value) ? 'rows' :
              (error ? 'error' : typeof value),
              errorClass: (error.match(/(?:Parser|Catalog|Binder|Conversion|Invalid Input|Internal) Error/) || [])[0] || '',
              rows: Array.isArray(value) ? value : [],
              marker: error ? error.split(/\\r?\\n/, 1)[0].slice(0, 120) : '' });
          };
          await inspect('create-macro',
            'CREATE MACRO eh_probe(x) AS TABLE SELECT x AS v');
          await inspect('table-macro-ok', 'SELECT * FROM eh_probe(7)');
          await inspect('table-macro-arity-error', 'SELECT * FROM eh_probe()');
          await inspect('pragma-ok', 'PRAGMA version');
          await inspect('pragma-error', 'PRAGMA eh_missing_pragma_6f86d081');
          await inspect('aggregate-ok', 'SELECT sum(i) AS total FROM csp_probe');
          await inspect('aggregate-error', "SELECT sum('eh_bad_number') FROM csp_probe");
          await inspect('same-connection', 'SELECT * FROM eh_probe(11)');
          await inspect('post-error-recovery', 'SELECT 42 AS alive');
          semantic.sameConnection = JSON.stringify(semantic.cases.find(c =>
            c.name === 'same-connection')?.rows) === JSON.stringify([{v:11}]);
          semantic.recovery = JSON.stringify(semantic.cases.find(c =>
            c.name === 'post-error-recovery')?.rows) === JSON.stringify([{alive:42}]);
          const byName = name => semantic.cases.find(c => c.name === name);
          semantic.targetedPathsOk =
            byName('create-macro')?.shape === 'rows' &&
            JSON.stringify(byName('table-macro-ok')?.rows) === JSON.stringify([{v:7}]) &&
            byName('table-macro-arity-error')?.shape === 'error' &&
            !!byName('table-macro-arity-error')?.errorClass &&
            byName('pragma-ok')?.shape === 'rows' &&
            byName('pragma-error')?.shape === 'error' &&
            !!byName('pragma-error')?.errorClass &&
            byName('aggregate-ok')?.shape === 'rows' &&
            [3, '3', '"3"'].includes(byName('aggregate-ok')?.rows?.[0]?.total) &&
            byName('aggregate-error')?.shape === 'error' &&
            !!byName('aggregate-error')?.errorClass;
          result.semanticObserved = JSON.stringify(semantic);
          result.ok = result.ok && result.exceptionOk &&
            semantic.sameConnection && semantic.recovery && semantic.targetedPathsOk;
          '''
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          sha256sum app/tauri/src/main.rs > "$RUNNER_TEMP/eh-semantic/test-harness.sha256"
      - name: Build test-only default or sounds installer with EH candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd app/leptos-ui && trunk build --release --locked)
          cmp app/leptos-ui/duckdb-runtime/duckdb-eh.wasm \
            app/leptos-ui/dist/duckdb-runtime/duckdb-eh.wasm
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            (cd app/tauri && cargo tauri build --bundles deb --features sounds)
          else
            (cd app/tauri && cargo tauri build --bundles deb)
          fi
          git diff --exit-code -- Cargo.lock
          shopt -s nullglob
          fingerprints=(target/release/.fingerprint/at-tauri-*/bin-auto-tundra.json)
          test "${#fingerprints[@]}" -eq 1
          cp "${fingerprints[0]}" "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          if [[ '${{ matrix.profile }}' == sounds ]]; then
            jq -e '(.features | fromjson | index("sounds")) != null' \
              "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          else
            jq -e '(.features | fromjson | index("sounds")) == null' \
              "$RUNNER_TEMP/eh-semantic/profile-fingerprint.json"
          fi
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb-root"
          mapfile -d '' bins < <(find "$RUNNER_TEMP/deb-root" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          "${bins[0]}" --verify-embedded-assets app/leptos-ui/dist \
            > "$RUNNER_TEMP/eh-semantic/embedded-assets.json"
          candidate="$(sha256sum app/leptos-ui/duckdb-runtime/duckdb-eh.wasm | cut -d ' ' -f1)"
          jq -e --arg digest "$candidate" \
            '[.assets[] | select(.key == "duckdb-runtime/duckdb-eh.wasm" and
              .dist_sha256 == $digest and .embedded_sha256 == $digest)] | length == 1' \
            "$RUNNER_TEMP/eh-semantic/embedded-assets.json"
          sha256sum "${debs[0]}" "${bins[0]}" \
            > "$RUNNER_TEMP/eh-semantic/installer.sha256"
      - name: Run forced EH in installed WebKitGTK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bins < <(find "$RUNNER_TEMP/deb-root" -type f -name auto-tundra -print0)
          test "${#bins[@]}" -eq 1
          elf_sha="$(sha256sum "${bins[0]}" | cut -d ' ' -f1)"
          home="$RUNNER_TEMP/eh-smoke-home"
          mkdir -p "$home/home" "$home/config" "$home/data" "$home/cache"
          set +e
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            env HOME="$home/home" XDG_CONFIG_HOME="$home/config" \
              XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" \
              TUNDRA_SMOKE_HEAD_SHA="$CONSUMER_HEAD" \
              TUNDRA_SMOKE_PROFILE='${{ matrix.profile }}' \
              TUNDRA_SMOKE_VARIANT=eh TUNDRA_SMOKE_ELF_SHA256="$elf_sha" \
              http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
              HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              NO_PROXY=localhost,127.0.0.1,tauri.localhost \
            timeout 150s "${bins[0]}" --smoke-duckdb eh \
            > "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            2> "$RUNNER_TEMP/eh-semantic/webkit.stderr"
          status=$?
          set -e
          printf 'exit_status=%s\ninstalled_elf_sha256=%s\n' "$status" "$elf_sha" \
            >> "$RUNNER_TEMP/eh-semantic/source.txt"
          awk 'index($0, "TUNDRA_DUCKDB_SMOKE:") == 1 {
            print substr($0, length("TUNDRA_DUCKDB_SMOKE:") + 1)
          }' "$RUNNER_TEMP/eh-semantic/webkit.stdout" \
            > "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$(wc -l < "$RUNNER_TEMP/eh-semantic/webkit.json")" -eq 1
          jq -e --arg head "$CONSUMER_HEAD" --arg elf "$elf_sha" \
            --arg profile '${{ matrix.profile }}' '
            .schema == "tundra-duckdb-webkit-smoke/v1" and
            .head_sha == $head and .profile == $profile and
            .installed_elf_sha256 == $elf and .requested_variant == "eh" and
            .result.variant == "eh" and .ok == true and .result.ok == true and
            .result.exceptionOk == true and .result.cspDenied == true and
            .result.cspViolations == [] and .result.localRuntime == true and
            .result.remoteRequests == 0 and
            (.result.semanticObserved | fromjson | .sameConnection and .recovery and
              .targetedPathsOk and
              (.cases | length == 9))' "$RUNNER_TEMP/eh-semantic/webkit.json"
          test "$status" -eq 0
      - name: Retain diagnostic receipts, not package bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-semantic-${{ matrix.repeat }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/eh-semantic/
          if-no-files-found: warn
          retention-days: 14

  compare-eh-webkit-semantics:
    name: Compare four installed EH observations
    if: always()
    needs: eh-webkit-semantic-trial
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Read exact-run trial receipts and compare observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eh-compare"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'duckdb-eh-semantic-*' --dir "$RUNNER_TEMP/eh-compare"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'eh-compare'
          observed = {}
          for repeat in ('a', 'b'):
              for profile in ('default', 'sounds'):
                  directory = root / f'duckdb-eh-semantic-{repeat}-{profile}'
                  source = (directory / 'source.txt').read_text()
                  assert 'admission=NO\n' in source
                  assert f'profile={profile}\n' in source
                  assert f'repeat={repeat}\n' in source
                  receipt = json.loads((directory / 'webkit.json').read_text())
                  result = receipt['result']
                  assert receipt['ok'] and result['ok']
                  assert receipt['requested_variant'] == result['variant'] == 'eh'
                  assert result['cspDenied'] and not result['cspViolations']
                  assert result['localRuntime'] and result['remoteRequests'] == 0
                  semantic = json.loads(result['semanticObserved'])
                  assert semantic['sameConnection'] and semantic['recovery']
                  assert semantic['targetedPathsOk'] and len(semantic['cases']) == 9
                  observed[(repeat, profile)] = {
                      'semantic': semantic,
                      'parser_catalog': result['rejectionProbes'],
                      'aggregate': result['aggregateObserved'],
                      'answer': result['answer'],
                      'absent_is_null': result['absentIsNull'],
                  }
          baseline = observed[('a', 'default')]
          for key, value in observed.items():
              assert value == baseline, f'EH semantic mismatch: {key}'
          output = root / 'comparison.json'
          output.write_text(json.dumps({
              'schema': 'tundra-eh-webkit-semantic-compare/v1',
              'admission': 'NO',
              'producer_run': 40257227449,
              'compared': [f'{r}-{p}' for r, p in observed],
              'observed': baseline,
              'equal': True,
          }, sort_keys=True, indent=2) + '\n')
          PY
      - name: Retain comparison receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-eh-semantic-comparison
          path: ${{ runner.temp }}/eh-compare/comparison.json
          if-no-files-found: warn
          retention-days: 14
