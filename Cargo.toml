[workspace]
resolver = "2"
members = [
    "crates/at-core",
    "crates/at-harness",
    "crates/at-session",
    "crates/at-agents",
    "crates/at-daemon",
    "crates/at-telemetry",
    "crates/at-api-types",
    "crates/at-cli",
    "crates/at-bridge",
    "crates/at-tui",
    "crates/at-integrations",
    "crates/at-intelligence",
    "app/tauri",
    "app/leptos-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
flume = "0.11"
dashmap = "6"
ratatui = "0.29"
crossterm = "0.28"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }
octocrab = "0.43"
# rustls instead of native-tls (SecureTransport/OpenSSL). The other features
# restore reqwest's defaults minus default-tls. Native roots keep OS trust-store
# semantics. webpki-roots would be CDLA-Permissive-2.0, which the policy excludes.
# NOTE: reqwest 0.12 uses rustls' process-default CryptoProvider if one is
# installed, and otherwise falls back to ring.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "charset", "http2", "macos-system-configuration"] }
ahash = { version = "0.8", features = ["serde"] }
mimalloc = "0.1"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
# Local repo reads only (status/diff/branches/revwalk/worktrees), with no remote
# transport, so drop the default `https`/`ssh` features. Those pull in openssl-sys
# and libssh2-sys.
git2 = { version = "0.21", default-features = false }
subtle = "2"
tauri = { version = "2", features = ["devtools"] }
tauri-build = "2"
opentelemetry = "0.21"
tracing-opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }

# ---------------------------------------------------------------------------
# Profiles — M-series optimized
# ---------------------------------------------------------------------------

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true  # Explicit incremental compilation for faster dev builds

# WASM-specific release profile (smaller binaries)
[profile.release.package."*"]
# Default: use release settings

[profile.release-wasm]
inherits = "release"
opt-level = 'z'       # Optimize for size
lto = true            # Link-time optimization for final binary
panic = 'abort'       # Reduce binary size by removing unwinding code
codegen-units = 1     # Better optimization at cost of compile time
strip = "symbols"     # Strip symbols for smaller binary

