[workspace]
resolver = "2"
members = [
    "crates/at-core",
    "crates/at-harness",
    "crates/at-session",
    "crates/at-agents",
    "crates/at-daemon",
    "crates/at-telemetry",
    "crates/at-api-types",
    "crates/at-cli",
    "crates/at-bridge",
    "crates/at-tui",
    "crates/at-integrations",
    "crates/at-intelligence",
    "app/tauri",
    "app/leptos-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
flume = "0.11"
dashmap = "6"
ratatui = "0.30"
crossterm = "0.29"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }
octocrab = { version = "0.54", default-features = false, features = ["follow-redirect", "retry", "rustls", "timeout", "tracing", "default-client", "rustls-aws-lc-rs", "jwt-aws-lc-rs"] }
# rustls instead of native-tls (SecureTransport/OpenSSL). reqwest 0.13's
# `rustls` feature uses the aws-lc-rs provider and rustls-platform-verifier
# (OS trust store, same semantics as the old native-roots feature), so no
# webpki-roots (CDLA-Permissive-2.0, excluded by policy). `system-proxy`
# replaces 0.12's `macos-system-configuration`. `query`/`form` became opt-in in
# 0.13; only at-bridge's tests enable `query`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
# Post-quantum key exchange for outbound TLS (LLM APIs carry source and keys
# over the public internet). `prefer-post-quantum` puts X25519MLKEM768 first in
# the aws-lc-rs provider's kx_groups; it is feature-unified into the rustls
# that reqwest and hyper-rustls use. ring is still compiled in (at-core and
# at-bridge use it directly for digests/HMAC, jsonwebtoken needs it), so rustls
# cannot pick a provider on its own: every binary calls
# `at_core::tls::install_default_crypto_provider()` first thing in main.
rustls = { version = "0.23.27", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
ahash = { version = "0.8", features = ["serde"] }
mimalloc = "0.1"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
# Local repo reads only (status/diff/branches/revwalk/worktrees), with no remote
# transport, so drop the default `https`/`ssh` features. Those pull in openssl-sys
# and libssh2-sys.
git2 = { version = "0.21", default-features = false }
subtle = "2"
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-build = "2"
datadog-tracing = "0.3"
datadog-apm-sync = "0.8"
tracing-datadog = "0.6"
opentelemetry = "0.31"
opentelemetry-datadog = "0.9"
tracing-opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }

# ---------------------------------------------------------------------------
# Profiles — M-series optimized
# ---------------------------------------------------------------------------

[profile.release]
lto = true            # Full link-time optimization for smaller binary
codegen-units = 1     # Better optimization at cost of compile time
strip = "symbols"     # Strip symbols for smaller binary
opt-level = 'z'       # Optimize for size (<30MB target)
panic = 'abort'       # Reduce binary size by removing unwinding code

[profile.dev]
opt-level = 1
incremental = true  # Explicit incremental compilation for faster dev builds

# WASM-specific release profile (smaller binaries)
[profile.release.package."*"]
# Default: use release settings

[profile.release-wasm]
inherits = "release"
opt-level = 'z'       # Optimize for size
lto = true            # Link-time optimization for final binary
panic = 'abort'       # Reduce binary size by removing unwinding code
codegen-units = 1     # Better optimization at cost of compile time
strip = "symbols"     # Strip symbols for smaller binary

